# =============================================================================
# UNIFIED DONKEY BETZ PLATFORM - MONITORING STACK
# Comprehensive monitoring with Prometheus, Grafana, and ELK Stack
# =============================================================================

version: '3.8'

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  kibana_data:
    driver: local
  logstash_data:
    driver: local
  alertmanager_data:
    driver: local

# =============================================================================
# MONITORING SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # METRICS COLLECTION
  # ---------------------------------------------------------------------------

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: unified-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
    volumes:
      - prometheus_data:/prometheus
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-rules:/etc/prometheus/rules:ro
      - ./config/alert-rules:/etc/prometheus/alert-rules:ro
    ports:
      - "9090:9090"
    networks:
      monitoring:
        ipv4_address: 172.22.0.10
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: unified-node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      monitoring:
        ipv4_address: 172.22.0.11
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: unified-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      monitoring:
        ipv4_address: 172.22.0.12
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: unified-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      monitoring:
        ipv4_address: 172.22.0.13
    restart: always

  # Postgres Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: unified-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://unified_user:secure_password@postgres:5432/ai_unified_platform?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      monitoring:
        ipv4_address: 172.22.0.14
    restart: always

  # ---------------------------------------------------------------------------
  # ALERTING
  # ---------------------------------------------------------------------------

  # Alertmanager - Alert Management
  alertmanager:
    image: prom/alertmanager:latest
    container_name: unified-alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    volumes:
      - alertmanager_data:/alertmanager
      - ./config/alertmanager.yml:/etc/alertmanager/config.yml:ro
    ports:
      - "9093:9093"
    networks:
      monitoring:
        ipv4_address: 172.22.0.20
    restart: always

  # ---------------------------------------------------------------------------
  # VISUALIZATION
  # ---------------------------------------------------------------------------

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: unified-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource,grafana-piechart-panel,grafana-worldmap-panel
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_LOG_FILTERS=rendering:debug
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      monitoring:
        ipv4_address: 172.22.0.30
    depends_on:
      - prometheus
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana Renderer - PDF/PNG Export
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: unified-grafana-renderer
    environment:
      ENABLE_METRICS: 'true'
    ports:
      - "8081:8081"
    networks:
      monitoring:
        ipv4_address: 172.22.0.31
    restart: always

  # ---------------------------------------------------------------------------
  # LOGGING STACK (ELK)
  # ---------------------------------------------------------------------------

  # Elasticsearch - Log Storage
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: unified-elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=unified-logging
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      monitoring:
        ipv4_address: 172.22.0.40
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G

  # Logstash - Log Processing
  logstash:
    image: docker.elastic.co/logstash/logstash:8.8.0
    container_name: unified-logstash
    environment:
      - "LS_JAVA_OPTS=-Xmx512m -Xms512m"
      - XPACK_MONITORING_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - logstash_data:/usr/share/logstash/data
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./config/logstash/config:/usr/share/logstash/config:ro
      - ./logs:/var/log/app:ro
    ports:
      - "5044:5044"
      - "5000:5000/tcp"
      - "5000:5000/udp"
      - "9600:9600"
    networks:
      monitoring:
        ipv4_address: 172.22.0.41
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always

  # Kibana - Log Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: unified-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    volumes:
      - kibana_data:/usr/share/kibana/data
      - ./config/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    networks:
      monitoring:
        ipv4_address: 172.22.0.42
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Filebeat - Log Shipping
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.8.0
    container_name: unified-filebeat
    user: root
    volumes:
      - ./config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./logs:/var/log/app:ro
    networks:
      monitoring:
        ipv4_address: 172.22.0.43
    depends_on:
      - logstash
    restart: always
    command: filebeat -e -strict.perms=false

  # ---------------------------------------------------------------------------
  # APM AND TRACING
  # ---------------------------------------------------------------------------

  # Jaeger - Distributed Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: unified-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "14250:14250"  # gRPC collector
      - "6831:6831/udp"  # Jaeger agent
    networks:
      monitoring:
        ipv4_address: 172.22.0.50
    restart: always

  # ---------------------------------------------------------------------------
  # UPTIME MONITORING
  # ---------------------------------------------------------------------------

  # Uptime Kuma - Service Monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: unified-uptime-kuma
    volumes:
      - ./data/uptime-kuma:/app/data
    ports:
      - "3002:3001"
    networks:
      monitoring:
        ipv4_address: 172.22.0.60
    restart: always