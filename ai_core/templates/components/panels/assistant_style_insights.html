{% comment %}
Session 275: Assistant Style Insights Card
Shows AI-learned style preferences and patterns
{% endcomment %}

<!-- Style Preferences Card -->
<div class="card mb-3" id="tabStyleInsightsCard" style="background: rgba(139, 92, 246, 0.1); border: 2px solid rgba(139, 92, 246, 0.4);">
    <div class="card-header" style="background: rgba(139, 92, 246, 0.2); border-bottom: 1px solid rgba(139, 92, 246, 0.3);">
        <h6 class="mb-0" style="color: #c4b5fd;">&#129504; AI Learning Your Style</h6>
    </div>
    <div class="card-body">
        <div id="tabInsightsLoading" style="text-align: center; padding: 10px;">
            <small style="color: #a78bfa;">Loading insights...</small>
        </div>
        <div id="tabInsightsData" style="display: none;">
            <!-- Stats Row -->
            <div class="d-flex gap-2 mb-3">
                <div style="flex: 1; background: rgba(139, 92, 246, 0.2); padding: 10px; border-radius: 8px; text-align: center;">
                    <div id="tabTotalInteractions" style="font-size: 20px; font-weight: 700; color: #e9d5ff;">0</div>
                    <small style="color: #c4b5fd; font-size: 10px;">Ratings</small>
                </div>
                <div style="flex: 1; background: rgba(34, 197, 94, 0.2); padding: 10px; border-radius: 8px; text-align: center;">
                    <div id="tabTotalPatterns" style="font-size: 20px; font-weight: 700; color: #bbf7d0;">0</div>
                    <small style="color: #86efac; font-size: 10px;">Patterns</small>
                </div>
                <div style="flex: 1; background: rgba(251, 191, 36, 0.2); padding: 10px; border-radius: 8px; text-align: center;">
                    <div id="tabTotalSuggestions" style="font-size: 20px; font-weight: 700; color: #fef08a;">0</div>
                    <small style="color: #fcd34d; font-size: 10px;">Ideas</small>
                </div>
            </div>
            <!-- Learned Patterns -->
            <div id="tabRecentPatterns">
                <!-- Patterns will be inserted here -->
            </div>
            <!-- AI Suggestion -->
            <div id="tabAiSuggestions" style="display: none; margin-top: 10px;">
                <small style="color: #fcd34d; font-weight: 600;">&#128161; AI Suggestion:</small>
                <div id="tabSuggestionText" style="font-size: 12px; color: #e9d5ff; margin-top: 4px; padding: 10px; background: rgba(251, 191, 36, 0.15); border-radius: 6px; border-left: 3px solid #fbbf24;"></div>
            </div>
        </div>
    </div>
</div>
