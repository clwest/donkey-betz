{% comment %}
Session 275: Assistant Intelligence Feed Card
Shows trending topics from spider network
{% endcomment %}

<!-- SESSION 219: Intelligence Feed Card (Phase A) -->
<div class="card mb-3" id="intelligenceFeedCard" style="background: rgba(236, 72, 153, 0.1); border: 2px solid rgba(236, 72, 153, 0.4);">
    <div class="card-header d-flex justify-content-between align-items-center" style="background: rgba(236, 72, 153, 0.2); border-bottom: 1px solid rgba(236, 72, 153, 0.3); cursor: pointer;" onclick="toggleIntelligenceFeed()">
        <h6 class="mb-0" style="color: #f9a8d4;">&#128302; Trending Intelligence</h6>
        <span id="intelligenceToggle" style="color: #f9a8d4;">&#9660;</span>
    </div>
    <div class="card-body" id="intelligenceFeedBody">
        <div id="intelligenceLoading" style="text-align: center; padding: 10px;">
            <div class="spinner-border spinner-border-sm" style="color: #ec4899;" role="status"></div>
            <small style="color: #f9a8d4; margin-left: 8px;">Loading trends...</small>
        </div>
        <div id="intelligenceFeedData" style="display: none;">
            <!-- Stats Row -->
            <div class="d-flex gap-2 mb-3">
                <div style="flex: 1; background: rgba(236, 72, 153, 0.2); padding: 8px; border-radius: 8px; text-align: center;">
                    <div id="intTrendsCount" style="font-size: 18px; font-weight: 700; color: #fbcfe8;">0</div>
                    <small style="color: #f9a8d4; font-size: 9px;">Trends</small>
                </div>
                <div style="flex: 1; background: rgba(34, 197, 94, 0.2); padding: 8px; border-radius: 8px; text-align: center;">
                    <div id="intSpidersActive" style="font-size: 18px; font-weight: 700; color: #bbf7d0;">67</div>
                    <small style="color: #86efac; font-size: 9px;">Spiders</small>
                </div>
                <div style="flex: 1; background: rgba(168, 85, 247, 0.2); padding: 8px; border-radius: 8px; text-align: center;">
                    <div id="intAgentsActive" style="font-size: 18px; font-weight: 700; color: #e9d5ff;">14</div>
                    <small style="color: #c4b5fd; font-size: 9px;">Agents</small>
                </div>
            </div>
            <!-- Trending Topics -->
            <div id="intelligenceTrends" style="max-height: 200px; overflow-y: auto;">
                <!-- Trends will be inserted here -->
            </div>
            <!-- Suggestions -->
            <div id="intelligenceSuggestions" style="margin-top: 10px; display: none;">
                <small style="color: #fcd34d; font-weight: 600;">&#128161; Try This:</small>
                <div id="suggestionPrompt" style="font-size: 11px; color: #f9a8d4; margin-top: 4px; padding: 8px; background: rgba(251, 191, 36, 0.15); border-radius: 6px; border-left: 3px solid #ec4899; cursor: pointer;" onclick="useIntelligenceSuggestion(this)"></div>
            </div>
        </div>
    </div>
</div>
