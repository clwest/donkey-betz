<style>
.trigger-card {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-radius: 8px;
    margin-bottom: 12px;
    transition: all 0.2s ease;
}
.trigger-card:hover {
    border-color: rgba(139, 92, 246, 0.6);
    box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2);
}
.trigger-card.disabled {
    opacity: 0.6;
    border-color: rgba(107, 114, 128, 0.3);
}
.trigger-header {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(139, 92, 246, 0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.trigger-body {
    padding: 16px;
}
.severity-badge {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
}
.severity-critical { background: rgba(239, 68, 68, 0.3); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5); }
.severity-high { background: rgba(245, 158, 11, 0.3); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.5); }
.severity-medium { background: rgba(59, 130, 246, 0.3); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.5); }
.severity-low { background: rgba(16, 185, 129, 0.3); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.5); }
.tuning-input {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: white;
    padding: 6px 10px;
    border-radius: 4px;
    width: 100%;
}
.tuning-input:focus {
    outline: none;
    border-color: rgba(139, 92, 246, 0.8);
    box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
}
.tuning-select {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: white;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
}
.fire-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
}
.fire-stat-value {
    font-weight: 600;
    color: #a78bfa;
}
.cooldown-indicator {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.7rem;
}
.cooldown-active {
    background: rgba(245, 158, 11, 0.3);
    color: #fbbf24;
}
.cooldown-ready {
    background: rgba(16, 185, 129, 0.3);
    color: #34d399;
}
.trigger-filter-btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid rgba(139, 92, 246, 0.3);
    background: transparent;
    color: #a78bfa;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
}
.trigger-filter-btn:hover {
    background: rgba(139, 92, 246, 0.2);
}
.trigger-filter-btn.active {
    background: rgba(139, 92, 246, 0.4);
    border-color: rgba(139, 92, 246, 0.6);
}
</style>

<div id="triggerTuningContainer" style="display: none;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h5 class="mb-1" style="color: #a78bfa;">
                <i class="fas fa-sliders-h me-2"></i>Trigger Tuning
            </h5>
            <p class="text-muted mb-0 small">Configure thresholds, cooldowns, and priorities for <span id="triggerTotalCount">0</span> triggers</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-info" onclick="refreshTriggerList()" title="Refresh">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <!-- Summary Stats -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card h-100" style="background: rgba(139, 92, 246, 0.15); border: 1px solid rgba(139, 92, 246, 0.4);">
                <div class="card-body text-center py-3">
                    <h3 class="mb-0" style="color: #a78bfa;" id="triggerActiveCount">0</h3>
                    <small class="text-muted">Active Triggers</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4);">
                <div class="card-body text-center py-3">
                    <h3 class="mb-0" style="color: #f87171;" id="triggerCriticalCount">0</h3>
                    <small class="text-muted">Critical Severity</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100" style="background: rgba(245, 158, 11, 0.15); border: 1px solid rgba(245, 158, 11, 0.4);">
                <div class="card-body text-center py-3">
                    <h3 class="mb-0" style="color: #fbbf24;" id="triggerOnCooldownCount">0</h3>
                    <small class="text-muted">On Cooldown</small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card h-100" style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4);">
                <div class="card-body text-center py-3">
                    <h3 class="mb-0" style="color: #34d399;" id="triggerFires24h">0</h3>
                    <small class="text-muted">Fires (24h)</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="card mb-4" style="background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(139, 92, 246, 0.3);">
        <div class="card-body py-3">
            <div class="d-flex flex-wrap gap-2 align-items-center">
                <span class="text-muted me-2">Filter:</span>
                <button class="trigger-filter-btn active" data-filter="all" onclick="filterTriggers('all', this)">All</button>
                <button class="trigger-filter-btn" data-filter="critical" onclick="filterTriggers('critical', this)">Critical</button>
                <button class="trigger-filter-btn" data-filter="high" onclick="filterTriggers('high', this)">High</button>
                <button class="trigger-filter-btn" data-filter="medium" onclick="filterTriggers('medium', this)">Medium</button>
                <button class="trigger-filter-btn" data-filter="low" onclick="filterTriggers('low', this)">Low</button>
                <span class="text-muted mx-2">|</span>
                <button class="trigger-filter-btn" data-filter="active" onclick="filterTriggers('active', this)">Active Only</button>
                <button class="trigger-filter-btn" data-filter="inactive" onclick="filterTriggers('inactive', this)">Inactive</button>
                <button class="trigger-filter-btn" data-filter="cooldown" onclick="filterTriggers('cooldown', this)">On Cooldown</button>

                <div class="ms-auto">
                    <input type="text" class="tuning-input" style="width: 200px;" placeholder="Search triggers..."
                           id="triggerSearchInput" oninput="searchTriggers(this.value)">
                </div>
            </div>
        </div>
    </div>

    <!-- Trigger List -->
    <div id="triggerList">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-muted mt-2">Loading triggers...</p>
        </div>
    </div>
</div>

<!-- Trigger Detail Modal -->
<div class="modal fade" id="triggerDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="background: rgba(15, 23, 42, 0.98); border: 1px solid rgba(139, 92, 246, 0.5);">
            <div class="modal-header" style="border-bottom: 1px solid rgba(139, 92, 246, 0.3);">
                <h5 class="modal-title" style="color: #a78bfa;">
                    <i class="fas fa-chart-line me-2"></i><span id="triggerModalName">Trigger Analytics</span>
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="triggerModalBody">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>
</div>

<script>
// Trigger tuning panel state (prefixed to avoid conflicts with other panels)
let triggerTuningAllTriggers = [];
let triggerTuningCurrentFilter = 'all';
let triggerTuningSearchQuery = '';

async function loadTriggerTuning() {
    try {
        const response = await authenticatedFetch('/api/autonomous/triggers/');
        if (!response.ok) throw new Error('Failed to fetch triggers');
        const data = await response.json();

        if (data.success) {
            triggerTuningAllTriggers = data.triggers;
            updateTriggerStats(data);
            renderTriggerList(data.triggers);
        }
    } catch (error) {
        console.error('Error loading triggers:', error);
        document.getElementById('triggerList').innerHTML = `
            <div class="alert alert-danger">Failed to load triggers: ${error.message}</div>
        `;
    }
}

function updateTriggerStats(data) {
    document.getElementById('triggerTotalCount').textContent = data.total_count || 0;
    document.getElementById('triggerActiveCount').textContent = data.active_count || 0;

    // Count by severity
    const critical = data.triggers.filter(t => t.severity === 'critical').length;
    const onCooldown = data.triggers.filter(t => t.is_on_cooldown).length;
    const fires24h = data.triggers.reduce((sum, t) => sum + (t.total_fires || 0), 0);

    document.getElementById('triggerCriticalCount').textContent = critical;
    document.getElementById('triggerOnCooldownCount').textContent = onCooldown;
    document.getElementById('triggerFires24h').textContent = fires24h;
}

function renderTriggerList(triggers) {
    const container = document.getElementById('triggerList');

    // Apply filters
    let filtered = triggers.filter(t => {
        // Search filter
        if (triggerTuningSearchQuery) {
            const q = triggerTuningSearchQuery.toLowerCase();
            if (!t.name.toLowerCase().includes(q) &&
                !t.description.toLowerCase().includes(q) &&
                !t.trigger_type.toLowerCase().includes(q)) {
                return false;
            }
        }

        // Category filter
        if (triggerTuningCurrentFilter === 'all') return true;
        if (triggerTuningCurrentFilter === 'active') return t.is_active;
        if (triggerTuningCurrentFilter === 'inactive') return !t.is_active;
        if (triggerTuningCurrentFilter === 'cooldown') return t.is_on_cooldown;
        if (['critical', 'high', 'medium', 'low'].includes(triggerTuningCurrentFilter)) {
            return t.severity === triggerTuningCurrentFilter;
        }
        return true;
    });

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5 text-muted">
                <i class="fas fa-search fa-3x mb-3"></i>
                <p>No triggers match your filters</p>
            </div>
        `;
        return;
    }

    container.innerHTML = filtered.map(t => `
        <div class="trigger-card ${!t.is_active ? 'disabled' : ''}" data-trigger-id="${t.id}">
            <div class="trigger-header">
                <div class="d-flex align-items-center gap-3">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" ${t.is_active ? 'checked' : ''}
                               onchange="toggleTriggerActive('${t.id}', this.checked)"
                               title="${t.is_active ? 'Disable' : 'Enable'} trigger">
                    </div>
                    <div>
                        <h6 class="mb-0" style="color: ${t.is_active ? '#f9a8d4' : '#9ca3af'};">${t.name}</h6>
                        <small class="text-muted">${t.trigger_type_display} | ${t.situation_type_display}</small>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <span class="severity-badge severity-${t.severity}">${t.severity}</span>
                    ${t.is_on_cooldown ? '<span class="cooldown-indicator cooldown-active"><i class="fas fa-clock me-1"></i>Cooldown</span>' : '<span class="cooldown-indicator cooldown-ready"><i class="fas fa-check me-1"></i>Ready</span>'}
                    <button class="btn btn-sm btn-outline-info" onclick="showTriggerDetail('${t.id}')" title="View Analytics">
                        <i class="fas fa-chart-line"></i>
                    </button>
                </div>
            </div>
            <div class="trigger-body">
                <div class="row g-3">
                    <!-- Threshold -->
                    <div class="col-md-4">
                        <label class="small text-muted mb-1">Threshold</label>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text" style="background: rgba(15, 23, 42, 0.8); border-color: rgba(139, 92, 246, 0.3); color: #a78bfa;">
                                ${t.operator === 'gt' ? '>' : t.operator === 'lt' ? '<' : t.operator === 'contains' ? '~' : t.operator}
                            </span>
                            <input type="text" class="tuning-input" value="${escapeHtml(t.threshold_value)}"
                                   onchange="updateTriggerField('${t.id}', 'threshold_value', this.value)"
                                   title="Field: ${t.target_field}">
                        </div>
                        <small class="text-muted" style="font-size: 0.7rem;">Field: ${t.target_field}</small>
                    </div>

                    <!-- Cooldown -->
                    <div class="col-md-3">
                        <label class="small text-muted mb-1">Cooldown (min)</label>
                        <div class="input-group input-group-sm">
                            <input type="number" class="tuning-input" value="${t.cooldown_minutes}" min="1" max="1440"
                                   onchange="updateTriggerField('${t.id}', 'cooldown_minutes', parseInt(this.value))">
                            <button class="btn btn-outline-warning btn-sm" onclick="resetTriggerCooldown('${t.id}')"
                                    title="Reset cooldown now" ${!t.is_on_cooldown ? 'disabled' : ''}>
                                <i class="fas fa-undo"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Severity -->
                    <div class="col-md-2">
                        <label class="small text-muted mb-1">Severity</label>
                        <select class="tuning-select w-100" onchange="updateTriggerField('${t.id}', 'severity', this.value)">
                            <option value="critical" ${t.severity === 'critical' ? 'selected' : ''}>Critical</option>
                            <option value="high" ${t.severity === 'high' ? 'selected' : ''}>High</option>
                            <option value="medium" ${t.severity === 'medium' ? 'selected' : ''}>Medium</option>
                            <option value="low" ${t.severity === 'low' ? 'selected' : ''}>Low</option>
                        </select>
                    </div>

                    <!-- Priority -->
                    <div class="col-md-3">
                        <label class="small text-muted mb-1">Priority (0-100)</label>
                        <input type="number" class="tuning-input" value="${t.priority}" min="0" max="100"
                               onchange="updateTriggerField('${t.id}', 'priority', parseInt(this.value))">
                    </div>
                </div>

                <!-- Stats Row -->
                <div class="d-flex justify-content-between mt-3 pt-3" style="border-top: 1px solid rgba(139, 92, 246, 0.2);">
                    <div class="fire-stat">
                        <i class="fas fa-fire text-warning"></i>
                        <span class="fire-stat-value">${t.total_fires}</span>
                        <span class="text-muted small">total fires</span>
                    </div>
                    <div class="fire-stat">
                        <i class="fas fa-bell text-info"></i>
                        <span class="fire-stat-value">${t.total_alerts_generated}</span>
                        <span class="text-muted small">alerts</span>
                    </div>
                    <div class="fire-stat">
                        <i class="fas fa-clock text-muted"></i>
                        <span class="text-muted small">${t.last_triggered_at ? formatTimeAgo(t.last_triggered_at) : 'Never fired'}</span>
                    </div>
                </div>
            </div>
        </div>
    `).join('');
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatTimeAgo(isoString) {
    const date = new Date(isoString);
    const now = new Date();
    const seconds = Math.floor((now - date) / 1000);

    if (seconds < 60) return 'Just now';
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
    return `${Math.floor(seconds / 86400)}d ago`;
}

async function toggleTriggerActive(triggerId, isActive) {
    try {
        const response = await authenticatedFetch(`/api/autonomous/triggers/${triggerId}/toggle/`, {
            method: 'POST'
        });
        if (!response.ok) throw new Error('Failed to toggle trigger');
        const data = await response.json();

        if (data.success) {
            showToast(data.message, 'success');
            // Update local state
            const trigger = triggerTuningAllTriggers.find(t => t.id === triggerId);
            if (trigger) {
                trigger.is_active = data.trigger.is_active;
            }
            renderTriggerList(triggerTuningAllTriggers);
        }
    } catch (error) {
        console.error('Error toggling trigger:', error);
        showToast('Failed to toggle trigger', 'error');
    }
}

async function updateTriggerField(triggerId, field, value) {
    try {
        const response = await authenticatedFetch(`/api/autonomous/triggers/${triggerId}/update/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ [field]: value })
        });
        if (!response.ok) throw new Error('Failed to update trigger');
        const data = await response.json();

        if (data.success) {
            showToast(`Updated ${field}`, 'success');
            // Update local state
            const trigger = triggerTuningAllTriggers.find(t => t.id === triggerId);
            if (trigger) {
                trigger[field] = value;
            }
        }
    } catch (error) {
        console.error('Error updating trigger:', error);
        showToast('Failed to update trigger', 'error');
    }
}

async function resetTriggerCooldown(triggerId) {
    try {
        const response = await authenticatedFetch(`/api/autonomous/triggers/${triggerId}/reset-cooldown/`, {
            method: 'POST'
        });
        if (!response.ok) throw new Error('Failed to reset cooldown');
        const data = await response.json();

        if (data.success) {
            showToast('Cooldown reset', 'success');
            // Update local state
            const trigger = triggerTuningAllTriggers.find(t => t.id === triggerId);
            if (trigger) {
                trigger.is_on_cooldown = false;
                trigger.last_triggered_at = null;
            }
            renderTriggerList(triggerTuningAllTriggers);
        }
    } catch (error) {
        console.error('Error resetting cooldown:', error);
        showToast('Failed to reset cooldown', 'error');
    }
}

async function showTriggerDetail(triggerId) {
    try {
        const response = await authenticatedFetch(`/api/autonomous/triggers/${triggerId}/`);
        if (!response.ok) throw new Error('Failed to fetch trigger details');
        const data = await response.json();

        if (data.success) {
            document.getElementById('triggerModalName').textContent = data.trigger.name;

            const stats = data.fire_stats;
            const trigger = data.trigger;

            document.getElementById('triggerModalBody').innerHTML = `
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card h-100" style="background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.3);">
                            <div class="card-body text-center py-3">
                                <h4 class="mb-0" style="color: #a78bfa;">${stats.fires_1h}</h4>
                                <small class="text-muted">Last Hour</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card h-100" style="background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.3);">
                            <div class="card-body text-center py-3">
                                <h4 class="mb-0" style="color: #60a5fa;">${stats.fires_24h}</h4>
                                <small class="text-muted">Last 24h</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card h-100" style="background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.3);">
                            <div class="card-body text-center py-3">
                                <h4 class="mb-0" style="color: #34d399;">${stats.fires_7d}</h4>
                                <small class="text-muted">Last 7 Days</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card h-100" style="background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.3);">
                            <div class="card-body text-center py-3">
                                <h4 class="mb-0" style="color: #fbbf24;">${stats.fires_30d}</h4>
                                <small class="text-muted">Last 30 Days</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mb-4" style="background: rgba(30, 41, 59, 0.8); border-color: rgba(139, 92, 246, 0.3);">
                    <div class="card-header" style="background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.3);">
                        <h6 class="mb-0" style="color: #a78bfa;">Configuration</h6>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <p class="mb-2"><strong>Type:</strong> ${trigger.trigger_type_display}</p>
                                <p class="mb-2"><strong>Situation:</strong> ${trigger.situation_type_display}</p>
                                <p class="mb-2"><strong>Target Field:</strong> <code>${trigger.target_field}</code></p>
                                <p class="mb-2"><strong>Condition:</strong> ${trigger.operator_display} <code>${escapeHtml(trigger.threshold_value)}</code></p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-2"><strong>Severity:</strong> <span class="severity-badge severity-${trigger.severity}">${trigger.severity}</span></p>
                                <p class="mb-2"><strong>Cooldown:</strong> ${trigger.cooldown_minutes} minutes</p>
                                <p class="mb-2"><strong>Priority:</strong> ${trigger.priority}</p>
                                <p class="mb-2"><strong>Spiders:</strong> ${trigger.target_spiders?.length > 0 ? trigger.target_spiders.join(', ') : 'All'}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card" style="background: rgba(30, 41, 59, 0.8); border-color: rgba(139, 92, 246, 0.3);">
                    <div class="card-header" style="background: rgba(139, 92, 246, 0.1); border-color: rgba(139, 92, 246, 0.3);">
                        <h6 class="mb-0" style="color: #a78bfa;">Recent Events (Last 20)</h6>
                    </div>
                    <div class="card-body p-0" style="max-height: 300px; overflow-y: auto;">
                        ${data.recent_events.length > 0 ? `
                            <table class="table table-dark table-sm mb-0" style="background: transparent;">
                                <thead>
                                    <tr>
                                        <th>Time</th>
                                        <th>Spider</th>
                                        <th>Matched Value</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${data.recent_events.map(e => `
                                        <tr>
                                            <td class="text-muted">${formatTimeAgo(e.fired_at)}</td>
                                            <td>${e.spider_name}</td>
                                            <td><small>${escapeHtml(e.matched_value.substring(0, 50))}${e.matched_value.length > 50 ? '...' : ''}</small></td>
                                            <td>
                                                ${e.alert_generated ? '<i class="fas fa-bell text-info" title="Alert sent"></i>' : ''}
                                                ${e.discord_sent ? '<i class="fab fa-discord text-purple" title="Discord notified"></i>' : ''}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        ` : '<p class="text-muted text-center py-3">No recent events</p>'}
                    </div>
                </div>
            `;

            new bootstrap.Modal(document.getElementById('triggerDetailModal')).show();
        }
    } catch (error) {
        console.error('Error fetching trigger details:', error);
        showToast('Failed to load trigger details', 'error');
    }
}

function filterTriggers(filter, btn) {
    triggerTuningCurrentFilter = filter;

    // Update button states
    document.querySelectorAll('.trigger-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    renderTriggerList(triggerTuningAllTriggers);
}

function searchTriggers(query) {
    triggerTuningSearchQuery = query;
    renderTriggerList(triggerTuningAllTriggers);
}

function refreshTriggerList() {
    loadTriggerTuning();
}

function showToast(message, type = 'info') {
    // Use existing toast system or simple alert
    if (typeof showNotification === 'function') {
        showNotification(message, type);
    } else {
        console.log(`[${type}] ${message}`);
    }
}

// Expose functions globally for cross-panel access
window.loadTriggerTuning = loadTriggerTuning;
window.refreshTriggerList = refreshTriggerList;
</script>
