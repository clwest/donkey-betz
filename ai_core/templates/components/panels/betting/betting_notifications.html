<!-- Session 562: Push Notification Settings for Betting Alerts -->
<div class="tab-pane fade" id="betting-notifications" role="tabpanel">
    <div class="container-fluid p-3">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="mb-0">Push Notifications</h5>
            <div id="notification-status-badge">
                <span class="badge bg-secondary">Checking...</span>
            </div>
        </div>

        <!-- Permission Request Card -->
        <div class="card bg-dark border-primary mb-4" id="enable-notifications-card">
            <div class="card-body text-center py-4">
                <i class="bi bi-bell-fill text-primary mb-3" style="font-size: 3rem;"></i>
                <h5>Enable Push Notifications</h5>
                <p class="text-muted mb-3">
                    Get instant alerts when arbitrage opportunities are detected!
                    Never miss a profitable bet.
                </p>
                <button class="btn btn-primary btn-lg" onclick="enablePushNotifications()">
                    <i class="bi bi-bell me-2"></i>Enable Notifications
                </button>
            </div>
        </div>

        <!-- Settings Card (shown when enabled) -->
        <div class="card bg-dark border-secondary mb-4" id="notification-settings-card" style="display: none;">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-gear me-2"></i>Notification Settings</span>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="notificationsEnabled" checked>
                    <label class="form-check-label" for="notificationsEnabled">Enabled</label>
                </div>
            </div>
            <div class="card-body">
                <!-- Arbitrage Alerts -->
                <div class="mb-4">
                    <h6 class="text-primary mb-3"><i class="bi bi-graph-up-arrow me-2"></i>Arbitrage Alerts</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="arbAlertsEnabled" checked>
                                <label class="form-check-label" for="arbAlertsEnabled">Enable Arb Alerts</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Minimum Profit %</label>
                            <div class="input-group input-group-sm">
                                <input type="number" class="form-control bg-dark text-white" id="arbMinProfit"
                                       value="1.0" min="0.5" max="10" step="0.1">
                                <span class="input-group-text bg-secondary">%</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <label class="form-label">Sports to Alert (leave empty for all)</label>
                        <div class="d-flex flex-wrap gap-2">
                            <div class="form-check">
                                <input class="form-check-input sport-filter" type="checkbox" value="nfl" id="sport-nfl">
                                <label class="form-check-label" for="sport-nfl">NFL</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input sport-filter" type="checkbox" value="nba" id="sport-nba">
                                <label class="form-check-label" for="sport-nba">NBA</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input sport-filter" type="checkbox" value="nhl" id="sport-nhl">
                                <label class="form-check-label" for="sport-nhl">NHL</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input sport-filter" type="checkbox" value="mlb" id="sport-mlb">
                                <label class="form-check-label" for="sport-mlb">MLB</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input sport-filter" type="checkbox" value="soccer" id="sport-soccer">
                                <label class="form-check-label" for="sport-soccer">Soccer</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Line Movement Alerts -->
                <div class="mb-4">
                    <h6 class="text-warning mb-3"><i class="bi bi-arrow-left-right me-2"></i>Line Movement Alerts</h6>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="lineMovementEnabled">
                                <label class="form-check-label" for="lineMovementEnabled">Enable Movement Alerts</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Movement Threshold (points)</label>
                            <div class="input-group input-group-sm">
                                <input type="number" class="form-control bg-dark text-white" id="lineMovementThreshold"
                                       value="1.0" min="0.5" max="5" step="0.5">
                                <span class="input-group-text bg-secondary">pts</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quiet Hours -->
                <div class="mb-4">
                    <h6 class="text-info mb-3"><i class="bi bi-moon me-2"></i>Quiet Hours</h6>
                    <div class="row g-3 align-items-center">
                        <div class="col-md-4">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="quietHoursEnabled">
                                <label class="form-check-label" for="quietHoursEnabled">Enable Quiet Hours</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Start</label>
                            <select class="form-select form-select-sm bg-dark text-white" id="quietStartHour">
                                <option value="20">8:00 PM</option>
                                <option value="21">9:00 PM</option>
                                <option value="22" selected>10:00 PM</option>
                                <option value="23">11:00 PM</option>
                                <option value="0">12:00 AM</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">End</label>
                            <select class="form-select form-select-sm bg-dark text-white" id="quietEndHour">
                                <option value="6">6:00 AM</option>
                                <option value="7">7:00 AM</option>
                                <option value="8" selected>8:00 AM</option>
                                <option value="9">9:00 AM</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Rate Limiting -->
                <div class="mb-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Max Notifications Per Hour</label>
                            <input type="number" class="form-control bg-dark text-white form-control-sm"
                                   id="maxNotificationsPerHour" value="10" min="1" max="50">
                        </div>
                    </div>
                </div>

                <!-- Save Button -->
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" onclick="saveNotificationPreferences()">
                        <i class="bi bi-save me-2"></i>Save Preferences
                    </button>
                    <button class="btn btn-outline-secondary" onclick="sendTestNotification()">
                        <i class="bi bi-bell me-2"></i>Send Test
                    </button>
                    <button class="btn btn-outline-danger" onclick="disablePushNotifications()">
                        <i class="bi bi-bell-slash me-2"></i>Disable
                    </button>
                </div>
            </div>
        </div>

        <!-- Subscription Info -->
        <div class="card bg-dark border-secondary" id="subscription-info-card" style="display: none;">
            <div class="card-header">
                <i class="bi bi-info-circle me-2"></i>Subscription Info
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <small class="text-muted">Status</small>
                        <p id="sub-status" class="mb-0">-</p>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted">Devices</small>
                        <p id="sub-count" class="mb-0">-</p>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted">Last Used</small>
                        <p id="sub-last-used" class="mb-0">-</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Push Notification Management
let pushSubscription = null;

// Check push notification support and status on load
document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('betting-notifications')) {
        checkPushStatus();
    }
});

async function checkPushStatus() {
    const statusBadge = document.getElementById('notification-status-badge');
    const enableCard = document.getElementById('enable-notifications-card');
    const settingsCard = document.getElementById('notification-settings-card');
    const infoCard = document.getElementById('subscription-info-card');

    // Check browser support
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        statusBadge.innerHTML = '<span class="badge bg-danger">Not Supported</span>';
        enableCard.querySelector('.card-body').innerHTML = `
            <i class="bi bi-exclamation-triangle text-warning mb-3" style="font-size: 3rem;"></i>
            <h5>Push Notifications Not Supported</h5>
            <p class="text-muted">Your browser doesn't support push notifications.</p>
        `;
        return;
    }

    // Check permission state
    const permission = Notification.permission;

    if (permission === 'denied') {
        statusBadge.innerHTML = '<span class="badge bg-danger">Blocked</span>';
        enableCard.querySelector('.card-body').innerHTML = `
            <i class="bi bi-shield-x text-danger mb-3" style="font-size: 3rem;"></i>
            <h5>Notifications Blocked</h5>
            <p class="text-muted">Please enable notifications in your browser settings.</p>
        `;
        return;
    }

    // Check for existing subscription
    try {
        const registration = await navigator.serviceWorker.ready;
        pushSubscription = await registration.pushManager.getSubscription();

        if (pushSubscription) {
            statusBadge.innerHTML = '<span class="badge bg-success">Enabled</span>';
            enableCard.style.display = 'none';
            settingsCard.style.display = 'block';
            infoCard.style.display = 'block';
            loadNotificationPreferences();
            loadSubscriptionInfo();
        } else {
            statusBadge.innerHTML = '<span class="badge bg-warning">Not Subscribed</span>';
        }
    } catch (err) {
        console.error('Error checking push status:', err);
        statusBadge.innerHTML = '<span class="badge bg-secondary">Error</span>';
    }
}

async function enablePushNotifications() {
    try {
        // Register service worker
        const registration = await navigator.serviceWorker.register('/static/js/push-service-worker.js');
        await navigator.serviceWorker.ready;

        // Get VAPID public key
        const response = await fetch('/api/v1/push/vapid-key/');
        const data = await response.json();

        if (!data.enabled) {
            showToast('Push notifications are disabled on this server', 'warning');
            return;
        }

        // Convert base64 VAPID key to Uint8Array
        const vapidPublicKey = urlBase64ToUint8Array(data.publicKey);

        // Subscribe to push
        pushSubscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: vapidPublicKey
        });

        // Send subscription to server
        const subscribeResponse = await fetch('/api/v1/push/subscribe/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                endpoint: pushSubscription.endpoint,
                keys: {
                    p256dh: btoa(String.fromCharCode.apply(null, new Uint8Array(pushSubscription.getKey('p256dh')))),
                    auth: btoa(String.fromCharCode.apply(null, new Uint8Array(pushSubscription.getKey('auth'))))
                }
            })
        });

        const result = await subscribeResponse.json();

        if (result.success) {
            showToast('Push notifications enabled!', 'success');
            checkPushStatus();
        } else {
            throw new Error(result.error || 'Failed to subscribe');
        }

    } catch (err) {
        console.error('Error enabling push:', err);
        showToast('Failed to enable notifications: ' + err.message, 'danger');
    }
}

async function disablePushNotifications() {
    try {
        if (pushSubscription) {
            // Unsubscribe from push
            await fetch('/api/v1/push/unsubscribe/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ endpoint: pushSubscription.endpoint })
            });

            await pushSubscription.unsubscribe();
            pushSubscription = null;

            showToast('Push notifications disabled', 'info');
            checkPushStatus();
        }
    } catch (err) {
        console.error('Error disabling push:', err);
        showToast('Failed to disable notifications', 'danger');
    }
}

async function loadNotificationPreferences() {
    try {
        const response = await fetch('/api/v1/push/preferences/');
        const data = await response.json();

        if (data.success) {
            const prefs = data.preferences;
            document.getElementById('notificationsEnabled').checked = prefs.notifications_enabled;
            document.getElementById('arbAlertsEnabled').checked = prefs.arb_alerts_enabled;
            document.getElementById('arbMinProfit').value = prefs.arb_min_profit_pct;
            document.getElementById('lineMovementEnabled').checked = prefs.line_movement_enabled;
            document.getElementById('lineMovementThreshold').value = prefs.line_movement_threshold;
            document.getElementById('quietHoursEnabled').checked = prefs.quiet_hours_enabled;
            document.getElementById('quietStartHour').value = prefs.quiet_start_hour;
            document.getElementById('quietEndHour').value = prefs.quiet_end_hour;
            document.getElementById('maxNotificationsPerHour').value = prefs.max_notifications_per_hour;

            // Set sport filters
            if (prefs.arb_sports && prefs.arb_sports.length > 0) {
                prefs.arb_sports.forEach(sport => {
                    const checkbox = document.getElementById('sport-' + sport);
                    if (checkbox) checkbox.checked = true;
                });
            }
        }
    } catch (err) {
        console.error('Error loading preferences:', err);
    }
}

async function saveNotificationPreferences() {
    try {
        const sports = Array.from(document.querySelectorAll('.sport-filter:checked'))
            .map(cb => cb.value);

        const response = await fetch('/api/v1/push/preferences/', {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                notifications_enabled: document.getElementById('notificationsEnabled').checked,
                arb_alerts_enabled: document.getElementById('arbAlertsEnabled').checked,
                arb_min_profit_pct: parseFloat(document.getElementById('arbMinProfit').value),
                arb_sports: sports,
                line_movement_enabled: document.getElementById('lineMovementEnabled').checked,
                line_movement_threshold: parseFloat(document.getElementById('lineMovementThreshold').value),
                quiet_hours_enabled: document.getElementById('quietHoursEnabled').checked,
                quiet_start_hour: parseInt(document.getElementById('quietStartHour').value),
                quiet_end_hour: parseInt(document.getElementById('quietEndHour').value),
                max_notifications_per_hour: parseInt(document.getElementById('maxNotificationsPerHour').value)
            })
        });

        const data = await response.json();

        if (data.success) {
            showToast('Preferences saved!', 'success');
        } else {
            throw new Error(data.error || 'Failed to save');
        }
    } catch (err) {
        console.error('Error saving preferences:', err);
        showToast('Failed to save preferences', 'danger');
    }
}

async function sendTestNotification() {
    try {
        const response = await fetch('/api/v1/push/test/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            }
        });

        const data = await response.json();

        if (data.success) {
            showToast(data.message, 'success');
        } else {
            throw new Error(data.error || 'Failed to send test');
        }
    } catch (err) {
        console.error('Error sending test:', err);
        showToast('Failed to send test notification', 'danger');
    }
}

async function loadSubscriptionInfo() {
    try {
        const response = await fetch('/api/v1/push/status/');
        const data = await response.json();

        if (data.success) {
            document.getElementById('sub-status').textContent = data.subscribed ? 'Active' : 'Inactive';
            document.getElementById('sub-count').textContent = data.subscription_count;

            if (data.subscriptions && data.subscriptions.length > 0) {
                const lastUsed = data.subscriptions[0].last_used_at;
                document.getElementById('sub-last-used').textContent = lastUsed
                    ? new Date(lastUsed).toLocaleString()
                    : 'Never';
            }
        }
    } catch (err) {
        console.error('Error loading subscription info:', err);
    }
}

// Helper: Convert base64 VAPID key to Uint8Array
function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding)
        .replace(/-/g, '+')
        .replace(/_/g, '/');
    const rawData = window.atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
}

// Helper: Get CSRF cookie
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
