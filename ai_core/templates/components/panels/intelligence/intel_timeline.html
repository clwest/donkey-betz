{% comment %}
Session 399: Timeline Sub-Tab
Visual timeline of data collection and source freshness
{% endcomment %}

<!-- ========== TIMELINE SUB-TAB ========== -->
<div class="tab-pane fade" id="intel-timeline" role="tabpanel">
    <div class="row">
        <!-- Timeline Chart -->
        <div class="col-md-12 mb-4">
            <div class="card" style="background: #1a1a1a; border: 1px solid rgba(6, 182, 212, 0.3);">
                <div class="card-header d-flex justify-content-between align-items-center" style="background: rgba(6, 182, 212, 0.1); border-bottom: 1px solid rgba(6, 182, 212, 0.3);">
                    <h5 class="mb-0" style="color: #22d3ee;">&#128200; Data Collection Timeline</h5>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-sm timeline-range-btn active" onclick="setTimelineRange('24h', this)" style="background: rgba(6, 182, 212, 0.3); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.4);">24h</button>
                        <button type="button" class="btn btn-sm timeline-range-btn" onclick="setTimelineRange('7d', this)" style="background: rgba(6, 182, 212, 0.1); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.4);">7d</button>
                        <button type="button" class="btn btn-sm timeline-range-btn" onclick="setTimelineRange('30d', this)" style="background: rgba(6, 182, 212, 0.1); color: #67e8f9; border: 1px solid rgba(6, 182, 212, 0.4);">30d</button>
                    </div>
                </div>
                <div class="card-body">
                    <!-- Timeline Chart Container -->
                    <div id="timeline-chart" style="height: 180px; position: relative;">
                        <p class="text-center text-muted py-5">
                            <span class="spinner-border spinner-border-sm me-2"></span>
                            Loading timeline...
                        </p>
                    </div>
                    <!-- Timeline Legend -->
                    <div class="d-flex justify-content-center gap-4 mt-3">
                        <small class="text-muted">
                            <span style="display: inline-block; width: 12px; height: 12px; background: linear-gradient(180deg, #06b6d4 0%, #0891b2 100%); border-radius: 2px; margin-right: 4px;"></span>
                            Items Collected
                        </small>
                        <small id="timeline-total" class="text-muted">Total: --</small>
                        <small id="timeline-peak" class="text-muted">Peak: --</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Source Freshness Grid -->
        <div class="col-md-12">
            <div class="card" style="background: #1a1a1a; border: 1px solid rgba(34, 197, 94, 0.3);">
                <div class="card-header d-flex justify-content-between align-items-center" style="background: rgba(34, 197, 94, 0.1); border-bottom: 1px solid rgba(34, 197, 94, 0.3);">
                    <h5 class="mb-0" style="color: #22c55e;">&#128994; Source Freshness</h5>
                    <div class="d-flex gap-3">
                        <small class="d-flex align-items-center">
                            <span style="width: 10px; height: 10px; background: #22c55e; border-radius: 50%; margin-right: 6px;"></span>
                            Fresh (&lt;6h)
                        </small>
                        <small class="d-flex align-items-center">
                            <span style="width: 10px; height: 10px; background: #f59e0b; border-radius: 50%; margin-right: 6px;"></span>
                            Aging (6-24h)
                        </small>
                        <small class="d-flex align-items-center">
                            <span style="width: 10px; height: 10px; background: #ef4444; border-radius: 50%; margin-right: 6px;"></span>
                            Stale (&gt;24h)
                        </small>
                    </div>
                </div>
                <div class="card-body">
                    <div id="freshness-grid" class="row">
                        <p class="text-center text-muted py-4 col-12">
                            <span class="spinner-border spinner-border-sm me-2"></span>
                            Loading source freshness...
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- END TIMELINE SUB-TAB -->

<style>
.timeline-range-btn {
    transition: all 0.2s ease;
}
.timeline-range-btn.active {
    background: rgba(6, 182, 212, 0.4) !important;
    font-weight: bold;
}
.timeline-range-btn:hover:not(.active) {
    background: rgba(6, 182, 212, 0.2) !important;
}
.freshness-card {
    transition: all 0.2s ease;
}
.freshness-card:hover {
    transform: scale(1.02);
    filter: brightness(1.1);
}
.timeline-bar {
    transition: height 0.3s ease;
}
.timeline-bar:hover {
    filter: brightness(1.3);
}
</style>
