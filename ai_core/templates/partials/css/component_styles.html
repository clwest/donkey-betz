<style>
/* =====================================================
   HEADER STYLES
   ===================================================== */
.studio-header {
    background: linear-gradient(135deg, #0891b2, #0e7490, #6366f1);
    padding: 3rem 2rem;
    border-radius: 20px;
    margin-bottom: 2rem;
    box-shadow: 0 20px 60px rgba(6, 182, 212, 0.5), 0 0 100px rgba(251, 191, 36, 0.3);
    border: 3px solid var(--cyan);
    position: relative;
    overflow: hidden;
}

.studio-header::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 200%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    animation: shine 8s infinite;
}

@keyframes shine {
    0% { left: -100%; }
    50% { left: 100%; }
    100% { left: 100%; }
}

.studio-header h1, .studio-header p {
    color: #ffffff;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    position: relative;
    z-index: 1;
}

.donkey-brand {
    color: #fbbf24;
    text-shadow: 0 0 30px rgba(251, 191, 36, 0.8), 0 4px 8px rgba(0, 0, 0, 0.5);
    animation: glow-pulse 3s ease-in-out infinite;
    font-size: 4rem;
    font-weight: 900;
    letter-spacing: 2px;
}

@keyframes glow-pulse {
    0%, 100% { text-shadow: 0 0 30px rgba(251, 191, 36, 0.8), 0 4px 8px rgba(0, 0, 0, 0.5); }
    50% { text-shadow: 0 0 50px rgba(251, 191, 36, 1), 0 4px 12px rgba(0, 0, 0, 0.6); }
}

@keyframes logo-glow {
    0%, 100% {
        box-shadow: 0 0 30px rgba(251, 191, 36, 0.8), 0 8px 20px rgba(0, 0, 0, 0.5);
        transform: scale(1);
    }
    50% {
        box-shadow: 0 0 50px rgba(251, 191, 36, 1), 0 10px 30px rgba(0, 0, 0, 0.6);
        transform: scale(1.02);
    }
}

.tagline {
    font-size: 1.4rem;
    font-weight: 700;
    font-style: italic;
    color: #fcd34d;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    letter-spacing: 1px;
}

.power-badge {
    background: rgba(0, 0, 0, 0.3);
    padding: 0.4rem 1rem;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.2);
}

.ai-assistant-badge {
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #000;
    font-weight: 800;
    font-size: 1.1rem;
    padding: 0.8rem 2rem;
    border-radius: 50px;
    box-shadow: 0 8px 25px rgba(251, 191, 36, 0.6);
    display: inline-block;
    border: 2px solid #fcd34d;
}

/* =====================================================
   CARD STYLES
   ===================================================== */
.card {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    border: 2px solid rgba(251, 191, 36, 0.3);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    transition: all 0.3s ease;
    color: var(--text-primary);
}

.card:hover {
    transform: translateY(-3px);
    border-color: rgba(251, 191, 36, 0.6);
    box-shadow: 0 12px 40px rgba(251, 191, 36, 0.2);
}

.card h3 {
    color: #fbbf24;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
}

.card h4 {
    color: var(--cyan-bright);
    font-weight: 600;
}

.feature-card {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border-radius: 15px;
    padding: 1.5rem;
    border: 2px solid rgba(255, 255, 255, 0.2);
    transition: all 0.3s ease;
    height: 100%;
}

.feature-card:hover {
    transform: translateY(-5px);
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.feature-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    display: block;
}

.feature-count {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 50px;
    padding: 0.5rem 1.2rem;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 1rem;
    display: inline-block;
    border: 2px solid rgba(255, 255, 255, 0.3);
}

/* Trending cards */
.trend-card {
    transition: all 0.3s ease;
}

.trend-card:hover {
    border-color: rgba(236, 72, 153, 0.5) !important;
    box-shadow: 0 8px 25px rgba(236, 72, 153, 0.2);
    transform: translateY(-2px);
}

.trend-card .dropdown-menu {
    background: #1a1a1a !important;
    border: 1px solid rgba(236, 72, 153, 0.3) !important;
    border-radius: 8px !important;
    padding: 0.5rem 0 !important;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5) !important;
}

.trend-card .dropdown-item {
    color: #f9a8d4 !important;
    padding: 0.5rem 1rem !important;
    transition: all 0.2s ease !important;
}

.trend-card .dropdown-item:hover {
    background: rgba(236, 72, 153, 0.2) !important;
    color: #fbcfe8 !important;
}

/* =====================================================
   IMAGE GALLERY STYLES
   ===================================================== */
.image-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 2rem;
}

.image-card {
    position: relative;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    transition: all 0.3s ease;
    border: 2px solid rgba(251, 191, 36, 0.3);
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
}

.image-card:hover {
    transform: translateY(-5px);
    border-color: #fbbf24;
    box-shadow: 0 15px 40px rgba(251, 191, 36, 0.4);
}

.image-card img {
    width: 100%;
    height: auto;
    display: block;
}

.image-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
    padding: 15px;
    color: var(--cyan-bright);
    font-weight: 600;
}

/* Checkbox styling for batch selection */
.image-select-checkbox {
    accent-color: var(--cyan) !important;
    transform: scale(1.2);
    filter: contrast(1.5) brightness(1.1);
    -webkit-appearance: checkbox;
    appearance: checkbox;
}

.image-select-checkbox:checked {
    background-color: var(--cyan) !important;
    border-color: var(--cyan-bright) !important;
    box-shadow: 0 0 10px rgba(6, 182, 212, 0.8);
    filter: contrast(1.8) brightness(1.2);
}

.image-card.selected {
    border: 4px solid var(--cyan) !important;
    box-shadow: 0 0 30px rgba(6, 182, 212, 0.8) !important;
    transform: scale(1.02);
}

/* =====================================================
   TAB NAVIGATION STYLES
   ===================================================== */
.nav-tabs {
    border-bottom: 3px solid var(--cyan);
    margin-bottom: 2rem;
    position: relative;
    z-index: 1000;
    pointer-events: auto;
}

.nav-tabs .nav-link {
    color: var(--text-secondary);
    border: 2px solid transparent;
    border-radius: 10px 10px 0 0;
    padding: 12px 20px;
    font-weight: 600;
    transition: all 0.3s ease;
    background: rgba(15, 23, 42, 0.5);
    margin-right: 5px;
    pointer-events: auto;
}

.nav-tabs .nav-link:hover {
    color: var(--cyan-bright);
    background: rgba(6, 182, 212, 0.2);
    border-color: var(--cyan);
}

.nav-tabs .nav-link.active {
    color: #000;
    background: var(--cyan);
    border-color: var(--cyan);
    font-weight: 700;
}

.tab-content {
    padding: 2rem;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 0 10px 10px 10px;
    border: 2px solid rgba(6, 182, 212, 0.3);
}

.tab-pane {
    min-height: 500px;
}

/* Nested Pills Styling */
.nav-pills {
    background: rgba(15, 23, 42, 0.4);
    padding: 15px;
    border-radius: 10px;
    border: 2px solid rgba(251, 191, 36, 0.2);
    margin-bottom: 2rem;
}

.nav-pills .nav-link {
    color: var(--text-secondary);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    background: rgba(15, 23, 42, 0.3);
    margin: 0 5px 5px 0;
}

.nav-pills .nav-link:hover {
    color: var(--cyan-bright);
    background: rgba(6, 182, 212, 0.2);
    border-color: var(--cyan);
    transform: translateY(-2px);
}

.nav-pills .nav-link.active {
    color: #000;
    background: linear-gradient(135deg, var(--cyan), var(--cyan-bright));
    border-color: var(--cyan-bright);
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
}

/* =====================================================
   MODAL STYLES
   ===================================================== */
#gallerySelectionModal {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background: rgba(0, 0, 0, 0.85) !important;
    z-index: 9999 !important;
    overflow-y: auto !important;
    padding: 20px !important;
    pointer-events: none !important;
}

#gallerySelectionModal.show {
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    pointer-events: auto !important;
}

#gallerySelectionModal .modal-dialog {
    margin: 50px auto;
    max-width: 90%;
}

#gallerySelectionModal .modal-content {
    background: var(--dark);
    border: 2px solid var(--cyan);
    border-radius: 15px;
    box-shadow: 0 20px 60px rgba(6, 182, 212, 0.5);
}

/* Ensure navigation elements are always clickable */
.nav, .nav-tabs, .nav-pills, .navbar,
.nav-link, .nav-item, button, a {
    pointer-events: auto !important;
}

/* =====================================================
   UNIFIED GALLERY STYLES
   ===================================================== */
.unified-gallery-card {
    transition: all 0.3s ease;
}

.unified-gallery-card-selected {
    border: 3px solid var(--cyan-bright) !important;
    box-shadow: 0 0 20px rgba(6, 182, 212, 0.6);
    transform: scale(1.02);
}

.unified-card-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    padding: 8px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    margin-top: 8px;
}

.unified-card-actions .btn {
    flex: 1;
    max-width: 60px;
    height: 36px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    border-radius: 6px;
}

.unified-card-actions .btn-action-favorite {
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid var(--goldenrod);
    color: var(--goldenrod);
}

.unified-card-actions .btn-action-favorite:hover,
.unified-card-actions .btn-action-favorite.is-favorite {
    background: var(--goldenrod);
    color: #000;
}

.unified-card-actions .btn-action-download {
    background: rgba(6, 182, 212, 0.1);
    border: 1px solid var(--cyan);
    color: var(--cyan);
}

.unified-card-actions .btn-action-download:hover {
    background: var(--cyan);
    color: #000;
}

.unified-card-actions .btn-action-delete {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
}

.unified-card-actions .btn-action-delete:hover {
    background: var(--danger);
    color: #fff;
}

/* =====================================================
   RESPONSIVE STYLES
   ===================================================== */
@media (max-width: 768px) {
    .image-gallery {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)) !important;
        gap: 15px !important;
    }
}

@media (min-width: 769px) and (max-width: 1024px) {
    .image-gallery {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) !important;
        gap: 18px !important;
    }
}

@media (min-width: 1025px) and (max-width: 1600px) {
    .image-gallery {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) !important;
        gap: 20px !important;
    }
}

@media (min-width: 1601px) {
    .image-gallery {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)) !important;
        gap: 22px !important;
    }
}

/* =====================================================
   ANIMATION KEYFRAMES
   ===================================================== */
@keyframes fadeInOut {
    0% { opacity: 0; transform: translateX(-50%) translateY(5px); }
    20% { opacity: 1; transform: translateX(-50%) translateY(0); }
    80% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
}

@keyframes celebrationPop {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    50% { transform: translate(-50%, -50%) scale(1.1); }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

@keyframes celebrationFade {
    from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    to { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
}

@keyframes confettiFall {
    0% { transform: translateY(0) rotateZ(0deg); }
    100% { transform: translateY(100vh) rotateZ(720deg); }
}
</style>
