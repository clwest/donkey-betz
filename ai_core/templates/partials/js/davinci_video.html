<script>
// SESSION 115: DAVINCI RESOLVE VIDEO EDITING

        // Global state for DaVinci editing
        const davinciState = {
            textOverlay: { videoId: null, videoName: null },
            colorGrading: { videoId: null, videoName: null },
            audioMixing: { videoId: null, videoName: null },
            chainVideos: []
        };

        // Helper function to switch tabs
        function switchToTab(tabId) {
            const tabButton = document.getElementById(tabId);
            if (tabButton) {
                tabButton.click();
            }
        }

        // 1. SELECT VIDEO FOR DAVINCI (used by text, color, audio)
        async function selectVideoForDaVinci(feature) {
            try {
                const apiClient = {
                    get: async (url) => {
                        const response = await authenticatedFetch(url);
                        return response;
                    }
                };

                // Fetch video gallery
                const response = await apiClient.get('/api/v1/gallery/all/?type=videos&limit=100');
                const videos = (response.results || []).filter(item => item.type === 'video');

                if (videos.length === 0) {
                    alert('❌ No videos in gallery!\n\nGenerate some videos first.');
                    return;
                }

                // Create selection modal
                const modal = document.createElement('div');
                modal.style = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: rgba(0,0,0,0.9); z-index: 10000; overflow-y: auto; padding: 40px;
                `;
                modal.innerHTML = `
                    <div style="max-width: 1400px; margin: 0 auto; background: #1a1a1a; border-radius: 12px; padding: 30px; border: 2px solid #00d9ff;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h4 style="color: #00d9ff; margin: 0;">🎬 Select Video for ${feature === 'text' ? 'Text Overlay' : feature === 'color' ? 'Color Grading' : 'Audio Mixing'}</h4>
                            <button onclick="this.closest('div[style*=fixed]').remove()" style="background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">✕ Close</button>
                        </div>
                        <div id="davinciVideoGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;"></div>
                    </div>
                `;
                document.body.appendChild(modal);

                // Populate video grid
                const grid = modal.querySelector('#davinciVideoGrid');
                videos.forEach(video => {
                    const card = document.createElement('div');
                    card.style = 'background: #222; border: 2px solid #444; border-radius: 8px; padding: 15px; cursor: pointer; transition: all 0.3s;';
                    card.onmouseover = () => card.style.borderColor = '#00d9ff';
                    card.onmouseout = () => card.style.borderColor = '#444';
                    card.onclick = () => {
                        // Store video info
                        if (feature === 'text') {
                            davinciState.textOverlay = { videoId: video.id, videoName: video.prompt || 'Untitled Video' };
                            document.getElementById('textOverlayVideoInfo').style.display = 'block';
                            document.getElementById('textOverlayVideoName').textContent = davinciState.textOverlay.videoName;
                            document.getElementById('renderTextBtn').disabled = false;
                        } else if (feature === 'color') {
                            davinciState.colorGrading = { videoId: video.id, videoName: video.prompt || 'Untitled Video' };
                            document.getElementById('colorGradingVideoInfo').style.display = 'block';
                            document.getElementById('colorGradingVideoName').textContent = davinciState.colorGrading.videoName;
                            document.getElementById('renderColorBtn').disabled = false;
                        } else if (feature === 'audio') {
                            davinciState.audioMixing = { videoId: video.id, videoName: video.prompt || 'Untitled Video' };
                            document.getElementById('audioMixingVideoInfo').style.display = 'block';
                            document.getElementById('audioMixingVideoName').textContent = davinciState.audioMixing.videoName;
                            document.getElementById('renderAudioBtn').disabled = false;
                        }
                        modal.remove();
                    };

                    card.innerHTML = `
                        <video src="${video.url}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin-bottom: 10px;" muted></video>
                        <p style="color: #ccc; font-size: 13px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${video.prompt || 'No prompt'}</p>
                        <small style="color: #888; font-size: 11px;">ID: ${video.id.substring(0, 8)}...</small>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error('❌ Error loading videos:', error);
                alert('Failed to load video gallery. Please try again.');
            }
        }

        // 2. RENDER TEXT OVERLAY
        async function renderTextOverlay() {
            const text = document.getElementById('textOverlayText').value.trim();
            if (!text) {
                alert('❌ Please enter text to display');
                return;
            }

            if (!davinciState.textOverlay.videoId) {
                alert('❌ Please select a video first');
                return;
            }

            // Show status
            document.getElementById('textOverlayStatus').style.display = 'block';
            document.getElementById('textOverlayResult').style.display = 'none';
            document.getElementById('renderTextBtn').disabled = true;

            try {
                const formData = new FormData();
                formData.append('video_id', davinciState.textOverlay.videoId);
                formData.append('text', text);
                formData.append('position', document.getElementById('textOverlayPosition').value);
                formData.append('start_second', document.getElementById('textOverlayStart').value);
                formData.append('duration', document.getElementById('textOverlayDuration').value);
                formData.append('font_size', document.getElementById('textOverlayFontSize').value);

                const response = await authenticatedFetch('/api/v1/davinci/add-text-overlay/', {
                    method: 'POST',
                    body: formData
                });

                if (response.success) {
                    document.getElementById('textOverlayStatus').style.display = 'none';
                    document.getElementById('textOverlayResult').style.display = 'block';
                } else {
                    throw new Error(response.error_message || response.error || 'Rendering failed');
                }
            } catch (error) {
                console.error('❌ Text overlay error:', error);
                document.getElementById('textOverlayStatusText').textContent = `Error: ${error.message}`;
                document.getElementById('textOverlayStatus').querySelector('.card').classList.add('border-danger');
            } finally {
                document.getElementById('renderTextBtn').disabled = false;
            }
        }

        // 3. RENDER COLOR GRADING
        async function renderColorGrading() {
            if (!davinciState.colorGrading.videoId) {
                alert('❌ Please select a video first');
                return;
            }

            // Show status
            document.getElementById('colorGradingStatus').style.display = 'block';
            document.getElementById('colorGradingResult').style.display = 'none';
            document.getElementById('renderColorBtn').disabled = true;

            try {
                const formData = new FormData();
                formData.append('video_id', davinciState.colorGrading.videoId);
                formData.append('style', document.getElementById('colorGradingStyle').value);

                const response = await authenticatedFetch('/api/v1/davinci/apply-color-grading/', {
                    method: 'POST',
                    body: formData
                });

                if (response.success) {
                    document.getElementById('colorGradingStatus').style.display = 'none';
                    document.getElementById('colorGradingResult').style.display = 'block';
                } else {
                    throw new Error(response.error_message || response.error || 'Color grading failed');
                }
            } catch (error) {
                console.error('❌ Color grading error:', error);
                document.getElementById('colorGradingStatusText').textContent = `Error: ${error.message}`;
                document.getElementById('colorGradingStatus').querySelector('.card').classList.add('border-danger');
            } finally {
                document.getElementById('renderColorBtn').disabled = false;
            }
        }

        // 4. RENDER AUDIO MIXING
        async function renderAudioMixing() {
            const audioFile = document.getElementById('audioMixingFile').files[0];
            if (!audioFile) {
                alert('❌ Please select an audio file');
                return;
            }

            if (!davinciState.audioMixing.videoId) {
                alert('❌ Please select a video first');
                return;
            }

            // Show status
            document.getElementById('audioMixingStatus').style.display = 'block';
            document.getElementById('audioMixingResult').style.display = 'none';
            document.getElementById('renderAudioBtn').disabled = true;

            try {
                const formData = new FormData();
                formData.append('video_id', davinciState.audioMixing.videoId);
                formData.append('audio_file', audioFile);
                formData.append('audio_volume', document.getElementById('audioMixingVolume').value / 100);

                const response = await authenticatedFetch('/api/v1/davinci/add-audio-to-video/', {
                    method: 'POST',
                    body: formData
                });

                if (response.success) {
                    document.getElementById('audioMixingStatus').style.display = 'none';
                    document.getElementById('audioMixingResult').style.display = 'block';
                } else {
                    throw new Error(response.error_message || response.error || 'Audio mixing failed');
                }
            } catch (error) {
                console.error('❌ Audio mixing error:', error);
                document.getElementById('audioMixingStatusText').textContent = `Error: ${error.message}`;
                document.getElementById('audioMixingStatus').querySelector('.card').classList.add('border-danger');
            } finally {
                document.getElementById('renderAudioBtn').disabled = false;
            }
        }

        // 5. SELECT MULTIPLE VIDEOS FOR CHAINING
        async function selectMultipleVideosForChaining() {
            try {
                const apiClient = {
                    get: async (url) => {
                        const response = await authenticatedFetch(url);
                        return response;
                    }
                };

                // Fetch video gallery
                const response = await apiClient.get('/api/v1/gallery/all/?type=videos&limit=100');
                const videos = (response.results || []).filter(item => item.type === 'video');

                if (videos.length === 0) {
                    alert('❌ No videos in gallery!\n\nGenerate some videos first.');
                    return;
                }

                // Create multi-select modal
                const modal = document.createElement('div');
                modal.style = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: rgba(0,0,0,0.9); z-index: 10000; overflow-y: auto; padding: 40px;
                `;
                modal.innerHTML = `
                    <div style="max-width: 1400px; margin: 0 auto; background: #1a1a1a; border-radius: 12px; padding: 30px; border: 2px solid #00d9ff;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h4 style="color: #00d9ff; margin: 0;">🔗 Select Videos to Chain (2-10 videos)</h4>
                            <button onclick="this.closest('div[style*=fixed]').remove()" style="background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">✕ Close</button>
                        </div>
                        <p style="color: #ccc; margin-bottom: 20px;">Click videos in the order you want them chained. Selected videos will be numbered.</p>
                        <div id="chainVideoSelectGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px;"></div>
                        <div style="text-align: center;">
                            <button id="confirmChainVideos" class="btn btn-success btn-lg" disabled>
                                ✅ Use These Videos (<span id="chainSelectedCount">0</span>)
                            </button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                // Populate grid
                const grid = modal.querySelector('#chainVideoSelectGrid');
                const confirmBtn = modal.querySelector('#confirmChainVideos');
                const countBadge = modal.querySelector('#chainSelectedCount');
                let selectedVideos = [];

                videos.forEach(video => {
                    const card = document.createElement('div');
                    card.className = 'chain-video-option';
                    card.dataset.id = video.id;
                    card.style = 'background: #222; border: 2px solid #444; border-radius: 8px; padding: 15px; cursor: pointer; transition: all 0.3s; position: relative;';

                    card.onclick = () => {
                        const index = selectedVideos.findIndex(v => v.id === video.id);
                        if (index >= 0) {
                            // Deselect
                            selectedVideos.splice(index, 1);
                            card.style.borderColor = '#444';
                            card.querySelector('.chain-order-badge').style.display = 'none';
                        } else {
                            // Select (max 10)
                            if (selectedVideos.length >= 10) {
                                alert('❌ Maximum 10 videos can be chained');
                                return;
                            }
                            selectedVideos.push({ id: video.id, url: video.url, prompt: video.prompt });
                            card.style.borderColor = '#28a745';
                            card.querySelector('.chain-order-badge').textContent = selectedVideos.length;
                            card.querySelector('.chain-order-badge').style.display = 'flex';
                        }

                        // Update count and button state
                        countBadge.textContent = selectedVideos.length;
                        confirmBtn.disabled = selectedVideos.length < 2;
                    };

                    card.innerHTML = `
                        <div class="chain-order-badge" style="display: none; position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; background: #28a745; color: white; border-radius: 50%; align-items: center; justify-content: center; font-weight: bold; font-size: 16px;"></div>
                        <video src="${video.url}" style="width: 100%; height: 150px; object-fit: cover; border-radius: 6px; margin-bottom: 10px;" muted></video>
                        <p style="color: #ccc; font-size: 13px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${video.prompt || 'No prompt'}</p>
                        <small style="color: #888; font-size: 11px;">ID: ${video.id.substring(0, 8)}...</small>
                    `;
                    grid.appendChild(card);
                });

                // Confirm button
                confirmBtn.onclick = () => {
                    davinciState.chainVideos = selectedVideos;
                    updateChainVideosPreview();
                    modal.remove();
                };

            } catch (error) {
                console.error('❌ Error loading videos:', error);
                alert('Failed to load video gallery. Please try again.');
            }
        }

        function updateChainVideosPreview() {
            const preview = document.getElementById('chainVideosPreview');
            const grid = document.getElementById('chainVideosGrid');
            const count = document.getElementById('chainVideoCount');

            if (davinciState.chainVideos.length === 0) {
                preview.style.display = 'none';
                document.getElementById('renderChainBtn').disabled = true;
                return;
            }

            count.textContent = davinciState.chainVideos.length;
            preview.style.display = 'block';
            document.getElementById('renderChainBtn').disabled = false;

            grid.innerHTML = davinciState.chainVideos.map((video, index) => `
                <div class="col-md-3">
                    <div class="card bg-dark border-success">
                        <div class="card-body p-2">
                            <div class="badge bg-success mb-2">#${index + 1}</div>
                            <small class="d-block text-truncate">${video.prompt || 'Untitled'}</small>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function clearChainVideos() {
            davinciState.chainVideos = [];
            document.getElementById('chainVideosPreview').style.display = 'none';
            document.getElementById('renderChainBtn').disabled = true;
        }

        // 6. RENDER CHAIN VIDEOS
        async function renderChainVideos() {
            if (davinciState.chainVideos.length < 2) {
                alert('❌ Please select at least 2 videos to chain');
                return;
            }

            // Show status
            document.getElementById('chainVideosStatus').style.display = 'block';
            document.getElementById('chainVideosResult').style.display = 'none';
            document.getElementById('renderChainBtn').disabled = true;

            try {
                const formData = new FormData();
                const videoClips = davinciState.chainVideos.map(v => ({ id: v.id, url: v.url }));
                formData.append('video_clips', JSON.stringify(videoClips));

                const projectName = document.getElementById('chainVideoProjectName').value.trim();
                if (projectName) {
                    formData.append('project_name', projectName);
                }

                const response = await authenticatedFetch('/api/v1/davinci/chain-videos/', {
                    method: 'POST',
                    body: formData
                });

                if (response.success) {
                    document.getElementById('chainVideosStatus').style.display = 'none';
                    document.getElementById('chainVideosResult').style.display = 'block';
                } else {
                    throw new Error(response.error || 'Video chaining failed');
                }
            } catch (error) {
                console.error('❌ Chain videos error:', error);
                document.getElementById('chainVideosStatusText').textContent = `Error: ${error.message}`;
                document.getElementById('chainVideosStatus').querySelector('.card').classList.add('border-danger');
            } finally {
                document.getElementById('renderChainBtn').disabled = false;
            }
        }

        // Enable audio file input validation
        document.getElementById('audioMixingFile').addEventListener('change', function() {
            const file = this.files[0];
            if (file && davinciState.audioMixing.videoId) {
                document.getElementById('renderAudioBtn').disabled = false;
            }
        });

        

// END SESSION 115: DAVINCI RESOLVE VIDEO EDITING
</script>
