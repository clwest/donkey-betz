<script>
        // SESSION 223: OPPORTUNITY ENGINE FUNCTIONS
        // Phase 1 - Creative Intelligence Empire
        // ============================================================

        // Current opportunity state
        let currentOpportunityId = null;

        // Load opportunities from API
        async function loadOpportunities() {
            const listEl = document.getElementById('opportunities-list');
            const loadingEl = document.getElementById('opp-loading');

            if (loadingEl) loadingEl.style.display = 'block';

            try {
                // Build query params
                const params = new URLSearchParams();
                const category = document.getElementById('opp-filter-category')?.value;
                const source = document.getElementById('opp-filter-source')?.value;
                const minScore = document.getElementById('opp-min-score')?.value;

                if (category) params.append('category', category);
                if (source) params.append('source_type', source);
                if (minScore) params.append('min_score', minScore);
                params.append('page_size', '20');

                const response = await fetch(`/api/opportunities/?${params}`);
                const data = await response.json();

                if (data.success) {
                    renderOpportunities(data.opportunities);
                    updateOpportunityStats();
                } else {
                    listEl.innerHTML = `<div class="alert alert-danger m-3">Error: ${data.error}</div>`;
                }
            } catch (error) {
                console.error('Error loading opportunities:', error);
                listEl.innerHTML = `<div class="alert alert-danger m-3">Failed to load opportunities: ${error.message}</div>`;
            } finally {
                if (loadingEl) loadingEl.style.display = 'none';
            }
        }

        // Render opportunities list
        function renderOpportunities(opportunities) {
            const listEl = document.getElementById('opportunities-list');
            const countEl = document.getElementById('opp-list-count');

            if (!opportunities || opportunities.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <p>No opportunities found. Try adjusting filters or score new data.</p>
                    </div>`;
                if (countEl) countEl.textContent = '0 opportunities';
                return;
            }

            if (countEl) countEl.textContent = `${opportunities.length} opportunities`;

            listEl.innerHTML = opportunities.map(opp => `
                <div class="opportunity-item p-3 border-bottom" style="border-color: rgba(16, 185, 129, 0.2) !important; cursor: pointer;" onclick="viewOpportunityDetail('${opp.id}')">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h6 class="mb-1 text-light">${escapeHtml(opp.title || 'Untitled')}</h6>
                            <p class="text-muted small mb-2">${escapeHtml((opp.description || '').substring(0, 120))}...</p>
                            <div class="d-flex gap-2 flex-wrap">
                                <span class="badge" style="background: rgba(16, 185, 129, 0.2); color: #10b981;">${opp.category || 'uncategorized'}</span>
                                <span class="badge" style="background: rgba(139, 92, 246, 0.2); color: #8b5cf6;">${opp.source_type || 'unknown'}</span>
                                ${opp.urgency_level === 'critical' ? '<span class="badge bg-danger">URGENT</span>' : ''}
                                ${opp.urgency_level === 'high' ? '<span class="badge bg-warning text-dark">High Priority</span>' : ''}
                            </div>
                            ${opp.suggested_content_types?.length ? `
                                <div class="mt-2">
                                    <small class="text-muted">Suggested: </small>
                                    ${opp.suggested_content_types.slice(0, 3).map(ct => `<span class="badge bg-secondary me-1">${ct}</span>`).join('')}
                                </div>
                            ` : ''}
                        </div>
                        <div class="text-end ms-3" style="min-width: 80px;">
                            <div class="mb-2">
                                <span class="badge ${getScoreBadgeClass(opp.scores?.overall_score)}" style="font-size: 1.1em; padding: 8px 12px;">
                                    ${opp.scores?.overall_score || 0}
                                </span>
                            </div>
                            <small class="text-muted d-block">Score</small>
                            ${opp.estimated_revenue ? `<small class="text-success d-block">~$${parseFloat(opp.estimated_revenue).toFixed(0)}</small>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Get badge class based on score
        function getScoreBadgeClass(score) {
            if (score >= 80) return 'bg-success';
            if (score >= 60) return 'bg-warning text-dark';
            if (score >= 40) return 'bg-info';
            return 'bg-secondary';
        }

        // View opportunity detail
        async function viewOpportunityDetail(oppId) {
            currentOpportunityId = oppId;
            const modalEl = document.getElementById('opportunityModal');
            const titleEl = document.getElementById('opp-modal-title');
            const bodyEl = document.getElementById('opp-modal-body');

            bodyEl.innerHTML = '<div class="text-center py-4"><div class="spinner-border text-success" role="status"></div></div>';

            try {
                const modal = new bootstrap.Modal(modalEl);
                modal.show();

                // Fetch opportunity details AND revenue history in parallel
                const [oppResponse, revenueResponse] = await Promise.all([
                    fetch(`/api/opportunities/${oppId}/`),
                    fetch(`/api/opportunities/${oppId}/revenue/list/`)
                ]);

                const data = await oppResponse.json();
                const revenueData = await revenueResponse.json();

                if (data.success && data.opportunity) {
                    const opp = data.opportunity;
                    const revenues = revenueData.success ? revenueData.revenues : [];
                    const totalActual = revenues.reduce((sum, r) => sum + parseFloat(r.amount || 0), 0);
                    const totalNet = revenues.reduce((sum, r) => sum + parseFloat(r.net_amount || 0), 0);
                    const predictionAccuracy = opp.estimated_revenue > 0 ? ((totalActual / parseFloat(opp.estimated_revenue)) * 100).toFixed(0) : '--';

                    titleEl.textContent = opp.title || 'Opportunity Details';

                    bodyEl.innerHTML = `
                        <div class="row">
                            <div class="col-md-8">
                                <p class="text-light">${escapeHtml(opp.description || 'No description')}</p>

                                <h6 class="text-success mt-4">Score Breakdown</h6>
                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <div class="p-2 rounded" style="background: rgba(16, 185, 129, 0.1);">
                                            <small class="text-muted">Profit Potential</small>
                                            <div class="progress mt-1" style="height: 20px;">
                                                <div class="progress-bar bg-success" style="width: ${opp.scores?.profit_potential || 0}%;">
                                                    ${opp.scores?.profit_potential || 0}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-2 rounded" style="background: rgba(239, 68, 68, 0.1);">
                                            <small class="text-muted">Competition</small>
                                            <div class="progress mt-1" style="height: 20px;">
                                                <div class="progress-bar bg-danger" style="width: ${opp.scores?.competition_level || 0}%;">
                                                    ${opp.scores?.competition_level || 0}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-2 rounded" style="background: rgba(245, 158, 11, 0.1);">
                                            <small class="text-muted">Effort Required</small>
                                            <div class="progress mt-1" style="height: 20px;">
                                                <div class="progress-bar bg-warning" style="width: ${opp.scores?.effort_required || 0}%;">
                                                    ${opp.scores?.effort_required || 0}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-2 rounded" style="background: rgba(139, 92, 246, 0.1);">
                                            <small class="text-muted">Time Sensitivity</small>
                                            <div class="progress mt-1" style="height: 20px;">
                                                <div class="progress-bar bg-primary" style="width: ${opp.scores?.time_sensitivity || 0}%;">
                                                    ${opp.scores?.time_sensitivity || 0}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                ${opp.score_details ? `
                                    <h6 class="text-success mt-4">Reasoning</h6>
                                    <div class="small text-muted">
                                        ${opp.score_details.profit_reasoning ? `<p><strong>Profit:</strong> ${escapeHtml(opp.score_details.profit_reasoning)}</p>` : ''}
                                        ${opp.score_details.competition_reasoning ? `<p><strong>Competition:</strong> ${escapeHtml(opp.score_details.competition_reasoning)}</p>` : ''}
                                    </div>
                                ` : ''}

                                ${opp.keywords?.length ? `
                                    <h6 class="text-success mt-4">Keywords</h6>
                                    <div class="d-flex gap-1 flex-wrap">
                                        ${opp.keywords.slice(0, 10).map(kw => `<span class="badge bg-secondary">${escapeHtml(kw)}</span>`).join('')}
                                    </div>
                                ` : ''}
                            </div>
                            <div class="col-md-4">
                                <div class="card" style="background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3);">
                                    <div class="card-body text-center">
                                        <h2 class="text-success mb-0">${opp.scores?.overall_score || 0}</h2>
                                        <small class="text-muted">Overall Score</small>

                                        <hr style="border-color: rgba(16, 185, 129, 0.3);">

                                        <div class="mb-2">
                                            <small class="text-muted d-block">Est. Revenue</small>
                                            <strong class="text-success">$${(parseFloat(opp.estimated_revenue) || 0).toFixed(2)}</strong>
                                        </div>
                                        <div class="mb-2">
                                            <small class="text-muted d-block">Est. Cost</small>
                                            <strong class="text-warning">$${(parseFloat(opp.estimated_cost) || 0).toFixed(2)}</strong>
                                        </div>
                                        <div>
                                            <small class="text-muted d-block">ROI</small>
                                            <strong class="text-info">${(parseFloat(opp.estimated_roi) || 0).toFixed(0)}%</strong>
                                        </div>
                                    </div>
                                </div>

                                ${opp.suggested_workflows?.length ? `
                                    <div class="mt-3">
                                        <h6 class="text-success">Suggested Workflows</h6>
                                        ${opp.suggested_workflows.map(wf => `
                                            <button class="btn btn-outline-success btn-sm w-100 mb-2" onclick="executeWorkflow('${wf}')">
                                                ▶️ ${wf.replace(/_/g, ' ')}
                                            </button>
                                        `).join('')}
                                    </div>
                                ` : ''}

                                ${opp.suggested_content_types?.length ? `
                                    <div class="mt-3">
                                        <h6 class="text-success">Content Types</h6>
                                        <div class="d-flex gap-1 flex-wrap">
                                            ${opp.suggested_content_types.map(ct => `<span class="badge bg-success">${ct}</span>`).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>

                        <!-- Session 225: Revenue Reality Section -->
                        <div class="row mt-4">
                            <div class="col-12">
                                <div class="card" style="background: rgba(6, 182, 212, 0.1); border-color: rgba(6, 182, 212, 0.3);">
                                    <div class="card-header d-flex justify-content-between align-items-center" style="background: rgba(6, 182, 212, 0.15); border-bottom: 1px solid rgba(6, 182, 212, 0.3);">
                                        <h6 class="mb-0 text-info">💰 Revenue Reality</h6>
                                        <span class="badge ${totalActual > 0 ? 'bg-success' : 'bg-secondary'}">${revenues.length} transactions</span>
                                    </div>
                                    <div class="card-body">
                                        <div class="row text-center mb-3">
                                            <div class="col-4">
                                                <small class="text-muted d-block">Estimated</small>
                                                <strong class="text-warning">$${(parseFloat(opp.estimated_revenue) || 0).toFixed(2)}</strong>
                                            </div>
                                            <div class="col-4">
                                                <small class="text-muted d-block">Actual</small>
                                                <strong class="text-success">$${totalActual.toFixed(2)}</strong>
                                            </div>
                                            <div class="col-4">
                                                <small class="text-muted d-block">Accuracy</small>
                                                <strong class="${parseFloat(predictionAccuracy) >= 100 ? 'text-success' : parseFloat(predictionAccuracy) >= 75 ? 'text-warning' : 'text-danger'}">${predictionAccuracy}%</strong>
                                            </div>
                                        </div>
                                        ${revenues.length > 0 ? `
                                            <h6 class="text-info small mb-2">Transaction History</h6>
                                            <div style="max-height: 150px; overflow-y: auto;">
                                                ${revenues.map(r => `
                                                    <div class="d-flex justify-content-between align-items-center py-2 border-bottom" style="border-color: rgba(6, 182, 212, 0.2) !important;">
                                                        <div>
                                                            <span class="badge bg-secondary me-2">${r.platform || 'direct'}</span>
                                                            <small class="text-muted">${r.content_type || 'content'}</small>
                                                        </div>
                                                        <div class="text-end">
                                                            <strong class="text-success">$${parseFloat(r.amount || 0).toFixed(2)}</strong>
                                                            <small class="text-muted d-block">${new Date(r.sale_date || r.created_at).toLocaleDateString()}</small>
                                                        </div>
                                                    </div>
                                                `).join('')}
                                            </div>
                                            <div class="mt-2 pt-2 border-top" style="border-color: rgba(6, 182, 212, 0.3) !important;">
                                                <div class="d-flex justify-content-between">
                                                    <span class="text-muted">Net Total (after fees):</span>
                                                    <strong class="text-success">$${totalNet.toFixed(2)}</strong>
                                                </div>
                                            </div>
                                        ` : `
                                            <p class="text-muted text-center mb-0">No revenue logged yet. Click "Log Revenue" to record sales.</p>
                                        `}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    bodyEl.innerHTML = `<div class="alert alert-danger">Failed to load opportunity: ${data.error || 'Unknown error'}</div>`;
                }
            } catch (error) {
                console.error('Error loading opportunity detail:', error);
                bodyEl.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
            }
        }

        // Score new opportunities from spider data
        async function scoreNewOpportunities() {
            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Scoring...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/opportunities/score/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hours: 24, limit: 50 })
                });
                const data = await response.json();

                if (data.success) {
                    showToast(`Scored ${data.scored_count} opportunities!`, 'success');
                    loadOpportunities();
                } else {
                    showToast(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showToast(`Error: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Analyze a custom trend
        async function analyzeTrend() {
            const topic = document.getElementById('opp-analyze-topic')?.value;
            if (!topic) {
                showToast('Please enter a trend topic to analyze', 'warning');
                return;
            }

            const btn = event.target;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Analyzing...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/opportunities/analyze/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic })
                });
                const data = await response.json();

                if (data.success && data.opportunity_id) {
                    showToast(`Analyzed! Score: ${data.scores.overall_score}`, 'success');
                    document.getElementById('opp-analyze-topic').value = '';
                    viewOpportunityDetail(data.opportunity_id);
                    loadOpportunities();
                } else {
                    showToast(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showToast(`Error: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Session 226: Track active opportunity for auto-linking content
        let activeOpportunityForContent = null;

        // Act on an opportunity
        async function actOnOpportunity() {
            if (!currentOpportunityId) return;

            const btn = document.getElementById('opp-modal-act-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Starting...';
            btn.disabled = true;

            try {
                const response = await fetch(`/api/opportunities/${currentOpportunityId}/act/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await response.json();

                if (data.success) {
                    // Session 226: Store the active opportunity for auto-linking
                    activeOpportunityForContent = currentOpportunityId;

                    // Show the active opportunity banner
                    const banner = document.getElementById('activeOpportunityBanner');
                    const titleEl = document.getElementById('activeOppTitle');
                    titleEl.textContent = data.opportunity?.title || 'Active Opportunity';
                    banner.classList.remove('d-none');

                    showToast('Started working on opportunity! Any content you create will be linked automatically.', 'success');

                    bootstrap.Modal.getInstance(document.getElementById('opportunityModal'))?.hide();
                    loadOpportunities();

                    // If there's a suggested workflow, offer to execute it
                    if (data.suggested_workflow) {
                        if (confirm(`Would you like to execute the "${data.suggested_workflow}" workflow?`)) {
                            executeWorkflow(data.suggested_workflow);
                        }
                    }
                } else {
                    showToast(`Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showToast(`Error: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // Session 226: Auto-link content to active opportunity
        async function linkContentToOpportunity(contentType, contentId) {
            if (!activeOpportunityForContent) return null;

            try {
                const response = await fetch(`/api/opportunities/${activeOpportunityForContent}/content/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({
                        content_type: contentType,
                        [contentType === 'image' ? 'image_history_id' : 'video_history_id']: contentId
                    })
                });
                const data = await response.json();

                if (data.success) {
                    showToast(`Content linked to opportunity! 🔗`, 'success');
                    return data;
                }
            } catch (error) {
                console.error('Error linking content to opportunity:', error);
            }
            return null;
        }

        // Session 226: Clear active opportunity
        function clearActiveOpportunity() {
            if (activeOpportunityForContent) {
                showToast('Active opportunity cleared', 'info');
                activeOpportunityForContent = null;
            }
        }

        // ============================================================
        // Session 227: Team Power JavaScript Functions
        // ============================================================

        let teamsCache = [];
        let rolesCache = [];

        // Load all teams data when tab opens
        async function loadTeamsData() {
            try {
                // Load teams, roles, and stats in parallel
                const [teamsRes, rolesRes, statsRes] = await Promise.all([
                    fetch('/api/teams/'),
                    fetch('/api/teams/roles/'),
                    fetch('/api/teams/stats/')
                ]);

                const teamsData = await teamsRes.json();
                const rolesData = await rolesRes.json();
                const statsData = await statsRes.json();

                // Update stats cards
                if (statsData.success && statsData.stats) {
                    document.getElementById('totalTeamsCount').textContent = statsData.stats.teams_count || 0;
                    document.getElementById('totalAgentsCount').textContent = statsData.stats.total_memberships || 0;
                    document.getElementById('activeWorkflowsCount').textContent = statsData.stats.active_workflows || 0;
                    document.getElementById('totalMessagesCount').textContent = statsData.stats.total_messages || 0;
                }

                // Cache and render teams
                if (teamsData.success) {
                    teamsCache = teamsData.teams || [];
                    renderTeamsList(teamsCache);
                    document.getElementById('teamsListCount').textContent = `${teamsCache.length} teams`;
                }

                // Cache and render roles
                if (rolesData.success) {
                    rolesCache = rolesData.roles || [];
                    renderRolesList(rolesCache);
                }

            } catch (error) {
                console.error('Error loading teams data:', error);
                document.getElementById('teamsListContainer').innerHTML = `
                    <div class="text-center py-5 text-danger">
                        <p>Error loading teams: ${error.message}</p>
                        <button class="btn btn-sm btn-outline-primary" onclick="loadTeamsData()">Retry</button>
                    </div>
                `;
            }
        }

        // Render teams list
        function renderTeamsList(teams) {
            const container = document.getElementById('teamsListContainer');

            if (!teams || teams.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5 text-muted">
                        <p class="mb-2">👥 No teams yet</p>
                        <p class="small">Create your first team to start multi-agent collaboration</p>
                        <button class="btn btn-primary" onclick="showCreateTeamModal()">➕ Create Team</button>
                    </div>
                `;
                return;
            }

            const teamTypeEmoji = {
                'creative': '🎨',
                'research': '🔬',
                'marketing': '📢',
                'content': '✍️',
                'custom': '⚙️'
            };

            container.innerHTML = teams.map(team => `
                <div class="card mb-3" style="background: rgba(71, 85, 105, 0.3); border: 1px solid rgba(167, 139, 250, 0.2);">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h6 class="mb-1" style="color: #e2e8f0;">
                                    ${teamTypeEmoji[team.team_type] || '👥'} ${team.name}
                                </h6>
                                <span class="badge bg-primary me-1">${team.team_type}</span>
                                ${team.lead_agent ? `<span class="badge bg-success">Lead: ${team.lead_agent.name || 'Unknown'}</span>` : ''}
                            </div>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-info" onclick="viewTeamDetails('${team.id}')" title="View Details">
                                    👁
                                </button>
                                <button class="btn btn-outline-warning" onclick="startTeamWorkflow('${team.id}')" title="Start Workflow">
                                    ⚡
                                </button>
                            </div>
                        </div>

                        ${team.description ? `<p class="small text-muted mb-2">${team.description}</p>` : ''}

                        <!-- Team Members -->
                        <div class="d-flex flex-wrap gap-1">
                            ${(team.members || []).slice(0, 5).map(member => `
                                <span class="badge" style="background: rgba(167, 139, 250, 0.2); color: #a78bfa; font-size: 10px;">
                                    ${getRoleEmoji(member.role_type)} ${member.agent_name}
                                </span>
                            `).join('')}
                            ${(team.members || []).length > 5 ? `
                                <span class="badge bg-secondary" style="font-size: 10px;">+${team.members.length - 5} more</span>
                            ` : ''}
                        </div>

                        <div class="mt-2 d-flex justify-content-between align-items-center">
                            <small class="text-muted">
                                ${team.members_count || 0} members • ${team.workflows_count || 0} workflows
                            </small>
                            <small class="text-muted">
                                Created ${formatTimeAgo(team.created_at)}
                            </small>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Render roles list
        function renderRolesList(roles) {
            const container = document.getElementById('rolesListContainer');

            if (!roles || roles.length === 0) {
                container.innerHTML = '<div class="text-center py-3 text-muted">No roles defined</div>';
                return;
            }

            container.innerHTML = roles.map(role => `
                <div class="d-flex align-items-center p-2 mb-1 rounded" style="background: rgba(34, 197, 94, 0.1);">
                    <span class="me-2">${getRoleEmoji(role.role_type)}</span>
                    <div class="flex-grow-1">
                        <div class="small" style="color: #d1fae5;">${role.name}</div>
                        <div class="text-muted" style="font-size: 10px;">${role.role_type}</div>
                    </div>
                </div>
            `).join('');
        }

        // Get emoji for role type
        function getRoleEmoji(roleType) {
            const emojis = {
                'designer': '🎨',
                'researcher': '🔬',
                'reviewer': '📝',
                'writer': '✍️',
                'analyst': '📊',
                'strategist': '🎯',
                'optimizer': '⚡',
                'communicator': '💬'
            };
            return emojis[roleType] || '👤';
        }

        // Format time ago (utility)
        function formatTimeAgo(dateStr) {
            if (!dateStr) return 'recently';
            const date = new Date(dateStr);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }

        // Connect to OAuth platform
        async function connectOAuthPlatform(platform) {
            try {
                const response = await fetch(`/api/distribution/oauth/${platform}/connect/`);
                const data = await response.json();

                if (data.success && data.auth_url) {
                    // Open OAuth flow in new window
                    const authWindow = window.open(
                        data.auth_url,
                        `${platform}_oauth`,
                        'width=600,height=700,scrollbars=yes'
                    );

                    // Store state for verification
                    sessionStorage.setItem(`${platform}_oauth_state`, data.state);

                    // Poll for completion
                    const pollInterval = setInterval(async () => {
                        if (authWindow.closed) {
                            clearInterval(pollInterval);
                            // Check if connection was successful
                            await refreshOAuthStatus();
                        }
                    }, 1000);

                    showToast(`${platform} OAuth`, 'OAuth window opened. Complete authorization to connect.', 'info');
                } else {
                    showToast('Connection Error', data.error || 'Failed to start OAuth flow', 'error');
                }
            } catch (error) {
                console.error('OAuth connect error:', error);
                showToast('Connection Error', 'Failed to connect to platform', 'error');
            }
        }

        // Disconnect from OAuth platform
        async function disconnectOAuthPlatform(platform) {
            if (!confirm(`Disconnect from ${platform}? This will revoke access.`)) {
                return;
            }

            try {
                const response = await fetch(`/api/distribution/oauth/${platform}/disconnect/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    }
                });

                const data = await response.json();
                if (data.success) {
                    showToast('Disconnected', `Successfully disconnected from ${platform}`, 'success');
                    await refreshOAuthStatus();
                } else {
                    showToast('Error', data.error || 'Failed to disconnect', 'error');
                }
            } catch (error) {
                console.error('Disconnect error:', error);
                showToast('Error', 'Failed to disconnect from platform', 'error');
            }
        }

        // Refresh OAuth status for all platforms
        async function refreshOAuthStatus() {
            try {
                const response = await fetch('/api/distribution/integrations/');
                const data = await response.json();

                if (data.success && data.integrations) {
                    // Update each platform status
                    for (const [platform, info] of Object.entries(data.integrations)) {
                        const statusEl = document.getElementById(`${platform}Status`);
                        const accountInfoEl = document.getElementById(`${platform}AccountInfo`);
                        const connectBtn = document.getElementById(`${platform}ConnectBtn`);
                        const disconnectBtn = document.getElementById(`${platform}DisconnectBtn`);

                        if (statusEl) {
                            if (info.connected) {
                                statusEl.textContent = 'Connected';
                                statusEl.style.background = 'rgba(34, 197, 94, 0.3)';
                                statusEl.style.color = '#22c55e';

                                if (accountInfoEl) accountInfoEl.style.display = 'block';
                                if (connectBtn) {
                                    connectBtn.textContent = '✓ Connected';
                                    connectBtn.disabled = true;
                                    connectBtn.style.opacity = '0.7';
                                }
                                if (disconnectBtn) disconnectBtn.style.display = 'block';

                                // Update account-specific info
                                if (platform === 'etsy' && info.shop_name) {
                                    const shopName = document.getElementById('etsyShopName');
                                    if (shopName) shopName.textContent = info.shop_name;
                                }
                            } else {
                                statusEl.textContent = 'Not Connected';
                                statusEl.style.background = 'rgba(148, 163, 184, 0.3)';
                                statusEl.style.color = '#94a3b8';

                                if (accountInfoEl) accountInfoEl.style.display = 'none';
                                if (connectBtn) {
                                    connectBtn.textContent = `🔗 Connect with ${info.name}`;
                                    connectBtn.disabled = false;
                                    connectBtn.style.opacity = '1';
                                }
                                if (disconnectBtn) disconnectBtn.style.display = 'none';
                            }
                        }
                    }
                }
            } catch (error) {
                console.error('Error refreshing OAuth status:', error);
            }
        }

        // Load Revenue Dashboard data
        async function loadRevenueDashboard() {
            const days = document.getElementById('revenuePeriodSelect')?.value || 30;

            try {
                const response = await fetch(`/api/distribution/revenue/dashboard/?days=${days}`);
                const data = await response.json();

                if (data.success && data.dashboard) {
                    const stats = data.dashboard;

                    // Update stat cards
                    document.getElementById('dashboardTotalRevenue').textContent = `$${(stats.total_revenue || 0).toFixed(2)}`;
                    document.getElementById('dashboardNetRevenue').textContent = `$${(stats.net_revenue || 0).toFixed(2)}`;
                    document.getElementById('dashboardItemsSold').textContent = stats.items_sold || 0;
                    document.getElementById('dashboardConversionRate').textContent = `${(stats.conversion_rate || 0).toFixed(1)}%`;

                    // Update trend
                    const trendEl = document.getElementById('revenueTrend');
                    if (stats.trend) {
                        const trendIcon = stats.trend > 0 ? '↑' : stats.trend < 0 ? '↓' : '→';
                        const trendColor = stats.trend > 0 ? '#22c55e' : stats.trend < 0 ? '#ef4444' : '#94a3b8';
                        trendEl.innerHTML = `<span style="color: ${trendColor}">${trendIcon} ${Math.abs(stats.trend).toFixed(1)}% vs last period</span>`;

                    // Update additional stats
                    if (stats.avg_item_price) {
                        document.getElementById('avgItemPrice').textContent = `Avg: $${stats.avg_item_price.toFixed(2)}`;
                    }
                    if (stats.total_views) {
                        document.getElementById('viewsCount').textContent = `${stats.total_views} views`;
                    }
                    if (stats.platform_fees) {
                        document.getElementById('platformFees').textContent = `Fees: $${stats.platform_fees.toFixed(2)}`;
                    }

                    // Update charts
                    if (stats.daily_revenue) {
                        renderRevenueTimeChart(stats.daily_revenue);
                    }
                    if (stats.by_platform) {
                        renderRevenuePlatformChart(stats.by_platform);
                    }

                    // Load goals
                    await loadRevenueGoals();

                    await loadRevenueForecast();
                }
            } catch (error) {
                console.error('Error loading revenue dashboard:', error);
            }

        // Execute auto-distribution
        async function executeAutoDistribute() {
            const title = document.getElementById('autoDistTitle').value;
            const description = document.getElementById('autoDistDescription').value;
            const contentType = document.getElementById('autoDistType').value;
            const tags = document.getElementById('autoDistTags').value.split(',').map(t => t.trim()).filter(t => t);

            // Get selected platforms
            const platforms = [];
            if (document.getElementById('platAll').checked) {
                platforms.push('all');
            } else {
                ['platEtsy', 'platGumroad', 'platShutterstock', 'platRedbubble', 'platSociety6'].forEach(id => {
                    const cb = document.getElementById(id);
                    if (cb && cb.checked) platforms.push(cb.value);
                });
            }

            if (!title) {
                alert('Please enter a title');
                return;
            }
            if (platforms.length === 0) {
                alert('Please select at least one platform');
                return;
            }

            // Get pricing
            const pricing = {
                etsy: parseFloat(document.getElementById('priceEtsy').value) || 29.99,
                gumroad: parseFloat(document.getElementById('priceGumroad').value) || 9.99,
                default: parseFloat(document.getElementById('priceOther').value) || 19.99
            };

            // Get schedule
            const scheduleType = document.getElementById('autoDistSchedule').value;
            const schedule = { type: scheduleType };
            if (scheduleType === 'scheduled') {
                schedule.datetime = document.getElementById('autoDistDateTime').value;
            }

            try {
                const response = await fetch('/api/distribution/auto/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({
                        content_type: contentType,
                        title: title,
                        description: description,
                        tags: tags,
                        platforms: platforms,
                        pricing: pricing,
                        schedule: schedule
                    })
                });

                const data = await response.json();
                if (data.success) {
                    bootstrap.Modal.getInstance(document.getElementById('autoDistributeModal')).hide();
                    showToast('Distribution Started!', `Content queued for ${data.platforms_count || platforms.length} platforms`, 'success');
                    loadDistributionData();
                } else {
                    showToast('Error', data.error || 'Failed to start distribution', 'error');
                }
            } catch (error) {
                console.error('Auto-distribute error:', error);
                showToast('Error', 'Failed to start distribution', 'error');
            }
        }

        // Execute batch upload

            if (batchFilesArray.length === 0) {
                alert('Please select files to upload');
                return;

            const platform = document.getElementById('batchPlatform').value;
            const price = parseFloat(document.getElementById('batchPrice').value);
            const tags = document.getElementById('batchTags').value.split(',').map(t => t.trim()).filter(t => t);

            // Show progress
            document.getElementById('batchProgressContainer').style.display = 'block';
            document.getElementById('batchUploadBtn').disabled = true;

            try {
                const response = await fetch('/api/distribution/batch/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({
                        items: batchFilesArray.map(f => ({
                            title: f.name.replace(/\.[^/.]+$/, ''),
                            content_type: f.type.startsWith('image/') ? 'image' :
                                          f.type.startsWith('video/') ? 'video' : 'audio'
                        })),
                        platform: platform,
                        pricing: { default: price },
                        tags: tags,
                        staggered: staggered
                    })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById('batchProgressBar').style.width = '100%';
                    document.getElementById('batchProgressText').textContent = '100%';
                    document.getElementById('batchStatusText').textContent = `${batchFilesArray.length} items queued for distribution`;

                    setTimeout(() => {
                        bootstrap.Modal.getInstance(document.getElementById('batchUploadModal')).hide();
                        showToast('Batch Upload Complete', `${batchFilesArray.length} items queued`, 'success');

                }
            } catch (error) {
                console.error('Batch upload error:', error);
                showToast('Error', 'Batch upload failed', 'error');
            }

            document.getElementById('batchUploadBtn').disabled = false;
        }

                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    }

                const data = await response.json();
                if (data.success) {
                    showToast('Cancelled', 'Scheduled distribution cancelled', 'info');

            } catch (error) {
                console.error('Cancel error:', error);

        // Score Content Before Distribution (Session 233)
        async function scoreContentBeforeDistribute() {
            const title = document.getElementById('autoDistTitle').value;
            const description = document.getElementById('autoDistDescription').value;
            const contentType = document.getElementById('autoDistType').value;
            const tags = document.getElementById('autoDistTags').value.split(',').map(t => t.trim()).filter(t => t);

            // Get selected platforms
            const platforms = [];
            if (document.getElementById('platAll').checked) {
                platforms.push('etsy', 'gumroad', 'shutterstock', 'redbubble', 'society6');
            } else {
                ['platEtsy', 'platGumroad', 'platShutterstock', 'platRedbubble', 'platSociety6'].forEach(id => {
                    const cb = document.getElementById(id);
                    if (cb && cb.checked) platforms.push(cb.value);
                });
            }

            // Get price (from first platform pricing input)
            const priceInputs = document.querySelectorAll('#autoDistributeModal input[type="number"]');
            let price = 19.99;
            priceInputs.forEach(input => {
                if (input.value && parseFloat(input.value) > 0) {
                    price = parseFloat(input.value);
                }
            });

            if (!title) {
                showToast('Please enter a title first', 'warning');
                return;
            }

            showToast('🧠 Scoring content...', 'info');

            try {
                const response = await fetch('/api/learning/predict/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({
                        content_type: contentType,
                        title: title,
                        description: description,
                        tags: tags,
                        platforms: platforms.length > 0 ? platforms : ['etsy', 'gumroad'],
                        price: price
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Show results
                    document.getElementById('scoreResultsContainer').style.display = 'block';
                    document.getElementById('overallScoreDisplay').textContent = Math.round(data.overall_score || 0);
                    document.getElementById('expectedRevenueDisplay').textContent = '$' + (data.expected_total_revenue || 0).toFixed(2);
                    document.getElementById('confidenceDisplay').textContent = Math.round((data.prediction_confidence || 0) * 100) + '%';

                    // Show recommendations
                    const recsContainer = document.getElementById('scoreRecommendations');
                    if (data.recommendations && data.recommendations.length > 0) {
                        recsContainer.innerHTML = data.recommendations.map(rec => `
                            <div class="alert alert-${rec.priority === 'high' ? 'warning' : 'info'} py-2 mb-2" style="background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.3);">
                                <small>💡 ${rec.message}</small>
                            </div>
                        `).join('');
                    } else {
                        recsContainer.innerHTML = '<small class="text-success">✅ Content looks good! No specific recommendations.</small>';
                    }

                    // Show recommended price if different
                    if (data.recommended_price_range) {
                        const optimalPrice = data.recommended_price_range.optimal;
                        if (Math.abs(optimalPrice - price) > 5) {
                            showToast(`💰 Suggested price: $${optimalPrice.toFixed(2)}`, 'info');
                        }
                    }

                    showToast(`Score: ${Math.round(data.overall_score || 0)}/100`, 'success');
                } else {
                    showToast(data.error?.message || 'Failed to score content', 'error');
                }
            } catch (error) {
                console.error('Error scoring content:', error);
                showToast('Error scoring content', 'error');
            }
        }

        // Save Alert
        async function saveAlert() {
            const form = document.getElementById('createAlertForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            // Collect notification channels
            const channels = [];
            if (document.getElementById('channelInApp').checked) channels.push('in_app');
            if (document.getElementById('channelEmail').checked) channels.push('email');
            if (document.getElementById('channelPush').checked) channels.push('push');
            if (document.getElementById('channelSms').checked) channels.push('sms');

            const alertData = {
                name: document.getElementById('alertName').value,
                alert_type: document.getElementById('alertType').value,
                description: document.getElementById('alertDescription').value,
                metric_name: document.getElementById('alertMetric').value,
                condition: document.getElementById('alertCondition').value,
                threshold_value: parseFloat(document.getElementById('alertThreshold').value),
                notification_channels: channels,
                priority: document.getElementById('alertPriority').value,
                cooldown_minutes: parseInt(document.getElementById('alertCooldown').value) * 60
            };

            try {
                const response = await fetch('/api/proactive/alerts/create/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify(alertData)
                });

                const data = await response.json();
                if (data.success) {
                    showToast('Alert created successfully!', 'success');
                    // Close modal
                    const modal = bootstrap.Modal.getInstance(document.getElementById('createAlertModal'));
                    modal.hide();
                    // Reset form
                    form.reset();
                    document.getElementById('channelInApp').checked = true;
                    // Refresh dashboard
                    loadProactiveDashboard();
                } else {
                    showToast(data.error?.message || 'Failed to create alert', 'error');
                }
            } catch (error) {
                console.error('Error creating alert:', error);
                showToast('Failed to create alert', 'error');
            }
        }

        // Load A/B Testing Dashboard
        async function loadABTestingDashboard() {
            try {
                const response = await fetch('/api/ab-testing/dashboard/');
                const data = await response.json();

                if (data.success) {
                    // Update stats
                    document.getElementById('abTestsRunningCount').textContent = data.dashboard.running_tests || 0;
                    document.getElementById('abTestsCompletedCount').textContent = data.dashboard.completed_tests || 0;
                    document.getElementById('abTestsTotalEventsCount').textContent = data.dashboard.total_events || 0;
                    document.getElementById('abTestsAvgLiftCount').textContent = (data.dashboard.average_lift || 0).toFixed(1) + '%';

                    // Update tests list
                    const container = document.getElementById('abTestsContainer');
                    const noTests = document.getElementById('noABTests');
                    const tests = data.dashboard.recent_tests || [];

                    if (tests.length > 0) {
                        noTests.style.display = 'none';
                        container.innerHTML = tests.map(test => `
                            <div class="list-group-item d-flex justify-content-between align-items-center"
                                 style="background: transparent; border-color: rgba(71, 85, 105, 0.3); cursor: pointer;"

                                <div>
                                    <h6 class="mb-1" style="color: #10b981;">${test.name}</h6>
                                    <small class="text-muted">
                                        <span class="badge ${getStatusBadgeClass(test.status)} me-2">${test.status}</span>
                                        ${test.test_type} • ${test.variants_count || 2} variants
                                    </small>
                                </div>
                                <div class="text-end">
                                    <div style="color: #06b6d4; font-weight: 600;">${test.total_events || 0} events</div>
                                    <small class="text-muted">${formatDate(test.created_at)}</small>
                                </div>
                            </div>
                        `).join('');
                        document.getElementById('abTestsListCount').textContent = `${tests.length} tests`;
                    } else {
                        noTests.style.display = 'block';
                        container.innerHTML = '';
                        document.getElementById('abTestsListCount').textContent = '0 tests';
                    }
                }
            } catch (error) {
                console.error('Error loading A/B testing dashboard:', error);
            }
        }

        function getStatusBadgeClass(status) {
            const classes = {
                'draft': 'bg-secondary',
                'running': 'bg-success',
                'paused': 'bg-warning text-dark',
                'completed': 'bg-info',
                'cancelled': 'bg-danger'
            };
            return classes[status] || 'bg-secondary';
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

            additionalVariantCount++;

            const variantHtml = `

        // Save A/B Test
        async function saveABTest() {
            const name = document.getElementById('abTestName').value;
            const testType = document.getElementById('abTestType').value;
            const hypothesis = document.getElementById('abTestHypothesis').value;

            if (!name || !hypothesis) {
                showToast('Please fill in all required fields', 'warning');
                return;
            }

            // Collect variants
            const variants = [
                {
                    name: document.getElementById('variantAName').value || 'Control',
                    is_control: true,
                    traffic_percentage: parseInt(document.getElementById('variantATraffic').value) || 50,
                    config: { value: document.getElementById('variantAValue').value }
                },
                {
                    name: document.getElementById('variantBName').value || 'Treatment',
                    is_control: false,
                    traffic_percentage: parseInt(document.getElementById('variantBTraffic').value) || 50,
                    config: { value: document.getElementById('variantBValue').value }
                }
            ];

            // Add additional variants
            const additionalVariants = document.querySelectorAll('#additionalVariants .variant-item');
            additionalVariants.forEach(item => {
                variants.push({
                    name: item.querySelector('.variant-name').value,
                    is_control: false,
                    traffic_percentage: parseInt(item.querySelector('.variant-traffic').value) || 25,
                    config: { value: item.querySelector('.variant-value').value }
                });
            });

            // Collect targeting
            const contentTypes = Array.from(document.getElementById('abTestContentTypes').selectedOptions).map(o => o.value);
            const platforms = Array.from(document.getElementById('abTestPlatforms').selectedOptions).map(o => o.value);

            const testData = {
                name: name,
                test_type: testType,
                hypothesis: hypothesis,
                variants: variants,
                primary_metric: document.getElementById('abTestPrimaryMetric').value,
                success_metrics: {
                    primary: document.getElementById('abTestPrimaryMetric').value,
                    minimum_sample: parseInt(document.getElementById('abTestMinSample').value) || 100,
                    confidence_level: parseInt(document.getElementById('abTestConfidence').value) || 95
                },
                targeting: {
                    content_types: contentTypes,
                    platforms: platforms
                }
            };

            try {
                const response = await fetch('/api/ab-testing/tests/create/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(testData)
                });
                const data = await response.json();

                if (data.success) {
                    showToast('A/B Test created successfully!', 'success');
                    bootstrap.Modal.getInstance(document.getElementById('createABTestModal')).hide();
                    document.getElementById('createABTestForm').reset();
                    loadABTestingDashboard();
                } else {
                    showToast(data.error || 'Failed to create test', 'error');
                }
            } catch (error) {
                console.error('Error creating A/B test:', error);
                showToast('Error creating test', 'error');
            }
        }

        // Load Goals Dashboard
        async function loadGoalsDashboard() {
            try {
                const response = await fetch('/api/goals/');
                const data = await response.json();

                if (data.success) {
                    const goals = data.goals || [];
                    const activeGoals = goals.filter(g => g.status === 'active');
                    const completedGoals = goals.filter(g => g.status === 'completed');

                    // Calculate stats
                    document.getElementById('goalsActiveCount').textContent = activeGoals.length;
                    document.getElementById('goalsCompletedCount').textContent = completedGoals.length;

                    // Calculate average progress
                    const avgProgress = activeGoals.length > 0
                        ? activeGoals.reduce((sum, g) => sum + (g.progress_percentage || 0), 0) / activeGoals.length
                        : 0;
                    document.getElementById('goalsAvgProgressCount').textContent = avgProgress.toFixed(0) + '%';

                    // Count milestones
                    const totalMilestones = goals.reduce((sum, g) => sum + (g.milestones_achieved?.length || 0), 0);
                    document.getElementById('goalsMilestonesCount').textContent = totalMilestones;

                    // Render goals list
                    const container = document.getElementById('goalsContainer');
                    const noGoals = document.getElementById('noGoals');

                    if (goals.length > 0) {
                        noGoals.style.display = 'none';
                        container.innerHTML = goals.map(goal => renderGoalCard(goal)).join('');
                        document.getElementById('goalsListCount').textContent = `${goals.length} goals`;
                    } else {
                        noGoals.style.display = 'block';
                        container.innerHTML = '';
                        document.getElementById('goalsListCount').textContent = '0 goals';
                    }
                }
            } catch (error) {
                console.error('Error loading goals dashboard:', error);
            }
        }

        function renderGoalCard(goal) {
            const progress = goal.progress_percentage || 0;
            const progressColor = progress >= 100 ? '#22c55e' : progress >= 75 ? '#fbbf24' : progress >= 50 ? '#06b6d4' : '#ef4444';
            const statusBadge = goal.status === 'completed' ? 'bg-success' : goal.status === 'active' ? 'bg-primary' : 'bg-secondary';

            return `
                <div class="card mb-2" style="background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(251, 191, 36, 0.2);">
                    <div class="card-body py-3">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div>
                                <h6 class="mb-1" style="color: #fbbf24;">${goal.name}</h6>
                                <small class="text-muted">${goal.goal_type} • ${goal.period || 'custom'}</small>
                            </div>
                            <span class="badge ${statusBadge}">${goal.status}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span style="color: #fde047; font-weight: 600;">
                                ${formatGoalValue(goal.current_value, goal.goal_type)} / ${formatGoalValue(goal.target_value, goal.goal_type)}
                            </span>
                            <span style="color: ${progressColor}; font-weight: 600;">${progress.toFixed(0)}%</span>
                        </div>
                        <div class="progress" style="height: 8px; background: rgba(71, 85, 105, 0.3);">
                            <div class="progress-bar" role="progressbar" style="width: ${Math.min(progress, 100)}%; background: ${progressColor};"
                                 aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                        ${goal.milestones_achieved && goal.milestones_achieved.length > 0 ? `
                            <div class="mt-2">
                                ${goal.milestones_achieved.map(m => `
                                    <span class="badge me-1" style="background: rgba(168, 85, 247, 0.2); color: #a855f7;">
                                        <i class="fas fa-flag-checkered me-1"></i>${m}%
                                    </span>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function formatGoalValue(value, type) {
            if (!value) return '0';
            if (type === 'revenue') return '$' + parseFloat(value).toFixed(2);
            if (type === 'conversion') return parseFloat(value).toFixed(1) + '%';
            return parseInt(value).toLocaleString();
        }

        // Update goal prefix based on type
        function updateGoalFields() {
            const type = document.getElementById('goalType').value;
            const prefix = document.getElementById('goalTargetPrefix');

            if (type === 'revenue') {
                prefix.textContent = '$';
            } else if (type === 'conversion') {
                prefix.textContent = '%';
            } else {
                prefix.textContent = '#';
            }
        }

        // ============================================================
        // SESSION 225: REVENUE CHARTS FUNCTIONS
        // ============================================================

        // Chart instances for revenue
        let revenueCharts = {
            trend: null,
            platform: null
        };

        // Initialize revenue charts
        async function initRevenueCharts() {
            try {
                const response = await fetch('/api/opportunities/revenue/stats/?days=7');
                const data = await response.json();

                if (!data.success) return;

                // Destroy existing charts if any
                if (revenueCharts.trend) revenueCharts.trend.destroy();
                if (revenueCharts.platform) revenueCharts.platform.destroy();

                // Revenue Trend Chart (Line)
                const trendCtx = document.getElementById('revenueTrendChart');
                if (trendCtx) {
                    // Generate last 7 days labels
                    const labels = [];
                    const revenues = [];
                    for (let i = 6; i >= 0; i--) {
                        const d = new Date();
                        d.setDate(d.getDate() - i);
                        labels.push(d.toLocaleDateString('en-US', { weekday: 'short' }));
                        revenues.push(0); // Will be populated with real data when available
                    }

                    // If we have by_date data, use it
                    if (data.by_date && data.by_date.length > 0) {
                        data.by_date.forEach(item => {
                            const dateStr = new Date(item.date).toLocaleDateString('en-US', { weekday: 'short' });
                            const idx = labels.indexOf(dateStr);
                            if (idx >= 0) revenues[idx] = item.total || 0;
                        });
                    }

                    revenueCharts.trend = new Chart(trendCtx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Revenue',
                                data: revenues,
                                borderColor: '#06b6d4',
                                backgroundColor: 'rgba(6, 182, 212, 0.1)',
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { color: '#9ca3af', callback: v => '$' + v },
                                    grid: { color: 'rgba(255,255,255,0.1)' }
                                },
                                x: {
                                    ticks: { color: '#9ca3af' },
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                }

                // Revenue by Platform Chart (Doughnut)
                const platformCtx = document.getElementById('revenuePlatformChart');
                if (platformCtx) {
                    const platforms = data.by_platform || [];
                    const platformLabels = platforms.length > 0 ? platforms.map(p => p.platform || 'direct') : ['No data'];
                    const platformData = platforms.length > 0 ? platforms.map(p => p.total || 0) : [1];
                    const platformColors = ['#10b981', '#f59e0b', '#8b5cf6', '#ef4444', '#06b6d4', '#ec4899', '#84cc16'];

                    revenueCharts.platform = new Chart(platformCtx, {
                        type: 'doughnut',
                        data: {
                            labels: platformLabels,
                            datasets: [{
                                data: platformData,
                                backgroundColor: platformColors.slice(0, platformLabels.length),
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'right',
                                    labels: { color: '#9ca3af', boxWidth: 12 }
                                }
                            }
                        }
                    });
                }
            } catch (error) {
                console.error('Error initializing revenue charts:', error);
            }
        }

        // Update loadRevenueStats to also init charts
        const originalLoadRevenueStats = loadRevenueStats;
        loadRevenueStats = async function() {
            await originalLoadRevenueStats();
            await initRevenueCharts();
        };

        // ============================================================
        // END SESSION 225: REVENUE CHARTS FUNCTIONS
        // ============================================================

        // ============================================================
        // END SESSION 223: OPPORTUNITY ENGINE FUNCTIONS
</script>
