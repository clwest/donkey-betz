<script>

        // Global state for MiniFig creation
        const minifigState = {
            selectedImages: [],  // Array of {id, url, filename}
            currentMiniFigId: null
        };

        // Select images from gallery for MiniFig creation
        async function selectMiniFigImagesFromGallery() {
            try {
                // Fetch image gallery
                const response = await authenticatedFetch('/api/v1/gallery/all/?type=images&limit=100');
                const data = await response.json();
                const images = (data.results || []).filter(item => item.type === 'image');

                if (images.length === 0) {
                    alert('❌ No images in gallery!\n\nGenerate some images first.');
                    return;
                }

                // Create multi-select modal
                const modal = document.createElement('div');
                modal.style = `
                    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                    background: rgba(0,0,0,0.9); z-index: 10000; overflow-y: auto; padding: 40px;
                `;
                modal.innerHTML = `
                    <div style="max-width: 1200px; margin: 0 auto; background: #1a1a1a; border-radius: 12px; padding: 30px; border: 2px solid var(--cyan);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <h4 style="color: var(--cyan); margin: 0;">📸 Select 1-4 Character Images</h4>
                            <button onclick="this.closest('div[style*=fixed]').remove()" style="background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">✕ Close</button>
                        </div>
                        <p style="color: #ccc; margin-bottom: 20px;">Select between 1-4 images. Multiple angles improve 3D model quality!</p>
                        <div id="minifigImageSelectGrid" class="row g-3" style="margin-bottom: 20px;"></div>
                        <div style="text-align: center;">
                            <button id="confirmMiniFigImages" class="btn btn-success btn-lg" disabled>
                                ✅ Use Selected Images (<span id="selectedCountBadge">0</span>/4)
                            </button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);

                // Populate grid
                const grid = modal.querySelector('#minifigImageSelectGrid');
                images.forEach(img => {
                    const col = document.createElement('div');
                    col.className = 'col-md-3';
                    col.innerHTML = `
                        <div class="card bg-dark border-secondary minifig-image-option" data-id="${img.id}" data-url="${img.url}" style="cursor: pointer; transition: all 0.3s;">
                            <img src="${img.url}" class="card-img-top" style="height: 200px; object-fit: cover;">
                            <div class="card-body p-2">
                                <small class="text-muted d-block text-truncate">${img.prompt || 'No prompt'}</small>
                                <div class="form-check mt-2">
                                    <input class="form-check-input minifig-image-checkbox" type="checkbox" value="${img.id}" data-url="${img.url}">
                                    <label class="form-check-label small">Select</label>
                                </div>
                            </div>
                        </div>
                    `;
                    grid.appendChild(col);
                });

                // Handle checkbox changes
                const checkboxes = modal.querySelectorAll('.minifig-image-checkbox');
                const confirmBtn = modal.querySelector('#confirmMiniFigImages');
                const countBadge = modal.querySelector('#selectedCountBadge');

                checkboxes.forEach(checkbox => {
                    checkbox.addEventListener('change', () => {
                        const checked = Array.from(checkboxes).filter(cb => cb.checked);
                        countBadge.textContent = checked.length;
                        confirmBtn.disabled = checked.length === 0 || checked.length > 4;

                        // Visual feedback
                        checkbox.closest('.minifig-image-option').style.borderColor = checkbox.checked ? 'var(--success)' : '';
                        checkbox.closest('.minifig-image-option').style.borderWidth = checkbox.checked ? '3px' : '';
                    });
                });

                // Confirm selection
                confirmBtn.addEventListener('click', () => {
                    const selected = Array.from(checkboxes)
                        .filter(cb => cb.checked)
                        .map(cb => ({ id: cb.value, url: cb.dataset.url }));

                    minifigState.selectedImages = selected;
                    updateMiniFigImagePreview();
                    modal.remove();
                });

            } catch (error) {
                console.error('❌ Error loading gallery:', error);
                alert('Failed to load image gallery. Please try again.');
            }
        }

        // Update MiniFig image preview
        function updateMiniFigImagePreview() {
            const preview = document.getElementById('minifigImagePreview');
            const grid = document.getElementById('minifigImageGrid');
            const count = document.getElementById('minifigImageCount');
            const btn = document.getElementById('launchMiniFigBtn');

            if (minifigState.selectedImages.length === 0) {
                preview.style.display = 'none';
                btn.disabled = true;
                return;
            }

            preview.style.display = 'block';
            count.textContent = minifigState.selectedImages.length;
            btn.disabled = false;

            grid.innerHTML = minifigState.selectedImages.map(img => `
                <div class="col-6">
                    <img src="${img.url}" class="img-fluid rounded border border-success" style="max-height: 100px; object-fit: cover; width: 100%;">
                </div>
            `).join('');
        }

        // Clear selected images
        function clearMiniFigImages() {
            minifigState.selectedImages = [];
            updateMiniFigImagePreview();
        }

        // Launch MiniFig Pipeline
        async function launchMiniFigPipeline() {
            if (minifigState.selectedImages.length === 0) {
                alert('❌ Please select at least 1 image!');
                return;
            }

            const style = document.getElementById('minifigStyle').value;
            const scale = document.getElementById('minifigScale').value;

            // Show status, hide info
            document.getElementById('minifigInfo').style.display = 'none';
            document.getElementById('minifigStatus').style.display = 'block';
            document.getElementById('minifigResult').style.display = 'none';
            document.getElementById('launchMiniFigBtn').disabled = true;

            try {
                // Call MiniFig pipeline API
                const response = await authenticatedFetch('/api/v1/pipelines/images_to_minifigs/launch/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image_ids: minifigState.selectedImages.map(img => img.id),
                        style: style,
                        scale: scale
                    })
                });

                // Check if response is OK before parsing JSON
                if (!response.ok) {
                    const text = await response.text();
                    console.error('❌ Server error response:', text.substring(0, 500));
                    throw new Error(`Server error (${response.status}): ${response.statusText}`);
                }

                // Check content type before parsing JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.error('❌ Non-JSON response:', text.substring(0, 500));
                    throw new Error(`Expected JSON but got ${contentType || 'unknown content type'}`);
                }

                const data = await response.json();

                if (data.success && data.minifig_id) {
                    minifigState.currentMiniFigId = data.minifig_id;
                    pollMiniFigStatus(data.minifig_id);
                } else {
                    throw new Error(data.error || 'Failed to start pipeline');
                }

            } catch (error) {
                console.error('❌ MiniFig creation error:', error);
                document.getElementById('minifigStatusText').textContent = `Error: ${error.message}`;
                const statusCard = document.getElementById('minifigStatus');
                if (statusCard) statusCard.style.borderColor = '#dc3545';
                document.getElementById('launchMiniFigBtn').disabled = false;
            }
        }

        // Poll MiniFig creation status
        async function pollMiniFigStatus(minifigId) {
            let attempts = 0;
            const maxAttempts = 60; // 2 minutes max

            const interval = setInterval(async () => {
                try {
                    attempts++;
                    const response = await authenticatedFetch(`/api/v1/content/minifigs/${minifigId}/`);
                    const data = await response.json();

                    if (!data.success) {
                        throw new Error(data.error || 'Failed to fetch status');
                    }

                    const minifig = data.minifig;

                    // Update progress
                    const progress = Math.min(95, Math.floor((attempts / maxAttempts) * 100));
                    document.getElementById('minifigProgress').style.width = `${progress}%`;
                    document.getElementById('minifigStatusText').textContent = minifig.status || 'Processing...';

                    if (minifig.status === 'completed') {
                        clearInterval(interval);
                        document.getElementById('minifigProgress').style.width = '100%';

                        // Show success
                        setTimeout(() => {
                            document.getElementById('minifigStatus').style.display = 'none';
                            document.getElementById('minifigResult').style.display = 'block';
                            document.getElementById('launchMiniFigBtn').disabled = false;
                        }, 500);

                    } else if (minifig.status === 'failed' || attempts >= maxAttempts) {
                        clearInterval(interval);
                        throw new Error(minifig.error_message || 'Pipeline timed out');
                    }

                } catch (error) {
                    clearInterval(interval);
                    console.error('❌ Polling error:', error);
                    document.getElementById('minifigStatusText').textContent = `Error: ${error.message}`;
                    document.getElementById('launchMiniFigBtn').disabled = false;
                }
            }, 2000); // Poll every 2 seconds
        }

        // Download MiniFig asset
        async function downloadMiniFigAsset(format) {
            if (!minifigState.currentMiniFigId) {
                alert('❌ No 3D model available to download');
                return;
            }

            try {
                const response = await authenticatedFetch(`/api/v1/content/minifigs/${minifigState.currentMiniFigId}/`);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to fetch MiniFig details');
                }

                const minifig = data.minifig;
                let fileUrl;
                if (format === 'obj') fileUrl = minifig.three_d_file;  // Backend stores in three_d_file
                else if (format === 'stl') fileUrl = minifig.three_d_file;
                else if (format === 'glb') fileUrl = minifig.three_d_file;

                if (!fileUrl) {
                    alert(`❌ .${format.toUpperCase()} file not available yet. Please wait a moment and try again.`);
                    return;
                }

                // Download file
                const link = document.createElement('a');
                link.href = fileUrl;
                link.download = `minifig_${minifigState.currentMiniFigId}.${format}`;
                link.click();

            } catch (error) {
                console.error('❌ Download error:', error);
                alert('Failed to download file. Please try again.');
            }
        }

        // Load MiniFig Gallery (Enhanced with 3D Viewer)
        async function loadMiniFigGallery() {
            const grid = document.getElementById('minifigGalleryGrid');
            const loading = document.getElementById('minifigGalleryLoading');
            const empty = document.getElementById('minifigGalleryEmpty');
            const filter = document.getElementById('minifigFilterStyle').value;

            loading.style.display = 'block';
            empty.style.display = 'none';
            grid.innerHTML = '';

            try {
                let url = '/api/v1/content/minifigs/?limit=50';
                if (filter) url += `&style=${filter}`;

                const response = await authenticatedFetch(url);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to load MiniFigs');
                }

                const minifigs = data.minifigs || [];

                loading.style.display = 'none';

                if (minifigs.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                grid.innerHTML = minifigs.map(mf => {
                    // Extract metadata
                    const style = mf.metadata?.style || 'Unknown';
                    const scale = mf.metadata?.scale || 'medium';
                    const imageCount = mf.metadata?.image_count || 'N/A';
                    const generationMethod = mf.metadata?.generation_method || 'AI';
                    const colorVideo = mf.metadata?.color_video;

                    // Generate title
                    const title = mf.title || `${style} Character (${scale})`;

                    // Status badge styling
                    const statusColors = {
                        'completed': 'success',
                        'processing': 'warning',
                        'pending': 'info',
                        'failed': 'danger'
                    };
                    const statusColor = statusColors[mf.status] || 'secondary';

                    // Format date
                    const createdDate = new Date(mf.created_at).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    // Download filename
                    const downloadFilename = `character_${style.toLowerCase()}_${scale}.glb`;

                    return `
                    <div class="col-lg-4 col-md-6">
                        <div class="card h-100" style="background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%); border: 2px solid var(--cyan); border-radius: 12px; overflow: hidden; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0, 217, 255, 0.2);"
                             onmouseover="this.style.transform='translateY(-5px)'; this.style.boxShadow='0 8px 25px rgba(0, 217, 255, 0.4)'; this.style.borderColor='var(--cyan-bright)';"
                             onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(0, 217, 255, 0.2)'; this.style.borderColor='var(--cyan)';">

                            <!-- 3D Model Viewer -->
                            ${mf.three_d_file ? `
                            <div style="background: #000; border-bottom: 2px solid var(--cyan); position: relative;">
                                <model-viewer
                                    src="${mf.three_d_file}"
                                    alt="${title}"
                                    auto-rotate
                                    camera-controls
                                    style="width: 100%; height: 300px;"
                                    loading="eager"
                                    reveal="auto">
                                </model-viewer>
                                <div style="position: absolute; top: 10px; right: 10px;">
                                    <span class="badge bg-${statusColor}" style="font-size: 11px; padding: 5px 10px;">
                                        ${mf.status.toUpperCase()}
                                    </span>
                                </div>
                            </div>
                            ` : `
                            <div style="background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%); height: 300px; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid var(--cyan);">
                                <div class="text-center">
                                    <div class="spinner-border text-cyan mb-3" role="status" style="width: 3rem; height: 3rem;">
                                        <span class="visually-hidden">Processing...</span>
                                    </div>
                                    <p class="text-muted">Generating 3D model...</p>
                                    <span class="badge bg-${statusColor}">${mf.status.toUpperCase()}</span>
                                </div>
                            </div>
                            `}

                            <!-- Card Body -->
                            <div class="card-body" style="padding: 20px;">
                                <!-- Title -->
                                <h5 class="card-title mb-3" style="color: var(--cyan-bright); font-weight: bold; font-size: 18px;">
                                    🎨 ${title}
                                </h5>

                                <!-- Source Image Preview -->
                                ${mf.preview_image_url ? `
                                <div class="mb-3" style="border-radius: 8px; overflow: hidden; border: 1px solid var(--cyan); cursor: pointer;">
                                    <img src="${mf.preview_image_url}"
                                         alt="Source Image"
                                         style="width: 100%; height: 120px; object-fit: cover;"
                                         onclick="showMiniFigDetails('${mf.id}')">
                                    <div style="background: rgba(0, 217, 255, 0.1); padding: 5px 10px; text-align: center;">
                                        <small style="color: var(--cyan); font-weight: 600;">Source Image</small>
                                    </div>
                                </div>
                                ` : ''}

                                <!-- Color Video Preview -->
                                ${colorVideo ? `
                                <div class="mb-3" style="border-radius: 8px; overflow: hidden; border: 1px solid var(--cyan); cursor: pointer;">
                                    <video src="${colorVideo}"
                                           style="width: 100%; height: 120px; object-fit: cover;"
                                           autoplay loop muted playsinline
                                           onclick="showMiniFigDetails('${mf.id}')">
                                    </video>
                                    <div style="background: rgba(0, 217, 255, 0.1); padding: 5px 10px; text-align: center;">
                                        <small style="color: var(--cyan); font-weight: 600;">🎬 Turntable Animation</small>
                                    </div>
                                </div>
                                ` : ''}

                                <!-- Metadata Cards -->
                                <div class="row g-2 mb-3">
                                    <div class="col-6">
                                        <div class="p-2" style="background: rgba(0, 217, 255, 0.1); border-radius: 6px; border: 1px solid rgba(0, 217, 255, 0.3);">
                                            <small style="color: #888; display: block; font-size: 10px;">STYLE</small>
                                            <strong style="color: var(--cyan); font-size: 13px;">${style}</strong>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-2" style="background: rgba(0, 217, 255, 0.1); border-radius: 6px; border: 1px solid rgba(0, 217, 255, 0.3);">
                                            <small style="color: #888; display: block; font-size: 10px;">SCALE</small>
                                            <strong style="color: var(--cyan); font-size: 13px; text-transform: uppercase;">${scale}</strong>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-2" style="background: rgba(0, 217, 255, 0.1); border-radius: 6px; border: 1px solid rgba(0, 217, 255, 0.3);">
                                            <small style="color: #888; display: block; font-size: 10px;">METHOD</small>
                                            <strong style="color: var(--cyan); font-size: 13px;">${generationMethod}</strong>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-2" style="background: rgba(0, 217, 255, 0.1); border-radius: 6px; border: 1px solid rgba(0, 217, 255, 0.3);">
                                            <small style="color: #888; display: block; font-size: 10px;">IMAGES</small>
                                            <strong style="color: var(--cyan); font-size: 13px;">${imageCount}</strong>
                                        </div>
                                    </div>
                                </div>

                                <!-- Cost Display -->
                                <div class="mb-3 p-2 text-center" style="background: linear-gradient(135deg, rgba(0, 217, 255, 0.15) 0%, rgba(0, 150, 200, 0.15) 100%); border-radius: 8px; border: 1px solid var(--cyan);">
                                    <small style="color: #888; display: block; font-size: 11px;">GENERATION COST</small>
                                    <strong style="color: #4ade80; font-size: 18px; font-weight: bold;">$0.038</strong>
                                </div>

                                <!-- Timestamp -->
                                <p class="text-muted mb-3" style="font-size: 12px; text-align: center;">
                                    📅 ${createdDate}
                                </p>

                                <!-- Action Buttons -->
                                <div class="d-grid gap-2">
                                    ${mf.three_d_file ? `
                                    <a href="${mf.three_d_file}"
                                       class="btn btn-outline-success btn-sm"
                                       download="${downloadFilename}"
                                       style="border-width: 2px; font-weight: 600; transition: all 0.3s;"
                                       onmouseover="this.style.transform='scale(1.02)'"
                                       onmouseout="this.style.transform='scale(1)'">
                                        📥 Download GLB File
                                    </a>
                                    ` : `
                                    <button class="btn btn-outline-secondary btn-sm" disabled>
                                        ⏳ Model Not Ready
                                    </button>
                                    `}
                                    ${mf.status === 'completed' ? `
                                    <button onclick="prepareForPrint('${mf.id}', null)"
                                            class="btn btn-sm"
                                            style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; font-weight: 600; transition: all 0.3s;"
                                            onmouseover="this.style.transform='scale(1.02)'; this.style.opacity='0.9'"
                                            onmouseout="this.style.transform='scale(1)'; this.style.opacity='1'">
                                        🖨️ Prepare for 3D Printing
                                    </button>
                                    ` : ''}
                                    <button onclick="showMiniFigDetails('${mf.id}')"
                                            class="btn btn-outline-info btn-sm"
                                            style="border-width: 2px; border-color: var(--cyan); color: var(--cyan); font-weight: 600; transition: all 0.3s;"
                                            onmouseover="this.style.background='var(--cyan)'; this.style.color='#000'; this.style.transform='scale(1.02)'"
                                            onmouseout="this.style.background='transparent'; this.style.color='var(--cyan)'; this.style.transform='scale(1)'">
                                        🔍 View Details
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                }).join('');

            } catch (error) {
                console.error('❌ Failed to load gallery:', error);
                loading.style.display = 'none';
                grid.innerHTML = '<div class="col-12 text-center text-danger">Failed to load gallery. Please try again.</div>';
            }
        }

        // Auto-load MiniFig gallery when tab is shown
        document.getElementById('minifig-gallery-pill').addEventListener('shown.bs.tab', () => {
            loadMiniFigGallery();
        });

        // Show MiniFig Details Modal
        async function showMiniFigDetails(minifigId) {
            const modal = document.getElementById('minifigDetailModal');
            const content = document.getElementById('minifigDetailContent');

            // Show modal with loading state
            modal.style.display = 'block';
            content.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-cyan mb-3" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="text-muted">Loading character details...</p>
                </div>
            `;

            try {
                // Fetch minifig details
                const response = await authenticatedFetch(`/api/v1/content/minifigs/${minifigId}/`);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.error || 'Failed to load MiniFig details');
                }

                const mf = data.minifig;

                // Extract metadata
                const style = mf.metadata?.style || 'Unknown';
                const scale = mf.metadata?.scale || 'medium';
                const imageCount = mf.metadata?.image_count || 'N/A';
                const generationMethod = mf.metadata?.generation_method || 'AI';
                const colorVideo = mf.metadata?.color_video;
                const depthVideo = mf.metadata?.depth_video;
                const normalVideo = mf.metadata?.normal_video;

                // Generate title
                const title = mf.title || `${style} Character (${scale})`;

                // Status badge styling
                const statusColors = {
                    'completed': 'success',
                    'processing': 'warning',
                    'pending': 'info',
                    'failed': 'danger'
                };
                const statusColor = statusColors[mf.status] || 'secondary';

                // Format date
                const createdDate = new Date(mf.created_at).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                // Download filename
                const downloadFilename = `character_${style.toLowerCase()}_${scale}.glb`;

                // Render detailed content
                content.innerHTML = `
                    <div class="row g-4">
                        <!-- Left Column: 3D Viewer -->
                        <div class="col-lg-6">
                            ${mf.three_d_file ? `
                            <div style="background: #000; border-radius: 12px; overflow: hidden; border: 2px solid var(--cyan); box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);">
                                <model-viewer
                                    src="${mf.three_d_file}"
                                    alt="${title}"
                                    auto-rotate
                                    camera-controls
                                    style="width: 100%; height: 500px;"
                                    loading="eager"
                                    reveal="auto"
                                    shadow-intensity="1">
                                </model-viewer>
                            </div>
                            ` : `
                            <div style="background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%); height: 500px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 2px solid var(--cyan);">
                                <div class="text-center">
                                    <div class="spinner-border text-cyan mb-3" role="status" style="width: 4rem; height: 4rem;">
                                        <span class="visually-hidden">Processing...</span>
                                    </div>
                                    <h4 class="text-muted">Generating 3D model...</h4>
                                    <span class="badge bg-${statusColor} mt-2" style="font-size: 14px; padding: 8px 16px;">
                                        ${mf.status.toUpperCase()}
                                    </span>
                                </div>
                            </div>
                            `}

                            <!-- Download Button -->
                            ${mf.three_d_file ? `
                            <div class="mt-3">
                                <a href="${mf.three_d_file}"
                                   class="btn btn-success btn-lg w-100"
                                   download="${downloadFilename}"
                                   style="border-width: 2px; font-weight: 700; font-size: 18px; padding: 12px;">
                                    📥 Download GLB File (${downloadFilename})
                                </a>
                            </div>
                            ` : ''}
                        </div>

                        <!-- Right Column: Details -->
                        <div class="col-lg-6">
                            <!-- Title & Status -->
                            <div class="mb-4">
                                <h3 style="color: var(--cyan-bright); font-size: 28px; font-weight: bold; margin-bottom: 10px;">
                                    ${title}
                                </h3>
                                <span class="badge bg-${statusColor}" style="font-size: 14px; padding: 8px 16px;">
                                    ${mf.status.toUpperCase()}
                                </span>
                            </div>

                            <!-- Source Image Preview -->
                            ${mf.preview_image_url ? `
                            <div class="mb-4">
                                <h5 style="color: var(--cyan); margin-bottom: 10px;">📸 Source Image</h5>
                                <div style="border-radius: 12px; overflow: hidden; border: 2px solid var(--cyan); box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);">
                                    <img src="${mf.preview_image_url}"
                                         alt="Source Image"
                                         style="width: 100%; height: auto; object-fit: cover;">
                                </div>
                            </div>
                            ` : ''}

                            <!-- Metadata Grid -->
                            <div class="mb-4">
                                <h5 style="color: var(--cyan); margin-bottom: 15px;">📊 Generation Details</h5>
                                <div class="row g-3">
                                    <div class="col-6">
                                        <div class="p-3" style="background: rgba(0, 217, 255, 0.1); border-radius: 8px; border: 2px solid rgba(0, 217, 255, 0.3);">
                                            <small style="color: #888; display: block; font-size: 11px; margin-bottom: 5px;">STYLE</small>
                                            <strong style="color: var(--cyan); font-size: 16px;">${style}</strong>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-3" style="background: rgba(0, 217, 255, 0.1); border-radius: 8px; border: 2px solid rgba(0, 217, 255, 0.3);">
                                            <small style="color: #888; display: block; font-size: 11px; margin-bottom: 5px;">SCALE</small>
                                            <strong style="color: var(--cyan); font-size: 16px; text-transform: uppercase;">${scale}</strong>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-3" style="background: rgba(0, 217, 255, 0.1); border-radius: 8px; border: 2px solid rgba(0, 217, 255, 0.3);">
                                            <small style="color: #888; display: block; font-size: 11px; margin-bottom: 5px;">METHOD</small>
                                            <strong style="color: var(--cyan); font-size: 16px;">${generationMethod}</strong>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="p-3" style="background: rgba(0, 217, 255, 0.1); border-radius: 8px; border: 2px solid rgba(0, 217, 255, 0.3);">
                                            <small style="color: #888; display: block; font-size: 11px; margin-bottom: 5px;">IMAGES</small>
                                            <strong style="color: var(--cyan); font-size: 16px;">${imageCount}</strong>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Cost Display -->
                            <div class="mb-4 p-3 text-center" style="background: linear-gradient(135deg, rgba(0, 217, 255, 0.2) 0%, rgba(0, 150, 200, 0.2) 100%); border-radius: 12px; border: 2px solid var(--cyan); box-shadow: 0 0 15px rgba(0, 217, 255, 0.2);">
                                <small style="color: #888; display: block; font-size: 12px; margin-bottom: 5px;">GENERATION COST</small>
                                <strong style="color: #4ade80; font-size: 32px; font-weight: bold;">$0.038</strong>
                                <p class="text-muted mt-2 mb-0" style="font-size: 13px;">Per character generation</p>
                            </div>

                            <!-- Timestamp -->
                            <div class="mb-4 p-3" style="background: rgba(0, 217, 255, 0.05); border-radius: 8px; border: 1px solid rgba(0, 217, 255, 0.2);">
                                <small style="color: #888; display: block; font-size: 11px; margin-bottom: 5px;">CREATED</small>
                                <strong style="color: #fff; font-size: 14px;">📅 ${createdDate}</strong>
                            </div>

                            <!-- Videos Section -->
                            ${colorVideo || depthVideo || normalVideo ? `
                            <div class="mb-4">
                                <h5 style="color: var(--cyan); margin-bottom: 15px;">🎬 Preview Videos</h5>
                                <div class="row g-3">
                                    ${colorVideo ? `
                                    <div class="col-12">
                                        <div style="border-radius: 8px; overflow: hidden; border: 2px solid var(--cyan);">
                                            <video src="${colorVideo}"
                                                   controls
                                                   loop
                                                   style="width: 100%; height: auto; background: #000;">
                                            </video>
                                            <div style="background: rgba(0, 217, 255, 0.1); padding: 8px; text-align: center;">
                                                <small style="color: var(--cyan); font-weight: 600;">Color Turntable</small>
                                            </div>
                                        </div>
                                    </div>
                                    ` : ''}
                                    ${depthVideo ? `
                                    <div class="col-6">
                                        <div style="border-radius: 8px; overflow: hidden; border: 1px solid rgba(0, 217, 255, 0.5);">
                                            <video src="${depthVideo}"
                                                   controls
                                                   loop
                                                   style="width: 100%; height: auto; background: #000;">
                                            </video>
                                            <div style="background: rgba(0, 217, 255, 0.05); padding: 5px; text-align: center;">
                                                <small style="color: var(--cyan); font-size: 11px;">Depth Map</small>
                                            </div>
                                        </div>
                                    </div>
                                    ` : ''}
                                    ${normalVideo ? `
                                    <div class="col-6">
                                        <div style="border-radius: 8px; overflow: hidden; border: 1px solid rgba(0, 217, 255, 0.5);">
                                            <video src="${normalVideo}"
                                                   controls
                                                   loop
                                                   style="width: 100%; height: auto; background: #000;">
                                            </video>
                                            <div style="background: rgba(0, 217, 255, 0.05); padding: 5px; text-align: center;">
                                                <small style="color: var(--cyan); font-size: 11px;">Normal Map</small>
                                            </div>
                                        </div>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>
                            ` : ''}
                        </div>
                    </div>
                `;

            } catch (error) {
                console.error('❌ Failed to load MiniFig details:', error);
                content.innerHTML = `
                    <div class="text-center py-5">
                        <div style="font-size: 64px; margin-bottom: 20px;">⚠️</div>
                        <h4 class="text-danger mb-3">Failed to Load Details</h4>
                        <p class="text-muted">${error.message}</p>
                        <button onclick="document.getElementById('minifigDetailModal').style.display='none'"
                                class="btn btn-outline-cyan mt-3">
                            Close
                        </button>
                    </div>
                `;
            }
        }

</script>
