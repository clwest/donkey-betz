<script>
        class AIAssistant {
            constructor() {
                this.isOpen = false;
                this.context = this.getCurrentContext();
                this.conversation = [];

                // Session 96: Session tracking for auto-project creation
                this.sessionId = null;
                this.sessionTitle = null;
                this.isNewSession = true;  // Track if this is a fresh session (don't inherit project)
                this.sessionStartedWithProject = false;  // Track if session was resumed with a project

                // Session 97: Project tracking
                this.activeProjectId = null;
                this.activeProjectName = null;

                // Session 58: Phase B.3 - Workflow definitions
                this.workflows = {
                    logo_creator: {
                        name: 'Logo Creator',
                        description: 'Generate professional iconic symbols and brand logos',
                        keywords: ['logo', 'brand', 'company icon', 'business symbol', 'emblem', 'brand mark'],
                        requiredInput: 'prompt',
                        example: 'Create a logo for a coffee shop'
                    },
                    portrait_enhancer: {
                        name: 'Portrait Enhancer',
                        description: 'Transform portraits into professional photography quality',
                        keywords: ['portrait', 'headshot', 'professional photo', 'enhance face', 'face photo', 'profile picture'],
                        requiredInput: 'image',
                        example: 'Enhance my portrait photo'
                    },
                    style_explorer: {
                        name: 'Style Explorer',
                        description: 'Generate images in 5 different artistic styles',
                        keywords: ['style', 'artistic', 'different looks', 'variations', 'multiple styles', 'explore styles'],
                        requiredInput: 'prompt',
                        example: 'Show me different artistic styles of a mountain'
                    },
                    social_media_pack: {
                        name: 'Social Media Pack',
                        description: 'Create 3 variations perfect for social media posts',
                        keywords: ['social media', 'instagram', 'facebook', 'twitter', 'post', 'social pack', 'social content'],
                        requiredInput: 'prompt',
                        example: 'Create social media content for my bakery'
                    },
                    product_mockup: {
                        name: 'Product Mockup',
                        description: 'Showcase products in professional lifestyle settings',
                        keywords: ['product', 'mockup', 'showcase', 'display item', 'product photo', 'product shot'],
                        requiredInput: 'image',
                        example: 'Create a mockup for my product'
                    },
                    creative_upscale: {
                        name: 'Creative Upscale',
                        description: '4x upscale with AI enhancement and detail addition',
                        keywords: ['upscale', 'enlarge', 'bigger', 'higher resolution', '4k', 'enhance resolution', 'improve quality'],
                        requiredInput: 'image',
                        example: 'Upscale and enhance my image'
                    }
                };

                this.workflowHistory = null; // Will load on demand

                // Session 64: Voice input properties
                this.isRecording = false;
                this.mediaRecorder = null;
                this.audioChunks = [];
                this.recordingStartTime = null;
                this.audioStream = null;

                // Session 271: Clean Architecture Support
                this.useCleanArchitecture = false;
                this.cleanAgents = [];
                this.checkCleanArchitectureStatus();

                this.setupUI();
                this.setupEventListeners();
            }

            getCurrentContext() {
                // Detect which tab is active
                const activeTab = document.querySelector('.nav-link.active');
                if (activeTab) {
                    const tabId = activeTab.id.replace('-tab', '');
                    return tabId;
                }
                return 'general';
            }

            // Session 271: Check if clean architecture is enabled
            async checkCleanArchitectureStatus() {
                try {
                    const response = await authenticatedFetch('/api/super-platform/status/');
                    const data = await response.json();
                    if (data.success && data.clean_architecture) {
                        this.useCleanArchitecture = data.clean_architecture.enabled;
                        this.cleanAgents = data.clean_architecture.agents || [];
                        if (this.useCleanArchitecture) {
                            console.log('🏗️ Session 271: Clean Architecture ENABLED with', this.cleanAgents.length, 'agents');
                            this.updateCleanArchitectureIndicator(true);
                        }
                    }
                } catch (e) {
                    console.log('Could not check clean architecture status:', e);
                }
            }

            // Session 271: Update UI indicator for clean architecture
            updateCleanArchitectureIndicator(enabled) {
                const indicator = document.getElementById('cleanArchIndicator');
                if (indicator) {
                    indicator.style.display = enabled ? 'inline-flex' : 'none';
                    indicator.title = `Clean Architecture: ${this.cleanAgents.length} agents`;
                }
            }

            setupUI() {
                // Session 189: Both tab and sidebar HTML are in the template
                console.log('✨ AI Assistant tab ready');
                // Load style insights on startup
                this.loadStyleInsights();
                // Load projects for dropdown
                this.loadProjects();
            }

            setupEventListeners() {
                // Session 189: PRIMARY - Tab-based assistant (new full-width UI)
                const tabSendBtn = document.getElementById('tabAssistantSend');
                const tabVoiceBtn = document.getElementById('tabAssistantVoice');
                const tabInput = document.getElementById('tabAssistantInput');

                if (tabSendBtn) {
                    tabSendBtn.addEventListener('click', () => this.sendMessage('tab'));
                }
                if (tabVoiceBtn) {
                    tabVoiceBtn.addEventListener('click', () => this.toggleVoiceRecording('tab'));
                }
                if (tabInput) {
                    tabInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') this.sendMessage('tab');
                    });
                }

                // Session 191: Stop button for cancelling workflows
                const tabStopBtn = document.getElementById('tabAssistantStop');
                if (tabStopBtn) {
                    tabStopBtn.addEventListener('click', () => this.stopWorkflow());
                }

                // Tab quick actions
                document.querySelectorAll('.tab-quick-action').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const action = e.target.dataset.action;
                        this.handleQuickAction(action);
                    });
                });

                // Tab meeting button
                const tabMeetingBtn = document.getElementById('tabStartMeetingBtn');
                if (tabMeetingBtn) {
                    tabMeetingBtn.addEventListener('click', () => this.startExecutiveMeeting());
                }

                // LEGACY - Sidebar-based assistant (kept for backwards compatibility)
                const sidebarToggle = document.getElementById('aiSidebarToggle');
                const sidebarClose = document.getElementById('aiSidebarClose');
                const sidebarSend = document.getElementById('aiAssistantSend');
                const sidebarVoice = document.getElementById('aiAssistantVoice');
                const sidebarInput = document.getElementById('aiAssistantInput');

                if (sidebarToggle) {
                    sidebarToggle.addEventListener('click', () => this.toggle());
                }
                if (sidebarClose) {
                    sidebarClose.addEventListener('click', () => this.close());
                }
                if (sidebarSend) {
                    sidebarSend.addEventListener('click', () => this.sendMessage('sidebar'));
                }
                if (sidebarVoice) {
                    sidebarVoice.addEventListener('click', () => this.toggleVoiceRecording('sidebar'));
                }
                if (sidebarInput) {
                    sidebarInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') this.sendMessage('sidebar');
                    });
                }

                // Sidebar quick actions (legacy)
                document.querySelectorAll('.quick-action').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const action = e.target.dataset.action;
                        this.handleQuickAction(action);
                    });
                });

                // Update context when tab changes
                document.querySelectorAll('.nav-link').forEach(tab => {
                    tab.addEventListener('shown.bs.tab', () => {
                        this.context = this.getCurrentContext();
                    });
                });
            }

            // Session 189: Use example command from the tab UI
            useExampleCommand(command) {
                const tabInput = document.getElementById('tabAssistantInput');
                if (tabInput) {
                    tabInput.value = command;
                    tabInput.focus();
                }
            }

            // Session 189: Wrapper to call global loadStyleInsights function
            loadStyleInsights() {
                // Call the global function (defined outside this class)
                if (typeof window.loadStyleInsights === 'function') {
                    window.loadStyleInsights();
                }
            }

            // Session 189: Update workflow status indicator
            // Session 201: Format markdown in status messages
            updateWorkflowStatus(status, isComplete = false) {
                const container = document.getElementById('workflowStatusContainer');
                const statusText = document.getElementById('workflowStatusText');

                if (!container || !statusText) return;

                // Session 201: Format any markdown in status
                const formattedStatus = formatMarkdown(status);

                if (isComplete) {
                    // Hide the status after completion
                    setTimeout(() => {
                        container.style.display = 'none';
                    }, 2000);
                    statusText.innerHTML = formattedStatus;
                    // Change to success styling
                    container.querySelector('.spinner-border')?.classList.add('d-none');
                } else {
                    // Show and update status
                    container.style.display = 'block';
                    statusText.innerHTML = formattedStatus;
                    container.querySelector('.spinner-border')?.classList.remove('d-none');
                }
            }

            // Session 189: Hide workflow status
            hideWorkflowStatus() {
                const container = document.getElementById('workflowStatusContainer');
                if (container) {
                    container.style.display = 'none';
                }
            }

            // Session 96: Update session indicator in UI
            updateSessionIndicator(sessionData) {
                if (!sessionData || !sessionData.session_id) return;

                // Session 117: First time getting session_id back means session is no longer "new"
                const wasNewSession = this.isNewSession && !this.sessionId;

                this.sessionId = sessionData.session_id;
                this.sessionTitle = sessionData.title || 'New Session';

                // Mark session as no longer new (has been created in backend)
                if (wasNewSession) {
                    this.isNewSession = false;
                    console.log('✨ Session created - no longer new');
                }

                // Session 189: Update BOTH tab and sidebar indicators
                // Tab indicator (primary)
                const tabIndicator = document.getElementById('tabSessionIndicator');
                const tabTitleEl = document.getElementById('tabSessionTitle');
                const tabCountersEl = document.getElementById('tabSessionCounters');

                if (tabIndicator) {
                    tabIndicator.style.display = 'flex';
                    if (tabTitleEl) tabTitleEl.textContent = this.sessionTitle;
                }

                // Sidebar indicator (legacy)
                const indicator = document.getElementById('sessionIndicator');
                const titleEl = document.getElementById('sessionTitle');
                const countersEl = document.getElementById('sessionCounters');
                const imageCount = document.getElementById('imageCount');
                const videoCount = document.getElementById('videoCount');
                const audioCount = document.getElementById('audioCount');

                // Show indicator
                if (indicator) indicator.style.display = 'block';
                if (titleEl) titleEl.textContent = this.sessionTitle;

                // Update counters if provided
                if (sessionData.total_images !== undefined || sessionData.total_videos !== undefined || sessionData.total_audio !== undefined) {
                    if (countersEl) countersEl.style.display = 'block';
                    const parts = [];
                    if (sessionData.total_images > 0) parts.push(`🖼️ ${sessionData.total_images} image${sessionData.total_images !== 1 ? 's' : ''}`);
                    if (sessionData.total_videos > 0) parts.push(`🎬 ${sessionData.total_videos} video${sessionData.total_videos !== 1 ? 's' : ''}`);
                    if (sessionData.total_audio > 0) parts.push(`🎵 ${sessionData.total_audio} audio`);

                    if (imageCount) imageCount.textContent = parts[0] || '';
                    if (videoCount) videoCount.textContent = parts[1] || '';
                    if (audioCount) audioCount.textContent = parts[2] || '';

                    // Session 189: Update tab counters
                    if (tabCountersEl) tabCountersEl.textContent = parts.join(' • ');
                }

                console.log('📝 Session indicator updated:', this.sessionId, this.sessionTitle);
            }

            // Session 117: Start a completely new session (fresh start)
            startNewSession() {
                console.log('✨ Starting new session...');

                // Clear all session state
                this.sessionId = null;
                this.sessionTitle = null;
                this.isNewSession = true;
                this.sessionStartedWithProject = false;
                this.conversation = [];

                // Session 189: Hide BOTH tab and sidebar session indicators
                const tabIndicator = document.getElementById('tabSessionIndicator');
                const indicator = document.getElementById('sessionIndicator');
                if (tabIndicator) tabIndicator.style.display = 'none';
                if (indicator) indicator.style.display = 'none';

                // Session 189: Clear BOTH tab and sidebar chat messages
                const welcomeHTML = `
                    <div class="alert alert-info mb-3" style="background: rgba(6, 182, 212, 0.15); border: 1px solid var(--cyan);">
                        👋 <strong>Welcome!</strong> Fresh session started! I can help you:
                        <ul class="mb-0 mt-2">
                            <li>Generate images, videos, and audio content</li>
                            <li>Execute professional AI workflows</li>
                            <li>Edit and enhance your content</li>
                            <li>Manage projects and view your history</li>
                        </ul>
                        <div class="mt-3" style="font-size: 12px; padding: 8px; background: rgba(251, 191, 36, 0.1); border-left: 3px solid #fbbf24; border-radius: 4px;">
                            <strong style="color: #fbbf24;">✨ Fresh Start!</strong>
                            <div style="margin-top: 4px; color: #cbd5e1;">This session will auto-create its own project when you generate 3+ images or 1+ video.</div>
                        </div>
                    </div>
                `;

                // Tab chat (primary)
                const tabMessagesDiv = document.getElementById('tabChatMessages');
                if (tabMessagesDiv) {
                    tabMessagesDiv.innerHTML = welcomeHTML + `
                        <div class="text-muted mb-3" style="font-size: 14px;">
                            <strong>💡 Try saying or typing:</strong>
                            <div class="d-flex flex-wrap gap-2 mt-2">
                                <button class="btn btn-sm btn-outline-light example-command" onclick="window.aiAssistant.useExampleCommand(this.dataset.cmd)" data-cmd="Create a logo for my coffee shop">
                                    "Create a logo for my coffee shop"
                                </button>
                                <button class="btn btn-sm btn-outline-light example-command" onclick="window.aiAssistant.useExampleCommand(this.dataset.cmd)" data-cmd="Show me artistic styles of a mountain">
                                    "Show me artistic styles of a mountain"
                                </button>
                            </div>
                        </div>
                    `;
                    tabMessagesDiv.scrollTop = 0;
                }

                // Sidebar chat (legacy)
                const messagesDiv = document.getElementById('aiChatMessages');
                if (messagesDiv) {
                    messagesDiv.innerHTML = welcomeHTML;
                    messagesDiv.scrollTop = 0;
                }

                // Don't clear activeProjectId - keep it for reference, but don't send it for new sessions
                // This way the dropdown still shows the last project, but new session won't be forced into it

                console.log('✅ New session ready - project will be auto-created when you create content');
            }

            // Session 96: Show toast notification when project is auto-created
            showProjectCreatedNotification(projectName, projectId) {
                console.log('🎉 Project auto-created:', projectName, projectId);

                // Create toast notification element
                const toast = document.createElement('div');
                toast.style.cssText = `
                    position: fixed;
                    top: 80px;
                    right: 20px;
                    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
                    color: white;
                    padding: 16px 24px;
                    border-radius: 12px;
                    box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
                    z-index: 10000;
                    max-width: 400px;
                    animation: slideInRight 0.3s ease-out;
                    border: 2px solid #34d399;
                `;

                toast.innerHTML = `
                    <div style="display: flex; align-items: start; gap: 12px;">
                        <div style="font-size: 32px; line-height: 1;">🎉</div>
                        <div style="flex: 1;">
                            <div style="font-weight: 700; font-size: 16px; margin-bottom: 4px;">Project Created!</div>
                            <div style="font-size: 14px; opacity: 0.95; margin-bottom: 12px;">${projectName}</div>
                            <button
                                onclick="window.aiAssistant.viewProject(${projectId}); this.parentElement.parentElement.parentElement.remove();"
                                style="
                                    background: rgba(255, 255, 255, 0.2);
                                    border: 1px solid rgba(255, 255, 255, 0.3);
                                    color: white;
                                    padding: 6px 16px;
                                    border-radius: 8px;
                                    font-weight: 600;
                                    font-size: 13px;
                                    cursor: pointer;
                                    transition: all 0.2s;
                                "
                                onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'"
                                onmouseout="this.style.background='rgba(255, 255, 255, 0.2)'"
                            >
                                📁 View Project
                            </button>
                        </div>
                        <button
                            onclick="this.parentElement.parentElement.remove();"
                            style="
                                background: none;
                                border: none;
                                color: white;
                                font-size: 20px;
                                cursor: pointer;
                                opacity: 0.7;
                                line-height: 1;
                                padding: 0;
                                margin: 0;
                            "
                            onmouseover="this.style.opacity='1'"
                            onmouseout="this.style.opacity='0.7'"
                        >×</button>
                    </div>
                `;

                // Add animation keyframes if not already present
                if (!document.getElementById('toast-animations')) {
                    const style = document.createElement('style');
                    style.id = 'toast-animations';
                    style.textContent = `
                        @keyframes slideInRight {
                            from {
                                transform: translateX(400px);
                                opacity: 0;
                            }
                            to {
                                transform: translateX(0);
                                opacity: 1;
                            }
                        }
                    `;
                    document.head.appendChild(style);
                }

                document.body.appendChild(toast);

                // Auto-remove after 10 seconds
                setTimeout(() => {
                    if (toast.parentElement) {
                        toast.style.animation = 'slideInRight 0.3s ease-out reverse';
                        setTimeout(() => toast.remove(), 300);
                    }
                }, 10000);
            }

            // Session 96: Navigate to Projects tab and show specific project
            viewProject(projectId) {
                console.log('📁 Navigating to project:', projectId);

                // Switch to Projects tab
                const projectsTab = document.querySelector('a[href="#projects"]');
                if (projectsTab) {
                    projectsTab.click();
                    console.log('✅ Switched to Projects tab');

                    // TODO: Implement project highlighting/filtering in Projects tab
                    // This would require enhancement to the Projects tab to accept a project ID parameter
                } else {
                    console.warn('⚠️ Projects tab not found');
                }
            }

            // Session 96: Open session gallery modal and load content
            async openSessionGallery() {
                if (!this.sessionId) {
                    console.warn('⚠️ No active session');
                    return;
                }

                console.log('📂 Opening session gallery:', this.sessionId);

                // Show modal and loading state
                const modal = document.getElementById('sessionGalleryModal');
                const loadingState = document.getElementById('sessionLoadingState');
                const emptyState = document.getElementById('sessionEmptyState');
                const imagesSection = document.getElementById('sessionImagesSection');
                const videosSection = document.getElementById('sessionVideosSection');

                modal.style.display = 'block';
                loadingState.style.display = 'block';
                emptyState.style.display = 'none';
                imagesSection.style.display = 'none';
                videosSection.style.display = 'none';

                try {
                    // Fetch session content from API
                    const response = await authenticatedFetch(`/api/v1/gallery/session/?session_id=${this.sessionId}`);
                    const data = await response.json();

                    loadingState.style.display = 'none';

                    // Update header
                    document.getElementById('sessionGalleryTitle').textContent = data.session.title;
                    document.getElementById('sessionGallerySubtitle').textContent =
                        `Created: ${new Date(data.session.created_at).toLocaleString()}`;

                    // Show/hide sections based on content
                    const hasImages = data.images && data.images.length > 0;
                    const hasVideos = data.videos && data.videos.length > 0;

                    if (!hasImages && !hasVideos) {
                        emptyState.style.display = 'block';
                        return;
                    }

                    // Display images
                    if (hasImages) {
                        imagesSection.style.display = 'block';
                        document.getElementById('sessionImageCount').textContent = `(${data.images.length})`;
                        const imagesGrid = document.getElementById('sessionImagesGrid');
                        imagesGrid.innerHTML = '';

                        data.images.forEach(img => {
                            const col = document.createElement('div');
                            col.className = 'col-md-4 col-sm-6';
                            col.innerHTML = `
                                <div class="card" style="background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(34, 211, 238, 0.3); border-radius: 8px; overflow: hidden; position: relative;">
                                    <button
                                        onclick="deleteImageFromSession('${img.id}', '${this.sessionId}')"
                                        style="position: absolute; top: 8px; right: 8px; background: rgba(239, 68, 68, 0.9); border: none; color: white; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.3);"
                                        onmouseover="this.style.background='rgba(220, 38, 38, 1)'"
                                        onmouseout="this.style.background='rgba(239, 68, 68, 0.9)'"
                                        title="Delete this image"
                                    >🗑️ Delete</button>
                                    <img src="${img.url}" alt="${img.prompt || 'Generated image'}" style="width: 100%; aspect-ratio: 1; object-fit: cover;">
                                    <div class="card-body" style="padding: 12px;">
                                        <div style="font-size: 11px; color: #22d3ee; font-weight: 700; margin-bottom: 4px;">
                                            🆔 Image #${img.sequential_number}
                                        </div>
                                        ${img.prompt ? `<p class="card-text" style="font-size: 12px; color: #94a3b8; margin: 0;">${img.prompt.substring(0, 60)}${img.prompt.length > 60 ? '...' : ''}</p>` : ''}
                                        ${img.style ? `<div style="font-size: 10px; color: #fbbf24; margin-top: 4px;">${img.style}</div>` : ''}
                                    </div>
                                </div>
                            `;
                            imagesGrid.appendChild(col);
                        });
                    }

                    // Display videos
                    if (hasVideos) {
                        videosSection.style.display = 'block';
                        document.getElementById('sessionVideoCount').textContent = `(${data.videos.length})`;
                        const videosGrid = document.getElementById('sessionVideosGrid');
                        videosGrid.innerHTML = '';

                        data.videos.forEach(vid => {
                            const col = document.createElement('div');
                            col.className = 'col-md-4 col-sm-6';
                            col.innerHTML = `
                                <div class="card" style="background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(167, 139, 250, 0.3); border-radius: 8px; overflow: hidden;">
                                    <video src="${vid.url}" controls style="width: 100%; aspect-ratio: 16/9; object-fit: cover;"></video>
                                    <div class="card-body" style="padding: 12px;">
                                        ${vid.prompt ? `<p class="card-text" style="font-size: 12px; color: #94a3b8; margin: 0;">${vid.prompt.substring(0, 60)}${vid.prompt.length > 60 ? '...' : ''}</p>` : ''}
                                        <div style="font-size: 10px; color: #a78bfa; margin-top: 4px;">${vid.duration}s • ${vid.status}</div>
                                    </div>
                                </div>
                            `;
                            videosGrid.appendChild(col);
                        });
                    }

                    console.log('✅ Session gallery loaded:', data.images.length, 'images,', data.videos.length, 'videos');

                } catch (error) {
                    console.error('❌ Error loading session gallery:', error);
                    loadingState.style.display = 'none';
                    emptyState.style.display = 'block';
                    document.getElementById('sessionEmptyState').innerHTML = `
                        <div style="font-size: 64px; margin-bottom: 16px;">⚠️</div>
                        <h4 style="color: #cbd5e1; margin-bottom: 8px;">Error Loading Session</h4>
                        <p>${error.message}</p>
                    `;
                }
            }

            // Session 97: Project Management Methods
            async loadProjects() {
                console.log('📁 Loading projects...');
                try {
                    // Session 97 Fix: Use correct endpoint for CreativeProjects
                    const response = await authenticatedFetch('/api/creative-projects/');
                    const data = await response.json();

                    // Session 97 Fix: API returns {projects: [...]} without success field
                    if (data.projects && data.projects.length > 0) {
                        this.populateProjectDropdown(data.projects);
                        // Auto-select Quick Starts or last active project
                        await this.autoSelectProject(data.projects);
                    } else {
                        console.warn('⚠️ No projects found');
                    }
                } catch (error) {
                    console.error('❌ Error loading projects:', error);
                }
            }

            populateProjectDropdown(projects) {
                // Session 189: Populate BOTH tab and sidebar dropdowns
                const tabSelect = document.getElementById('tabActiveProjectSelect');
                const sidebarSelect = document.getElementById('activeProjectSelect');

                // Sort projects: Quick Starts first, then by last_activity
                const sortedProjects = projects.sort((a, b) => {
                    if (a.is_quick_starts) return -1;
                    if (b.is_quick_starts) return 1;
                    return new Date(b.last_activity || 0) - new Date(a.last_activity || 0);
                });

                // Populate each dropdown
                [tabSelect, sidebarSelect].forEach(select => {
                    if (!select) return;

                    // Clear existing options
                    select.innerHTML = '';

                    // Add projects as options
                    sortedProjects.forEach(project => {
                        const option = document.createElement('option');
                        option.value = project.id;
                        // Session 117: Show sequential number for easy reference
                        if (project.is_quick_starts) {
                            option.textContent = `⚡ ${project.name}`;
                        } else {
                            option.textContent = `📁 Project #${project.sequential_number} - ${project.name}`;
                        }
                        select.appendChild(option);
                    });
                });

                console.log(`✅ Loaded ${projects.length} projects into dropdowns`);
            }

            async autoSelectProject(projects) {
                // Try to get last active project from localStorage
                const lastProjectId = localStorage.getItem('lastActiveProject');

                let selectedProject = null;

                if (lastProjectId) {
                    // Try to find the last active project
                    selectedProject = projects.find(p => p.id === lastProjectId);
                }

                if (!selectedProject) {
                    // Fall back to Quick Starts
                    selectedProject = projects.find(p => p.is_quick_starts);
                }

                if (!selectedProject && projects.length > 0) {
                    // Last resort: first project
                    selectedProject = projects[0];
                }

                if (selectedProject) {
                    await this.switchProject(selectedProject.id, selectedProject.name, true);
                }
            }

            async switchProject(projectId, projectName = null, skipSave = false) {
                console.log('📁 Switching to project:', projectId);

                // Update active project
                this.activeProjectId = projectId;

                    return `<div style="margin: 1em 0;">
                        <div style="background: #1a1a2e; color: #6ee7b7; font-size: 0.75em; padding: 0.25em 0.5em; border-radius: 4px 4px 0 0; display: inline-block;">${lang}</div>
                        <pre style="margin: 0; background: #0d1117; padding: 1em; border-radius: 0 4px 4px 4px; overflow-x: auto; border: 1px solid #30363d;"><code class="language-${lang}" style="color: #e6edf3; font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; font-size: 0.9em; line-height: 1.5;">${escapedCode}</code></pre>
                    </div>`;
                });

                // Session 266: Convert inline code `text` to <code>
                text = text.replace(/`([^`]+)`/g, '<code style="background: rgba(110, 118, 129, 0.4); padding: 0.2em 0.4em; border-radius: 4px; font-family: monospace; font-size: 0.9em; color: #f0883e;">$1</code>');

                // Session 189: Convert markdown images ![alt](url) to HTML img tags FIRST
                // This ensures images are rendered before paragraph processing
                text = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (match, alt, url) => {
                    console.log('🖼️ Converting markdown image:', alt, url);
                    return `<div class="generated-image-preview" style="margin: 10px 0;">
                        <img src="${url}" alt="${alt}" style="max-width: 100%; border-radius: 8px; cursor: pointer;" onclick="window.open('${url}', '_blank')" title="Click to view full size">
                        <div style="font-size: 0.85em; color: #6c757d; margin-top: 5px;">${alt || 'Generated Image'}</div>
                    </div>`;
                });

                // Session 195: Convert markdown links [text](url) to HTML anchor tags
                // Must be done after images to avoid conflict
                text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, linkText, url) => {
                    return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: #17a2b8; text-decoration: underline;">${linkText}</a>`;
                });

                // Session 195: Convert headers (## and ###)
                text = text.replace(/^## (.+)$/gm, '<h4 style="margin: 1em 0 0.5em 0; font-size: 1.2em; color: #fff;">$1</h4>');
                text = text.replace(/^### (.+)$/gm, '<h5 style="margin: 0.8em 0 0.4em 0; font-size: 1.1em; color: #ddd;">$1</h5>');

                // Session 195: Convert horizontal rules
                text = text.replace(/^---$/gm, '<hr style="border: none; border-top: 1px solid #444; margin: 1em 0;">');

                // Session 195: Convert blockquotes (> text)
                text = text.replace(/^> (.+)$/gm, '<blockquote style="border-left: 3px solid #17a2b8; padding-left: 10px; margin: 0.5em 0; color: #ccc; font-style: italic;">$1</blockquote>');

                // Session 195: Convert bold (**text**)
                text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

                // Session 195: Convert italic (*text*) - must be after bold to avoid conflicts
                text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');

                // Split into lines
                let lines = text.split('\n');
                let formatted = '';
                let inList = false;
                let listType = null; // 'bullet' or 'number'
                let currentParagraph = '';

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();

                    // Empty line - finish current paragraph and add spacing
                    if (!line) {
                        if (inList) {
                            formatted += listType === 'bullet' ? '</ul>' : '</ol>';
                            inList = false;
                            listType = null;
                        }
                        if (currentParagraph) {
                            formatted += '<p style="margin: 0.75em 0;">' + currentParagraph + '</p>';
                            currentParagraph = '';
                        }
                        continue;
                    }

                    // Bullet point (-, •, *)
                    if (line.match(/^[-•*]\s+/)) {
                        // Finish any current paragraph
                        if (currentParagraph) {
                            formatted += '<p style="margin: 0.75em 0;">' + currentParagraph + '</p>';
                            currentParagraph = '';
                        }
                        if (!inList || listType !== 'bullet') {
                            if (inList) formatted += listType === 'bullet' ? '</ul>' : '</ol>';
                            formatted += '<ul style="margin: 0.75em 0; padding-left: 1.5em;">';
                            inList = true;
                            listType = 'bullet';
                        }
                        formatted += '<li style="margin: 0.25em 0;">' + line.replace(/^[-•*]\s+/, '') + '</li>';
                    }
                    // Numbered list (1., 2., etc)
                    else if (line.match(/^\d+\.\s+/)) {
                        // Finish any current paragraph
                        if (currentParagraph) {
                            formatted += '<p style="margin: 0.75em 0;">' + currentParagraph + '</p>';
                            currentParagraph = '';
                        }
                        if (!inList || listType !== 'number') {
                            if (inList) formatted += listType === 'bullet' ? '</ul>' : '</ol>';
                            formatted += '<ol style="margin: 0.75em 0; padding-left: 1.5em;">';
                            inList = true;
                            listType = 'number';
                        }
                        formatted += '<li style="margin: 0.25em 0;">' + line.replace(/^\d+\.\s+/, '') + '</li>';
                    }
                    // Regular text - accumulate into paragraph
                    else {
                        if (inList) {
                            formatted += listType === 'bullet' ? '</ul>' : '</ol>';
                            inList = false;
                            listType = null;
                        }
                        // Add to current paragraph with space
                        if (currentParagraph) {
                            currentParagraph += ' ' + line;
                        } else {
                            currentParagraph = line;
                        }
                    }
                }

                // Close any open list
                if (inList) {
                    formatted += listType === 'bullet' ? '</ul>' : '</ol>';
                }

                // Finish any remaining paragraph
                if (currentParagraph) {
                    formatted += '<p style="margin: 0.75em 0;">' + currentParagraph + '</p>';
                }

                return formatted;
            }

            // Session 64: Detect prompts in GPT-5 responses and categorize them
            // SIMPLIFIED FOR 7-YEAR-OLDS: If AI talks about creating, show buttons!
            detectPromptsInMessage(message) {
                const result = {
                    hasImagePrompts: false,
                    hasVideoPrompts: false,
                    hasAudioPrompts: false,
                    imagePrompts: [],
                    videoPrompts: [],
                    audioPrompts: []
                };

                const lower = message.toLowerCase();
                console.log('🔍 Detecting prompts in message...', message.substring(0, 100) + '...');

                // Extract ALL quoted text (prompts are usually in quotes)
                const quotedTextRegex = /"([^"]+)"/g;
                const matches = [...message.matchAll(quotedTextRegex)];
                console.log(`📝 Found ${matches.length} quoted sections`);

                matches.forEach(match => {
                    const prompt = match[1].trim();

                    // Skip very short matches (likely not prompts)
                    if (prompt.length < 10) {
                        console.log('⏭️ Skipping short quote:', prompt);
                        return;
                    }

                    console.log('✅ Found prompt candidate:', prompt.substring(0, 50) + '...');

                    // Determine type based on context around the quote
                    const contextBefore = message.substring(Math.max(0, match.index - 100), match.index).toLowerCase();
                    const contextAfter = message.substring(match.index + match[0].length, match.index + match[0].length + 100).toLowerCase();
                    const fullContext = contextBefore + ' ' + prompt.toLowerCase() + ' ' + contextAfter;

                    // Video indicators
                    if (fullContext.includes('video') || fullContext.includes('footage') || fullContext.includes('clip') || fullContext.includes('motion')) {
                        result.videoPrompts.push(prompt);
                        result.hasVideoPrompts = true;
                        console.log('🎬 Categorized as VIDEO');
                    }
                    // Audio indicators
                    else if (fullContext.includes('audio') || fullContext.includes('sound') || fullContext.includes('voice') || fullContext.includes('music')) {
                        result.audioPrompts.push(prompt);
                        result.hasAudioPrompts = true;
                        console.log('🎵 Categorized as AUDIO');
                    }
                    // Default to image (most common)
                    else {
                        result.imagePrompts.push(prompt);
                        result.hasImagePrompts = true;
                        console.log('🎨 Categorized as IMAGE (default)');
                    }
                });

                // SIMPLE FALLBACK: If AI mentions image/logo/generate but no quotes found,
                // show button anyway that just opens the Images tab (7-year-old friendly!)
                if (result.imagePrompts.length === 0 && result.videoPrompts.length === 0 && result.audioPrompts.length === 0) {
                    if (lower.includes('image') || lower.includes('logo') || lower.includes('generate') ||
                        lower.includes('create') || lower.includes('prompt') || lower.includes('model:') ||
                        lower.includes('style:')) {
                        // Add a generic "Start Creating" button
                        result.imagePrompts.push(''); // Empty prompt = just open tab
                        result.hasImagePrompts = true;
                        console.log('🎨 No quotes found, but AI is talking about creation - showing button!');
                    }
                }

                console.log('🎯 Detection result:', {
                    images: result.imagePrompts.length,
                    videos: result.videoPrompts.length,
                    audio: result.audioPrompts.length
                });

                return result;
            }

            parseIntent(message) {
                const lower = message.toLowerCase();

                // Session 64: Detect uncertainty/help requests FIRST (before workflow matching)
                // If user is asking for help/ideas/suggestions, don't treat it as a literal prompt
                const uncertaintyPhrases = [
                    'not sure', "don't know", "dont know", 'no idea', 'help me',
                    'what prompt', 'what should i', 'need help', 'need ideas',
                    'suggestions', 'recommend', 'advice', 'stuck', 'brain fart'
                ];
                const hasUncertainty = uncertaintyPhrases.some(phrase => lower.includes(phrase));

                if (hasUncertainty) {
                    // User needs help - send to GPT-5 for advice
                    return { type: 'general', message };
                }

                // Session 65: DISABLED workflow detection - let GPT-5 executor handle everything
                // Workflows are still available but only if explicitly requested by name
                // This allows the autonomous executor to handle creation requests directly

                // Only trigger workflows if user explicitly mentions the workflow name
                const explicitWorkflowTriggers = {
                    'logo creator': 'logo_creator',
                    'portrait enhancer': 'portrait_enhancer',
                    'style explorer': 'style_explorer',
                    'social media pack': 'social_media_pack',
                    'product mockup': 'product_mockup',
                    'creative upscale': 'creative_upscale'
                };

                for (const [trigger, workflowType] of Object.entries(explicitWorkflowTriggers)) {
                    if (lower.includes(trigger)) {
                        const workflow = this.workflows[workflowType];
                        return {
                            type: 'workflow',
                            workflow: workflowType,
                            workflowName: workflow.name,
                            description: workflow.description,
                            requiredInput: workflow.requiredInput,
                            prompt: message,
                            extractedPrompt: this.extractPromptFromMessage(message, workflow.keywords)
                        };
                    }
                }

                // Session 65: Removed old generate_image intent - now handled by GPT-5 function calling
                // Image generation requests should go to the AI executor for autonomous execution
                // The GPT-5 assistant will decide when to call generate_image tool

                // Help intent (only very specific help requests)
                if (lower === 'help' || lower === 'help me' || lower.includes('what can you do') || lower.includes('what can you help')) {
                    return {
                        type: 'help',
                        topic: this.context
                    };
                }

                // Show history intent
                if (lower.includes('history') || lower.includes('previous') || lower.includes('past workflows')) {
                    return {
                        type: 'show_history'
                    };
                }

                // Show favorites intent
                if (lower.includes('favorites') || lower.includes('favourite') || lower.includes('saved workflows')) {
                    return {
                        type: 'show_favorites'
                    };
                }

                return { type: 'general', message };
            }

            // Session 58: Phase B.3 - Extract clean prompt from message
            extractPromptFromMessage(message, keywords) {
                let cleaned = message;
                // Remove workflow keywords
                keywords.forEach(keyword => {
                    const regex = new RegExp(keyword, 'gi');
                    cleaned = cleaned.replace(regex, '');
                });
                // Remove common action words
                cleaned = cleaned.replace(/(create|make|generate|show me|give me|i need|i want|can you)/gi, '');
                // Clean up extra spaces
                cleaned = cleaned.replace(/\s+/g, ' ').trim();
                return cleaned || message;

                        } else if (result.tool === 'strategic_review') {

                        } else if (result.tool === 'coleadership_agent') {

                            message += `🏢 **Executive Co-Leadership Review Complete!**\n\n`;

                                            message += `<span id="${recId}_full" style="display:none;">${response} <a href="#" onclick="document.getElementById('${recId}_preview').style.display='inline';document.getElementById('${recId}_full').style.display='none';document.querySelector('[onclick*=\\'${recId}_full\\']').style.display='inline';return false;" style="color:#fbbf24;font-size:12px;">[show less]</a></span>`;

            // Session 518: Format backend-executed tool results

            formatBackendToolResults(toolResults) {
                let message = '';

                for (const result of toolResults) {

                    const toolResult = result.result || {};
                    const hasError = result.error;

                    if (hasError) {
                        message += `❌ **Error executing ${toolName}:**\n${result.error}\n\n`;

                    if (toolName === 'content_writer_agent') {
                        // ContentWriterAgent returns structured written content

                        const contentType = content.content_type || 'blog_post';
                        const typeLabels = {
                            'blog_post': '📝 Blog Post',
                            'podcast_script': '🎙️ Podcast Script',
                            'video_script': '🎬 Video Script',
                            'article': '📰 Article',
                            'newsletter': '📧 Newsletter',

            // Session 401: Format Knowledge Attribution for transparency
            formatKnowledgeAttribution(attribution) {

                const confidence = Math.round((attribution.confidence_score || 0) * 100);
                const freshness = attribution.data_freshness_hours || 0;

                                        <div style="color: #93c5fd; font-weight: 600;">Video Generated</div>

                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span style="font-size: 24px;">🎤</span>
                                    <div>
                                        <div style="color: #86efac; font-weight: 600;">Audio Generated</div>
                                        ${artifact.url ? `<audio controls src="${artifact.url}" style="margin-top: 8px;"></audio>` : ''}
                                    </div>
                                </div>

                    } else if (type === '3d') {
                        html += `
                            <div class="artifact-3d" style="margin: 10px 0; padding: 12px; background: rgba(251, 146, 60, 0.1); border-radius: 8px;">

                        let researchContent = '';

                        const renderArticleList = (items, headerText) => {

                            });
                            html += `</div>`;

                        // Helper function to render topic tags
                        const renderTopicTags = (topics) => {
                            if (!topics || topics.length === 0) return '';
                            let html = `<div style="margin-top: 10px;">`;
                            html += `<div style="color: #a5b4fc; font-size: 12px; margin-bottom: 6px; font-weight: 500;">🔥 Trending Topics:</div>`;

            async startRecording() {
                try {
                    // Request microphone access with specific constraints
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true,
                            autoGainControl: true,
                            sampleRate: 48000
                        }
                    });
                    this.audioStream = stream;

                    // Create audio level monitor using Web Audio API
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioContext.createMediaStreamSource(stream);
                    const analyser = audioContext.createAnalyser();
                    analyser.fftSize = 256;
                    source.connect(analyser);

                    const dataArray = new Uint8Array(analyser.frequencyBinCount);

                    // Monitor audio level
                    const checkAudioLevel = () => {
                        if (!this.isRecording) return;

                        analyser.getByteFrequencyData(dataArray);
                        const average = dataArray.reduce((sum, value) => sum + value, 0) / dataArray.length;

                        console.log('🎤 Audio level:', Math.round(average), '/ 255');

                        if (average < 5) {
                            console.warn('⚠️ VERY LOW AUDIO! Microphone might be muted or wrong input selected!');
                        }

                        setTimeout(checkAudioLevel, 500);
                    };
                    checkAudioLevel();

                    // List available audio devices for debugging
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const audioInputs = devices.filter(d => d.kind === 'audioinput');
                    console.log('🎤 Available microphones:', audioInputs.map(d => d.label || d.deviceId));
                    console.log('🎤 Using:', stream.getAudioTracks()[0].label);

                    // Create MediaRecorder with explicit options
                    const options = { mimeType: 'audio/webm' };
                    this.mediaRecorder = new MediaRecorder(stream, options);
                    this.audioChunks = [];
                    this.recordingStartTime = Date.now();

                    // Collect audio data - this fires multiple times during recording
                    this.mediaRecorder.addEventListener('dataavailable', (event) => {
                        if (event.data.size > 0) {
                            console.log('🎤 Audio chunk received:', event.data.size, 'bytes');
                            this.audioChunks.push(event.data);
                        }
                    });

                    // Handle recording stop
                    this.mediaRecorder.addEventListener('stop', async () => {
                        console.log('🎤 Recording stopped, total chunks:', this.audioChunks.length);

                        // Small delay to ensure all data is collected
                        await new Promise(resolve => setTimeout(resolve, 100));

                        // Process the audio
                        await this.transcribeAudio();

                        // Stop all tracks to release microphone
                        if (this.audioStream) {
                            this.audioStream.getTracks().forEach(track => track.stop());
                            this.audioStream = null;
                        }

                        // Close audio context
                        if (audioContext.state !== 'closed') {
                            audioContext.close();
                        }
                    });

                    // Start recording - collect data every 100ms to ensure we capture everything
                    this.mediaRecorder.start(100);
                    this.isRecording = true;

                    console.log('🎤 Recording started');

                    // Session 189: Update UI based on source (tab or sidebar)
                    const voiceBtnId = this.voiceSource === 'tab' ? 'tabAssistantVoice' : 'aiAssistantVoice';
                    const voiceStatusId = this.voiceSource === 'tab' ? 'tabVoiceStatus' : 'voiceStatus';

                    const voiceBtn = document.getElementById(voiceBtnId);
                    if (voiceBtn) {
                        voiceBtn.innerHTML = '🔴';
                        voiceBtn.classList.add('btn-danger');
                        voiceBtn.classList.remove('btn-outline-light');
                    }

                    const voiceStatus = document.getElementById(voiceStatusId);
                    if (voiceStatus) {
                        voiceStatus.textContent = '🎤 Recording... ';
                        voiceStatus.style.color = '#ef4444';
                    }

                    // Also update sidebar status if using tab
                    const sidebarStatus = document.getElementById('voiceStatus');
                    const separator = document.getElementById('voiceStatusSeparator');
                    if (sidebarStatus) {
                        sidebarStatus.textContent = '🎤 Recording...';
                        sidebarStatus.style.color = '#ef4444';
                    }
                    if (separator) separator.style.display = 'inline';

                } catch (error) {
                    console.error('Error starting recording:', error);
                    alert('Could not access microphone. Please check permissions.');
                }
            }

            stopRecording() {
                if (this.mediaRecorder && this.isRecording) {
                    // Check minimum recording duration
                    const duration = Date.now() - this.recordingStartTime;
                    console.log('🎤 Recording duration:', duration, 'ms');

                    if (duration < 500) {
                        alert('Recording too short! Please speak for at least 1 second.');
                        // Continue recording
                        return;
                    }

                    // Request any remaining data before stopping
                    if (this.mediaRecorder.state === 'recording') {
                        this.mediaRecorder.requestData();
                    }

                    this.mediaRecorder.stop();
                    this.isRecording = false;

                    // Session 189: Update UI based on source (tab or sidebar)
                    const voiceBtnId = this.voiceSource === 'tab' ? 'tabAssistantVoice' : 'aiAssistantVoice';
                    const voiceStatusId = this.voiceSource === 'tab' ? 'tabVoiceStatus' : 'voiceStatus';

                    const voiceBtn = document.getElementById(voiceBtnId);
                    if (voiceBtn) {
                        voiceBtn.innerHTML = '🎤';
                        voiceBtn.classList.remove('btn-danger');
                        voiceBtn.classList.add('btn-outline-light');
                    }

                    const voiceStatus = document.getElementById(voiceStatusId);
                    if (voiceStatus) {
                        voiceStatus.textContent = '⚡ Transcribing... ';
                        voiceStatus.style.color = '#fbbf24';
                    }

                    // Also update sidebar UI
                    const sidebarBtn = document.getElementById('aiAssistantVoice');
                    if (sidebarBtn && this.voiceSource === 'tab') {
                        sidebarBtn.innerHTML = '🎤';
                        sidebarBtn.classList.remove('btn-danger');
                        sidebarBtn.classList.add('btn-outline-light');
                    }

                    const sidebarStatus = document.getElementById('voiceStatus');
                    const separator = document.getElementById('voiceStatusSeparator');
                    if (sidebarStatus) {
                        sidebarStatus.textContent = '⚡ Transcribing...';
                        sidebarStatus.style.color = '#fbbf24';
                    }
                }
            }

            async transcribeAudio() {
                try {
                    // Create audio blob from all chunks
                    const audioBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
                    console.log('🎤 Audio blob created:', audioBlob.size, 'bytes from', this.audioChunks.length, 'chunks');

                    if (audioBlob.size === 0) {
                        throw new Error('No audio data recorded');
                    }

                    // Create FormData
                    const formData = new FormData();
                    formData.append('audio', audioBlob, 'recording.webm');

                    console.log('🎤 Sending to Whisper...');

                    // Send to backend
                    const response = await authenticatedFetch('/api/assistant/transcribe/', {
                        method: 'POST',
                        body: formData,
                        // Don't set Content-Type header - let browser set it with boundary for FormData
                        headers: undefined
                    });

                    const data = await response.json();

                    console.log('🎤 Whisper response:', data);

                    if (data.text) {
                        console.log('✅ Transcribed text:', data.text);

                        // Session 189: Fill the correct input based on source and AUTO-SEND
                        const inputId = this.voiceSource === 'tab' ? 'tabAssistantInput' : 'aiAssistantInput';
                        const voiceStatusId = this.voiceSource === 'tab' ? 'tabVoiceStatus' : 'voiceStatus';

                        const input = document.getElementById(inputId);
                        if (input) {
                            input.value = data.text;
                        }

                        // Update status
                        const voiceStatus = document.getElementById(voiceStatusId);
                        if (voiceStatus) {
                            voiceStatus.textContent = '✅ Sending... ';
                            voiceStatus.style.color = '#22c55e';
                        }

                        // Also update sidebar status
                        const sidebarStatus = document.getElementById('voiceStatus');
                        const separator = document.getElementById('voiceStatusSeparator');
                        if (sidebarStatus) {
                            sidebarStatus.textContent = '✅ Sending...';
                            sidebarStatus.style.color = '#22c55e';
                        }

                        // Clear status after 3 seconds
                        setTimeout(() => {
                            if (voiceStatus) voiceStatus.textContent = '';
                            if (sidebarStatus) sidebarStatus.textContent = '';
                            if (separator) separator.style.display = 'none';
                        }, 3000);

                        // Session 189: AUTO-SEND the transcribed message (like project assistant does)
                        console.log('🚀 Auto-sending transcribed message...');
                        await this.sendMessage(this.voiceSource);

                    } else {
                        throw new Error(data.error || 'Transcription failed');
                    }

                } catch (error) {
                    console.error('Error transcribing audio:', error);

                    const voiceStatusId = this.voiceSource === 'tab' ? 'tabVoiceStatus' : 'voiceStatus';
                    const voiceStatus = document.getElementById(voiceStatusId);
                    const sidebarStatus = document.getElementById('voiceStatus');
                    const separator = document.getElementById('voiceStatusSeparator');

                    if (voiceStatus) {
                        voiceStatus.textContent = '❌ Failed ';
                        voiceStatus.style.color = '#ef4444';
                    }
                    if (sidebarStatus) {
                        sidebarStatus.textContent = '❌ Transcription failed';
                        sidebarStatus.style.color = '#ef4444';
                    }

                    setTimeout(() => {
                        if (voiceStatus) voiceStatus.textContent = '';
                        if (sidebarStatus) sidebarStatus.textContent = '';
                        if (separator) separator.style.display = 'none';
                    }, 3000);
                }
            }

            // Session 64: Quick generation helpers
            quickGenerateImage(prompt) {
                console.log('🎨 Quick generating image:', prompt || '(opening tab for manual input)');

                // Switch to Images tab
                const imagesTab = document.getElementById('images-tab');
                if (imagesTab) imagesTab.click();

                // Wait for tab switch, then switch to Generate pill
                setTimeout(() => {
                    const generatePill = document.getElementById('generate-pill');
                    if (generatePill) generatePill.click();
                }, 100);

                // Wait a bit more, then fill prompt (if we have one)
                setTimeout(() => {
                    const promptField = document.getElementById('prompt');
                    if (promptField) {
                        if (prompt) {
                            promptField.value = prompt;
                            // Visual highlight
                            promptField.style.background = 'rgba(34, 197, 94, 0.2)';
                            setTimeout(() => {
                                promptField.style.background = '';
                            }, 2000);
                            console.log('✅ Image prompt filled!');
                        } else {
                            // No prompt - just focus the field for manual input
                            promptField.focus();
                            console.log('✅ Image tab opened - ready for input!');
                        }
                        promptField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 300);
            }

            quickGenerateVideo(prompt) {
                console.log('🎬 Quick generating video:', prompt);

                // Switch to Video tab
                const videoTab = document.getElementById('video-tab');
                if (videoTab) videoTab.click();

                // Wait for tab switch, then fill prompt
                setTimeout(() => {
                    // Look for text-to-video prompt field
                    const videoPromptField = document.getElementById('video_prompt');
                    if (videoPromptField) {
                        videoPromptField.value = prompt;
                        videoPromptField.scrollIntoView({ behavior: 'smooth', block: 'center' });

                        // Visual highlight
                        videoPromptField.style.background = 'rgba(34, 197, 94, 0.2)';
                        setTimeout(() => {
                            videoPromptField.style.background = '';
                        }, 2000);

                        console.log('✅ Video prompt filled!');
                    }
                }, 300);
            }

            quickGenerateAudio(prompt) {
                console.log('🎵 Quick generating audio:', prompt);

                // Switch to Audio tab
                const audioTab = document.getElementById('audio-tab');
                if (audioTab) audioTab.click();

                // Wait for tab switch, then fill prompt
                setTimeout(() => {
                    // Look for audio prompt field (usually text or voice text)
                    const audioPromptField = document.getElementById('audio_text') || document.getElementById('tts_text');
                    if (audioPromptField) {
                        audioPromptField.value = prompt;
                        audioPromptField.scrollIntoView({ behavior: 'smooth', block: 'center' });

                        // Visual highlight
                        audioPromptField.style.background = 'rgba(34, 197, 94, 0.2)';
                        setTimeout(() => {
                            audioPromptField.style.background = '';
                        }, 2000);

                        console.log('✅ Audio prompt filled!');
                    }
                }, 300);
            }
        }

        // Initialize AI Assistant when page loads
        let aiAssistant;
        window.addEventListener('DOMContentLoaded', () => {
            aiAssistant = new AIAssistant();
            window.aiAssistant = aiAssistant;  // Session 73: Make globally accessible for button onclick
            console.log('🤖 AI Assistant initialized!');

            // Session 97: Load projects into dropdown
            aiAssistant.loadProjects();
        });

        // ====================================================================
        // END AI ASSISTANT
        // ====================================================================

        // ====================================================================
        // PROMPT ASSISTANT (Session 53: Phase B)
        // ====================================================================

</script>
