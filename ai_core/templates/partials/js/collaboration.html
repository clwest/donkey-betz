<script>
        // SESSION 220 PHASE E: REAL-TIME COLLABORATION FUNCTIONS
        // ============================================================

        // Collaboration state
        let collabWebSocket = null;
        let activeCollabProject = null;
        let collabPresences = {};

        // Load the collaboration tab
        async function loadCollaborationTab() {
            await Promise.all([
                loadCollaborationProjects(),
                loadCollaborationInvitations(),
                loadCollaborationStats()
            ]);
        }

        // Load collaboration statistics
        async function loadCollaborationStats() {
            try {
                const response = await fetch('/api/projects/shared/', {
                    headers: { 'X-CSRFToken': getCsrfToken() }
                });
                if (response.ok) {
                    const data = await response.json();
                    const projects = data.projects || [];
                    document.getElementById('collab-projects-count').textContent = projects.length;

                    // Count collaborators
                    let totalCollaborators = 0;
                    projects.forEach(p => {
                        totalCollaborators += (p.collaborators_count || 0);
                    });
                    document.getElementById('collab-collaborators-count').textContent = totalCollaborators;
                }
            } catch (error) {
                console.error('Error loading collab stats:', error);
            }
        }

        // Load user's shared projects
        async function loadCollaborationProjects() {
            const container = document.getElementById('collab-projects-list');
            try {
                const response = await fetch('/api/projects/shared/', {
                    headers: { 'X-CSRFToken': getCsrfToken() }
                });
                if (response.ok) {
                    const data = await response.json();
                    const projects = data.projects || [];

                    if (projects.length === 0) {
                        container.innerHTML = `
                            <div class="text-center py-4">
                                <p class="text-muted">No shared projects yet. Create one above!</p>
                            </div>
                        `;
                        return;
                    }

                    container.innerHTML = projects.map(p => renderCollabProject(p)).join('');
                } else {
                    container.innerHTML = '<p class="text-danger">Error loading projects</p>';
                }
            } catch (error) {
                console.error('Error loading projects:', error);
                container.innerHTML = '<p class="text-danger">Error loading projects</p>';
            }
        }

        // Render a single collaboration project card
        function renderCollabProject(project) {
            const statusColors = {
                'active': '#22c55e',
                'paused': '#f59e0b',
                'archived': '#6b7280'
            };
            const color = statusColors[project.status] || '#6b7280';
            const isOwner = project.is_owner;

            return `
                <div class="card mb-2" style="background: rgba(255,255,255,0.03); border: 1px solid ${color}40;">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h6 class="mb-1" style="color: white;">${project.name}</h6>
                                <small class="text-muted">${project.description || 'No description'}</small>
                            </div>
                            <span class="badge" style="background: ${color}30; color: ${color};">${project.status}</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <small class="text-muted">
                                ${isOwner ? '<span style="color: #fbbf24;">👑 Owner</span>' : `<span style="color: #60a5fa;">👤 ${project.role}</span>`}
                                • ${project.collaborators_count || 0} collaborators
                            </small>
                            <div>
                                <button class="btn btn-sm btn-outline-success" onclick="joinProjectWorkspace('${project.id}', '${project.name}')">
                                    🚀 Open
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Load pending invitations
        async function loadCollaborationInvitations() {
            const container = document.getElementById('collab-invitations-list');
            try {
                const response = await fetch('/api/projects/shared/invitations/', {
                    headers: { 'X-CSRFToken': getCsrfToken() }
                });
                if (response.ok) {
                    const data = await response.json();
                    const invitations = data.invitations || [];
                    document.getElementById('collab-invites-count').textContent = invitations.length;

                    if (invitations.length === 0) {
                        container.innerHTML = '<p class="text-muted small">No pending invitations</p>';
                        return;
                    }

                    container.innerHTML = invitations.map(inv => `
                        <div class="d-flex justify-content-between align-items-center mb-2 p-2 rounded" style="background: rgba(251, 191, 36, 0.1);">
                            <div>
                                <small style="color: white;">${inv.project_name}</small><br>
                                <small class="text-muted">From: ${inv.invited_by}</small>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-success me-1" onclick="acceptInvitation('${inv.id}')">✓</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="declineInvitation('${inv.id}')">✗</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Error loading invitations:', error);
            }
        }

        // Create a new shared project
        async function createSharedProject() {
            const name = document.getElementById('collab-new-project-name').value.trim();
            const description = document.getElementById('collab-new-project-desc').value.trim();
            const visibility = document.getElementById('collab-new-project-visibility').value;

            if (!name) {
                alert('Please enter a project name');
                return;
            }

            try {
                const response = await fetch('/api/projects/shared/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({ name, description, visibility })
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('collab-new-project-name').value = '';
                    document.getElementById('collab-new-project-desc').value = '';
                    await loadCollaborationProjects();
                    await loadCollaborationStats();
                    showToast('success', 'Project created successfully!');
                } else {
                    const err = await response.json();
                    showToast('error', err.error || 'Failed to create project');
                }
            } catch (error) {
                console.error('Error creating project:', error);
                showToast('error', 'Error creating project');
            }
        }

        // Join a project workspace (connect WebSocket)
        function joinProjectWorkspace(projectId, projectName) {
            // Show the workspace UI
            document.getElementById('collab-active-workspace').style.display = 'block';
            document.getElementById('collab-active-project-name').textContent = projectName;
            activeCollabProject = { id: projectId, name: projectName };

            // Connect WebSocket
            connectCollabWebSocket(projectId);
        }

        // Leave project workspace
        function leaveProjectWorkspace() {
            if (collabWebSocket) {
                collabWebSocket.close();
                collabWebSocket = null;
            }
            document.getElementById('collab-active-workspace').style.display = 'none';
            activeCollabProject = null;
            collabPresences = {};
            document.getElementById('collab-presence-avatars').innerHTML = '';
            document.getElementById('collab-activity-feed').innerHTML = '<p class="text-muted small">Activity will appear here...</p>';
        }

        // Connect to collaboration WebSocket
        function connectCollabWebSocket(projectId) {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/collaboration/${projectId}/`;

            if (collabWebSocket) {
                collabWebSocket.close();
            }

            collabWebSocket = new WebSocket(wsUrl);

            collabWebSocket.onopen = function() {
                console.log('Collaboration WebSocket connected');
                showToast('success', 'Connected to project');
            };

            collabWebSocket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleCollabMessage(data);
            };

            collabWebSocket.onclose = function() {
                console.log('Collaboration WebSocket disconnected');
            };

            collabWebSocket.onerror = function(error) {
                console.error('Collaboration WebSocket error:', error);
                showToast('error', 'Connection error');
            };

            // Start ping interval
            setInterval(() => {
                if (collabWebSocket && collabWebSocket.readyState === WebSocket.OPEN) {
                    collabWebSocket.send(JSON.stringify({ type: 'ping' }));
                }
            }, 30000);
        }

        // Handle incoming collaboration messages
        function handleCollabMessage(data) {
            switch(data.type) {
                case 'initial_state':
                    collabPresences = {};
                    (data.presences || []).forEach(p => {
                        collabPresences[p.user_id] = p;
                    });
                    renderPresenceAvatars();
                    if (data.project) {
                        renderProjectContent(data.project);
                    }
                    break;

                case 'presence:update':
                    if (data.action === 'joined') {
                        collabPresences[data.user.id] = data.user;
                        addActivityItem(`${data.user.username} joined the project`);
                    } else if (data.action === 'left') {
                        delete collabPresences[data.user.id];
                        addActivityItem(`${data.user.username} left the project`);
                    }
                    renderPresenceAvatars();
                    break;

                case 'presences':
                    collabPresences = {};
                    (data.presences || []).forEach(p => {
                        collabPresences[p.user_id] = p;
                    });
                    renderPresenceAvatars();
                    break;

                case 'content:update':
                    addActivityItem(`${data.username} ${data.operation}d content`);
                    // Could update specific content here
                    break;

                case 'cursor:move':
                    // Could show cursor position
                    break;

                case 'comment:add':
                    addActivityItem(`${data.comment.username} added a comment`);
                    break;

                case 'pong':
                    // Keep-alive response
                    break;

                case 'error':
                    showToast('error', data.message);
                    break;
            }
        }

        // Render presence avatars
        function renderPresenceAvatars() {
            const container = document.getElementById('collab-presence-avatars');
            const presenceList = Object.values(collabPresences);
            document.getElementById('collab-active-count').textContent = presenceList.length;

            if (presenceList.length === 0) {
                container.innerHTML = '<span class="text-muted small">No one else online</span>';
                return;
            }

            container.innerHTML = presenceList.map(p => `
                <div class="d-flex align-items-center" title="${p.username}" style="background: ${p.color}30; border: 2px solid ${p.color}; border-radius: 20px; padding: 4px 10px;">
                    <span style="width: 8px; height: 8px; background: ${p.color}; border-radius: 50%; margin-right: 6px;"></span>
                    <small style="color: white;">${p.username}</small>
                </div>
            `).join('');

            // Also update sidebar
            const sidebarContainer = document.getElementById('collab-online-users');
            if (sidebarContainer && presenceList.length > 0) {
                sidebarContainer.innerHTML = presenceList.map(p => `
                    <div class="d-flex align-items-center mb-2">
                        <span style="width: 10px; height: 10px; background: ${p.color}; border-radius: 50%; margin-right: 8px;"></span>
                        <small style="color: white;">${p.username}</small>
                        <small class="ms-auto text-muted">${p.status || 'viewing'}</small>
                    </div>
                `).join('');
            }
        }

        // Render project content
        function renderProjectContent(project) {
            const container = document.getElementById('collab-content-area');
            const content = project.content || {};
            const items = content.items || [];

            if (items.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">Project content will sync here in real-time</p>';
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="p-2 mb-2 rounded" style="background: rgba(255,255,255,0.05);">
                    ${JSON.stringify(item)}
                </div>
            `).join('');
        }

        // Add activity item to feed
        function addActivityItem(text) {
            const feed = document.getElementById('collab-activity-feed');
            const time = new Date().toLocaleTimeString();
            const item = document.createElement('div');
            item.className = 'small mb-1';
            item.style.color = '#9ca3af';
            item.innerHTML = `<span style="color: #6b7280;">${time}</span> - ${text}`;
            feed.insertBefore(item, feed.firstChild);

            // Limit to 20 items
            while (feed.children.length > 20) {
                feed.removeChild(feed.lastChild);
            }
        }

        // Accept invitation
        async function acceptInvitation(invitationId) {
            try {
                const response = await fetch(`/api/projects/shared/invitations/${invitationId}/accept/`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCsrfToken() }
                });
                if (response.ok) {
                    await loadCollaborationInvitations();
                    await loadCollaborationProjects();
                    showToast('success', 'Invitation accepted!');
                }
            } catch (error) {
                console.error('Error accepting invitation:', error);
            }
        }

        // Decline invitation
        async function declineInvitation(invitationId) {
            try {
                const response = await fetch(`/api/projects/shared/invitations/${invitationId}/decline/`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': getCsrfToken() }
                });
                if (response.ok) {
                    await loadCollaborationInvitations();
                    showToast('success', 'Invitation declined');
                }
            } catch (error) {
                console.error('Error declining invitation:', error);
            }
        }

        // Invite a collaborator
        function inviteCollaborator() {
            if (!activeCollabProject) {
                showToast('error', 'No project selected');
                return;
            }

            const email = prompt('Enter email address to invite:');
            if (!email) return;

            const role = prompt('Enter role (viewer, editor, admin):', 'editor');
            if (!role) return;

            fetch(`/api/projects/shared/${activeCollabProject.id}/invite/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfToken()
                },
                body: JSON.stringify({ email, role })
            }).then(response => {
                if (response.ok) {
                    showToast('success', `Invitation sent to ${email}`);
                } else {
                    return response.json().then(err => {
                        showToast('error', err.error || 'Failed to send invitation');
                    });
                }
            }).catch(error => {
                console.error('Error inviting:', error);
                showToast('error', 'Error sending invitation');
            });
        }

        // Show collaboration tutorial
        function showCollabTutorial() {
            alert('Real-Time Collaboration Guide:\n\n1. Create a shared project using the form above\n2. Click "Open" to join the workspace\n3. Invite collaborators using their email\n4. See who\'s online with presence indicators\n5. All changes sync in real-time!');
        }

        // Export collaboration project
        function exportCollabProject() {
            if (!activeCollabProject) {
                showToast('error', 'No project selected');
                return;
            }
            showToast('info', 'Export feature coming soon!');
        }

        // Share project link
        function shareProjectLink() {
            if (!activeCollabProject) {
                showToast('error', 'No project selected');
                return;
            }
            const link = `${window.location.origin}/ai-studio/?project=${activeCollabProject.id}`;
            navigator.clipboard.writeText(link).then(() => {
                showToast('success', 'Link copied to clipboard!');
            }).catch(() => {
                showToast('info', `Project link: ${link}`);
            });
        }

        // ============================================================
        // END SESSION 220: REAL-TIME COLLABORATION FUNCTIONS
</script>
