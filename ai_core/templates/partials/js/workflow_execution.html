<script>
        // SESSION 62: PHASE C.4 - WORKFLOW EXECUTION FROM PROJECTS
        // ====================================================================

        /**
         * Create and execute a new workflow for a project
         * This allows "working from a clean slate" - create fresh workflows within project context
         */
        async function createNewWorkflowForProject(projectId) {
            const project = projectManagement.projects.find(p => p.id === projectId);
            if (!project) return;

            // Show workflow selection modal
            const workflowTypes = [
                { id: 'logo-creator', name: '🎨 Logo Creator', desc: 'Design professional logos' },
                { id: 'portrait-enhancer', name: '👤 Portrait Enhancer', desc: 'Professional portrait generation' },
                { id: 'style-explorer', name: '🖌️ Style Explorer', desc: 'Try multiple artistic styles' },
                { id: 'social-media-pack', name: '📱 Social Media Pack', desc: 'Platform-optimized content' },
                { id: 'product-mockup', name: '📦 Product Mockup', desc: 'Product visualization' },
                { id: 'creative-upscale', name: '⬆️ Creative Upscale', desc: 'AI-powered upscaling' }
            ];

            const html = `
                <div class="modal fade" id="create-workflow-modal" tabindex="-1">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content" style="background: #1a1a1a; border: 2px solid #fbbf24;">
                            <div class="modal-header" style="border-color: rgba(251, 191, 36, 0.3);">
                                <h5 class="modal-title" style="color: #fbbf24;">✨ Create New Workflow for ${project.name}</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <p class="text-muted mb-3">Select a workflow type to create and execute:</p>
                                <div class="row g-3">
                                    ${workflowTypes.map(wf => `
                                        <div class="col-md-6">
                                            <div class="card" onclick="executeNewWorkflow('${projectId}', '${wf.id}')"
                                                 style="cursor: pointer; background: #222; border: 1px solid #444; transition: all 0.2s;">
                                                <div class="card-body">
                                                    <h6 style="color: #fbbf24;">${wf.name}</h6>
                                                    <p class="small text-muted mb-0">${wf.desc}</p>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Remove existing modal if present
            document.getElementById('create-workflow-modal')?.remove();

            // Add modal to page
            document.body.insertAdjacentHTML('beforeend', html);

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('create-workflow-modal'));
            modal.show();
        }

        /**
         * Execute a new workflow of the selected type
         * Session 63: Complete in-project workflow execution with auto-fill
         */
        async function executeNewWorkflow(projectId, workflowType) {
            const project = projectManagement.projects.find(p => p.id === projectId);
            if (!project) return;

            // Close workflow selection modal properly
            const selectionModal = bootstrap.Modal.getInstance(document.getElementById('create-workflow-modal'));
            if (selectionModal) {
                selectionModal.hide();
                document.querySelectorAll('.modal-backdrop').forEach(el => el.remove());
                document.body.classList.remove('modal-open');
                document.body.style.removeProperty('overflow');
                document.body.style.removeProperty('padding-right');
            }

            // Wait for modal to close
            await new Promise(resolve => setTimeout(resolve, 200));

            // Build workflow execution modal with form
            showWorkflowExecutionModal(project, workflowType);
        }

        /**
         * Session 63: Show complete workflow execution modal with auto-filled form
         */
        function showWorkflowExecutionModal(project, workflowType) {
            const workflowNames = {
                'logo-creator': '🎨 Logo Creator',
                'portrait-enhancer': '👤 Portrait Enhancer',
                'style-explorer': '🖌️ Style Explorer',
                'social-media-pack': '📱 Social Media Pack',
                'product-mockup': '📦 Product Mockup',
                'creative-upscale': '⬆️ Creative Upscale'
            };

            // Auto-fill logic based on project context
            const autoFill = extractProjectContext(project, workflowType);

            // Build workflow-specific form
            const formHTML = buildWorkflowForm(workflowType, autoFill);

            const modalHTML = `
                <div class="modal fade" id="workflow-execution-modal" tabindex="-1" data-bs-backdrop="static">
                    <div class="modal-dialog modal-xl">
                        <div class="modal-content" style="background: #1a1a1a; border: 2px solid #fbbf24;">
                            <div class="modal-header" style="border-color: rgba(251, 191, 36, 0.3);">
                                <h5 class="modal-title" style="color: #fbbf24;">${workflowNames[workflowType]} - ${project.name}</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <!-- Session 63: Vision-driven workflow - show Goal prominently -->
                                <div class="mb-4" style="background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(251, 191, 36, 0.05)); padding: 1.25rem; border-radius: 12px; border: 2px solid rgba(251, 191, 36, 0.4);">
                                    <div style="display: flex; align-items: start; gap: 1rem;">
                                        <div style="font-size: 2rem;">✨</div>
                                        <div style="flex: 1;">
                                            <h6 style="color: #fbbf24; margin-bottom: 0.5rem; font-weight: 600;">Your Vision Drives This Workflow:</h6>
                                            <p style="color: #fcd34d; margin: 0; font-size: 1.05rem; line-height: 1.5;">
                                                "${project.goal}"
                                            </p>
                                            <small class="text-muted d-block mt-2">
                                                💡 We'll translate your vision into perfect technical prompts for this workflow
                                            </small>
                                        </div>
                                    </div>
                                </div>

                                <div class="alert alert-info mb-3" style="background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.3);">
                                    <strong>✨ Form auto-filled from project!</strong><br>
                                    Review and adjust as needed, then click Generate.
                                </div>
                                ${formHTML}
                            </div>
                            <div class="modal-footer" style="border-color: rgba(251, 191, 36, 0.3);">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" class="btn btn-primary" onclick="executeWorkflowFromModal('${project.id}', '${workflowType}')" style="background: #fbbf24; color: #000;">
                                    ✨ Generate for Project
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // Remove existing modal if present
            document.getElementById('workflow-execution-modal')?.remove();

            // Add modal to page
            document.body.insertAdjacentHTML('beforeend', modalHTML);

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('workflow-execution-modal'));
            modal.show();

            // Session 63: Store project context for prompt generation
            window.currentProjectContext = project;

            // Session 63: Attach event listeners for prompt generation and improvement
            setTimeout(() => {
                // Generate prompt from form button
                document.getElementById('generate-logo-prompt-btn')?.addEventListener('click', () => {
                    generatePromptFromForm(workflowType);
                });

                // Improve prompt with AI button
                document.getElementById('improve-logo-prompt-btn')?.addEventListener('click', () => {
                    improveWorkflowPrompt(workflowType);
                });
            }, 100);
        }

        /**
         * Session 63: Generate prompt from workflow form fields
         * GOAL-DRIVEN: Vision comes FIRST, then workflow-specific details
         */
        function generatePromptFromForm(workflowType) {
            if (workflowType === 'logo-creator') {
                const parts = [];

                // Session 63: GOAL IS THE FOUNDATION - Put it FIRST!
                const projectGoal = window.currentProjectContext?.goal?.trim();
                if (projectGoal) {
                    parts.push(projectGoal);  // This drives everything!
                }

                // Then add workflow-specific context
                const businessName = document.getElementById('modal-logoBusinessName')?.value.trim() || '';
                if (businessName) parts.push(businessName);

                parts.push('logo design');

                const industry = document.getElementById('modal-logoIndustry')?.value || '';
                if (industry) parts.push(industry);

                const colors = document.getElementById('modal-logoColors')?.value.trim() || '';
                if (colors) parts.push(`color scheme: ${colors}`);

                // Additional project context
                const projectDescription = window.currentProjectContext?.description?.trim();
                if (projectDescription) {
                    parts.push(projectDescription);
                }

                const details = document.getElementById('modal-logoAdditionalDetails')?.value.trim() || '';
                if (details) parts.push(details);

                // Session 64: User-selected logo style (replaces hardcoded vector terms)
                const logoStyle = document.getElementById('modal-logoStyle')?.value || 'character-mascot';
                const styleMap = {
                    'character-mascot': 'cool cartoon character mascot standing upright, anthropomorphic, DreamWorks animation style, expressive, detailed illustration, cinematic lighting, 4K resolution, professional quality',
                    'vector': 'professional vector art, flat design, clean lines, minimalist, iconic symbol, modern, simple shapes',
                    'illustrative': 'hand-drawn illustration style, artistic, detailed linework, creative, sketch-like quality, unique character',
                    'minimalist': 'minimalist design, simple and clean, negative space, modern, geometric, essential elements only',
                    'badge': 'badge design, emblem style, traditional, detailed ornamental, crest, vintage feel, professional seal',
                    'geometric': 'geometric shapes, abstract patterns, angular design, modern, mathematical precision, structured'
                };
                parts.push(styleMap[logoStyle] || styleMap['character-mascot']);

                const prompt = parts.join(', ');
                document.getElementById('modal-logoPrompt').value = prompt;
            }
            // TODO: Add other workflow types here
        }

        /**
         * Session 63: Improve workflow prompt using AI (workflow-specific!)
         */
        async function improveWorkflowPrompt(workflowType) {
            const promptField = document.getElementById('modal-logoPrompt');
            const prompt = promptField?.value.trim();

            if (!prompt) {
                alert('Please generate or enter a prompt first!');
                return;
            }

            const spinner = document.getElementById('improve-logo-spinner');
            const btn = document.getElementById('improve-logo-prompt-btn');
            const originalHTML = btn.innerHTML;

            // Show loading
            spinner.style.display = 'inline-block';
            btn.disabled = true;
            btn.innerHTML = spinner.outerHTML + ' Improving...';

            try {
                // Session 63: Use workflow-specific improvement endpoint!
                // This uses the logo-specific GPT-5 system prompt with examples
                const response = await fetch('/api/workflows/improve-prompt/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        prompt: prompt,
                        workflow_type: workflowType.replace('-', '_')  // Convert logo-creator -> logo_creator
                    })
                });

                const data = await response.json();

                // Session 63: Backend returns improved_prompt directly (no success field)
                if (data.improved_prompt) {
                    const useIt = confirm(
                        `Original:\n"${prompt}"\n\n` +
                        `✨ Improved (with workflow-specific guidance):\n"${data.improved_prompt}"\n\n` +
                        `Use the improved version?`
                    );

                    if (useIt) {
                        promptField.value = data.improved_prompt;
                    }
                } else if (data.error) {
                    alert(`Error: ${data.error}`);
                } else {
                    alert('Sorry, could not improve prompt. Please try again.');
                }
            } catch (error) {
                console.error('Prompt improvement error:', error);
                alert('Error improving prompt: ' + error.message);
            } finally {
                // Reset button
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        }

        /**
         * Extract smart context from project for auto-fill
         */
        function extractProjectContext(project, workflowType) {
            const context = {
                name: project.name,
                description: project.description || '',
                goal: project.goal || '',
                category: project.category || '',
                colors: project.colors || '',  // Use explicit colors field from professional intake form
                tags: project.tags || []
            };

            // Infer industry from category or description
            context.industry = inferIndustry(context.category, context.description);

            // Infer style/mood from description
            context.style = inferStyle(context.description + ' ' + context.goal);

            return context;
        }

        /**
         * Infer industry from category and description
         */
        function inferIndustry(category, description) {
            const text = (category + ' ' + description).toLowerCase();

            if (text.includes('tech') || text.includes('software') || text.includes('startup')) return 'tech';
            if (text.includes('coffee') || text.includes('café') || text.includes('cafe')) return 'coffee';
            if (text.includes('fitness') || text.includes('gym') || text.includes('workout')) return 'fitness';
            if (text.includes('food') || text.includes('restaurant') || text.includes('dining')) return 'food';
            if (text.includes('finance') || text.includes('business') || text.includes('consulting')) return 'finance';
            if (text.includes('health') || text.includes('medical') || text.includes('clinic')) return 'health';
            if (text.includes('education') || text.includes('school') || text.includes('learning')) return 'education';
            if (text.includes('retail') || text.includes('shop') || text.includes('store')) return 'retail';
            if (text.includes('creative') || text.includes('art') || text.includes('design')) return 'creative';
            if (text.includes('construction') || text.includes('contractor')) return 'construction';

            return '';
        }

        /**
         * Infer style/mood from description
         */
        function inferStyle(text) {
            text = text.toLowerCase();

            if (text.includes('modern') || text.includes('minimalist') || text.includes('clean')) return 'modern and minimalist';
            if (text.includes('professional') || text.includes('corporate') || text.includes('business')) return 'professional and polished';
            if (text.includes('playful') || text.includes('fun') || text.includes('friendly')) return 'playful and approachable';
            if (text.includes('luxury') || text.includes('premium') || text.includes('elegant')) return 'elegant and sophisticated';
            if (text.includes('bold') || text.includes('energetic') || text.includes('dynamic')) return 'bold and energetic';

            return '';
        }

                        <div style="margin-bottom: 1rem;">

                        </div>
                        <div style="margin-bottom: 1rem; padding: 1rem; background: rgba(139, 92, 246, 0.1); border: 2px solid rgba(139, 92, 246, 0.3); border-radius: 10px;">
                            <label style="${labelStyle}">💬 AI Prompt (You can edit this!):</label>
                            <textarea id="modal-logoPrompt" rows="3" placeholder="This will auto-generate from your inputs above..." style="${formStyle} resize: vertical;"></textarea>
                            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                                <button type="button" class="btn btn-sm" id="generate-logo-prompt-btn"
                                        style="background: rgba(251, 191, 36, 0.2); border: 2px solid rgba(251, 191, 36, 0.5); color: #fbbf24; font-weight: 600;">
                                    🔄 Generate Prompt from Form
                                </button>
                                <button type="button" class="btn btn-sm" id="improve-logo-prompt-btn"
                                        style="background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(109, 40, 217, 0.2));
                                               border: 2px solid rgba(139, 92, 246, 0.5); color: #a78bfa; font-weight: 600;">
                                    <span id="improve-logo-spinner" class="spinner-border spinner-border-sm me-1" style="display: none;"></span>
                                    ✨ Improve with AI
                                </button>
                            </div>
                            <small class="text-muted d-block mt-2">💡 Tip: Click "Generate Prompt" to see what AI will create from your form, then edit or improve it!</small>
                        </div>
                    </div>
                `;
            }

            if (workflowType === 'portrait-enhancer') {
                return `
                    <div style="margin-bottom: 1.5rem;">

                        </div>
                        <div style="margin-bottom: 1rem;">
                            <label style="${labelStyle}">🎭 Style/Mood:</label>
                            <select id="modal-portraitStyle" style="${formStyle}">

            if (workflowType === 'social-media-pack') {
                return `
                    <div style="margin-bottom: 1.5rem;">

                            <label style="${labelStyle}">📱 Content Description:</label>

                    <div style="margin-bottom: 1.5rem;">

                        <div style="margin-bottom: 1rem;">
                            <label style="${labelStyle}">🎨 Product Colors:</label>
                            <input type="text" id="modal-productColors" value="${autoFill.colors}" placeholder="e.g., matte black, silver accents" style="${formStyle}">
                        </div>

                            <label style="${labelStyle}">🖼️ Context/Setting:</label>

        /**
         * Execute workflow from modal with project linking
         * Session 63: Core execution function with backend integration
         */
        async function executeWorkflowFromModal(projectId, workflowType) {
            try {
                // Close the execution modal
                const modal = bootstrap.Modal.getInstance(document.getElementById('workflow-execution-modal'));
                if (modal) {
                    modal.hide();
                }

                // Show generating notification
                showNotification('🎨 Generating assets for project...', 'info', 3000);

                // Collect form data based on workflow type
                const formData = collectWorkflowFormData(workflowType);

                if (!formData) {
                    showNotification('Please fill in required fields', 'danger');
                    return;
                }

                // Call backend to execute workflow
                const response = await fetch('/api/workflows/execute-for-project/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        project_id: projectId,
                        workflow_type: workflowType,
                        form_data: formData
                    })
                });

                // Session 63: Better error handling - check response status first
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Backend error response:', errorText);
                    try {
                        const errorJson = JSON.parse(errorText);
                        showNotification(errorJson.error || 'Server error occurred', 'danger');
                    } catch (e) {
                        showNotification(`Server error (${response.status}): ${errorText.substring(0, 100)}`, 'danger');
                    }
                    return;
                }

                const result = await response.json();

                if (result.success) {
                    showNotification(`✅ ${result.count || 0} assets generated and linked to project!`, 'success', 5000);

                    // Refresh project details to show new assets
                    await viewProjectDetails(projectId);
                } else {
                    showNotification(result.error || 'Failed to execute workflow', 'danger');
                }

            } catch (error) {
                console.error('Error executing workflow:', error);
                showNotification('Error executing workflow', 'danger');
            }
        }

        /**
         * Re-execute an existing workflow from project
         */
        async function executeWorkflowFromProject(projectId, workflowHistoryId) {
            const project = projectManagement.projects.find(p => p.id === projectId);
            if (!project) return;

            try {
                // Fetch workflow history details
                const response = await fetch(`/api/workflows/history/?limit=1000`);
                const data = await response.json();
                const workflow = data.workflows.find(w => w.id === workflowHistoryId);

                if (!workflow) {
                    showNotification('Workflow not found', 'danger');
                    return;
                }

                // Show executing state
                const workflowElem = document.getElementById(`workflow-${workflowHistoryId}`);
                if (workflowElem) {
                    workflowElem.style.opacity = '0.6';
                    workflowElem.innerHTML += '<div class="text-center mt-2"><div class="spinner-border spinner-border-sm text-warning"></div> Executing...</div>';
                }

                // Re-execute the workflow
                const config = workflow.workflow_config;
                const results = [];

                for (let i = 0; i < config.steps.length; i++) {
                    const step = config.steps[i];

                    // Call workflow execution endpoint
                    const stepResponse = await fetch('/api/workflows/execute/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify({
                            workflow_type: workflow.workflow_type,
                            step: step,
                            previous_results: results
                        })
                    });

                    const stepData = await stepResponse.json();
                    if (stepData.success && stepData.result) {
                        results.push(stepData.result);
                    }
                }

                // Refresh project details
                await viewProjectDetails(projectId);

                showNotification(`Workflow "${workflow.workflow_name}" re-executed successfully!`, 'success');

            } catch (error) {
                console.error('Error executing workflow:', error);
                showNotification('Error executing workflow: ' + error.message, 'danger');

                // Restore workflow element
                const workflowElem = document.getElementById(`workflow-${workflowHistoryId}`);
                if (workflowElem) {
                    workflowElem.style.opacity = '1';
                }
            }
        }

        /**
         * Execute all workflows in the project sequentially
         */
        async function executeAllWorkflows(projectId) {
            const project = projectManagement.projects.find(p => p.id === projectId);
            if (!project || !project.workflows || project.workflows.length === 0) return;

            if (!confirm(`Execute all ${project.workflows.length} workflows in sequence? This may take several minutes.`)) {
                return;
            }

            showNotification('Starting sequential workflow execution...', 'info');

            let successCount = 0;
            let failCount = 0;

            for (const wf of project.workflows) {
                try {
                    await executeWorkflowFromProject(projectId, wf.workflow_history_id);
                    successCount++;
                } catch (error) {
                    console.error(`Failed to execute workflow ${wf.workflow_name}:`, error);
                    failCount++;
                }
            }

            showNotification(`Completed! ${successCount} successful, ${failCount} failed.`, successCount > 0 ? 'success' : 'warning');

            // Refresh project
            await viewProjectDetails(projectId);
        }

                        <audio src="${item.content_url}" controls autoplay style="width: 400px; max-width: 100%;"></audio>
                    </div>
                `;
            }

            modal.innerHTML = `
                <div id="${modalId}-content" style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; cursor: pointer;">
                    ${mediaHTML}
                </div>
                <div style="background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 20px; border-radius: 12px; max-width: 800px; width: 100%; margin-top: 20px;">
                    <div style="color: white; margin-bottom: 10px;">
                        <strong>Type:</strong> ${item.operation_type || itemType}
                        ${item.model ? `<span style="margin-left: 20px;"><strong>Model:</strong> ${item.model}</span>` : ''}
                    </div>
                    <div style="color: #ccc; margin-bottom: 15px; font-style: italic;">
                        ${item.prompt || 'No description available'}
                    </div>
                    <button id="${modalId}-download" class="btn btn-primary" style="margin-right: 10px;">
                        <i class="bi bi-download"></i> Download
                    </button>
                    <button id="${modalId}-close" class="btn btn-secondary">
                        <i class="bi bi-x-lg"></i> Close
                    </button>
                </div>
            `;

            // Add event listeners after appending
            document.body.appendChild(modal);

            // Click media area to close
            document.getElementById(modalId + '-content').addEventListener('click', () => modal.remove());

            // Download button (Session 62: Fixed to actually download)
            document.getElementById(modalId + '-download').addEventListener('click', async () => {
                try {
                    // Fetch the content
                    const response = await fetch(item.content_url);
                    const blob = await response.blob();

                    // Create download link
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;

                    // Generate filename from item
                    const extension = item.type === 'image' ? 'png' :
                                    item.type === 'video' ? 'mp4' : 'mp3';
                    const timestamp = new Date(item.created_at).toISOString().split('T')[0];
                    a.download = `${item.operation_type || item.type}-${timestamp}.${extension}`;

                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    showNotification('Download started!', 'success');
                } catch (error) {
                    console.error('Download error:', error);
                    // Fallback to opening in new tab if download fails
                    window.open(item.content_url, '_blank');
                    showNotification('Opening in new tab (direct download failed)', 'info');
                }
            });

            // Close button
            document.getElementById(modalId + '-close').addEventListener('click', () => modal.remove());
        }

        // Session 206: Populate Trends Chart
        function populateTrendsChart(trends) {
            const container = document.getElementById('trends-bars');

            if (trends.length > 0) {
                const maxCount = Math.max(...trends.map(t => t.count), 1);

                container.innerHTML = trends.map(trend => {
                    const height = Math.max(10, (trend.count / maxCount) * 150);
                    // Session 218: Fix timezone issue - parse date parts directly to avoid UTC shift
                    // When parsing "2025-11-27" as Date, JS treats it as midnight UTC
                    // In MST (UTC-7), that shows as Nov 26, which is wrong
                    const [year, month, dayNum] = trend.date.split('-').map(Number);
                    const day = new Date(year, month - 1, dayNum).toLocaleDateString('en-US', { weekday: 'short' });
                    return `
                        <div class="text-center" style="flex: 1;">
                            <div style="background: linear-gradient(135deg, #06b6d4, #0891b2); width: 30px; height: ${height}px; margin: 0 auto; border-radius: 4px 4px 0 0;"></div>
                            <div class="text-muted small mt-1">${day}</div>
                            <div class="text-light small">${trend.count}</div>
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = '<p class="text-muted text-center">No trend data available</p>';
            }
        }

        // Session 209: Run ALL Active Spiders in batches (no individual toasts)
        async function runAllActiveSpiders() {
            const batchSize = 10;  // Run 10 at a time in parallel

            try {
                // Get all active spiders
                const response = await fetch('/api/spider-dashboard/network/', {
                    headers: { 'X-CSRFToken': getCsrfToken() }
                });
                const data = await response.json();

                const activeSpiders = (data.spiders || []).filter(s => s.status === 'Active');
                const totalSpiders = activeSpiders.length;

                if (totalSpiders === 0) {
                    showToast('⚠️ No active spiders to run', 'warning');
                    return;
                }

                if (!confirm(`Run all ${totalSpiders} active spiders in batches of ${batchSize}?`)) return;

                let completed = 0;
                let failed = 0;
                let batchNum = 0;
                const totalBatches = Math.ceil(totalSpiders / batchSize);

                // Process in batches
                for (let i = 0; i < activeSpiders.length; i += batchSize) {
                    batchNum++;
                    const batch = activeSpiders.slice(i, i + batchSize);

                    // Show batch progress
                    showToast(`🕷️ Running batch ${batchNum}/${totalBatches} (${batch.length} spiders)...`, 'info');

                    // Run batch in parallel
                    const results = await Promise.allSettled(
                        batch.map(spider => executeSpiderSilent(spider.id, spider.name))
                    );

                    // Count results
                    results.forEach((result, idx) => {
                        if (result.status === 'fulfilled') {
                            completed++;
                        } else {
                            failed++;
                            console.error(`Spider ${batch[idx].name} failed:`, result.reason);
                        }
                    });

                    // Small delay between batches to avoid overwhelming the server
                    if (i + batchSize < activeSpiders.length) {
                        await new Promise(resolve => setTimeout(resolve, 500));
                    }
                }

                // Final summary toast
                if (failed === 0) {
                    showToast(`✅ All ${completed} spiders completed successfully!`, 'success');
                } else {
                    showToast(`⚠️ ${completed} succeeded, ${failed} failed`, 'warning');
                }

                // Refresh data
                await loadSpiderNetwork();
                await loadSpiderIntelligence();

            } catch (error) {
                console.error('Error running all spiders:', error);
                showToast('❌ Failed to run spiders: ' + error.message, 'error');
            }
        }
