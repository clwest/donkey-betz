<script>
        // SESSION 60: PHASE C.1.3 - PROJECT MANAGEMENT SYSTEM
        // ====================================================================

        // Project Management State
        const projectManagement = {
            currentProject: null,
            projects: [],
            projectModal: null,
            detailModal: null
        };

        // Initialize Project Management
        function initProjectManagement() {
            // Initialize modals
            projectManagement.projectModal = new bootstrap.Modal(document.getElementById('project-modal'));
            projectManagement.detailModal = new bootstrap.Modal(document.getElementById('project-detail-modal'));

            // Event listeners
            document.getElementById('create-project-btn').addEventListener('click', () => {
                openProjectModal();
            });

            document.getElementById('save-project-btn').addEventListener('click', () => {
                saveProject();
            });

            document.getElementById('edit-project-btn').addEventListener('click', () => {
                const projectId = document.getElementById('edit-project-btn').dataset.projectId;
                const project = projectManagement.projects.find(p => p.id === projectId);
                if (project) {
                    projectManagement.detailModal.hide();
                    openProjectModal(project);
                }
            });

            // Load projects when Projects tab is shown
            document.getElementById('projects-tab').addEventListener('click', () => {
                loadProjects();
            });
        }

        // Open project modal (create or edit)
        function openProjectModal(project = null) {
            const form = document.getElementById('project-form');
            form.reset();

            if (project) {
                // Edit mode
                document.getElementById('project-modal-title').textContent = 'Edit Project';
                document.getElementById('project-id').value = project.id;
                document.getElementById('project-name').value = project.name;
                document.getElementById('project-goal').value = project.goal;
                document.getElementById('project-description').value = project.description || '';
                document.getElementById('project-category').value = project.category || '';
                document.getElementById('project-colors').value = project.colors || '';
                document.getElementById('project-status').value = project.status;
                document.getElementById('project-tags').value = Array.isArray(project.tags) ? project.tags.join(', ') : '';

                if (project.deadline) {
                    const deadline = new Date(project.deadline);
                    document.getElementById('project-deadline').value = deadline.toISOString().slice(0, 16);
                }
            } else {
                // Create mode
                document.getElementById('project-modal-title').textContent = 'Create New Project';
                document.getElementById('project-id').value = '';
                document.getElementById('project-status').value = 'planning';
            }

            projectManagement.projectModal.show();
        }

        // Save project (create or update)
        async function saveProject() {
            const projectId = document.getElementById('project-id').value;
            const name = document.getElementById('project-name').value.trim();
            const goal = document.getElementById('project-goal').value.trim();

            if (!name || !goal) {
                alert('Project name and goal are required!');
                return;
            }

            const tags = document.getElementById('project-tags').value
                .split(',')
                .map(t => t.trim())
                .filter(t => t.length > 0);

            const deadline = document.getElementById('project-deadline').value || null;

            const data = {
                name,
                goal,
                description: document.getElementById('project-description').value.trim(),
                category: document.getElementById('project-category').value.trim(),
                colors: document.getElementById('project-colors').value.trim(),
                status: document.getElementById('project-status').value,
                tags,
                deadline
            };

            const saveBtn = document.getElementById('save-project-btn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '⏳ Saving...';

            try {
                let url, method;
                if (projectId) {
                    // Update existing project
                    url = `/api/creative-projects/${projectId}/update/`;
                    method = 'PATCH';
                } else {
                    // Create new project
                    url = '/api/creative-projects/create/';
                    method = 'POST';
                }

                const response = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    projectManagement.projectModal.hide();
                    loadProjects();
                    showNotification(projectId ? 'Project updated successfully!' : 'Project created successfully!', 'success');
                } else {
                    showNotification(result.error || 'Failed to save project', 'danger');
                }
            } catch (error) {
                console.error('Error saving project:', error);
                showNotification('Error saving project', 'danger');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '💾 Save Project';
            }
        }

        // Load all projects
        async function loadProjects() {
            const container = document.getElementById('projects-list');
            container.innerHTML = `
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-warning" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 text-muted">Loading projects...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/creative-projects/', {
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                const data = await response.json();

                if (data.projects) {
                    projectManagement.projects = data.projects;
                    renderProjects(data.projects);
                } else {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <p class="text-danger">Error loading projects</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading projects:', error);
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <p class="text-danger">Error loading projects</p>
                    </div>
                `;
            }
        }

        // Render projects list
        function renderProjects(projects) {
            const container = document.getElementById('projects-list');

            if (projects.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <p class="text-muted">No projects yet. Create your first project!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = projects.map(project => {
                const statusEmoji = {
                    'planning': '📋',
                    'in_progress': '🚀',
                    'review': '👀',
                    'completed': '✅',
                    'archived': '📦'
                }[project.status] || '📋';

                const statusColor = {
                    'planning': '#6b7280',
                    'in_progress': '#3b82f6',
                    'review': '#f59e0b',
                    'completed': '#10b981',
                    'archived': '#6b7280'
                }[project.status] || '#6b7280';

                const progressColor = project.progress_percentage === 100 ? '#10b981' :
                                    project.progress_percentage >= 50 ? '#f59e0b' : '#ef4444';

                const deadline = project.deadline ? new Date(project.deadline).toLocaleDateString() : 'No deadline';
                const isOverdue = project.is_overdue ? '<span class="badge bg-danger ms-2">OVERDUE</span>' : '';

                return `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="card" style="background: #222; border: 1px solid #333; height: 100%;">
                            <div class="card-body">
                                <h5 class="card-title" style="color: #f59e0b;">
                                    ${statusEmoji} ${project.name}
                                </h5>
                                <p class="card-text text-muted small">${project.goal}</p>

                                <!-- Progress Bar -->
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <span class="small">Progress</span>
                                        <span class="small">${project.progress_percentage}%</span>
                                    </div>
                                    <div class="progress" style="height: 8px; background: #333;">
                                        <div class="progress-bar" role="progressbar"
                                             style="width: ${project.progress_percentage}%; background: ${progressColor};">
                                        </div>
                                    </div>
                                </div>

                                <!-- Project Info -->
                                <div class="small mb-3">
                                    <div class="d-flex justify-content-between mb-1">
                                        <span>Status:</span>
                                        <span style="color: ${statusColor};">${statusEmoji} ${project.status.replace('_', ' ').toUpperCase()}</span>
                                    </div>
                                    <div class="d-flex justify-content-between mb-1">
                                        <span>Workflows:</span>
                                        <span>${project.completed_workflows}/${project.total_workflows}</span>
                                    </div>
                                    <div class="d-flex justify-content-between mb-1">
                                        <span>Deadline:</span>
                                        <span>${deadline} ${isOverdue}</span>
                                    </div>
                                    ${project.category ? `
                                    <div class="d-flex justify-content-between">
                                        <span>Category:</span>
                                        <span>${project.category}</span>
                                    </div>
                                    ` : ''}
                                </div>

                                <!-- Tags -->
                                ${project.tags && project.tags.length > 0 ? `
                                <div class="mb-3">
                                    ${project.tags.map(tag => `
                                        <span class="badge bg-secondary me-1">${tag}</span>
                                    `).join('')}
                                </div>
                                ` : ''}

                                <!-- Actions -->
                                <div class="d-flex gap-2">
                                    <button class="btn btn-sm btn-primary flex-fill" onclick="viewProjectDetails('${project.id}')">
                                        👁️ View
                                    </button>
                                    <button class="btn btn-sm btn-warning" onclick="openProjectModal(projectManagement.projects.find(p => p.id === '${project.id}'))">
                                        ✏️ Edit
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteProject('${project.id}')">
                                        🗑️ Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // View project details
        async function viewProjectDetails(projectId) {
            const detailContent = document.getElementById('project-detail-content');
            detailContent.innerHTML = `
                <div class="text-center py-5">
                    <div class="spinner-border text-warning" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 text-muted">Loading project details...</p>
                </div>
            `;

            document.getElementById('edit-project-btn').dataset.projectId = projectId;
            projectManagement.detailModal.show();

            try {
                const response = await fetch(`/api/creative-projects/${projectId}/`, {
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });
                const data = await response.json();

                if (data.project) {
                    renderProjectDetails(data.project);
                } else {
                    detailContent.innerHTML = `
                        <div class="text-center py-5">
                            <p class="text-danger">Error loading project details</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading project details:', error);
                detailContent.innerHTML = `
                    <div class="text-center py-5">
                        <p class="text-danger">Error loading project details</p>
                    </div>
                `;
            }
        }

            detailContent.innerHTML = `

                                <div class="small text-light">Images</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="text-center p-2" style="background: rgba(255,255,255,0.1); border-radius: 8px;">
                                <div style="font-size: 28px;">🎬</div>
                                <div class="h4 text-white mb-0" id="stats-videos-${project.id}">0</div>
                                <div class="small text-light">Videos</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="text-center p-2" style="background: rgba(255,255,255,0.1); border-radius: 8px;">
                                <div style="font-size: 28px;">🎨</div>
                                <div class="h4 text-white mb-0" id="stats-models-${project.id}">0</div>
                                <div class="small text-light">3D Models</div>
                            </div>
                        </div>
                    </div>

                    <!-- Collaboration Stats -->
                    <div class="row g-3 mb-3">
                        <div class="col-4">
                            <div class="text-center p-2" style="background: rgba(255,255,255,0.1); border-radius: 8px;">
                                <div style="font-size: 28px;">🤖</div>
                                <div class="h4 text-white mb-0" id="stats-agents-${project.id}">0</div>
                                <div class="small text-light">Agents</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="text-center p-2" style="background: rgba(255,255,255,0.1); border-radius: 8px;">
                                <div style="font-size: 28px;">⚡</div>
                                <div class="h4 text-white mb-0" id="stats-workflows-${project.id}">0</div>
                                <div class="small text-light">Workflows</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="text-center p-2" style="background: rgba(255,255,255,0.1); border-radius: 8px;">
                                <div style="font-size: 28px;">📱</div>
                                <div class="h4 text-white mb-0" id="stats-socialmedia-${project.id}">0</div>
                                <div class="small text-light">Social Media</div>
                            </div>
                        </div>
                    </div>

                    <!-- Timeline -->
                    <div class="text-center text-light small">
                        📅 Created <span id="stats-created-${project.id}">...</span> •
                        Last active <span id="stats-active-${project.id}">...</span>
                    </div>
                    </div><!-- End section-content-stats -->
                </div>

                <!-- Session 125: Split View Layout - Project & Assistant Side by Side -->
                <div class="row">
                    <!-- LEFT: Project Content (60%) -->
                    <div class="col-lg-7">
                        <!-- Project Info - Session 180 Part 3: Collapsible, Session 181: Read-only display -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-3" style="cursor: pointer;" onclick="toggleProjectSection('${project.id}', 'info')">
                                <h5 style="color: #f59e0b; margin: 0;">
                                    <span id="section-toggle-info-${project.id}" style="display: inline-block; width: 20px; font-size: 12px;">▼</span>
                                    📋 Project Information
                                </h5>
                            </div>
                    <div id="section-content-info-${project.id}">

                    <!-- Session 201: Enhanced Project Information with workflow data -->

                    <!-- Basic Info Table -->
                    <table class="table table-dark table-sm mb-3">
                        <tr>
                            <td style="width: 120px;"><strong>Status:</strong></td>
                            <td>
                                ${project.status === 'planning' ? '📋 Planning' :
                                  project.status === 'in_progress' ? '🚀 In Progress' :
                                  project.status === 'review' ? '👀 Review' :
                                  project.status === 'completed' ? '✅ Completed' :
                                  project.status === 'archived' ? '📦 Archived' : project.status}
                            </td>
                        </tr>
                        ${project.total_workflows > 0 ? `<tr>
                            <td><strong>Progress:</strong></td>
                            <td>${project.progress_percentage}% (${project.completed_workflows}/${project.total_workflows} workflows)</td>
                        </tr>` : ''}
                        <tr>
                            <td><strong>Category:</strong></td>
                            <td>${project.category ? project.category.replace(/[-_]/g, ' ').replace(/\//g, ' / ') : '<span class="text-muted">Not set</span>'}</td>
                        </tr>
                        <tr>
                            <td><strong>Colors:</strong></td>
                            <td>
                                ${project.colors || '<span class="text-muted">Not set</span>'}
                            </td>
                        </tr>
                        <tr>
                            <td><strong>Tags:</strong></td>
                            <td>
                                ${project.tags && project.tags.length > 0 ? project.tags.map(tag => `<span class="badge bg-secondary me-1" style="font-size: 11px;">${tag}</span>`).join('') : '<span class="text-muted">No tags</span>'}
                            </td>
                        </tr>
                    </table>

                    <!-- Goal & Description -->
                    ${project.goal ? `
                    <div class="mb-3 p-2" style="background: rgba(245, 158, 11, 0.1); border-radius: 6px; border-left: 3px solid #f59e0b;">
                        <div class="small text-muted mb-1">🎯 Goal</div>
                        <div style="font-size: 13px;">${project.goal}</div>
                    </div>` : ''}

                    ${project.description ? `
                    <div class="mb-3 p-2" style="background: rgba(100, 100, 100, 0.1); border-radius: 6px;">
                        <div class="small text-muted mb-1">📝 Description</div>
                        <div id="project-description-${project.id}" style="font-size: 13px;">${formatMarkdown(project.description)}</div>
                    </div>` : ''}

                    <!-- Session 201: Research Sources -->
                    ${project.metadata && project.metadata.research_links && project.metadata.research_links.length > 0 ? `
                    <div class="mb-3 p-2" style="background: rgba(59, 130, 246, 0.1); border-radius: 6px; border-left: 3px solid #3b82f6;">
                        <div class="d-flex justify-content-between align-items-center mb-2" style="cursor: pointer;" onclick="toggleProjectSubsection('${project.id}', 'research')">
                            <div class="small" style="color: #3b82f6; font-weight: 600;">
                                🔍 Research Sources (${project.metadata.research_links.length})
                                <span id="subsection-toggle-research-${project.id}" style="font-size: 10px; margin-left: 5px;">▼</span>
                            </div>
                        </div>
                        <div id="subsection-content-research-${project.id}">
                            ${project.metadata.research_links.map((link, idx) => `
                                <div class="mb-2 p-2" style="background: rgba(255,255,255,0.05); border-radius: 4px;">
                                    <a href="${link.link}" target="_blank" style="color: #60a5fa; font-size: 12px; font-weight: 500;">
                                        ${idx + 1}. ${link.title || 'Source'}
                                    </a>
                                    <div class="small text-muted mt-1" style="font-size: 11px;">${link.snippet || ''}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>` : ''}

                    <!-- Session 201: Executive Recommendations with expandable dropdowns -->
                    ${project.metadata && project.metadata.agent_recommendations && project.metadata.agent_recommendations.length > 0 ? `
                    <div class="mb-3 p-2" style="background: rgba(168, 85, 247, 0.1); border-radius: 6px; border-left: 3px solid #a855f7;">
                        <div class="d-flex justify-content-between align-items-center mb-2" style="cursor: pointer;" onclick="toggleProjectSubsection('${project.id}', 'executives')">
                            <div class="small" style="color: #a855f7; font-weight: 600;">
                                👔 Executive Team Recommendations (${project.metadata.agent_recommendations.length})
                                <span id="subsection-toggle-executives-${project.id}" style="font-size: 10px; margin-left: 5px;">▼</span>
                            </div>
                        </div>
                        <div id="subsection-content-executives-${project.id}">
                            ${project.metadata.agent_recommendations.map((rec, idx) => `
                                <div class="mb-2" style="background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden;">

                                            <span id="exec-toggle-${project.id}-${idx}" style="display: inline-block; width: 14px; font-size: 10px;">▶</span>
                                            ${rec.stance === 'support' ? '✅' : rec.stance === 'concern' ? '⚠️' : '🤔'} ${rec.agent || 'Agent'}
                                        </span>
                                        <span class="badge ${rec.stance === 'support' ? 'bg-success' : rec.stance === 'concern' ? 'bg-warning text-dark' : 'bg-secondary'}" style="font-size: 10px;">
                                            ${rec.stance === 'support' ? 'Supportive' : rec.stance === 'concern' ? 'Has Concerns' : 'Neutral'}
                                        </span>
                                    </div>
                                    <div id="exec-content-${project.id}-${idx}" style="display: none; padding: 8px 12px; background: rgba(0,0,0,0.2); border-top: 1px solid rgba(168, 85, 247, 0.3);">
                                        <div style="font-size: 12px; color: rgba(255,255,255,0.9); line-height: 1.5;">${rec.response || rec.recommendation || rec.recommendation_text || 'No recommendation provided.'}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>` : ''}

                    <!-- Session 201: Suggested Next Steps -->
                    ${project.metadata && project.metadata.suggested_next_steps && project.metadata.suggested_next_steps.length > 0 ? `
                    <div class="mb-3 p-2" style="background: rgba(34, 197, 94, 0.1); border-radius: 6px; border-left: 3px solid #22c55e;">
                        <div class="d-flex justify-content-between align-items-center mb-2" style="cursor: pointer;" onclick="toggleProjectSubsection('${project.id}', 'nextsteps')">
                            <div class="small" style="color: #22c55e; font-weight: 600;">
                                🚀 Suggested Next Steps
                                <span id="subsection-toggle-nextsteps-${project.id}" style="font-size: 10px; margin-left: 5px;">▼</span>
                            </div>
                        </div>
                        <div id="subsection-content-nextsteps-${project.id}">
                            <ul class="mb-0 ps-3" style="font-size: 12px;">
                                ${project.metadata.suggested_next_steps.map(step => `<li style="margin-bottom: 4px;">${step}</li>`).join('')}
                            </ul>
                        </div>
                    </div>` : ''}

                    <!-- Dates (collapsed by default) -->
                    <div class="small text-muted" style="font-size: 11px;">
                        Created: ${new Date(project.created_at).toLocaleDateString()} •
                        Updated: ${new Date(project.updated_at).toLocaleDateString()}
                        ${project.deadline ? ` • Deadline: ${new Date(project.deadline).toLocaleDateString()}` : ''}
                        ${project.is_overdue ? '<span class="badge bg-danger ms-1" style="font-size: 9px;">OVERDUE</span>' : ''}
                    </div>

                    </div><!-- End section-content-info -->
                </div>

                <!-- Session 183: Removed Decision Timeline (premature complexity for v1)
                     TODO: Re-add when meaningful decision tracking is implemented -->

                <!-- Session 180: Removed Agent Contributions section (data not meaningful yet)
                     TODO: Re-add when execution_time and user_rating are being recorded -->

                <!-- Session 125: Phase 6 - Workflow Templates -->
                <!-- Session 180 Part 3: Collapsible -->

                        <div class="card-body">

                                <h5 style="color: white; margin: 0;">
                                    <span id="section-toggle-workflows-${project.id}" style="display: inline-block; width: 20px; font-size: 12px;">▼</span>
                                    ⚡ Quick Workflows

        // Session 123: Phase 2 - Project Editing Functions

        // Edit project name inline
        function editProjectName(projectId) {
            const display = document.getElementById('project-name-display');
            const saveBtn = document.getElementById('save-name-btn');
            const currentName = display.textContent;

            display.innerHTML = `<input type="text" id="project-name-input" class="form-control form-control-sm d-inline-block" value="${currentName}" style="width: 400px; background: #222; color: white; border: 2px solid #f59e0b;">`;
            saveBtn.style.display = 'inline-block';

            // Focus the input and select all text
            const input = document.getElementById('project-name-input');
            input.focus();
            input.select();

            // Allow saving with Enter key
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    saveProjectName(projectId);
                }
            });
        }

        // Save project name
        async function saveProjectName(projectId) {
            const input = document.getElementById('project-name-input');
            const newName = input.value.trim();

            if (!newName) {
                showNotification('Project name cannot be empty', 'danger');
                return;
            }

            try {
                const response = await fetch(`/api/creative-projects/${projectId}/update/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ name: newName })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✓ Project name updated!', 'success');

                    // Fix: Properly restore the title to editable state
                    const titleElement = document.getElementById('project-detail-title');
                    const display = document.getElementById('project-name-display');
                    const saveBtn = document.getElementById('save-name-btn');

                    display.innerHTML = newName;
                    display.style.cursor = 'pointer';
                    display.onclick = () => editProjectName(projectId);
                    saveBtn.style.display = 'none';

                    loadProjects(); // Refresh sidebar
                } else {
                    showNotification(result.error || 'Failed to update project name', 'danger');
                }
            } catch (error) {
                console.error('Error saving project name:', error);
                showNotification('Error updating project name', 'danger');
            }
        }

        // Save all project info (status, goal, description, category)
        async function saveProjectInfo(projectId) {
            const saveBtn = document.getElementById('save-project-btn');
            saveBtn.disabled = true;
            saveBtn.textContent = '⏳ Saving...';

            try {
                const status = document.getElementById(`project-status-${projectId}`).value;
                const goal = document.getElementById(`project-goal-${projectId}`).value.trim();
                const description = document.getElementById(`project-description-${projectId}`).value.trim();
                const category = document.getElementById(`project-category-${projectId}`).value.trim();
                const colors = document.getElementById(`project-colors-${projectId}`).value.trim();
                const deadlineInput = document.getElementById(`project-deadline-${projectId}`).value;
                const deadline = deadlineInput ? new Date(deadlineInput).toISOString() : null;

                const response = await fetch(`/api/creative-projects/${projectId}/update/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        status,
                        goal,
                        description,
                        category,
                        colors,
                        deadline
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✓ Project updated successfully!', 'success');
                    loadProjects(); // Refresh sidebar
                } else {
                    showNotification(result.error || 'Failed to update project', 'danger');
                }
            } catch (error) {
                console.error('Error saving project:', error);
                showNotification('Error updating project', 'danger');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Save Changes';
            }
        }

        // Add a new tag
        async function addProjectTag(projectId) {
            const tagName = prompt('Enter tag name:');
            if (!tagName || !tagName.trim()) return;

            try {
                // Get current project data
                const response = await fetch(`/api/creative-projects/${projectId}/`, {
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                });
                const data = await response.json();
                const project = data.project;

                // Add new tag
                const tags = project.tags || [];
                if (!tags.includes(tagName.trim())) {
                    tags.push(tagName.trim());

                    // Update project
                    const updateResponse = await fetch(`/api/creative-projects/${projectId}/update/`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify({ tags })
                    });

                    const result = await updateResponse.json();

                    if (result.success) {
                        showNotification('✓ Tag added!', 'success');
                        viewProjectDetails(projectId); // Refresh view
                    } else {
                        showNotification(result.error || 'Failed to add tag', 'danger');
                    }
                } else {
                    showNotification('Tag already exists', 'warning');
                }
            } catch (error) {
                console.error('Error adding tag:', error);
                showNotification('Error adding tag', 'danger');
            }
        }

        // Remove a tag
        async function removeProjectTag(projectId, tagToRemove) {
            if (!confirm(`Remove tag "${tagToRemove}"?`)) return;

            try {
                // Get current project data
                const response = await fetch(`/api/creative-projects/${projectId}/`, {
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                });
                const data = await response.json();
                const project = data.project;

                // Remove tag
                const tags = (project.tags || []).filter(tag => tag !== tagToRemove);

                // Update project
                const updateResponse = await fetch(`/api/creative-projects/${projectId}/update/`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({ tags })
                });

                const result = await updateResponse.json();

                if (result.success) {
                    showNotification('✓ Tag removed!', 'success');
                    viewProjectDetails(projectId); // Refresh view

            const command = input.value.trim();

            if (!command) {

            try {

                }

        // Parse natural language command
        function parseNLPCommand(command) {
            const lower = command.toLowerCase();

            // Extract asset type and number
            let assetType = null;
            let assetNumber = null;

            // Match patterns like:
            // - "logo 3", "image 5", "video 2"
            // - "logo #224", "image #224"
            // - "logo Image #224" (flexible with extra words)
            const assetMatch = lower.match(/(logo|image|img|video|vid)[^0-9]*?(\d+)/);
            if (assetMatch) {
                assetType = assetMatch[1].includes('vid') ? 'video' : 'image';
                assetNumber = parseInt(assetMatch[2]);
            }

            if (!assetType || !assetNumber) {
                return null;
            }

            // Determine operation based on keywords
            let operation = null;
            let parameters = {};

            // Image operations
            if (lower.includes('darker') || lower.includes('dark')) {
                operation = 'make_darker';
                parameters.brightness = -0.3;
            } else if (lower.includes('lighter') || lower.includes('bright')) {
                operation = 'make_lighter';
                parameters.brightness = 0.3;
            } else if (lower.includes('more vibrant') || lower.includes('saturate')) {
                operation = 'increase_saturation';
                parameters.saturation = 0.3;
            } else if (lower.includes('less vibrant') || lower.includes('desaturate')) {
                operation = 'decrease_saturation';
                parameters.saturation = -0.3;
            } else if (lower.includes('refine') || lower.includes('enhance') || lower.includes('improve')) {
                operation = 'refine';
                parameters.prompt = 'enhance details and quality';
            } else if (lower.includes('blur')) {
                operation = 'blur';
            } else if (lower.includes('sharpen')) {
                operation = 'sharpen';
            } else if (lower.includes('upscale')) {
                operation = 'upscale';
            } else if (lower.includes('slow motion') || lower.includes('slower')) {
                operation = 'slow_motion';
            } else if (lower.includes('speed up') || lower.includes('faster')) {
                operation = 'speed_up';
            } else {
                return null;
            }

            return {
                assetType,
                assetNumber,
                operation,
                parameters
            };
        }

        // Execute the actual asset operation
        async function executeAssetOperation(asset, operation, parameters, projectId) {
            showNotification(`⏳ Executing ${operation} on ${asset.type} #${asset.sequential_number}...`, 'info');

            // MVP: Directly call EditingOrchestratorAgent without Personal Assistant
            // This is faster and more reliable than going through the conversational AI

            const prompt = generatePromptFromOperation(operation, parameters);

            console.log(`🔧 Executing ${operation} on asset #${asset.sequential_number}`);
            console.log(`📝 Prompt: ${prompt}`);

            const response = await fetch('/api/agents/editing/execute/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({
                    image_id: asset.sequential_number.toString(),
                    operation: 'image_to_image',
                    parameters: {
                        prompt: prompt,
                        strength: 0.65
                    }
                })
            });

            const result = await response.json();

            console.log('🎨 Operation result:', result);

            if (result.success) {
                showNotification(`✓ ${operation} completed successfully!`, 'success');
            } else {
                console.error('❌ Operation failed:', result);
                throw new Error(result.error || result.message || 'Operation failed');
            }
        }

        /**
         * Session 125: Phase 7 - Download Project Assets
         */
        async function downloadProjectAssets(projectId, projectName) {
            console.log(`💾 Downloading assets for project: ${projectName}`);

            const statusDiv = document.getElementById(`download-status-${projectId}`);
            const messageSpan = document.getElementById(`download-message-${projectId}`);

            statusDiv.style.display = 'block';
            messageSpan.textContent = 'Fetching project assets...';

            try {
                // Get all project assets
                const response = await fetch(`/api/portfolio/?project=${projectId}`, {
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();
                const assets = result.data || [];

                if (assets.length === 0) {
                    showNotification('No assets to download in this project', 'info');
                    statusDiv.style.display = 'none';
                    return;
                }

                messageSpan.textContent = `Downloading ${assets.length} assets...`;

                // Create download for each asset
                for (let i = 0; i < assets.length; i++) {
                    const asset = assets[i];
                    const url = asset.url || asset.file_path;

                    if (url && !url.startsWith('data:')) {
                        // Create download link
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${projectName.replace(/[^a-z0-9]/gi, '_')}_${asset.sequential_number || i}`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);

                        // Small delay between downloads
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }
                }

                showNotification(`✅ Downloaded ${assets.length} assets!`, 'success');
                statusDiv.style.display = 'none';

            } catch (error) {
                console.error('❌ Download error:', error);
                showNotification(`Download failed: ${error.message}`, 'danger');
                statusDiv.style.display = 'none';
            }
        }

                            `${asset.image_width}x${asset.image_height}` : null,
                        created_at: asset.created_at,
                        url: asset.url || asset.file_path
                    }))
                };

                // Create and download JSON file
                const blob = new Blob([JSON.stringify(metadata, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${projectName.replace(/[^a-z0-9]/gi, '_')}_metadata.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showNotification('✅ Metadata exported!', 'success');

        // Session 125 Part C: Quick Editing Operations (Direct API Shortcuts)
        async function tryQuickEditingOperation(projectId, message, statusDiv) {
            const msgLower = message.toLowerCase();

            // Parse image number from message (e.g., "image 262", "image number 262", "#262")
            const imageMatch = msgLower.match(/(?:image|#)\s*(?:number\s*)?(\d+)/);
            if (!imageMatch) {
                return { handled: false };
            }

            const imageNumber = parseInt(imageMatch[1]);
            console.log(`🎯 Detected operation on image #${imageNumber}`);

            // Detect operation type
            let operation = null;
            let endpoint = null;
            let successMessage = '';

            if (msgLower.includes('upscale')) {
                operation = 'upscale';
                endpoint = '/api/stability/upscale/';
                successMessage = `✨ Upscaling image #${imageNumber} (4x resolution)... This takes ~30 seconds.`;
            } else if (msgLower.match(/remove\s+(the\s+)?(background|bg)/)) {
                // Matches: "remove background", "remove the background", "remove bg", "remove the bg"
                operation = 'remove_background';
                endpoint = '/api/stability/remove-background/';
                successMessage = `✨ Removing background from image #${imageNumber}... This takes ~20 seconds.`;
            } else {
                return { handled: false }; // Not a quick operation
            }

            // Fetch project assets to find the image by sequential number
            try {
                statusDiv.innerHTML = `🔍 Finding image #${imageNumber}...`;

                const portfolioResponse = await fetch(`/api/portfolio/?project_id=${projectId}`, {
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                });
                const portfolioData = await portfolioResponse.json();

                if (!portfolioData.success || !portfolioData.portfolio) {
                    throw new Error('Failed to load project assets');
                }

                // Find image by sequential number
                const targetImage = portfolioData.portfolio.find(a =>
                    a.type === 'image' && a.sequential_number === imageNumber
                );

                if (!targetImage) {
                    return {
                        handled: true,
                        message: `❌ Could not find image #${imageNumber} in this project. Try refreshing the page.`
                    };
                }

                console.log(`✅ Found image #${imageNumber}:`, targetImage.id);
                statusDiv.innerHTML = `⚙️ Executing ${operation}...`;

                // Execute the operation
                const opResponse = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        image_id: targetImage.id,
                        project_id: projectId
                    })
                });

                const result = await opResponse.json();

                if (result.success || result.image_id) {
                    // Poll for new assets
                    setTimeout(() => {
                        for (let i = 0; i < 6; i++) {
                            setTimeout(() => {
                                console.log(`🔄 Polling for new asset (${i+1}/6)...`);
                                refreshProjectAssets(projectId);
                            }, i * 5000);
                        }
                    }, 5000);

                    statusDiv.innerHTML = '⏳ Processing... New image will appear shortly.';
                    return {
                        handled: true,
                        message: successMessage + ' Check above for the result!'
                    };
                } else {
                    throw new Error(result.error || 'Operation failed');
                }

            } catch (error) {
                console.error(`❌ Quick operation error:`, error);
                statusDiv.innerHTML = '';
                return {
                    handled: true,
                    message: `❌ Failed to ${operation}: ${error.message}`
                };
            }
        }

        // Session 131: Helper function for workflows to use project-embedded assistant
        // Ensures proper Assistant → Agent → Session flow
        async function sendProjectMessageFromWorkflow(projectId, message) {
            const messagesDiv = document.getElementById(`project-chat-messages-${projectId}`);
            const statusDiv = document.getElementById(`project-chat-status-${projectId}`);

            // Add user message to chat (so user sees what workflow is doing)
            addProjectChatMessage(projectId, 'user', message);

            // Show status
            statusDiv.innerHTML = '🤖 Routing to specialized agent...';

            try {
                console.log(`🤖 Workflow calling Enhanced Assistant API (Assistant → Agent flow)`);
                console.log(`   Project ID: ${projectId}`);
                console.log(`   Message: ${message}`);

                // Call Enhanced Assistant API with project context
                // This ensures proper routing through agent orchestrators
                const response = await fetch('/api/assistant/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        message: message,
                        project_id: projectId  // KEY: Project context for session tracking
                    })
                });

                const result = await response.json();
                console.log('🔍 Workflow API response:', result);

                // Extract response (handle both wrapped and direct response structures)
                const assistantResponse = result.data?.response || result.response || result.message;
                const toolCalls = result.data?.tool_calls || result.tool_calls;
                console.log('🔍 Assistant response:', assistantResponse);
                console.log('🔍 Tool calls:', toolCalls);

                // Session 173: Handle tool_calls - execute them!
                if (toolCalls && toolCalls.length > 0) {
                    console.log(`🛠️ Executing ${toolCalls.length} tool calls from workflow`);
                    statusDiv.innerHTML = `🛠️ Executing ${toolCalls.length} tool(s)...`;

                    // Execute tools using window.aiAssistant.executeTools
                    if (window.aiAssistant && typeof window.aiAssistant.executeTools === 'function') {
                        console.log('🔧 Calling window.aiAssistant.executeTools()');
                        // Session 173: Set project context so tools know where to store content
                        window.aiAssistant.projectId = projectId;
                        console.log('🔧 Set projectId on aiAssistant:', projectId);
                        const toolResults = await window.aiAssistant.executeTools(toolCalls);
                        console.log('🔧 Tool execution results:', toolResults);

                        // Session 183: Trigger video polling for any task_ids returned from tool execution
                        if (toolResults && Array.isArray(toolResults)) {
                            for (const result of toolResults) {
                                // Check for task_id in result.result (video generation returns this)
                                if (result?.result?.task_id && typeof window.pollVideoStatus === 'function') {
                                    console.log(`📹 Starting video polling for task_id: ${result.result.task_id}`);
                                    setTimeout(() => window.pollVideoStatus(result.result.task_id, 'assistant', projectId), 100);
                                }
                                // Also check for task_ids array (batch video generation)
                                if (result?.result?.task_ids && Array.isArray(result.result.task_ids)) {
                                    for (let i = 0; i < result.result.task_ids.length; i++) {
                                        const taskId = result.result.task_ids[i];
                                        console.log(`📹 Starting video polling for batch task_id: ${taskId}`);
                                        setTimeout(() => window.pollVideoStatus(taskId, 'assistant', projectId), 100 + (i * 50));
                                    }
                                }
                            }
                        }

                        addProjectChatMessage(projectId, 'assistant', assistantResponse || '✅ Tool execution completed!');
                        statusDiv.innerHTML = '✅ Tools executed';
                    } else {
                        console.warn('⚠️ window.aiAssistant.executeTools not available');
                        addProjectChatMessage(projectId, 'assistant', assistantResponse || '🛠️ Tool calls received - processing...');
                    }

                    setTimeout(() => {
                        statusDiv.innerHTML = '';
                    }, 2000);

                    return true;
                } else if (assistantResponse) {
                    addProjectChatMessage(projectId, 'assistant', assistantResponse);
                    statusDiv.innerHTML = '✅ Agent completed task';

                    // Brief status clear
                    setTimeout(() => {
                        statusDiv.innerHTML = '';
                    }, 2000);

                    return true; // Success
                } else {
                    addProjectChatMessage(projectId, 'error', '❌ No response from agent');
                    statusDiv.innerHTML = '';
                    return false;
                }
            } catch (error) {
                console.error('❌ Workflow agent routing error:', error);
                addProjectChatMessage(projectId, 'error', `❌ Error: ${error.message}`);
                statusDiv.innerHTML = '';
                return false;

        // Session 173: Training progress tracking state
        let trainingTrackers = {};

        // Session 173: Start tracking training progress
        function startTrainingProgressTracker(projectId, projectName) {
            const trackerDiv = document.getElementById(`training-progress-tracker-${projectId}`);
            if (!trackerDiv) return;

            trackerDiv.style.display = 'block';

            // Initialize tracker state
            const startTime = Date.now();
            const styleName = `${projectName.replace(/\s+/g, '-').toLowerCase()}-style`;

            trainingTrackers[projectId] = {
                startTime: startTime,
                styleName: styleName,
                characterId: null,
                intervalId: null
            };

            // Update model name display
            const modelNameDiv = document.getElementById(`training-model-name-${projectId}`);
            if (modelNameDiv) {
                modelNameDiv.textContent = `Model: "${styleName}"`;
            }

            // Start elapsed time updater
            trainingTrackers[projectId].elapsedIntervalId = setInterval(() => {
                updateTrainingElapsedTime(projectId);
            }, 1000);

            // Start polling for character ID and status (check every 10 seconds)
            trainingTrackers[projectId].intervalId = setInterval(() => {
                pollTrainingStatus(projectId, styleName);
            }, 10000);

            // Do first poll immediately
            setTimeout(() => pollTrainingStatus(projectId, styleName), 2000);

            console.log(`📊 Started training tracker for project ${projectId}`);
        }

        // Session 173: Update elapsed time display
        function updateTrainingElapsedTime(projectId) {
            const tracker = trainingTrackers[projectId];
            if (!tracker) return;

            const elapsed = Math.floor((Date.now() - tracker.startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;

            const elapsedDiv = document.getElementById(`training-elapsed-${projectId}`);
            if (elapsedDiv) {
                elapsedDiv.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }

            // Update ETA based on elapsed time and progress
            const progressPct = tracker.progress || 0;
            if (progressPct > 0 && progressPct < 100) {
                const estimatedTotal = elapsed / (progressPct / 100);
                const remaining = Math.max(0, Math.floor(estimatedTotal - elapsed));
                const remainingMin = Math.floor(remaining / 60);

                const etaDiv = document.getElementById(`training-eta-${projectId}`);
                if (etaDiv && remainingMin > 0) {
                    etaDiv.textContent = `Est. ~${remainingMin} min remaining`;
                }
            }
        }

        // Session 173: Poll for training status
        async function pollTrainingStatus(projectId, styleName) {
            try {
                // First, find the character by name if we don't have the ID
                const tracker = trainingTrackers[projectId];
                if (!tracker) return;

                // Get list of characters and find the one matching our style name
                const listResponse = await fetch('/api/characters/', {
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                });

                if (!listResponse.ok) {
                    console.log('📊 Could not fetch characters list');
                    return;
                }

                const listData = await listResponse.json();
                const characters = listData.characters || listData || [];

                // Session 173 FIX: Only find NEW models created AFTER training started
                // This prevents finding old completed models and showing false "completed"
                const trainingStartTime = tracker.startTime;
                const cutoffTime = new Date(trainingStartTime - 60000); // 1 minute buffer

                // Find matching character created AFTER we started training
                const matchingChar = characters.find(c => {
                    const nameMatch = c.name?.toLowerCase().includes(styleName.toLowerCase()) ||
                                      c.trigger_word?.toLowerCase().includes(styleName.toLowerCase());
                    if (!nameMatch) return false;

                    // Check if this model was created after we started training
                    const createdAt = new Date(c.created_at);
                    const isNew = createdAt >= cutoffTime;

                    // Session 173: Don't spam logs for old models - just filter silently
                    return isNew;
                });

                if (!matchingChar) {
                    // Session 173: Only log this once per minute (every 6th poll) to reduce spam
                    tracker.noMatchCount = (tracker.noMatchCount || 0) + 1;
                    if (tracker.noMatchCount % 6 === 1) {
                        console.log(`📊 No NEW character found matching "${styleName}" yet (training may still be starting)`);
                    }
                    return;
                }

                console.log(`📊 Found new model: ${matchingChar.name} (ID: ${matchingChar.id}, created: ${matchingChar.created_at})`);
                tracker.characterId = matchingChar.id;

                // Now get detailed status
                const statusResponse = await fetch(`/api/characters/${matchingChar.id}/training-status/`, {
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }
                });

                if (!statusResponse.ok) return;

                const statusData = await statusResponse.json();
                console.log(`📊 Training status:`, statusData);

                // Update UI
                updateTrainingProgressUI(projectId, statusData);

                // Check if training is complete or failed
                if (statusData.training_status === 'completed') {
                    stopTrainingTracker(projectId, 'completed');
                } else if (statusData.training_status === 'failed') {
                    stopTrainingTracker(projectId, 'failed', statusData.error_message);
                }

            } catch (error) {
                console.log('📊 Training poll error:', error.message);
            }
        }

        // Session 173: Update training progress UI
        function updateTrainingProgressUI(projectId, statusData) {
            const tracker = trainingTrackers[projectId];
            if (!tracker) return;

            const progress = statusData.training_progress || 0;
            tracker.progress = progress;

            // Update progress bar
            const progressBar = document.getElementById(`training-progress-bar-${projectId}`);
            if (progressBar) {
                progressBar.style.width = `${progress}%`;
            }

            // Update progress percentage
            const progressPct = document.getElementById(`training-progress-pct-${projectId}`);
            if (progressPct) {
                progressPct.textContent = `${progress}%`;
            }

            // Update status icon and text based on status
            const statusIcon = document.getElementById(`training-status-icon-${projectId}`);
            const statusText = document.getElementById(`training-status-text-${projectId}`);

            if (statusIcon && statusText) {
                switch (statusData.training_status) {
                    case 'preparing':
                        statusIcon.textContent = '📦';
                        statusText.textContent = 'Preparing training data...';
                        break;
                    case 'pending':
                        statusIcon.textContent = '⏳';
                        statusText.textContent = 'Waiting in queue...';
                        break;
                    case 'training':
                        statusIcon.textContent = '🔥';
                        statusText.textContent = 'Training in progress...';
                        break;
                    case 'completed':
                        statusIcon.textContent = '✅';
                        statusText.textContent = 'Training complete!';
                        break;
                    case 'failed':
                        statusIcon.textContent = '❌';
                        statusText.textContent = 'Training failed';
                        break;

        // Session 173: Stop training tracker
        function stopTrainingTracker(projectId, status, errorMessage = null) {
            const tracker = trainingTrackers[projectId];
            if (!tracker) return;

            // Clear intervals
            if (tracker.intervalId) clearInterval(tracker.intervalId);
            if (tracker.elapsedIntervalId) clearInterval(tracker.elapsedIntervalId);

            // Update final UI
            const progressBar = document.getElementById(`training-progress-bar-${projectId}`);
            const etaDiv = document.getElementById(`training-eta-${projectId}`);

            if (status === 'completed') {

                if (etaDiv) etaDiv.textContent = 'Complete!';
                showNotification(`Training complete! Model "${tracker.styleName}" is ready to use.`, 'success', 10000);
            } else if (status === 'failed') {
                if (progressBar) progressBar.style.background = '#ef4444';
                if (etaDiv) etaDiv.textContent = errorMessage || 'Training failed';
                showNotification(`Training failed: ${errorMessage || 'Unknown error'}`, 'danger', 10000);
            }

            // Cleanup
            delete trainingTrackers[projectId];
            console.log(`📊 Training tracker stopped for project ${projectId} (${status})`);
        }

        // Session 173: Check for active training on page load
        async function checkActiveTraining(projectId, projectName) {
            try {
                const styleName = `${projectName.replace(/\s+/g, '-').toLowerCase()}-style`;

                const listResponse = await fetch('/api/characters/', {
                    headers: { 'X-CSRFToken': getCookie('csrftoken') }

                if (!listResponse.ok) return;

                const listData = await listResponse.json();
                const characters = listData.characters || listData || [];

                // Session 173 FIX: Only resume tracking for RECENT models (last 2 hours)
                // This prevents showing stale "training in progress" for old abandoned models
                const twoHoursAgo = new Date(Date.now() - 2 * 60 * 60 * 1000);

                // Find any in-progress training for this project created recently
                const activeTraining = characters.find(c => {
                    const nameMatch = (c.name?.toLowerCase().includes(styleName.toLowerCase()) ||
                                       c.trigger_word?.toLowerCase().includes(styleName.toLowerCase()));
                    const isActive = ['preparing', 'pending', 'training'].includes(c.training_status);
                    const isRecent = new Date(c.created_at) >= twoHoursAgo;

                    if (nameMatch && isActive && !isRecent) {
                        console.log(`📊 Ignoring stale training: ${c.name} (created ${c.created_at})`);
                    }
                    return nameMatch && isActive && isRecent;
                });

                if (activeTraining) {
                    console.log(`📊 Found active training: ${activeTraining.name} (created ${activeTraining.created_at})`);
                    startTrainingProgressTracker(projectId, projectName);

        // Voice input for project chat
        let projectVoiceRecorder = null;
        let projectVoiceChunks = [];
        let projectVoiceProjectId = null;

        async function startProjectVoiceInput(projectId) {
            // Prevent starting a new recording if one is already active
            if (projectVoiceRecorder && projectVoiceRecorder.state === 'recording') {
                console.log('🎤 Already recording, ignoring start request');
                return;
            }

            projectVoiceProjectId = projectId;
            const statusDiv = document.getElementById(`project-chat-status-${projectId}`);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                // Session 124: Try formats in order of OpenAI Whisper compatibility
                let options = {};

                // Try audio/wav first (most compatible)
                if (MediaRecorder.isTypeSupported('audio/wav')) {
                    options.mimeType = 'audio/wav';
                }
                // Try audio/mp4 (Safari, very compatible)
                else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                    options.mimeType = 'audio/mp4';
                }
                // Try basic audio/webm without codec specification
                else if (MediaRecorder.isTypeSupported('audio/webm')) {
                    options.mimeType = 'audio/webm';
                }
                // Fallback to default (usually webm with opus)
                else {
                    options = { mimeType: 'audio/webm;codecs=opus' };
                }

                projectVoiceRecorder = new MediaRecorder(stream, options);
                projectVoiceChunks = [];

                console.log('🎤 Recording with MIME type:', projectVoiceRecorder.mimeType);

                projectVoiceRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        projectVoiceChunks.push(e.data);
                        console.log('🎤 Data chunk received:', e.data.size, 'bytes');
                    }
                };

                // Start recording - request data every 100ms to ensure we capture something
                projectVoiceRecorder.start(100);
                statusDiv.innerHTML = `🎤 Recording (${projectVoiceRecorder.mimeType})... (release to stop)`;

                // Change button appearance
                const btn = document.getElementById(`project-voice-btn-${projectId}`);
                btn.style.background = '#dc2626';
                btn.innerHTML = '⏺️';

            } catch (error) {
                console.error('Microphone error:', error);
                statusDiv.innerHTML = '❌ Microphone access denied';
            }
        }

        async function stopProjectVoiceInput(projectId) {
            if (!projectVoiceRecorder || projectVoiceRecorder.state === 'inactive') return;

            const statusDiv = document.getElementById(`project-chat-status-${projectId}`);

            projectVoiceRecorder.stop();
            statusDiv.innerHTML = '⏳ Processing voice...';

            projectVoiceRecorder.onstop = async () => {
                // Get MIME type and strip codec info (e.g., "audio/webm;codecs=opus" -> "audio/webm")
                const fullMimeType = projectVoiceRecorder.mimeType;
                const baseMimeType = fullMimeType.split(';')[0];

                const audioBlob = new Blob(projectVoiceChunks, { type: baseMimeType });

                console.log('🎤 Audio blob created:', {
                    fullMimeType,
                    baseMimeType,
                    size: audioBlob.size,
                    type: audioBlob.type
                });

                // Stop all tracks
                projectVoiceRecorder.stream.getTracks().forEach(track => track.stop());

                // Reset button
                const btn = document.getElementById(`project-voice-btn-${projectId}`);
                btn.style.background = '';
                btn.innerHTML = '🎤';

                // Determine file extension from base MIME type
                let extension = 'webm';
                if (baseMimeType.includes('mp4')) {
                    extension = 'mp4';
                } else if (baseMimeType.includes('mpeg')) {
                    extension = 'mp3';
                } else if (baseMimeType.includes('wav')) {
                    extension = 'wav';
                } else if (baseMimeType.includes('ogg')) {
                    extension = 'ogg';
                }

                // Send to Whisper
                const formData = new FormData();
                formData.append('audio', audioBlob, `recording.${extension}`);

                console.log('🎤 Sending to Whisper:', `recording.${extension}`, audioBlob.size, 'bytes');

                try {
                    const response = await fetch('/api/assistant/transcribe/', {
                        method: 'POST',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: formData
                    });

                    const result = await response.json();

                    if (result.text) {
                        // Put transcribed text in input and send
                        const inputField = document.getElementById(`project-chat-input-${projectId}`);
                        inputField.value = result.text;
                        statusDiv.innerHTML = '';
                        sendProjectMessage(projectId);
                    } else {
                        throw new Error('No transcription received');
                    }

                } catch (error) {
                    console.error('Transcription error:', error);
                    statusDiv.innerHTML = '❌ Transcription failed';
                }
            };
        }

        // Execute a tool call from the Personal Assistant
        async function executeToolCall(toolCall, asset, operation) {
            const toolName = toolCall.name;
            const args = toolCall.arguments;

            console.log(`🔧 Executing ${toolName} with args:`, args);

            if (toolName === 'refine_image') {
                // Call the EditingOrchestratorAgent directly with image_to_image operation
                // This is more reliable than the IterationAgent's parser
                const refineResponse = await fetch('/api/agents/editing/execute/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        image_id: args.image_id,
                        operation: 'image_to_image',
                        parameters: {
                            prompt: args.refinement_request,
                            strength: 0.65  // Medium strength for refinements
                        }
                    })
                });

                const refineResult = await refineResponse.json();
                console.log('🎨 Refinement result:', refineResult);

                if (!refineResult.success) {
                    throw new Error(refineResult.error || 'Image refinement failed');
                }

                return refineResult;
            } else if (toolName === 'upscale_image') {
                // Call the upscale API
                const upscaleResponse = await fetch('/api/images/upscale/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        image_id: args.image_id
                    })
                });

                const upscaleResult = await upscaleResponse.json();
                console.log('📐 Upscale result:', upscaleResult);

                if (!upscaleResult.success) {
                    throw new Error(upscaleResult.error || 'Image upscale failed');
                }

                return upscaleResult;
            } else {
                console.warn(`⚠️ Unknown tool: ${toolName}`);
                // For other tools, just log them for now
                return { success: true, message: `Tool ${toolName} recognized but not yet implemented` };
            }
        }

            if (agent && agent !== 'all') params.append('agent', agent);

        /**
         * Session 182: Auto-poll pending 3D models until completion
         * Polls every 5 seconds and refreshes UI when models complete
         */
        const pending3DModelPollers = {};  // Track active pollers per project

        function startPending3DModelPolling(projectId, pendingModels) {
            // Don't start multiple pollers for same project
            if (pending3DModelPollers[projectId]) {
                console.log(`⏸️ Poller already running for project ${projectId}`);
                return;
            }

            const modelIds = pendingModels.map(m => m.id);
            console.log(`🔄 Starting 3D model poller for: ${modelIds.join(', ')}`);

            pending3DModelPollers[projectId] = setInterval(async () => {
                try {
                    let allComplete = true;
                    let anyUpdated = false;

                    for (const modelId of modelIds) {
                        // Poll each pending model's status
                        const response = await fetch(`/api/v1/content/minifigs/${modelId}/`, {
                            headers: {
                                'X-CSRFToken': getCookie('csrftoken')
                            }
                        });

                        if (response.ok) {
                            const data = await response.json();
                            const model = data.minifig;

                            if (model.status === 'completed') {
                                console.log(`✅ 3D Model ${modelId} completed!`);
                                anyUpdated = true;
                            } else if (model.status === 'failed') {
                                console.log(`❌ 3D Model ${modelId} failed: ${model.error_message}`);
                                anyUpdated = true;
                            } else {
                                // Still pending/processing
                                allComplete = false;
                                console.log(`⏳ 3D Model ${modelId} still ${model.status}...`);
                            }
                        }
                    }

                    // If any model updated, refresh the project assets
                    if (anyUpdated) {
                        showNotification('🎉 3D Model generation complete!', 'success');
                        refreshProjectAssets(projectId);
                    }

                    // If all models complete, stop polling
                    if (allComplete) {
                        console.log(`✅ All 3D models complete - stopping poller for project ${projectId}`);
                        clearInterval(pending3DModelPollers[projectId]);
                        delete pending3DModelPollers[projectId];
                    }

                } catch (error) {
                    console.error('Error polling 3D model status:', error);
                }
            }, 5000);  // Poll every 5 seconds

            // Safety timeout - stop polling after 10 minutes max
            setTimeout(() => {
                if (pending3DModelPollers[projectId]) {
                    console.log(`⏰ Polling timeout reached for project ${projectId}`);
                    clearInterval(pending3DModelPollers[projectId]);
                    delete pending3DModelPollers[projectId];
                }
            }, 600000);  // 10 minutes
        }
