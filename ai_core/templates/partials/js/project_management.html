            const content = document.getElementById(`toolbox-content-${sectionType}-${projectId}`);
            const toggle = document.getElementById(`toolbox-toggle-${sectionType}-${projectId}`);

            if (!content || !toggle) {
                console.warn(`Toolbox section not found: ${sectionType} for project ${projectId}`);
                return;
            }

            const isHidden = content.style.display === 'none';

            if (isHidden) {
                // Expand with animation
                content.style.display = 'block';
                content.style.opacity = '0';
                content.style.transform = 'translateY(-5px)';
                toggle.textContent = '▼';
                setTimeout(() => {
                    content.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
                    content.style.opacity = '1';
                    content.style.transform = 'translateY(0)';
                }, 10);
            } else {
                // Collapse
                content.style.display = 'none';
                toggle.textContent = '▶';
            }

            // Store preference
            const prefs = JSON.parse(localStorage.getItem('toolboxSectionPrefs') || '{}');
            prefs[`${sectionType}-${projectId}`] = !isHidden;
            localStorage.setItem('toolboxSectionPrefs', JSON.stringify(prefs));

        /**
         * Session 197 Phase 2: Helper function to populate image dropdowns in modals
         */
        async function populateImageDropdown(projectId, selectId) {
            console.log(`📸 populateImageDropdown called: projectId=${projectId}, selectId=${selectId}`);
            const select = document.getElementById(selectId);
            if (!select) {
                console.warn(`📸 Select element not found: ${selectId}`);
                return;
            }

            select.innerHTML = '<option value="">Loading images...</option>';

            try {
                // Use /api/images/history/ with project_id filter (Session 197)
                const url = `/api/images/history/?project_id=${projectId}&limit=100`;
                console.log(`📸 Fetching: ${url}`);
                const response = await fetch(url, {
                    headers: {'X-CSRFToken': getCsrfToken()}
                });
                const data = await response.json();
                console.log(`📸 API response:`, data);

                if (data.success && data.images && data.images.length > 0) {
                    console.log(`📸 Found ${data.images.length} images for project ${projectId}`);
                    select.innerHTML = '<option value="">Select an image...</option>';
                    data.images.forEach(img => {
                        const seqNum = img.sequential_number || img.id.toString().substring(0, 8);
                        const prompt = img.prompt ? img.prompt.substring(0, 40) + '...' : 'Image';
                        select.innerHTML += `<option value="${img.id}">Image #${seqNum} - ${prompt}</option>`;
                    });
                } else {
                    console.log(`📸 No images found or error: success=${data.success}, images=${data.images?.length || 0}`);
                    select.innerHTML = '<option value="">No images in this project</option>';
                }
            } catch (error) {
                console.error('📸 Error loading images:', error);
                select.innerHTML = '<option value="">Error loading images</option>';
            }
        }

        /**
         * Session 197 Phase 4+: Handle image upload in modal, upload to project and select it
         * @param {string} toolName - Name of the tool (e.g., 'upscale', 'removeBg')
         * @param {string} projectId - Project UUID
         */
        async function handleModalImageUpload(toolName, projectId) {
            const fileInput = document.getElementById(`${toolName}ImageFile-${projectId}`);
            if (!fileInput || !fileInput.files || !fileInput.files[0]) {
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('image', file);
            formData.append('project_id', projectId);
            formData.append('prompt', `Uploaded for ${toolName} operation`);

            // Show a loading indicator
            showToast('info', 'Uploading image...');

            try {
                const response = await fetch('/api/v1/images/upload/', {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success && data.image_id) {
                    showToast('success', 'Image uploaded! It will be used for this operation.');

                    // Store the uploaded image ID in a data attribute
                    fileInput.dataset.uploadedImageId = data.image_id;
                    fileInput.dataset.uploadedImageSeq = data.sequential_number || data.image_id.substring(0, 8);

                    // Also refresh the project dropdown so the image appears there
                    const selectId = `${toolName}ImageSource-${projectId}` || `${toolName}Source-${projectId}`;
                    await populateImageDropdown(projectId, selectId);

                    // Select the newly uploaded image in the dropdown
                    const select = document.getElementById(selectId);
                    if (select) {
                        select.value = data.image_id;
                    }
                } else {
                    showToast('error', data.error || 'Failed to upload image');
                }
            } catch (error) {
                console.error('Error uploading image:', error);
                showToast('error', 'Failed to upload image: ' + error.message);
            }
        }

        function getSelectedImageId(toolName, projectId) {
            // Check which source type is selected
            const projectRadio = document.getElementById(`${toolName}SourceProject-${projectId}`);

            if (isProjectSource) {
                // Get from dropdown
                const select = document.getElementById(`${toolName}ImageSource-${projectId}`) ||

                return select ? select.value : null;

                const fileInput = document.getElementById(`${toolName}ImageFile-${projectId}`);
                return fileInput ? fileInput.dataset.uploadedImageId : null;

        }

        /**
         * Initialize erase canvas with brush drawing
         */
        function initializeEraseCanvas(projectId) {
            const canvas = document.getElementById(`eraseCanvas-${projectId}`);
            const brushSlider = document.getElementById(`eraseBrushSize-${projectId}`);
            const brushLabel = document.getElementById(`eraseBrushSizeLabel-${projectId}`);

            if (brushSlider && brushLabel) {
                brushSlider.oninput = () => brushLabel.textContent = brushSlider.value;
            }

            if (!canvas) return;

            // Initialize drawing state for this canvas
            const stateKey = `erase-${projectId}`;
            canvasDrawingState[stateKey] = {
                isDrawing: false,
                lastX: 0,
                lastY: 0,
                originalImage: null
            };

            const ctx = canvas.getContext('2d');

            // Mouse events
            canvas.addEventListener('mousedown', (e) => startDrawing(e, stateKey, canvas, 'erase', projectId));
            canvas.addEventListener('mousemove', (e) => draw(e, stateKey, canvas, 'erase', projectId));
            canvas.addEventListener('mouseup', () => stopDrawing(stateKey));
            canvas.addEventListener('mouseout', () => stopDrawing(stateKey));

            // Touch events for mobile
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousedown', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                startDrawing(mouseEvent, stateKey, canvas, 'erase', projectId);
            });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const mouseEvent = new MouseEvent('mousemove', {
                    clientX: touch.clientX,
                    clientY: touch.clientY
                });
                draw(mouseEvent, stateKey, canvas, 'erase', projectId);
            });
            canvas.addEventListener('touchend', () => stopDrawing(stateKey));
        }

        /**
         * Start drawing on canvas
         */
        function startDrawing(e, stateKey, canvas, toolType, projectId) {
            const state = canvasDrawingState[stateKey];
            if (!state) return;

            state.isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            state.lastX = (e.clientX - rect.left) * scaleX;
            state.lastY = (e.clientY - rect.top) * scaleY;
        }

        /**
         * Draw on canvas
         */
        function draw(e, stateKey, canvas, toolType, projectId) {
            const state = canvasDrawingState[stateKey];
            if (!state || !state.isDrawing) return;

            const ctx = canvas.getContext('2d');
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            // Get brush size from slider
            const brushSlider = document.getElementById(`${toolType}BrushSize-${projectId}`);
            const brushSize = brushSlider ? parseInt(brushSlider.value) : 30;

            // Draw semi-transparent red/orange mask
            ctx.beginPath();
            ctx.moveTo(state.lastX, state.lastY);
            ctx.lineTo(x, y);
            ctx.strokeStyle = toolType === 'erase' ? 'rgba(255, 0, 0, 0.5)' : 'rgba(255, 165, 0, 0.5)';
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            state.lastX = x;
            state.lastY = y;
        }

        /**
         * Stop drawing
         */
        function stopDrawing(stateKey) {
            const state = canvasDrawingState[stateKey];
            if (state) {
                state.isDrawing = false;
            }
        }

        /** Execute Erase */
        async function executeErase(projectId) {
            const imageId = getSelectedImageId('erase', projectId);
            const erasePrompt = document.getElementById(`erasePrompt-${projectId}`).value.trim();

            if (!imageId) {
                showToast('error', 'Please select or upload an image');
                return;
            }

            // Session 198: Check if we have a mask drawn
            // If mask is drawn, use the proper erase API with mask
            // If no mask but have prompt, use search-and-replace
            // Session 198 FIX: Get the PROJECT-SPECIFIC canvas, not the global one
            const projectEraseCanvas = document.getElementById(`eraseCanvas-${projectId}`);
            const stateKey = `erase-${projectId}`;
            const drawingState = canvasDrawingState[stateKey];

            console.log('🧹 Erase check - projectEraseCanvas exists:', !!projectEraseCanvas);
            console.log('🧹 Erase check - drawingState exists:', !!drawingState);
            if (projectEraseCanvas) {
                console.log('🧹 Canvas size:', projectEraseCanvas.width, 'x', projectEraseCanvas.height);
            }

            // Check if user drew on the canvas (look for non-original pixels)
            const hasMask = projectEraseCanvas && hasDrawnOnCanvas(projectEraseCanvas, drawingState);
            console.log('🧹 Has drawn content:', hasMask);
            console.log('🧹 Erase prompt:', erasePrompt);

            if (!hasMask && !erasePrompt) {
                showToast('error', 'Please either draw on the image to mark what to erase, OR describe what to remove in the text field');
                return;
            }

            document.getElementById(`eraseProgress-${projectId}`).style.display = 'block';

            try {
                if (hasMask) {
                    // Session 198: Use proper mask-based erase API
                    console.log('🎨 Using MASK-BASED erase (Stability AI erase endpoint)');

                    // Get the source image from the canvas (with drawings on it)
                    const sourceBlob = await new Promise(resolve => projectEraseCanvas.toBlob(resolve, 'image/png'));
                    console.log('🎨 Source image blob size:', sourceBlob.size);

                    // Create the mask from drawn areas
                    const maskCanvas = createMaskFromCanvas(projectEraseCanvas, drawingState);
                    if (!maskCanvas) {
                        showToast('error', 'Failed to create mask from drawing');

        /** Check if canvas has any drawn content (old global canvas method) */
        function hasDrawnContent(canvas) {
            if (!canvas) {
                console.log('🧹 hasDrawnContent: canvas is null/undefined');
                return false;
            }
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            // The mask canvas is filled with BLACK (0,0,0) and drawing adds WHITE (255,255,255)
            // Check if any pixel is white (R > 200)
            let whitePixelCount = 0;
            for (let i = 0; i < imageData.data.length; i += 4) {
                // Check red channel - if > 200, it's likely white (drawn)
                if (imageData.data[i] > 200) {
                    whitePixelCount++;
                }
            }
            console.log('🧹 hasDrawnContent: found', whitePixelCount, 'white pixels out of', imageData.data.length / 4, 'total');
            return whitePixelCount > 10; // At least 10 white pixels to count as having content
        }

        /** Session 198: Check if user drew on the project-specific canvas */
        function hasDrawnOnCanvas(canvas, drawingState) {
            if (!canvas) {
                console.log('🧹 hasDrawnOnCanvas: canvas is null');
                return false;
            }
            if (!drawingState || !drawingState.originalImage) {
                console.log('🧹 hasDrawnOnCanvas: no original image saved');
                return false;
            }

            // Compare current canvas to original - if different, user drew something
            const ctx = canvas.getContext('2d');
            const currentData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            const originalData = drawingState.originalImage.data;

            let differentPixels = 0;
            for (let i = 0; i < currentData.length; i += 4) {
                // Check if red channel differs significantly (drawing is typically red/white)
                if (Math.abs(currentData[i] - originalData[i]) > 50 ||
                    Math.abs(currentData[i+1] - originalData[i+1]) > 50 ||
                    Math.abs(currentData[i+2] - originalData[i+2]) > 50) {
                    differentPixels++;
                }
            }

            console.log('🧹 hasDrawnOnCanvas: found', differentPixels, 'changed pixels');
            return differentPixels > 50; // At least 50 different pixels
        }

        /** Session 198: Create a mask image from the drawn areas */
        function createMaskFromCanvas(canvas, drawingState) {
            if (!canvas || !drawingState || !drawingState.originalImage) {
                console.log('🧹 createMaskFromCanvas: missing canvas or original');
                return null;
            }

            const ctx = canvas.getContext('2d');
            const currentData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const originalData = drawingState.originalImage;

            // Create mask: white where drawn, black everywhere else
            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = canvas.width;
            maskCanvas.height = canvas.height;
            const maskCtx = maskCanvas.getContext('2d');

            const maskImageData = maskCtx.createImageData(canvas.width, canvas.height);

            for (let i = 0; i < currentData.data.length; i += 4) {
                // Check if this pixel differs from original
                const isDifferent = Math.abs(currentData.data[i] - originalData.data[i]) > 50 ||
                                   Math.abs(currentData.data[i+1] - originalData.data[i+1]) > 50 ||
                                   Math.abs(currentData.data[i+2] - originalData.data[i+2]) > 50;

                if (isDifferent) {
                    // White = erase this area
                    maskImageData.data[i] = 255;     // R
                    maskImageData.data[i+1] = 255;   // G
                    maskImageData.data[i+2] = 255;   // B
                    maskImageData.data[i+3] = 255;   // A
                } else {
                    // Black = keep this area
                    maskImageData.data[i] = 0;
                    maskImageData.data[i+1] = 0;
                    maskImageData.data[i+2] = 0;
                    maskImageData.data[i+3] = 255;
                }
            }

            maskCtx.putImageData(maskImageData, 0, 0);
            console.log('🧹 Created mask canvas:', maskCanvas.width, 'x', maskCanvas.height);
            return maskCanvas;
        }

        /**

        async function deleteDecision(decisionId, title, projectId) {
            // Confirm deletion
            if (!confirm(`Delete decision: "${title}"?\n\nThis will also delete all agent recommendations and outcomes.`)) {
                return;
            }

            try {
                const response = await fetch(`/api/v1/coleadership/decisions/${decisionId}/delete/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken'),
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (data.success) {
                    // Show success message and refresh
                    alert('🗑️ Decision deleted successfully');
                    // Refresh the decisions list
                    refreshProjectDecisions(projectId);
                } else {
                    alert(`❌ ${data.error || 'Failed to delete decision'}`);
                }
            } catch (error) {
                console.error('Error deleting decision:', error);
                alert('❌ Error deleting decision: ' + error.message);
            }
        }

        /**
         * Extract smart context from project for auto-fill
         */
        function extractProjectContext(project, workflowType) {
            const context = {
                name: project.name,
                description: project.description || '',
                goal: project.goal || '',
                category: project.category || '',
                colors: project.colors || '',  // Use explicit colors field from professional intake form
                tags: project.tags || []
            };

            // Infer industry from category or description
            context.industry = inferIndustry(context.category, context.description);

            // Infer style/mood from description
            context.style = inferStyle(context.description + ' ' + context.goal);

            return context;
        }

        /**
         * Infer industry from category and description
         */
        function inferIndustry(category, description) {
            const text = (category + ' ' + description).toLowerCase();

            if (text.includes('tech') || text.includes('software') || text.includes('startup')) return 'tech';
            if (text.includes('coffee') || text.includes('café') || text.includes('cafe')) return 'coffee';
            if (text.includes('fitness') || text.includes('gym') || text.includes('workout')) return 'fitness';
            if (text.includes('food') || text.includes('restaurant') || text.includes('dining')) return 'food';
            if (text.includes('finance') || text.includes('business') || text.includes('consulting')) return 'finance';
            if (text.includes('health') || text.includes('medical') || text.includes('clinic')) return 'health';
            if (text.includes('education') || text.includes('school') || text.includes('learning')) return 'education';
            if (text.includes('retail') || text.includes('shop') || text.includes('store')) return 'retail';
            if (text.includes('creative') || text.includes('art') || text.includes('design')) return 'creative';
            if (text.includes('construction') || text.includes('contractor')) return 'construction';

            return '';
        }

        /**
         * Infer style/mood from description
         */
        function inferStyle(text) {
            text = text.toLowerCase();

            if (text.includes('modern') || text.includes('minimalist') || text.includes('clean')) return 'modern and minimalist';
            if (text.includes('professional') || text.includes('corporate') || text.includes('business')) return 'professional and polished';
            if (text.includes('playful') || text.includes('fun') || text.includes('friendly')) return 'playful and approachable';
            if (text.includes('luxury') || text.includes('premium') || text.includes('elegant')) return 'elegant and sophisticated';
            if (text.includes('bold') || text.includes('energetic') || text.includes('dynamic')) return 'bold and energetic';

            return '';
        }

        /**
         * Execute workflow from modal with project linking
         * Session 63: Core execution function with backend integration
         */
        async function executeWorkflowFromModal(projectId, workflowType) {
            try {
                // Close the execution modal
                const modal = bootstrap.Modal.getInstance(document.getElementById('workflow-execution-modal'));
                if (modal) {
                    modal.hide();
                }

                // Show generating notification
                showNotification('🎨 Generating assets for project...', 'info', 3000);

                // Collect form data based on workflow type
                const formData = collectWorkflowFormData(workflowType);

                if (!formData) {
                    showNotification('Please fill in required fields', 'danger');
                    return;
                }

                // Call backend to execute workflow
                const response = await fetch('/api/workflows/execute-for-project/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: JSON.stringify({
                        project_id: projectId,
                        workflow_type: workflowType,
                        form_data: formData
                    })
                });

                // Session 63: Better error handling - check response status first
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Backend error response:', errorText);
                    try {
                        const errorJson = JSON.parse(errorText);
                        showNotification(errorJson.error || 'Server error occurred', 'danger');
                    } catch (e) {
                        showNotification(`Server error (${response.status}): ${errorText.substring(0, 100)}`, 'danger');
                    }
                    return;
                }

                const result = await response.json();

                if (result.success) {
                    showNotification(`✅ ${result.count || 0} assets generated and linked to project!`, 'success', 5000);

                    // Refresh project details to show new assets
                    await viewProjectDetails(projectId);
                } else {
                    showNotification(result.error || 'Failed to execute workflow', 'danger');
                }

            } catch (error) {
                console.error('Error executing workflow:', error);
                showNotification('Error executing workflow', 'danger');
            }
        }

        /**
         * Re-execute an existing workflow from project
         */
        async function executeWorkflowFromProject(projectId, workflowHistoryId) {
            const project = projectManagement.projects.find(p => p.id === projectId);
            if (!project) return;

            try {
                // Fetch workflow history details
                const response = await fetch(`/api/workflows/history/?limit=1000`);
                const data = await response.json();
                const workflow = data.workflows.find(w => w.id === workflowHistoryId);

                if (!workflow) {
                    showNotification('Workflow not found', 'danger');
                    return;
                }

                // Show executing state
                const workflowElem = document.getElementById(`workflow-${workflowHistoryId}`);
                if (workflowElem) {
                    workflowElem.style.opacity = '0.6';
                    workflowElem.innerHTML += '<div class="text-center mt-2"><div class="spinner-border spinner-border-sm text-warning"></div> Executing...</div>';
                }

                // Re-execute the workflow
                const config = workflow.workflow_config;
                const results = [];

                for (let i = 0; i < config.steps.length; i++) {
                    const step = config.steps[i];

                    // Call workflow execution endpoint
                    const stepResponse = await fetch('/api/workflows/execute/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify({
                            workflow_type: workflow.workflow_type,
                            step: step,
                            previous_results: results
                        })
                    });

                    const stepData = await stepResponse.json();
                    if (stepData.success && stepData.result) {
                        results.push(stepData.result);
                    }
                }

                // Refresh project details
                await viewProjectDetails(projectId);

                showNotification(`Workflow "${workflow.workflow_name}" re-executed successfully!`, 'success');

            } catch (error) {
                console.error('Error executing workflow:', error);
                showNotification('Error executing workflow: ' + error.message, 'danger');

                // Restore workflow element
                const workflowElem = document.getElementById(`workflow-${workflowHistoryId}`);
                if (workflowElem) {
                    workflowElem.style.opacity = '1';
                }
            }
        }

        /**
         * Execute all workflows in the project sequentially
         */
        async function executeAllWorkflows(projectId) {
            const project = projectManagement.projects.find(p => p.id === projectId);
            if (!project || !project.workflows || project.workflows.length === 0) return;

            if (!confirm(`Execute all ${project.workflows.length} workflows in sequence? This may take several minutes.`)) {
                return;
            }

            showNotification('Starting sequential workflow execution...', 'info');

            let successCount = 0;
            let failCount = 0;

            for (const wf of project.workflows) {
                try {
                    await executeWorkflowFromProject(projectId, wf.workflow_history_id);
                    successCount++;
                } catch (error) {
                    console.error(`Failed to execute workflow ${wf.workflow_name}:`, error);
                    failCount++;
                }
            }

            showNotification(`Completed! ${successCount} successful, ${failCount} failed.`, successCount > 0 ? 'success' : 'warning');

            // Refresh project
            await viewProjectDetails(projectId);
        }

        // Make functions global for onclick handlers
        window.viewProjectDetails = viewProjectDetails;
        window.deleteProject = deleteProject;
        window.openAddWorkflowModal = openAddWorkflowModal;
        window.updateAddWorkflowButton = updateAddWorkflowButton;
        window.removeWorkflowFromProject = removeWorkflowFromProject;
        window.selectCampaign = selectCampaign;  // Session 62: Phase C.3
        window.createNewWorkflowForProject = createNewWorkflowForProject;  // Session 62: Phase C.4
        window.executeNewWorkflow = executeNewWorkflow;  // Session 62: Phase C.4
        window.executeWorkflowFromProject = executeWorkflowFromProject;  // Session 62: Phase C.4
        window.executeAllWorkflows = executeAllWorkflows;  // Session 62: Phase C.4

        // ====================================================================
        // END PROJECT MANAGEMENT SYSTEM
</script>
