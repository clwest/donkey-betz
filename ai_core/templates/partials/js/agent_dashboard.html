<script>
        // SESSION 216: AGENT INTELLIGENCE DASHBOARD FUNCTIONS
        // ============================================================

        // Session 216: Load Agent Intelligence Dashboard
        async function loadAgentDashboard() {
            const loadingEl = document.getElementById('agents-loading');
            const containerEl = document.getElementById('agents-container');

            try {
                // Fetch dashboard data
                const response = await fetch('/api/collective/dashboard/', {
                    headers: { 'X-CSRFToken': getCsrfToken() }
                });
                const data = await response.json();

                // Update stats
                document.getElementById('agent-total-count').textContent = data.stats?.agents?.total || 0;
                document.getElementById('agent-collaborations-count').textContent = data.stats?.collaboration?.total || 0;
                document.getElementById('agent-knowledge-count').textContent = data.stats?.knowledge?.total_items || 0;

                const successRate = data.stats?.collaboration?.success_rate || 0;
                document.getElementById('agent-success-rate').textContent = Math.round(successRate * 100) + '%';

                // Session 244: Update learning stats
                document.getElementById('agent-learning-connections').textContent = data.stats?.agents?.learning_connections || 0;
                document.getElementById('agent-transfers-count').textContent = data.stats?.learning?.total_transfers || 0;
                document.getElementById('agent-synthesized-count').textContent = data.stats?.learning?.synthesized_items || 0;

                // Session 244: Update learning feed
                updateLearningFeed(data.stats?.learning?.recent_transfers || []);

                // Update health banner
                updateHealthBanner(data.monitor);

                // Update active collaborations
                updateActiveCollaborations(data.monitor);

                // Update network stats
                document.getElementById('network-nodes-badge').textContent = (data.network?.node_count || 0) + ' nodes';
                document.getElementById('network-edges-badge').textContent = (data.network?.edge_count || 0) + ' connections';

                // Load additional data
                await Promise.all([
                    loadKnowledgeGaps(),
                    loadImprovements(),
                    loadTopCollaborators(),
                    loadCollaborationNetwork()
                ]);

                // Session 217: Load analytics charts
                loadAnalyticsCharts();

                // Session 217B: Load training dashboard
                loadTrainingDashboard();

                // Session 217C: Load workflow analytics
                loadWorkflowAnalytics();

                // Session 244: Load agent conversations
                loadAgentConversations();

                // Hide loading, show content
                loadingEl.style.display = 'none';
                containerEl.style.display = 'block';

            } catch (error) {
                console.error('Error loading agent dashboard:', error);
                loadingEl.innerHTML = '<p class="text-danger">Failed to load agent intelligence. <button class="btn btn-sm btn-outline-warning" onclick="loadAgentDashboard()">Retry</button></p>';
            }
        }

        // Session 216: Update Health Banner
        function updateHealthBanner(monitor) {
            const banner = document.getElementById('collaboration-health-banner');
            const status = document.getElementById('health-status');
            const details = document.getElementById('health-details');

            const health = monitor?.collaboration_health || 'unknown';
            status.textContent = health.charAt(0).toUpperCase() + health.slice(1);

            if (health === 'healthy') {
                banner.className = 'alert alert-success d-flex align-items-center';
                banner.style.background = 'rgba(34, 197, 94, 0.15)';
                banner.style.border = '1px solid #22c55e';
                banner.querySelector('span').textContent = '✅';
                details.textContent = `${monitor?.active_collaborations || 0} active, ${Math.round((monitor?.success_rate_24h || 0) * 100)}% success rate (24h)`;
            } else if (health === 'degraded') {
                banner.className = 'alert alert-warning d-flex align-items-center';
                banner.style.background = 'rgba(251, 191, 36, 0.15)';
                banner.style.border = '1px solid #fbbf24';
                banner.querySelector('span').textContent = '⚠️';
                details.textContent = 'Some collaborations experiencing delays';
            } else {
                banner.className = 'alert alert-danger d-flex align-items-center';
                banner.style.background = 'rgba(239, 68, 68, 0.15)';
                banner.style.border = '1px solid #ef4444';
                banner.querySelector('span').textContent = '❌';
                details.textContent = 'Collaboration system needs attention';
            }
        }

        // Session 244: Update Learning Feed
        function updateLearningFeed(transfers) {
            const listEl = document.getElementById('learning-feed-list');

            if (transfers && transfers.length > 0) {
                listEl.innerHTML = transfers.map(t => {
                    const timeAgo = t.time ? formatTimeAgo(t.time) : 'Just now';
                    const usefulnessColor = t.usefulness >= 0.8 ? '#22c55e' :
                                           t.usefulness >= 0.5 ? '#f59e0b' : '#ef4444';
                    return `
                        <div class="d-flex align-items-center mb-2 p-2" style="background: rgba(236, 72, 153, 0.1); border-radius: 8px; border-left: 3px solid ${usefulnessColor};">
                            <div style="flex: 1;">
                                <div style="color: #f9a8d4; font-size: 13px;">
                                    <span style="color: #ec4899;">🎓 ${t.teacher}</span>
                                    <span style="opacity: 0.7;">→</span>
                                    <span style="color: #14b8a6;">📚 ${t.student}</span>
                                </div>
                                <div class="text-muted small mt-1" style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                    "${t.knowledge}"
                                </div>
                            </div>
                            <div class="text-end">
                                <div class="badge" style="background: ${usefulnessColor};">${Math.round(t.usefulness * 100)}%</div>
                                <div class="text-muted small">${timeAgo}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                listEl.innerHTML = '<p class="text-muted text-center">No recent learning activity. Next cycle in ~10 minutes.</p>';
            }
        }

        // Session 244: Format time ago helper
        function formatTimeAgo(isoTime) {
            const date = new Date(isoTime);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            return `${diffDays}d ago`;
        }

        // Session 244: Update Agent Conversations Display
        function updateAgentConversations(data) {
            const listEl = document.getElementById('agent-conversations-list');
            const todayBadge = document.getElementById('conversations-today-badge');

            if (data?.total_today !== undefined) {
                todayBadge.textContent = `${data.total_today} today`;
            }

            const conversations = data?.recent_conversations || [];

            if (conversations.length > 0) {
                listEl.innerHTML = conversations.map(conv => {
                    const timeAgo = conv.started_at ? formatTimeAgo(conv.started_at) : 'Just now';
                    const statusBadge = conv.status === 'concluded' ?
                        '<span class="badge bg-success">Concluded</span>' :
                        '<span class="badge bg-warning">Active</span>';
                    const typeIcons = {
                        'knowledge_sharing': '📚',
                        'question_answer': '❓',
                        'debate': '⚔️',
                        'brainstorm': '💡',
                        'consultation': '🎓',
                        'synthesis': '🔮'
                    };
                    const typeIcon = typeIcons[conv.type] || '💬';

                    // Build conversation messages display (chat bubble style)
                    let messagesHtml = '';
                    if (conv.messages && conv.messages.length > 0) {
                        // Assign consistent colors to each agent
                        const agentColors = {};
                        const colorPalette = ['#8b5cf6', '#06b6d4', '#22c55e', '#f59e0b', '#ec4899', '#6366f1'];
                        let colorIndex = 0;

                        messagesHtml = conv.messages.map((msg, idx) => {
                            // Get or assign color for this agent
                            if (!agentColors[msg.agent]) {
                                agentColors[msg.agent] = colorPalette[colorIndex % colorPalette.length];
                                colorIndex++;
                            }
                            const agentColor = agentColors[msg.agent];

                            // Clean content - remove agent name prefix if GPT included it
                            let cleanContent = msg.content;
                            const prefixPattern = new RegExp(`^${msg.agent}:\\s*`, 'i');
                            cleanContent = cleanContent.replace(prefixPattern, '');

                            // Alternate alignment for chat feel
                            const isLeft = idx % 2 === 0;
                            const alignStyle = isLeft ? 'margin-right: 15%;' : 'margin-left: 15%;';

                            return `
                                <div class="mb-2 p-2" style="background: rgba(139, 92, 246, 0.08); border-radius: 12px; border-left: 3px solid ${agentColor}; ${alignStyle}">
                                    <div style="font-size: 11px; color: ${agentColor}; font-weight: 600; margin-bottom: 4px;">
                                        ${msg.agent}
                                    </div>
                                    <div style="color: #e5e7eb; font-size: 13px; line-height: 1.4;">${cleanContent}</div>
                                </div>
                            `;
                        }).join('');
                    }

                    // Build conclusion display if available
                    let conclusionHtml = '';
                    if (conv.conclusion) {
                        conclusionHtml = `
                            <div class="mt-2 p-2" style="background: rgba(34, 197, 94, 0.1); border-radius: 6px; border-left: 2px solid #22c55e;">
                                <div style="font-size: 11px; color: #22c55e;">Conclusion:</div>
                                <div style="color: #d1d5db; font-size: 12px;">${conv.conclusion}</div>
                            </div>
                        `;
                    }

                    return `
                        <div class="mb-3 p-3" style="background: rgba(139, 92, 246, 0.1); border-radius: 10px; border: 1px solid rgba(139, 92, 246, 0.3);">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <span style="font-size: 18px;">${typeIcon}</span>
                                    <strong style="color: #c4b5fd;">${conv.topic}</strong>
                                </div>
                                <div class="text-end">
                                    ${statusBadge}
                                    <div class="text-muted small">${timeAgo}</div>
                                </div>
                            </div>
                            <div style="font-size: 12px; color: #9ca3af; margin-bottom: 8px;">
                                Participants: ${conv.participants.join(' + ')}
                                <span class="ms-2 badge bg-secondary">${conv.message_count} messages</span>
                            </div>
                            <div class="conversation-messages">
                                ${messagesHtml}
                            </div>
                            ${conclusionHtml}
                        </div>
                    `;
                }).join('');
            } else {
                listEl.innerHTML = '<p class="text-muted text-center">No recent conversations. Click "Start Chat" to begin!</p>';
            }
        }

        // Session 244: WebSocket for Real-Time Agent Conversations
        let conversationWs = null;
        let conversationWsReconnectTimeout = null;

        function connectAgentConversationWs() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${wsProtocol}//${window.location.host}/ws/agent-conversations/`;

            const statusBadge = document.getElementById('conversation-ws-status');

            try {
                conversationWs = new WebSocket(wsUrl);

                conversationWs.onopen = function() {
                    console.log('Agent Conversation WebSocket connected');
                    statusBadge.innerHTML = '<span style="color: #22c55e;">Live</span>';
                    statusBadge.style.background = 'rgba(34, 197, 94, 0.3)';
                };

                conversationWs.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    handleConversationWsMessage(data);
                };

                conversationWs.onclose = function() {
                    console.log('Agent Conversation WebSocket disconnected');
                    statusBadge.innerHTML = '<span style="color: #f59e0b;">Reconnecting...</span>';
                    statusBadge.style.background = 'rgba(245, 158, 11, 0.3)';

                    // Reconnect after 5 seconds
                    conversationWsReconnectTimeout = setTimeout(connectAgentConversationWs, 5000);
                };

                conversationWs.onerror = function(error) {
                    console.error('Agent Conversation WebSocket error:', error);
                    statusBadge.innerHTML = '<span style="color: #ef4444;">Error</span>';
                    statusBadge.style.background = 'rgba(239, 68, 68, 0.3)';
                };

            } catch (error) {
                console.error('Failed to connect to Agent Conversation WebSocket:', error);
            }
        }

        function handleConversationWsMessage(data) {
            console.log('Conversation WS message:', data);

            switch (data.type) {
                case 'connected':
                    console.log('Connected to agent conversations stream');
                    break;

                case 'recent_conversations':
                    // Format and display recent conversations
                    if (data.conversations && data.conversations.length > 0) {
                        const formattedData = {
                            total_today: data.conversations.filter(c => {
                                const today = new Date().toDateString();
                                return new Date(c.started_at).toDateString() === today;
                            }).length,
                            recent_conversations: data.conversations.map(conv => ({
                                topic: conv.topic,
                                type: conv.type,
                                status: conv.status,
                                initiator: conv.initiator,
                                participants: conv.participants,
                                message_count: conv.message_count,
                                conclusion: conv.conclusion,
                                started_at: conv.started_at,
                                messages: conv.messages
                            }))
                        };
                        updateAgentConversations(formattedData);
                    }
                    break;

                case 'conversation_starting':
                    showNotification('Agent conversation starting...', 'info');
                    break;

                case 'conversation_started':
                    showTypingIndicator(data.participants[0], true);
                    break;

                case 'typing':
                    showTypingIndicator(data.agent, true);
                    break;

                case 'new_message':
                    showTypingIndicator(null, false);
                    appendLiveMessage(data);
                    break;

                case 'conversation_complete':
                    showTypingIndicator(null, false);
                    document.getElementById('start-conv-spinner').classList.add('d-none');
                    document.getElementById('start-conversation-btn').disabled = false;

                    if (data.result && data.result.status === 'success') {
                        showNotification('Conversation complete!', 'success');
                        // Refresh the conversation list
                        if (conversationWs && conversationWs.readyState === WebSocket.OPEN) {
                            conversationWs.send(JSON.stringify({ type: 'get_recent' }));
                        }
                    }
                    break;

                case 'conversation_ended':
                    showTypingIndicator(null, false);
                    showNotification(`Conversation concluded: ${data.conclusion?.substring(0, 50)}...`, 'success');
                    break;

                case 'error':
                    showTypingIndicator(null, false);
                    document.getElementById('start-conv-spinner').classList.add('d-none');
                    document.getElementById('start-conversation-btn').disabled = false;
                    showNotification(`Error: ${data.message}`, 'error');
                    break;
            }
        }

        function showTypingIndicator(agentName, show) {
            const indicator = document.getElementById('typing-indicator');
            const nameSpan = document.getElementById('typing-agent-name');

            if (show && agentName) {
                nameSpan.textContent = `${agentName} is thinking`;
                indicator.classList.remove('d-none');
            } else {
                indicator.classList.add('d-none');
            }
        }

        function appendLiveMessage(msgData) {
            const listEl = document.getElementById('agent-conversations-list');

            // Create or find live conversation container
            let liveContainer = document.getElementById('live-conversation-container');
            if (!liveContainer) {
                liveContainer = document.createElement('div');
                liveContainer.id = 'live-conversation-container';
                liveContainer.className = 'mb-3 p-3';
                liveContainer.style.cssText = 'background: rgba(139, 92, 246, 0.15); border-radius: 10px; border: 2px solid #8b5cf6;';
                liveContainer.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <strong style="color: #c4b5fd;">Live Conversation</strong>
                        <span class="badge" style="background: #22c55e; animation: pulse 1.5s infinite;">LIVE</span>
                    </div>
                    <div id="live-messages"></div>
                `;
                listEl.insertBefore(liveContainer, listEl.firstChild);
            }

            const messagesDiv = document.getElementById('live-messages');
            const msgTypeColors = {
                'question': '#f59e0b',
                'insight': '#22c55e',
                'agreement': '#06b6d4',
                'disagreement': '#ef4444',
                'suggestion': '#8b5cf6',
                'statement': '#94a3b8',
                'conclusion': '#22c55e'
            };
            const msgColor = msgTypeColors[msgData.message_type] || '#94a3b8';

            const msgHtml = `
                <div class="mb-2 p-2" style="background: rgba(139, 92, 246, 0.05); border-radius: 6px; border-left: 2px solid ${msgColor}; animation: fadeIn 0.3s;">
                    <div style="font-size: 12px; color: #a78bfa;">
                        <strong>${msgData.agent}</strong>
                        <span class="badge ms-2" style="background: ${msgColor}; font-size: 9px;">${msgData.message_type}</span>
                    </div>
                    <div style="color: #d1d5db; font-size: 13px; margin-top: 4px;">${msgData.content}</div>
                </div>
            `;
            messagesDiv.insertAdjacentHTML('beforeend', msgHtml);

            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function startLiveConversation() {
            if (!conversationWs || conversationWs.readyState !== WebSocket.OPEN) {
                showNotification('WebSocket not connected. Reconnecting...', 'warning');
                connectAgentConversationWs();
                return;
            }

            // Show spinner
            document.getElementById('start-conv-spinner').classList.remove('d-none');
            document.getElementById('start-conversation-btn').disabled = true;

            // Clear any existing live conversation
            const liveContainer = document.getElementById('live-conversation-container');
            if (liveContainer) {
                liveContainer.remove();
            }

            // Request new conversation
            conversationWs.send(JSON.stringify({
                type: 'start_conversation',
                topic: null  // Let the system pick a topic from agent knowledge
            }));
        }

        // Connect WebSocket when Agents tab is activated
        document.addEventListener('DOMContentLoaded', function() {
            // Check if we're on the Agents tab initially or when tab changes
            const agentsTabTrigger = document.querySelector('[data-bs-target="#agents"]');
            if (agentsTabTrigger) {
                agentsTabTrigger.addEventListener('shown.bs.tab', function() {
                    // Connect WebSocket for conversations
                    if (!conversationWs || conversationWs.readyState !== WebSocket.OPEN) {
                        connectAgentConversationWs();
                    }
                    // Session 248: Load learning feed and dreams when tab is shown
                    loadLearningFeed();
                    loadAgentDreams();
                    startLearningFeedAutoRefresh();
                });

                // Stop auto-refresh when leaving Agents tab
                agentsTabTrigger.addEventListener('hidden.bs.tab', function() {
                    stopLearningFeedAutoRefresh();
                });
            }
        });

        // Session 244: Load Agent Conversations from API (fallback)
        async function loadAgentConversations() {
            try {
                const response = await fetch('/api/agent-conversations/?limit=5');
                const data = await response.json();

                if (data.success) {
                    // Transform API data to format expected by updateAgentConversations
                    const formattedData = {
                        total_today: data.today_count,
                        recent_conversations: data.conversations.map(conv => ({
                            topic: conv.topic,
                            type: conv.type,
                            type_display: conv.type_display,
                            status: conv.status,
                            initiator: conv.initiator,
                            participants: conv.participants.map(p => p.name),
                            message_count: conv.message_count,
                            quality_score: conv.quality_score,
                            conclusion: conv.conclusion,
                            started_at: conv.started_at,
                            messages: conv.messages.map(m => ({
                                agent: m.agent,
                                content: m.content,
                                type: m.type,
                                sequence: m.sequence
                            }))
                        }))
                    };
                    updateAgentConversations(formattedData);
                }
            } catch (error) {
                console.error('Error loading agent conversations:', error);
            }
        }

        // =====================================================================
        // Session 248: Live Agent Learning Activity Feed
        // =====================================================================

        // Load learning feed from API (Session 248: Use KnowledgeTransfer endpoint)
        async function loadLearningFeed() {
            try {
                const response = await fetch('/api/agent-learning/activity/');
                const data = await response.json();

                if (data.feed_items || data.error === undefined) {
                    updateLearningFeed(data);
                }
            } catch (error) {
                console.error('Error loading learning feed:', error);
            }
        }

        // Update the learning feed UI
        function updateLearningFeed(data) {
            const feedList = document.getElementById('learning-feed-list');
            if (!feedList) return;

            if (!data.feed_items || data.feed_items.length === 0) {
                feedList.innerHTML = `
                    <div class="text-center py-3">
                        <span style="font-size: 32px; opacity: 0.5;">🧠</span>
                        <p class="text-muted mt-2 mb-0">No learning activity yet...</p>
                        <small class="text-muted">Agents learn from each other every 10 minutes</small>
                    </div>
                `;
                return;
            }

            // Learning type icons
            const typeIcons = {
                'self_learning': '📚',
                'peer_learning': '🤝',
                'teaching': '📖',
                'knowledge_transfer': '🔄',
                'default': '💡'
            };

            feedList.innerHTML = data.feed_items.map(item => {
                const icon = typeIcons[item.type] || typeIcons['default'];
                const timeAgo = formatTimeAgo(item.timestamp);
                const gainText = item.effectiveness_gain > 0
                    ? `<span class="text-success">+${(item.effectiveness_gain * 100).toFixed(1)}%</span>`
                    : '';

                return `
                    <div class="learning-item p-2 mb-2" style="background: rgba(236, 72, 153, 0.1); border-radius: 8px; border-left: 3px solid #ec4899;">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="d-flex align-items-center">
                                <span style="font-size: 18px; margin-right: 8px;">${icon}</span>
                                <div>
                                    <span style="color: #f9a8d4; font-weight: 500;">${item.teacher}</span>
                                    ${item.teacher !== item.student ? `<span class="text-muted mx-1">→</span><span style="color: #a78bfa;">${item.student}</span>` : ''}
                                </div>
                            </div>
                            <small class="text-muted">${timeAgo}</small>
                        </div>
                        <p class="mb-1 mt-1" style="color: #d1d5db; font-size: 13px;">${item.description}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small style="color: #9ca3af;">📖 ${item.knowledge}</small>
                            ${gainText}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Set up auto-refresh for learning feed (every 60 seconds)
        let learningFeedInterval = null;
        function startLearningFeedAutoRefresh() {
            if (learningFeedInterval) clearInterval(learningFeedInterval);
            learningFeedInterval = setInterval(loadLearningFeed, 60000);
        }

        function stopLearningFeedAutoRefresh() {
            if (learningFeedInterval) {
                clearInterval(learningFeedInterval);
                learningFeedInterval = null;
            }
        }

        // =====================================================================
        // Session 247: Agent Dreams - Creative Idle Thoughts
        // =====================================================================

        // Load agent dreams from API
        async function loadAgentDreams() {
            try {
                const response = await fetch('/api/agent-dreams/?limit=10');
                const data = await response.json();

                if (data.success) {
                    updateAgentDreams(data);
                }
            } catch (error) {
                console.error('Error loading agent dreams:', error);
            }
        }

        // Update the dreams UI
        function updateAgentDreams(data) {
            const dreamsList = document.getElementById('agent-dreams-list');
            const unreadBadge = document.getElementById('dreams-unread-badge');
            const todayBadge = document.getElementById('dreams-today-badge');

            if (unreadBadge) unreadBadge.textContent = `${data.unread_count || 0} new dreams`;
            if (todayBadge) todayBadge.textContent = `${data.today_count || 0} today`;

            if (!data.dreams || data.dreams.length === 0) {
                dreamsList.innerHTML = `
                    <div class="text-center py-4">
                        <span style="font-size: 48px; opacity: 0.5;">💭</span>
                        <p class="text-muted mt-2">No dreams yet... agents are still waking up!</p>
                        <small class="text-muted">Dreams generate every 15 minutes when agents are idle</small>
                    </div>
                `;
                return;
            }

            // Dream type icons
            const dreamTypeIcons = {
                'creative_idea': '💡',
                'what_if': '🤔',
                'mashup': '🔀',
                'prediction': '🔮',
                'improvement': '📈',
                'observation': '👁️',
                'wild_thought': '🌀'
            };

            const dreamTypeLabels = {
                'creative_idea': 'Creative Idea',
                'what_if': 'What If?',
                'mashup': 'Mashup',
                'prediction': 'Prediction',
                'improvement': 'Improvement',
                'observation': 'Observation',
                'wild_thought': 'Wild Thought'
            };

            dreamsList.innerHTML = data.dreams.map(dream => {
                const icon = dreamTypeIcons[dream.dream_type] || '💭';
                const typeLabel = dreamTypeLabels[dream.dream_type] || dream.dream_type;
                const timeAgo = formatTimeAgo(dream.dreamed_at);
                const isUnread = !dream.shown_to_user;

                return `
                    <div class="dream-card ${isUnread ? 'border-start border-pink border-3' : ''}" data-dream-id="${dream.id}">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <div class="d-flex align-items-center">
                                <span style="font-size: 24px; margin-right: 8px;">${icon}</span>

        // Format time ago helper
        function formatTimeAgo(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 60) return 'just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }

                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },

                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        // Session 249: Show the feedback effect message
                        const emoji = reaction === 'like' ? '👍' : reaction === 'interesting' ? '🤔' : '🚀';
                        let message = `${emoji} Reaction recorded!`;

                        // Add the feedback effect message
                        if (data.feedback_effect) {
                            message += ` ${data.feedback_effect}`;

                        // Special notification for "explore" reaction
                        if (reaction === 'explore' && data.exploration_id) {
                            message = `🚀 Exploring this idea! The agent is diving deeper...`;

        // Get emoji for agent based on name

            if (nameL.includes('image')) return '🎨';
            if (nameL.includes('video')) return '🎬';
            if (nameL.includes('audio')) return '🎵';
            if (nameL.includes('research')) return '🔍';
            if (nameL.includes('trend')) return '📈';
            if (nameL.includes('brand')) return '💼';
            if (nameL.includes('content')) return '📝';
            if (nameL.includes('seo')) return '🔗';
            if (nameL.includes('3d')) return '🧊';
            if (nameL.includes('prompt')) return '✨';

        // Show the neural network visualization
        function showHiveMindVisualization(participants) {
            const vizEl = document.getElementById('hive-mind-visualization');
            const nodesEl = document.getElementById('hive-mind-agent-nodes');
            const contributionsEl = document.getElementById('hive-mind-contributions');
            const contributionsListEl = document.getElementById('hive-mind-contributions-list');

            vizEl.style.display = 'block';
            contributionsEl.style.display = 'block';
            contributionsListEl.innerHTML = '';

            // Position agents in a circle around the center
            const radius = 100;
            const centerX = 50;
            const centerY = 50;

            nodesEl.innerHTML = participants.map((agent, index) => {
                const angle = (2 * Math.PI * index) / participants.length - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);

                return `
                    <div class="hive-agent-node pending" id="hive-node-${agent.id}"
                         style="left: calc(${x}% - 25px); top: calc(${y}% - 25px);"
                         title="${agent.name}: ${agent.specialization}">
                        ${getAgentEmoji(agent.name)}
                    </div>
                `;
            }).join('');

            // Reset progress
            document.getElementById('hive-mind-progress-bar').style.width = '0%';
            document.getElementById('hive-mind-progress-text').textContent = 'Agents are thinking...';
        }

        // Connect to Hive Mind WebSocket for real-time updates
        function connectHiveMindWebSocket(sessionId) {
            if (hiveMindWebSocket) {
                hiveMindWebSocket.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            hiveMindWebSocket = new WebSocket(`${protocol}//${window.location.host}/ws/hive-mind/`);

            hiveMindWebSocket.onopen = function() {
                console.log('Hive Mind WebSocket connected');
                // Subscribe to this session
                hiveMindWebSocket.send(JSON.stringify({
                    type: 'subscribe',
                    session_id: sessionId
                }));
            };

            hiveMindWebSocket.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleHiveMindUpdate(data);
            };

            hiveMindWebSocket.onerror = function(error) {
                console.error('Hive Mind WebSocket error:', error);
            };

            hiveMindWebSocket.onclose = function() {
                console.log('Hive Mind WebSocket closed');
            };
        }

        // Handle real-time Hive Mind updates
        function handleHiveMindUpdate(data) {
            console.log('Hive Mind update:', data);

            if (data.type === 'contribution_update') {
                // Update agent node status
                const nodeEl = document.querySelector(`[id*="hive-node"]`);
                const nodes = document.querySelectorAll('.hive-agent-node');

                nodes.forEach(node => {
                    if (node.title.includes(data.agent_name)) {
                        node.classList.remove('pending', 'thinking', 'completed', 'failed');
                        node.classList.add(data.status);
                    }
                });

                // Update progress
                updateHiveMindProgress();

                // Add contribution to feed if completed
                if (data.status === 'completed') {
                    // We'll fetch the full contribution details
                    fetchAndDisplayContribution(data.agent_name);
                }
            } else if (data.type === 'session_status') {
                if (data.status === 'synthesizing') {
                    document.getElementById('hive-mind-progress-text').textContent = 'Synthesizing all contributions...';
                    document.getElementById('hive-mind-progress-bar').style.width = '90%';
                } else if (data.status === 'completed') {
                    document.getElementById('hive-mind-progress-text').textContent = 'Complete!';
                    document.getElementById('hive-mind-progress-bar').style.width = '100%';
                    document.getElementById('hive-mind-status-badge').textContent = 'Complete';

                    // Fetch and display the synthesis
                    fetchHiveMindSynthesis();
                }
            } else if (data.type === 'session_status' && data.session_id === currentHiveMindSession) {
                // Update progress based on session data
                if (data.progress !== undefined) {
                    document.getElementById('hive-mind-progress-bar').style.width = `${data.progress}%`;
                }
            }
        }

        // Update progress bar based on completed nodes
        function updateHiveMindProgress() {
            const nodes = document.querySelectorAll('.hive-agent-node');
            const completed = document.querySelectorAll('.hive-agent-node.completed').length;
            const total = nodes.length;

            if (total > 0) {
                const progress = Math.round((completed / total) * 80); // 80% for contributions, 20% for synthesis
                document.getElementById('hive-mind-progress-bar').style.width = `${progress}%`;
                document.getElementById('hive-mind-progress-text').textContent =
                    `${completed}/${total} agents contributed`;
            }
        }

        // Fetch and display a contribution in the feed

        // Get color for perspective type
        function getPerspectiveColor(type) {
            const colors = {
                'analysis': '#8b5cf6',
                'creative': '#ec4899',
                'strategic': '#22c55e',
                'technical': '#06b6d4',
                'general': '#6b7280'
            };
            return colors[type] || colors['general'];
        }

        // Format synthesis text with basic styling
        function formatSynthesis(text) {
            // Convert markdown-like headers and lists
            return text
                .replace(/^## (.+)$/gm, '<h6 style="color: #22c55e; margin-top: 16px;">$1</h6>')
                .replace(/^# (.+)$/gm, '<h5 style="color: #22c55e; margin-top: 16px;">$1</h5>')
                .replace(/^\- (.+)$/gm, '<li style="margin-left: 16px;">$1</li>')
                .replace(/\n/g, '<br>');
        }

        // Helper function for time ago (if not already defined)
        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
        }

        async function loadCollaborationNetwork() {
            const canvas = document.getElementById('network-canvas');

        // Session 216: Draw Network Graph on Canvas
        function drawNetworkGraph(canvas, nodes, edges) {
            const ctx = canvas.getContext('2d');
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;

            canvas.width = width;
            canvas.height = height;

            // Clear canvas
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Position nodes in a circle
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(width, height) * 0.35;

            nodes.forEach((node, idx) => {
                const angle = (idx / nodes.length) * 2 * Math.PI - Math.PI / 2;
                node.x = centerX + radius * Math.cos(angle);
                node.y = centerY + radius * Math.sin(angle);
            });

            // Draw edges
            ctx.strokeStyle = 'rgba(139, 92, 246, 0.3)';
            edges.forEach(edge => {
                const source = nodes.find(n => n.id === edge.source);
                const target = nodes.find(n => n.id === edge.target);
                if (source && target) {
                    ctx.beginPath();
                    ctx.lineWidth = Math.min(edge.width || 1, 5);
                    ctx.moveTo(source.x, source.y);
                    ctx.lineTo(target.x, target.y);
                    ctx.stroke();
                }
            });

            // Draw nodes
            nodes.forEach(node => {
                // Node circle
                ctx.beginPath();
                ctx.fillStyle = node.color || '#8b5cf6';
                ctx.arc(node.x, node.y, Math.min(node.size || 20, 30), 0, 2 * Math.PI);
                ctx.fill();

                // Node border
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Node label
                ctx.fillStyle = '#fff';
                ctx.font = '10px sans-serif';
                ctx.textAlign = 'center';
                const label = (node.label || node.id).substring(0, 12);
                ctx.fillText(label, node.x, node.y + node.size + 12);
            });
        }

                                <div class="d-flex justify-content-between">
                                    <strong style="color: #c4b5fd;">${insight.agent_name.replace(/_/g, ' ')}</strong>
                                    <span class="badge bg-secondary">${Math.round(insight.confidence * 100)}% confident</span>
                                </div>
                                <small class="text-muted">${insight.content.substring(0, 200)}...</small>
                            </div>
                        `).join('')}
                    `;
                } else {
                    results.innerHTML = '<p class="text-warning text-center">No insights found for this topic</p>';
                }
            } catch (error) {
                console.error('Error searching:', error);
                results.innerHTML = '<p class="text-danger text-center">Search failed</p>';
            }
        }

        // Session 216: Orchestrate Multi-Agent Task
        async function orchestrateMultiAgentTask() {
            const input = document.getElementById('orchestration-task-input');
            const results = document.getElementById('orchestration-result');
            const task = input.value.trim();

            if (!task) {
                showToast('Please describe a task to orchestrate', 'warning');
                return;
            }

            results.style.display = 'block';
            results.innerHTML = '<p class="text-center"><span class="spinner-border spinner-border-sm"></span> Orchestrating agents...</p>';

            try {
                const response = await fetch('/api/collective/orchestrate/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCsrfToken()
                    },
                    body: JSON.stringify({ task_description: task })
                });
                const data = await response.json();

                if (data.status === 'initiated') {
                    results.innerHTML = `
                        <div class="alert alert-success" style="background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e;">
                            <h6 style="color: #22c55e;">🚀 Orchestration Initiated!</h6>
                            <p class="mb-2">Session ID: <code>${data.session_id}</code></p>
                            <p class="mb-2"><strong>${data.agent_count}</strong> agents selected:</p>
                            <div class="d-flex flex-wrap gap-1">
                                ${data.selected_agents.map(a => `<span class="badge bg-success">${a.replace(/_/g, ' ')}</span>`).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    results.innerHTML = `<div class="alert alert-danger">${data.error || 'Orchestration failed'}</div>`;
                }
            } catch (error) {
                console.error('Error orchestrating:', error);
                results.innerHTML = '<div class="alert alert-danger">Orchestration failed</div>';
            }
        }

        // Session 216: Initialize Agent Dashboard on Tab Show
        document.addEventListener('DOMContentLoaded', function() {
            const agentsTab = document.getElementById('agents-tab');
            if (agentsTab) {
                agentsTab.addEventListener('shown.bs.tab', function() {
                    loadAgentDashboard();
                });
            }

            // Session 219: Initialize Trending Tab on Tab Show
            // Session 241: Also load spider network data when tab is shown
            const trendingTab = document.getElementById('trending-tab');
            if (trendingTab) {
                trendingTab.addEventListener('shown.bs.tab', function() {
                    loadTrendingTab();
                    loadSpiderNetwork();  // Session 241: Auto-load spider status
                });
            }

            // Session 219 Phase D: Initialize Marketplace Tab on Tab Show
            const marketplaceTab = document.getElementById('marketplace-tab');
            if (marketplaceTab) {
                marketplaceTab.addEventListener('shown.bs.tab', function() {
                    loadMarketplaceTab();
                });
            }

            // Session 220 Phase E: Initialize Collaborate Tab on Tab Show
            const collaborateTab = document.getElementById('collaborate-tab');
            if (collaborateTab) {
                collaborateTab.addEventListener('shown.bs.tab', function() {
                    loadCollaborationTab();
                });
            }
        });

        // ============================================================
</script>
