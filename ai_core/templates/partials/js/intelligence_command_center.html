{% comment %}
Session 530: Intelligence Command Center JavaScript
State management singleton for unified intelligence dashboard
Handles: API calls, WebSocket connections, cross-references, real-time updates
{% endcomment %}

<script>
/**
 * Intelligence Command Center State Manager
 * Singleton pattern for managing unified intelligence dashboard
 */
const ICCState = {
    // Initialization flag
    initialized: false,

    // Data stores
    spiders: [],
    spiderCategories: {},
    agents: [],
    situations: [],
    events: [],
    triggerFires: [],

    // UI state
    selectedItem: null,
    selectedType: null,
    isPaused: false,
    filter: 'all',
    agentFilter: '',

    // WebSocket connections
    wsSpider: null,
    wsAutonomous: null,

    // Cross-reference maps (populated from API)
    spiderToAgents: {},
    agentToSituations: {},
    situationToSpiders: {},

    // Counters for flow visualization
    flowCounts: {
        spiders: 0,
        triggers: 0,
        events: 0,
        situations: 0,
        agents: 0
    },

    /**
     * Initialize the Intelligence Command Center
     */
    async init() {
        if (this.initialized) {
            console.log('ICC: Already initialized');
            return;
        }

        console.log('ICC: Initializing Intelligence Command Center...');

        try {
            // Load initial data in parallel
            await Promise.all([
                this.loadSpiders(),
                this.loadAgents(),
                this.loadSituations(),
                this.loadTriggerFires()
            ]);

            // Build cross-references
            this.buildCrossReferences();

            // Connect WebSockets
            this.connectWebSockets();

            // Hide loading, show content
            document.getElementById('icc-loading').style.display = 'none';
            document.getElementById('icc-container').style.display = 'grid';

            // Start auto-refresh
            this.startAutoRefresh();

            this.initialized = true;
            console.log('ICC: Initialization complete');

            // Add a welcome event
            this.addEvent({
                type: 'system',
                icon: '&#129504;',
                title: 'Intelligence Command Center Online',
                details: `${this.spiders.length} spiders, ${this.agents.length} agents, ${this.situations.length} situations`,
                timestamp: new Date()
            });

        } catch (error) {
            console.error('ICC: Initialization failed:', error);
            document.getElementById('icc-loading').innerHTML = `
                <div style="color: #ef4444;">
                    <p>Failed to initialize: ${error.message}</p>
                    <button onclick="ICCState.init()" class="btn btn-sm btn-outline-danger mt-2">Retry</button>
                </div>
            `;
        }
    },

    /**
     * Load spider data from API
     */
    async loadSpiders() {
        try {
            const response = await fetch('/api/spider-intelligence/dashboard-stats/', {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();

            if (data.status === 'success' || data.stats) {
                const stats = data.stats || data;
                this.flowCounts.spiders = stats.total_spiders || 72;
                document.getElementById('icc-spider-count').textContent = this.flowCounts.spiders;
                document.getElementById('icc-flow-spiders').textContent = this.flowCounts.spiders;

                // Build spider categories from stats
                this.spiderCategories = stats.categories || {};
                this.renderSpiderList();
            }
        } catch (error) {
            console.error('ICC: Failed to load spiders:', error);
            this.renderSpiderListFallback();
        }
    },

    /**
     * Load agents from API
     */
    async loadAgents() {
        try {
            const response = await fetch('/api/agents/', {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();

            if (data.agents || Array.isArray(data)) {
                this.agents = data.agents || data;
                this.flowCounts.agents = this.agents.length;
                document.getElementById('icc-agent-count').textContent = this.agents.length;
                document.getElementById('icc-flow-agents').textContent = this.agents.length;
                this.renderAgentList();
            }
        } catch (error) {
            console.error('ICC: Failed to load agents:', error);
            this.renderAgentListFallback();
        }
    },

    /**
     * Load autonomous situations from API
     */
    async loadSituations() {
        try {
            const response = await fetch('/api/autonomous/situations/', {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();

            if (data.success !== false) {
                this.situations = data.situations || data || [];
                this.flowCounts.situations = this.situations.length;
                document.getElementById('icc-situation-count').textContent = this.situations.length;
                document.getElementById('icc-flow-situations').textContent = this.situations.length;
                this.renderSituationsList();
            }
        } catch (error) {
            console.error('ICC: Failed to load situations:', error);
            this.renderSituationsListFallback();
        }
    },

    /**
     * Load recent trigger fires
     */
    async loadTriggerFires() {
        try {
            const response = await fetch('/api/autonomous/trigger-events/?hours=24', {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();

            if (data.events || Array.isArray(data)) {
                this.triggerFires = data.events || data || [];
                this.flowCounts.triggers = this.triggerFires.length;
                this.flowCounts.events = this.triggerFires.length;
                document.getElementById('icc-trigger-count').textContent = this.triggerFires.length;
                document.getElementById('icc-flow-triggers').textContent = this.triggerFires.length;
                document.getElementById('icc-flow-events').textContent = this.triggerFires.length;
                this.renderTriggerFeed();

                // Also populate the main Live Intelligence Flow with trigger events
                this.populateLiveFeedFromTriggers();
            }
        } catch (error) {
            console.error('ICC: Failed to load trigger fires:', error);
            // Non-critical, continue
        }
    },

    /**
     * Populate live feed with trigger events
     */
    populateLiveFeedFromTriggers() {
        // Clear existing events first time, then add trigger events
        if (this.events.length === 0 || this.events[0]?.type === 'system') {
            // Hide empty state
            const emptyState = document.getElementById('icc-feed-empty');
            if (emptyState) emptyState.style.display = 'none';

            const feed = document.getElementById('icc-live-feed');

            // Add events sorted by most recent first (already sorted from API)
            for (const trigger of this.triggerFires.slice(0, 20)) {
                const severityColors = {
                    'critical': '#ef4444',
                    'high': '#f97316',
                    'medium': '#fbbf24',
                    'low': '#22c55e'
                };
                const severityIcons = {
                    'critical': '🚨',
                    'high': '⚠️',
                    'medium': '📢',
                    'low': '📌'
                };

                const event = {
                    type: 'trigger',
                    icon: severityIcons[trigger.severity] || '⚡',
                    title: `${trigger.trigger_name}: ${(trigger.matched_value || '').substring(0, 50)}...`,
                    details: `${trigger.spider_name} → ${trigger.situation_type} | ${trigger.severity}`,
                    timestamp: new Date(trigger.fired_at),
                    severity: trigger.severity,
                    sourceId: trigger.trigger_name
                };

                this.events.push(event);

                // Render to DOM
                const eventEl = document.createElement('div');
                eventEl.className = `icc-feed-event trigger`;
                eventEl.style.borderLeftColor = severityColors[trigger.severity] || '#fbbf24';
                eventEl.onclick = () => this.showDetail('trigger', trigger.trigger_name);

                eventEl.innerHTML = `
                    <div class="icc-feed-event-icon">${event.icon}</div>
                    <div class="icc-feed-event-content">
                        <div class="icc-feed-event-title">${event.title}</div>
                        <div class="icc-feed-event-details">${event.details}</div>
                    </div>
                    <div class="icc-feed-event-time">${this.formatTimeAgo(event.timestamp)}</div>
                `;

                feed.appendChild(eventEl);
            }

            // Update event count
            document.getElementById('icc-events-count').textContent = `${this.events.length} events`;
        }
    },

    /**
     * Build cross-reference maps for drill-down
     */
    buildCrossReferences() {
        // Spider → Agent mappings based on known patterns
        this.spiderToAgents = {
            'techcrunch': ['TrendAnalysisAgent', 'ContentWriterAgent', 'ResearchAgent'],
            'hackernews': ['TrendAnalysisAgent', 'ContentWriterAgent', 'CodeGeneratorAgent'],
            'coingecko': ['BlockchainAuditCoordinator', 'WhaleWatcherAgent', 'MarketIntelligenceCoordinator'],
            'etherscan': ['BlockchainAuditCoordinator', 'SmartContractAuditorAgent', 'TransactionMonitorAgent'],
            'reddit': ['TrendAnalysisAgent', 'ContentWriterAgent', 'SocialMediaAgent'],
            'remoteok': ['OpportunityScoringAgent', 'OpportunityPipelineAgent'],
            'dribbble': ['ImageAgent', 'BrandIdentityAgent', 'CreativeDirectorAgent'],
            'yahoo_finance': ['StockAuditCoordinator', 'MarketIntelligenceCoordinator', 'StockAnalystAgent']
        };

        // Agent → Situation mappings
        this.agentToSituations = {
            'BlockchainAuditCoordinator': ['blockchain_security'],
            'StockAuditCoordinator': ['stock_market_intelligence'],
            'ContentWriterAgent': ['autonomous_content_generation', 'viral_content_predictor'],
            'TrendAnalysisAgent': ['tech_stack_evolution', 'narrative_drift'],
            'OpportunityScoringAgent': ['job_matching', 'freelance_scout'],
            'ImageAgent': ['design_trends', 'thumbnail_optimizer'],
            'LegalDocDrafterAgent': ['case_law_monitor', 'regulatory_change']
        };

        // Situation → Spider mappings
        this.situationToSpiders = {
            'blockchain_security': ['etherscan', 'coingecko', 'coindesk'],
            'stock_market_intelligence': ['yahoo_finance', 'sec_edgar', 'marketwatch'],
            'autonomous_content_generation': ['techcrunch', 'hackernews', 'reddit', 'the_verge'],
            'job_matching': ['remoteok', 'weworkremotely', 'adzuna'],
            'design_trends': ['dribbble', 'behance', 'unsplash']
        };
    },

    /**
     * Connect WebSocket for real-time updates
     */
    connectWebSockets() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const host = window.location.host;

        // Try to connect to spider intelligence WebSocket
        try {
            const wsUrl = `${protocol}//${host}/ws/spider-intelligence/`;
            this.wsSpider = new WebSocket(wsUrl);

            this.wsSpider.onopen = () => {
                console.log('ICC: Spider WebSocket connected');
                this.updateHealthIndicator('ws', 'Connected', 'good');
            };

            this.wsSpider.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    this.handleWebSocketMessage(data);
                } catch (e) {
                    console.error('ICC: Failed to parse WebSocket message:', e);
                }
            };

            this.wsSpider.onclose = () => {
                console.log('ICC: Spider WebSocket closed, reconnecting...');
                this.updateHealthIndicator('ws', 'Reconnecting', 'warning');
                setTimeout(() => this.connectWebSockets(), 5000);
            };

            this.wsSpider.onerror = (error) => {
                console.error('ICC: WebSocket error:', error);
                this.updateHealthIndicator('ws', 'Error', 'error');
            };
        } catch (error) {
            console.error('ICC: Failed to connect WebSocket:', error);
            this.updateHealthIndicator('ws', 'Unavailable', 'error');
        }
    },

    /**
     * Handle incoming WebSocket messages
     */
    handleWebSocketMessage(data) {
        if (this.isPaused) return;

        switch (data.type) {
            case 'spider_update':
            case 'spider_data':
                this.addEvent({
                    type: 'spider',
                    icon: '&#128375;',
                    title: `${data.spider_name || 'Spider'} collected ${data.item_count || 'new'} items`,
                    details: data.category || '',
                    timestamp: new Date(),
                    sourceId: data.spider_name
                });
                this.flowCounts.spiders++;
                break;

            case 'trigger_fired':
                this.addEvent({
                    type: 'trigger',
                    icon: '&#9889;',
                    title: `Trigger: ${data.trigger_name || 'Unknown'}`,
                    details: `Matched: ${data.matched_value || 'N/A'}`,
                    timestamp: new Date(),
                    severity: data.severity
                });
                this.flowCounts.triggers++;
                this.flowCounts.events++;
                break;

            case 'situation_started':
                this.addEvent({
                    type: 'situation',
                    icon: '&#128736;',
                    title: `Situation: ${data.situation_type || 'Unknown'}`,
                    details: 'Processing...',
                    timestamp: new Date()
                });
                break;

            case 'agent_executed':
                this.addEvent({
                    type: 'agent',
                    icon: '&#129302;',
                    title: `Agent: ${data.agent_name || 'Unknown'}`,
                    details: data.result || 'Completed',
                    timestamp: new Date()
                });
                break;
        }

        this.updateFlowCounts();
    },

    /**
     * Add event to live feed
     */
    addEvent(event) {
        if (this.filter !== 'all' && event.type !== this.filter && event.type !== 'system') {
            return;
        }

        this.events.unshift(event);
        if (this.events.length > 100) this.events.pop();

        // Hide empty state
        const emptyState = document.getElementById('icc-feed-empty');
        if (emptyState) emptyState.style.display = 'none';

        // Render the event
        const feed = document.getElementById('icc-live-feed');
        const eventEl = document.createElement('div');
        eventEl.className = `icc-feed-event ${event.type}`;
        eventEl.onclick = () => this.showDetail(event.type, event.sourceId || event.title);

        eventEl.innerHTML = `
            <div class="icc-feed-event-icon">${event.icon}</div>
            <div class="icc-feed-event-content">
                <div class="icc-feed-event-title">${event.title}</div>
                ${event.details ? `<div class="icc-feed-event-details">${event.details}</div>` : ''}
            </div>
            <div class="icc-feed-event-time">${this.formatTimeAgo(event.timestamp)}</div>
        `;

        feed.insertBefore(eventEl, feed.firstChild);

        // Remove old events from DOM
        while (feed.children.length > 50) {
            feed.removeChild(feed.lastChild);
        }

        // Update event count
        document.getElementById('icc-events-count').textContent = `${this.events.length} events`;
    },

    /**
     * Render spider list by category
     */
    renderSpiderList() {
        const container = document.getElementById('icc-spider-list');
        let html = '';

        // Default categories if API didn't provide them
        const categories = Object.keys(this.spiderCategories).length > 0
            ? this.spiderCategories
            : {
                'Tech News': 8,
                'Financial': 6,
                'Jobs': 5,
                'Social': 12,
                'Creative': 4,
                'Crypto': 5,
                'Research': 6,
                'Other': 26
            };

        for (const [category, count] of Object.entries(categories)) {
            html += `
                <div class="icc-category-header">${category} (${count})</div>
                <div class="icc-list-item" onclick="ICCState.showDetail('category', '${category}')">
                    <span class="icc-status-dot active"></span>
                    <span>${category} Spiders</span>
                    <span class="badge bg-secondary ms-auto" style="font-size: 0.65rem;">${count}</span>
                </div>
            `;
        }

        container.innerHTML = html;
    },

    /**
     * Fallback spider list render
     */
    renderSpiderListFallback() {
        const container = document.getElementById('icc-spider-list');
        container.innerHTML = `
            <div class="icc-list-item">
                <span class="icc-status-dot active"></span>
                <span>72 Active Spiders</span>
            </div>
            <div class="text-muted px-3 py-2" style="font-size: 0.75rem;">
                Categories: Tech, Financial, Jobs, Creative, Crypto, Social
            </div>
        `;
    },

    /**
     * Render agent list
     */
    renderAgentList() {
        const container = document.getElementById('icc-agent-list');
        let html = '';

        const filteredAgents = this.agentFilter
            ? this.agents.filter(a => {
                const name = a.name || a.agent_name || '';
                return name.toLowerCase().includes(this.agentFilter.toLowerCase());
            })
            : this.agents.slice(0, 20);

        for (const agent of filteredAgents) {
            const name = agent.name || agent.agent_name || 'Unknown';
            const status = agent.status || 'idle';
            html += `
                <div class="icc-list-item" onclick="ICCState.showDetail('agent', '${name}')">
                    <span class="icc-status-dot ${status === 'active' ? 'active' : 'idle'}"></span>
                    <span>${name.replace('Agent', '')}</span>
                </div>
            `;
        }

        if (this.agents.length > 20 && !this.agentFilter) {
            html += `<div class="text-muted text-center py-2" style="font-size: 0.75rem;">+ ${this.agents.length - 20} more agents</div>`;
        }

        container.innerHTML = html || '<div class="text-muted text-center py-3">No agents found</div>';
    },

    /**
     * Fallback agent list render
     */
    renderAgentListFallback() {
        const container = document.getElementById('icc-agent-list');
        container.innerHTML = `
            <div class="icc-list-item">
                <span class="icc-status-dot active"></span>
                <span>47 Registered Agents</span>
            </div>
        `;
    },

    /**
     * Render situations list
     */
    renderSituationsList() {
        const container = document.getElementById('icc-situations-list');
        let html = '';

        const domainColors = {
            'content': 'content',
            'creative': 'creative',
            'income': 'income',
            'financial': 'financial',
            'research': 'research',
            'legal': 'legal'
        };

        for (const sit of this.situations) {
            const name = sit.name || sit.situation_type || 'Unknown';
            const domain = sit.domain || 'research';
            const status = sit.status || sit.is_active ? 'active' : 'inactive';
            const runs = sit.runs_24h || sit.total_runs || 0;

            html += `
                <div class="icc-situation-item ${domainColors[domain] || ''}">
                    <div class="icc-situation-info" onclick="ICCState.showDetail('situation', '${sit.situation_type || name}')">
                        <div class="icc-situation-name">${name}</div>
                        <div class="icc-situation-stats">${runs} runs</div>
                    </div>
                    <label class="icc-toggle">
                        <input type="checkbox" ${status === 'active' ? 'checked' : ''}
                               onchange="ICCState.toggleSituation('${sit.situation_type || name}', this.checked)">
                        <span class="icc-toggle-slider"></span>
                    </label>
                </div>
            `;
        }

        container.innerHTML = html || '<div class="text-muted text-center py-3">No situations found</div>';
    },

    /**
     * Fallback situations list render
     */
    renderSituationsListFallback() {
        const container = document.getElementById('icc-situations-list');
        container.innerHTML = `
            <div class="icc-situation-item content">
                <div class="icc-situation-info">
                    <div class="icc-situation-name">Autonomous Content Studio</div>
                    <div class="icc-situation-stats">Content generation</div>
                </div>
            </div>
            <div class="icc-situation-item financial">
                <div class="icc-situation-info">
                    <div class="icc-situation-name">Market Intelligence</div>
                    <div class="icc-situation-stats">Financial analysis</div>
                </div>
            </div>
            <div class="text-muted text-center py-2" style="font-size: 0.75rem;">+ 17 more situations</div>
        `;
    },

    /**
     * Render trigger feed
     */
    renderTriggerFeed() {
        const container = document.getElementById('icc-trigger-feed');
        let html = '';

        for (const trigger of this.triggerFires.slice(0, 10)) {
            const name = trigger.trigger_name || trigger.name || 'Trigger';
            const time = trigger.fired_at || trigger.created_at;
            html += `
                <div class="icc-list-item" onclick="ICCState.showDetail('trigger', '${name}')">
                    <span style="color: #fbbf24;">&#9889;</span>
                    <span style="flex: 1; font-size: 0.8rem;">${name}</span>
                    <span style="font-size: 0.65rem; color: #6b7280;">${this.formatTimeAgo(new Date(time))}</span>
                </div>
            `;
        }

        container.innerHTML = html || '<div class="text-muted text-center py-3" style="font-size: 0.8rem;">No triggers in 24h</div>';
    },

    /**
     * Show detail panel with cross-references
     */
    showDetail(type, id) {
        const panel = document.getElementById('icc-detail-panel');
        panel.style.display = 'block';

        let html = '';

        switch (type) {
            case 'spider':
            case 'category':
                const agents = this.spiderToAgents[id] || ['TrendAnalysisAgent', 'ContentWriterAgent'];
                html = `
                    <h6>&#128375; ${type === 'category' ? 'Category' : 'Spider'}: ${id}</h6>
                    <p style="color: #9ca3af; font-size: 0.8rem;">Agents that use this data:</p>
                    <div class="icc-connections">
                        ${agents.map(a => `
                            <span class="icc-connection-badge agent" onclick="ICCState.showDetail('agent', '${a}')">${a.replace('Agent', '')}</span>
                        `).join('')}
                    </div>
                `;
                break;

            case 'agent':
                const situations = this.agentToSituations[id] || [];
                html = `
                    <h6>&#129302; Agent: ${id}</h6>
                    <p style="color: #9ca3af; font-size: 0.8rem;">Autonomous situations using this agent:</p>
                    <div class="icc-connections">
                        ${situations.length > 0 ? situations.map(s => `
                            <span class="icc-connection-badge situation" onclick="ICCState.showDetail('situation', '${s}')">${s.replace(/_/g, ' ')}</span>
                        `).join('') : '<span style="color: #6b7280; font-size: 0.8rem;">No linked situations</span>'}
                    </div>
                `;
                break;

            case 'situation':
                const spiders = this.situationToSpiders[id] || [];
                html = `
                    <h6>&#128736; Situation: ${id.replace(/_/g, ' ')}</h6>
                    <p style="color: #9ca3af; font-size: 0.8rem;">Spider data sources:</p>
                    <div class="icc-connections">
                        ${spiders.length > 0 ? spiders.map(s => `
                            <span class="icc-connection-badge spider" onclick="ICCState.showDetail('spider', '${s}')">${s}</span>
                        `).join('') : '<span style="color: #6b7280; font-size: 0.8rem;">Uses multiple sources</span>'}
                    </div>
                `;
                break;

            case 'trigger':
                // Find the full trigger data
                const trigger = this.triggerFires.find(t => t.trigger_name === id) || {};
                const severityColors = {
                    'critical': '#ef4444',
                    'high': '#f97316',
                    'medium': '#fbbf24',
                    'low': '#22c55e'
                };
                const severityColor = severityColors[trigger.severity] || '#fbbf24';

                html = `
                    <h6 style="color: ${severityColor};">⚡ Trigger: ${id}</h6>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0;">
                        <div style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px;">
                            <div style="color: #9ca3af; font-size: 0.7rem; text-transform: uppercase;">Severity</div>
                            <div style="color: ${severityColor}; font-weight: 600;">${trigger.severity || 'unknown'}</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px;">
                            <div style="color: #9ca3af; font-size: 0.7rem; text-transform: uppercase;">Spider</div>
                            <div style="color: #f97316; cursor: pointer;" onclick="ICCState.showDetail('spider', '${trigger.spider_name}')">${trigger.spider_name || 'unknown'}</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px;">
                            <div style="color: #9ca3af; font-size: 0.7rem; text-transform: uppercase;">Situation</div>
                            <div style="color: #a855f7; cursor: pointer;" onclick="ICCState.showDetail('situation', '${trigger.situation_type}')">${(trigger.situation_type || 'unknown').replace(/_/g, ' ')}</div>
                        </div>
                        <div style="background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px;">
                            <div style="color: #9ca3af; font-size: 0.7rem; text-transform: uppercase;">Fired At</div>
                            <div style="color: #e5e7eb;">${trigger.fired_at ? new Date(trigger.fired_at).toLocaleString() : 'unknown'}</div>
                        </div>
                    </div>
                    <div style="background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; margin-top: 8px;">
                        <div style="color: #9ca3af; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px;">Matched Value</div>
                        <div style="color: #e5e7eb; font-size: 0.85rem; word-break: break-word;">${trigger.matched_value || 'N/A'}</div>
                    </div>
                    ${trigger.trigger_data ? `

    /**
     * Format time ago string
     */
    formatTimeAgo(date) {
        if (!date) return '';
        const d = date instanceof Date ? date : new Date(date);
        const seconds = Math.floor((new Date() - d) / 1000);

        if (seconds < 5) return 'Just now';
        if (seconds < 60) return `${seconds}s ago`;
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return `${Math.floor(seconds / 86400)}d ago`;
    },

    /**
     * Extract text from various data types (string, array, object)
     */
    extractText(value) {
        if (!value) return '';
        if (typeof value === 'string') return value;
        if (Array.isArray(value)) {
            // Join array items with spaces
            return value.map(item => this.extractText(item)).join(' ');
        }
        if (typeof value === 'object') {
            // Try common text fields
            return value.text || value.content || value.summary || value.message || JSON.stringify(value);
        }
        return String(value);
    },

    /**
     * Get CSRF token
     */
    getCSRFToken() {
        const cookie = document.cookie.split(';').find(c => c.trim().startsWith('csrftoken='));
        return cookie ? cookie.split('=')[1] : '';
    },

    /**
     * Load agent conversations
     */
    async loadConversations() {
        try {
            console.log('ICC: Loading conversations...');
            const response = await fetch('/api/agent-conversations/?limit=20', {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();
            console.log('ICC: Conversations API response:', data);

            const container = document.getElementById('icc-conversations-list');
            const todayBadge = document.getElementById('icc-conversations-today');

            // Handle API error response
            if (!data.success) {
                console.error('ICC: Conversations API error:', data.error);
                container.innerHTML = `<div class="text-center py-4"><p class="text-danger">Error: ${data.error || 'Failed to load'}</p></div>`;
                return;
            }

            if (data.conversations && data.conversations.length > 0) {
                if (todayBadge && data.today_count !== undefined) {
                    todayBadge.textContent = `${data.today_count} today`;
                }

                container.innerHTML = data.conversations.map((conv, index) => {
                    const timeAgo = this.formatTimeAgo(conv.started_at || conv.created_at);
                    // participants is array of {name, emoji} objects
                    const participants = conv.participants || [];
                    const participantBadges = participants.map(p => {
                        const name = typeof p === 'object' ? p.name : p;
                        const emoji = typeof p === 'object' ? (p.emoji || '🤖') : '🤖';
                        return `<span class="badge bg-secondary me-1" style="font-size: 10px;">${emoji} ${name}</span>`;
                    }).join('');

                    // Build messages HTML
                    const messages = conv.messages || [];
                    const messagesHtml = messages.length > 0 ? messages.map(msg => `
                        <div class="mb-2 p-2" style="background: rgba(0,0,0,0.2); border-radius: 6px; border-left: 2px solid #8b5cf6;">

                                <strong style="color: #c4b5fd; font-size: 12px; margin-left: 6px;">${msg.agent || 'Agent'}</strong>

                    const convId = `conv-${index}-${conv.id || index}`;

                    return `
                        <div class="mb-3 p-3" style="background: rgba(139, 92, 246, 0.1); border-radius: 8px; border-left: 3px solid #8b5cf6;">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <strong style="color: #a78bfa;">${conv.topic || 'Agent Discussion'}</strong>
                                    <div class="mt-1">${participantBadges}</div>
                                </div>
                                <small class="text-muted">${timeAgo}</small>
                            </div>

                            <!-- Summary/Conclusion -->
                            <div style="background: rgba(0,0,0,0.15); padding: 8px; border-radius: 6px; margin-bottom: 8px;">

                                <p style="color: #e5e7eb; font-size: 13px; margin: 4px 0 0 0;">${this.extractText(conv.conclusion || conv.insights || conv.summary || 'No conclusion yet')}</p>
                            </div>

                                <button class="btn btn-sm w-100" style="background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border: 1px solid rgba(139, 92, 246, 0.3);"

                console.log('ICC: No conversations found in response');
                container.innerHTML = '<div class="text-center py-4"><p class="text-muted">No conversations yet. Click "Start New Chat" to begin!</p></div>';

                    // Dream type descriptions for context
                    const dreamTypeInfo = {
                        'creative_idea': { emoji: '💡', desc: 'New creative concept or approach' },
                        'process_improvement': { emoji: '⚙️', desc: 'Suggestion to improve workflows' },
                        'feature_request': { emoji: '🚀', desc: 'New feature or capability idea' },
                        'warning': { emoji: '⚠️', desc: 'Potential issue or risk identified' },
                        'collaboration': { emoji: '🤝', desc: 'Cross-agent collaboration opportunity' },
                        'optimization': { emoji: '📈', desc: 'Performance or efficiency improvement' },
                        'insight': { emoji: '🔍', desc: 'Analysis or discovery' },
                        'prediction': { emoji: '🔮', desc: 'Forecast or trend prediction' }
                    };

                    container.innerHTML = data.dreams.map((dream, index) => {
                        const typeInfo = dreamTypeInfo[dream.dream_type] || { emoji: '💭', desc: 'Agent insight' };
                        const dreamId = `dream-detail-${index}`;

                        return `
                        <div class="mb-3 p-3" style="background: #0d0d0d; border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 8px;">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h6 class="mb-1" style="color: #f59e0b;">
                                        ${typeInfo.emoji} ${dream.title || 'Dream'}
                                    </h6>
                                    <small style="color: #9ca3af;">${typeInfo.desc}</small>
                                </div>
                                <span class="badge" style="background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);">
                                    Score: ${((dream.composite_score || 0) * 100).toFixed(0)}%
                                </span>
                            </div>

                            <!-- Agent & Type Badges -->
                            <div class="mb-2">
                                <span class="badge bg-secondary">${dream.agent_name || 'Unknown'}</span>
                                <span class="badge bg-info ms-1">${dream.dream_type || 'unknown'}</span>
                                ${dream.impact_area ? `<span class="badge bg-warning text-dark ms-1">Impact: ${dream.impact_area}</span>` : ''}
                            </div>

                            <!-- Dream Content Preview -->
                            <div style="background: rgba(245, 158, 11, 0.1); padding: 12px; border-radius: 6px; margin-bottom: 12px;">
                                <div style="color: #fbbf24; font-size: 11px; text-transform: uppercase; margin-bottom: 6px;">💭 Dream Content</div>
                                <p style="color: #e5e7eb; font-size: 13px; margin: 0; white-space: pre-wrap;" id="${dreamId}-preview">
                                    ${this.extractText(dream.content || '').substring(0, 300)}${(dream.content || '').length > 300 ? '...' : ''}
                                </p>
                                ${(dream.content || '').length > 300 ? `
                                <button class="btn btn-link btn-sm p-0 mt-2" style="color: #f59e0b;"
                                        onclick="document.getElementById('${dreamId}-full').classList.toggle('d-none'); this.textContent = this.textContent.includes('Show') ? '🔼 Show Less' : '📖 Show Full Dream'">
                                    📖 Show Full Dream
                                </button>
                                <div id="${dreamId}-full" class="d-none mt-2" style="border-top: 1px solid rgba(245, 158, 11, 0.3); padding-top: 10px;">
                                    <p style="color: #e5e7eb; font-size: 13px; margin: 0; white-space: pre-wrap;">${this.extractText(dream.content || '')}</p>
                                </div>
                                ` : ''}
                            </div>

                            <!-- Recommendation if available -->
                            ${dream.recommendation ? `
                            <div style="background: rgba(34, 197, 94, 0.1); padding: 10px; border-radius: 6px; margin-bottom: 12px; border-left: 3px solid #22c55e;">
                                <div style="color: #86efac; font-size: 11px; text-transform: uppercase; margin-bottom: 4px;">💡 Recommendation</div>
                                <p style="color: #d1fae5; font-size: 12px; margin: 0;">${dream.recommendation}</p>
                            </div>
                            ` : ''}

                            <!-- Action Buttons -->
                            <div class="d-flex gap-2 mt-3">
                                <button class="btn btn-sm btn-success" onclick="ICCState.decideDream('${dream.id}', 'approved')">
                                    ✅ Approve
                                </button>
                                <button class="btn btn-sm btn-warning" onclick="ICCState.decideDream('${dream.id}', 'deferred')">
                                    ⏸️ Defer
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="ICCState.decideDream('${dream.id}', 'rejected')">
                                    ❌ Reject
                                </button>
                            </div>
                        </div>
                    `}).join('');
                } else {
                    container.innerHTML = `
                        <div class="text-center text-muted py-4">
                            <h5>🏛️ No pending dream decisions</h5>
                            <p>High-scoring dreams will appear here for approval</p>
                        </div>
                    `;
                }
            }
        } catch (error) {
            console.error('ICC: Error loading boardroom dreams:', error);
        }
    },

    /**
     * Decide on a boardroom dream (approve/defer/reject)
     */
    async decideDream(dreamId, decision) {
        try {
            const response = await fetch(`/api/boardroom/dreams/${dreamId}/decide/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': this.getCSRFToken()
                },
                body: JSON.stringify({ decision: decision })
            });
            const data = await response.json();
            if (data.success) {
                const messages = {
                    'approved': '✅ Dream approved for implementation!',
                    'deferred': '⏸️ Dream deferred for later review',
                    'rejected': '❌ Dream rejected'
                };
                if (typeof showNotification === 'function') {
                    showNotification(messages[decision] || 'Decision recorded', decision === 'approved' ? 'success' : 'info');
                }
                this.loadBoardroomDreams();
            }
        } catch (error) {
            console.error('ICC: Error deciding dream:', error);
        }
    },

    /**
     * Load learning feed
     */
    async loadLearningFeed() {
        try {
            const response = await fetch('/api/agent-learning/activity/', {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });
            const data = await response.json();

            const container = document.getElementById('icc-learning-feed');
            const countBadge = document.getElementById('icc-learning-count');

            if (data.success && data.feed_items && data.feed_items.length > 0) {
                if (countBadge) countBadge.textContent = `${data.total_count || data.feed_items.length} transfers`;

                // Learning type info
                const learningTypeInfo = {
                    'knowledge_transfer': { emoji: '📚', desc: 'Knowledge shared between agents', color: '#22c55e' },
                    'skill_learned': { emoji: '🎯', desc: 'New skill or capability acquired', color: '#3b82f6' },
                    'insight_shared': { emoji: '💡', desc: 'Insight or discovery shared', color: '#f59e0b' },
                    'pattern_recognized': { emoji: '🔍', desc: 'Pattern or trend identified', color: '#8b5cf6' },
                    'feedback_received': { emoji: '📝', desc: 'Feedback from user or system', color: '#ec4899' },
                    'collaboration': { emoji: '🤝', desc: 'Collaborative learning session', color: '#14b8a6' }
                };

                container.innerHTML = data.feed_items.map((t, index) => {
                    const timeAgo = this.formatTimeAgo(t.timestamp);
                    const typeInfo = learningTypeInfo[t.type] || learningTypeInfo[t.learning_type] || { emoji: '🧠', desc: 'Knowledge transfer', color: '#22c55e' };
                    const learnId = `learning-${index}`;

                    // Session 532: Extract full knowledge data from API
                    const kFull = t.knowledge_full || {};
                    const knowledgeTitle = kFull.title || '';
                    const knowledgeSummary = kFull.summary || t.knowledge || t.description || '';
                    const keyInsights = kFull.key_insights || [];
                    const keyPoints = t.key_points || [];
                    const knowledgeType = kFull.knowledge_type || '';
                    const confidence = kFull.confidence || 0;
                    const usefulnessScore = t.usefulness_score || 0;

                    // Build key insights HTML
                    const insightsHtml = keyInsights.length > 0 ? `
                        <div style="margin-top: 10px;">
                            <div style="color: #fbbf24; font-size: 11px; text-transform: uppercase; margin-bottom: 4px;">💡 Key Insights</div>
                            <ul style="margin: 0; padding-left: 20px; color: #d1d5db; font-size: 12px;">
                                ${keyInsights.slice(0, 5).map(i => `<li>${this.extractText(i)}</li>`).join('')}
                            </ul>
                        </div>
                    ` : '';

                    // Build key points HTML (from the transfer itself)
                    const pointsHtml = keyPoints.length > 0 ? `
                        <div style="margin-top: 10px;">
                            <div style="color: #a855f7; font-size: 11px; text-transform: uppercase; margin-bottom: 4px;">📝 Key Points</div>
                            <ul style="margin: 0; padding-left: 20px; color: #d1d5db; font-size: 12px;">
                                ${keyPoints.slice(0, 5).map(p => `<li>${this.extractText(p)}</li>`).join('')}
                            </ul>
                        </div>
                    ` : '';

                    return `
                        <div class="mb-3 p-3" style="background: rgba(34, 197, 94, 0.1); border-radius: 8px; border-left: 3px solid ${typeInfo.color};">
                            <!-- Header with agents and time -->
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <div style="color: #86efac; font-size: 14px; font-weight: 600;">
                                        ${typeInfo.emoji} ${t.teacher || 'Agent'} → ${t.student || 'Agent'}
                                    </div>
                                    <small style="color: #9ca3af;">${typeInfo.desc}</small>
                                </div>
                                <small class="text-muted">${timeAgo}</small>
                            </div>

                            <!-- Knowledge Title -->
                            ${knowledgeTitle ? `
                            <div style="color: #f0abfc; font-size: 15px; font-weight: 600; margin-bottom: 8px;">
                                📖 ${knowledgeTitle}
                            </div>
                            ` : ''}

                            <!-- Badges -->
                            <div class="mb-2">
                                ${knowledgeType ? `<span class="badge" style="background: #3b82f6; font-size: 10px;">${knowledgeType.replace(/_/g, ' ')}</span>` : ''}
                                ${t.type ? `<span class="badge ms-1" style="background: ${typeInfo.color}; font-size: 10px;">${t.type.replace(/_/g, ' ')}</span>` : ''}
                                ${t.was_useful !== undefined && t.was_useful !== null ? `<span class="badge ms-1" style="background: ${t.was_useful ? '#22c55e' : '#ef4444'}; font-size: 10px;">${t.was_useful ? '✓ Useful' : '✗ Not useful'}</span>` : ''}
                                ${confidence > 0 ? `<span class="badge ms-1" style="background: #8b5cf6; font-size: 10px;">Confidence: ${Math.round(confidence * 100)}%</span>` : ''}
                            </div>

                            <!-- Knowledge Content Box -->
                            <div style="background: rgba(34, 197, 94, 0.15); padding: 12px; border-radius: 6px;">
                                <div style="color: #86efac; font-size: 11px; text-transform: uppercase; margin-bottom: 6px;">🧠 Knowledge Content</div>
                                <p style="color: #e5e7eb; font-size: 13px; margin: 0; white-space: pre-wrap; line-height: 1.5;">
                                    ${this.extractText(knowledgeSummary).substring(0, 400)}${knowledgeSummary.length > 400 ? '...' : ''}
                                </p>
                                ${knowledgeSummary.length > 400 ? `
                                <button class="btn btn-link btn-sm p-0 mt-2" style="color: #86efac;"
                                        onclick="document.getElementById('${learnId}-full').classList.toggle('d-none'); this.textContent = this.textContent.includes('Show Full') ? '🔼 Show Less' : '📖 Show Full Content'">
                                    📖 Show Full Content
                                </button>
                                <div id="${learnId}-full" class="d-none mt-2" style="border-top: 1px solid rgba(34, 197, 94, 0.3); padding-top: 10px;">
                                    <p style="color: #e5e7eb; font-size: 13px; margin: 0; white-space: pre-wrap; line-height: 1.5;">${this.extractText(knowledgeSummary)}</p>
                                </div>
                                ` : ''}
                            </div>

                            <!-- Key Insights from source knowledge -->
                            ${insightsHtml}

                            <!-- Key Points from the transfer -->
                            ${pointsHtml}

                            <!-- Source info -->
                            ${t.source ? `
                            <div style="margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 6px;">
                                <div style="color: #9ca3af; font-size: 11px; text-transform: uppercase; margin-bottom: 4px;">📍 Source</div>
                                <small style="color: #d1d5db;">${t.source}</small>
                            </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = '<p class="text-muted text-center">No learning activity yet</p>';
            }
        } catch (error) {
            console.error('ICC: Error loading learning feed:', error);
        }
    },

    /**
     * Ask the hive mind
     */
    async askHiveMind() {
        const input = document.getElementById('icc-hive-question');
        const responseDiv = document.getElementById('icc-hive-response');
        const question = input.value.trim();

        if (!question) return;

        responseDiv.className = 'd-block p-3';
        responseDiv.style.background = 'rgba(6, 182, 212, 0.1)';
        responseDiv.style.borderRadius = '8px';
        responseDiv.style.borderLeft = '3px solid #06b6d4';
        responseDiv.innerHTML = '<p class="mb-0 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Consulting the hive mind...</p>';

        try {
            const response = await fetch('/api/hive-mind/ask/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': this.getCSRFToken()
                },
                body: JSON.stringify({ question: question })
            });
            const data = await response.json();

            if (data.success) {
                responseDiv.innerHTML = `
                    <h6 style="color: #06b6d4;">Hive Mind Response</h6>
                    <p style="color: #e5e7eb;">${data.response || data.answer || 'No response'}</p>
                    ${data.contributing_agents ? `<small class="text-muted">Contributors: ${data.contributing_agents.join(', ')}</small>` : ''}
                `;
                input.value = '';
            } else {
                responseDiv.innerHTML = `<p class="text-danger mb-0">Error: ${data.error || 'Unknown error'}</p>`;
            }
        } catch (error) {
            console.error('ICC: Error asking hive mind:', error);
            responseDiv.innerHTML = '<p class="text-danger mb-0">Error connecting to hive mind</p>';
        }
    }
};

// Initialize when tab is shown
document.addEventListener('DOMContentLoaded', function() {
    const iccTab = document.getElementById('icc-tab');
    if (iccTab) {
        iccTab.addEventListener('shown.bs.tab', function() {
            ICCState.init();
        });
    }

    // Also check if tab is already active (direct navigation)
    const iccPane = document.getElementById('intelligence-command-center');
    if (iccPane && iccPane.classList.contains('active')) {
        ICCState.init();
    }

    // Sub-tab event listeners for lazy loading
    const conversationsTab = document.getElementById('icc-conversations-tab');
    if (conversationsTab) {
        conversationsTab.addEventListener('shown.bs.tab', function() {
            ICCState.loadConversations();
        });
    }

    const dreamsTab = document.getElementById('icc-dreams-tab');
    if (dreamsTab) {
        dreamsTab.addEventListener('shown.bs.tab', function() {
            ICCState.loadDreams();
        });
    }

    const boardroomTab = document.getElementById('icc-boardroom-tab');
    if (boardroomTab) {
        boardroomTab.addEventListener('shown.bs.tab', function() {
            ICCState.loadBoardroomDecisions();
            ICCState.loadBoardroomDreams();
        });
    }

    const memoryTab = document.getElementById('icc-memory-tab');
    if (memoryTab) {
        memoryTab.addEventListener('shown.bs.tab', function() {
            ICCState.loadLearningFeed();
        });
    }
});
</script>
