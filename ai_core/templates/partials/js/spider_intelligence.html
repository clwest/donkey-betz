<!-- Load all intelligence data when spider tab is shown -->
<script>
// Load all intelligence data when spider tab is shown
async function loadSpiderIntelligence() {
    console.log('🧠 Loading Spider Intelligence...');
    await Promise.all([
        loadTrendingTopics(),
        loadMarketInsights(),
        loadTechTrends(),
        loadJobMarket()
    ]);
}

// Load Trending Topics
async function loadTrendingTopics() {
    const container = document.getElementById('trending-topics-list');
    if (!container) {
        console.log('Trending topics container not found - skipping');
        return;
    }
    try {
        const response = await fetch('/api/spider-intelligence/trends/?limit=10', {
            headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await response.json();

        if (data.status === 'success' && data.trends.length > 0) {
            container.innerHTML = data.trends.map(trend => `
                <div class="d-flex justify-content-between align-items-center p-2 mb-2" style="background: rgba(249, 115, 22, 0.1); border-radius: 8px;">
                    <div>
                        <span class="text-warning me-2">🔥</span>
                        <span class="text-light">${trend.topic}</span>
                    </div>
                    <div class="text-end">
                        <span class="badge" style="background: #f97316;">${trend.mentions} mentions</span>
                        <small class="text-muted d-block">${trend.sources.join(', ')}</small>
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = '<p class="text-muted text-center">No trending topics found</p>';
        }
    } catch (error) {
        console.error('Error loading trending topics:', error);
        if (container) container.innerHTML = '<p class="text-danger text-center">Failed to load trends</p>';
    }
}

// Load Market Insights
async function loadMarketInsights() {
    const container = document.getElementById('market-insights-list');
    if (!container) {
        console.log('Market insights container not found - skipping');
        return;
    }
    try {
        const response = await fetch('/api/spider-intelligence/market/', {
            headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await response.json();

        if (data.status === 'success' && data.insights.crypto.length > 0) {
            container.innerHTML = data.insights.crypto.map(crypto => {
                const changeColor = (crypto.change_24h || 0) >= 0 ? '#22c55e' : '#ef4444';
                const changeIcon = (crypto.change_24h || 0) >= 0 ? '📈' : '📉';
                return `
                    <div class="d-flex justify-content-between align-items-center p-2 mb-2" style="background: rgba(34, 197, 94, 0.1); border-radius: 8px;">
                        <div>
                            <span class="text-success me-2">${changeIcon}</span>
                            <span class="text-light fw-bold">${crypto.symbol}</span>
                            <small class="text-muted ms-2">${crypto.name}</small>
                        </div>
                        <div class="text-end">
                            <span class="text-light fw-bold">$${Number(crypto.price).toLocaleString()}</span>
                            <small class="d-block" style="color: ${changeColor};">
                                ${crypto.change_24h ? (crypto.change_24h >= 0 ? '+' : '') + crypto.change_24h.toFixed(2) + '%' : 'N/A'}
                            </small>
                        </div>
                    </div>
                `;
            }).join('');
        } else {
            container.innerHTML = '<p class="text-muted text-center">No market data available</p>';
        }
    } catch (error) {
        console.error('Error loading market insights:', error);
        if (container) container.innerHTML = '<p class="text-danger text-center">Failed to load market data</p>';
    }
}

// Load Tech Trends
async function loadTechTrends() {
    const container = document.getElementById('tech-trends-list');
    if (!container) {
        console.log('Tech trends container not found - skipping');
        return;
    }
    try {
        const response = await fetch('/api/spider-intelligence/tech/?limit=10', {
            headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await response.json();

        if (data.status === 'success') {
            let html = '';

            // Show discussions
            if (data.trends.discussions && data.trends.discussions.length > 0) {
                html += data.trends.discussions.slice(0, 5).map(disc => `
                    <div class="p-2 mb-2" style="background: rgba(139, 92, 246, 0.1); border-radius: 8px;">
                        <div class="d-flex justify-content-between">
                            <a href="${disc.url}" target="_blank" class="text-light text-decoration-none" style="flex: 1;">
                                ${disc.title.substring(0, 60)}${disc.title.length > 60 ? '...' : ''}
                            </a>
                            ${disc.score ? `<span class="badge bg-secondary ms-2">${disc.score} pts</span>` : ''}
                        </div>
                        <small class="text-muted">${disc.source}</small>
                    </div>
                `).join('');
            }

            // Show topics
            if (data.trends.topics && data.trends.topics.length > 0) {
                html += '<div class="mt-3"><small class="text-muted">Hot Topics:</small></div>';
                html += '<div class="d-flex flex-wrap gap-1 mt-2">';
                html += data.trends.topics.slice(0, 10).map(topic =>
                    `<span class="badge" style="background: rgba(139, 92, 246, 0.3);">${topic.topic}</span>`
                ).join('');
                html += '</div>';
            }

            container.innerHTML = html || '<p class="text-muted text-center">No tech trends found</p>';
        } else {
            container.innerHTML = '<p class="text-muted text-center">No tech trends available</p>';
        }
    } catch (error) {
        console.error('Error loading tech trends:', error);
        if (container) container.innerHTML = '<p class="text-danger text-center">Failed to load tech trends</p>';
    }
}

// Load Job Market
async function loadJobMarket() {
    const container = document.getElementById('job-market-list');
    if (!container) {
        console.log('Job market container not found - skipping');
        return;
    }
    try {
        const response = await fetch('/api/spider-intelligence/jobs/?limit=10', {
            headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await response.json();

        if (data.status === 'success' && data.job_market.jobs.length > 0) {
            let html = `<div class="mb-2"><small class="text-muted">Found ${data.job_market.total_found} remote jobs</small></div>`;

            html += data.job_market.jobs.slice(0, 5).map(job => `
                <div class="p-2 mb-2" style="background: rgba(6, 182, 212, 0.1); border-radius: 8px;">
                    <div class="d-flex justify-content-between align-items-start">
                        <div style="flex: 1;">
                            <a href="${job.url}" target="_blank" class="text-light text-decoration-none fw-bold">
                                ${job.title}
                            </a>
                            <small class="text-muted d-block">${job.company} • ${job.location}</small>
                        </div>
                        <span class="badge" style="background: rgba(6, 182, 212, 0.3);">${job.source}</span>
                    </div>
                </div>
            `).join('');

            container.innerHTML = html;
        } else {
            container.innerHTML = '<p class="text-muted text-center">No jobs found</p>';
        }
    } catch (error) {
        console.error('Error loading job market:', error);
        if (container) container.innerHTML = '<p class="text-danger text-center">Failed to load jobs</p>';
    }
}

// Search Spider Intelligence
async function searchSpiderIntelligence() {
    const query = document.getElementById('intelligence-search-input').value.trim();
    if (!query) {
        alert('Please enter a search query');
        return;
    }

    const resultsContainer = document.getElementById('intelligence-search-results');
    resultsContainer.style.display = 'block';
    resultsContainer.innerHTML = '<p class="text-center"><span class="spinner-border spinner-border-sm"></span> Searching...</p>';

    try {
        const response = await fetch(`/api/spider-intelligence/search/?q=${encodeURIComponent(query)}&limit=20`, {
            headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await response.json();

        if (data.status === 'success' && data.results.length > 0) {
            resultsContainer.innerHTML = `
                <div class="mb-2">
                    <span class="text-light">Found ${data.count} results for "${query}"</span>
                    <button class="btn btn-sm btn-outline-secondary ms-2" onclick="document.getElementById('intelligence-search-results').style.display='none'">✕ Close</button>
                </div>
                <div style="max-height: 400px; overflow-y: auto;">
                    ${data.results.map(result => `
                        <div class="p-2 mb-2" style="background: rgba(255,255,255,0.05); border-radius: 8px; border-left: 3px solid #f97316;">
                            <div class="d-flex justify-content-between">
                                <a href="${result.url}" target="_blank" class="text-light text-decoration-none fw-bold">
                                    ${result.title}
                                </a>
                                <span class="badge" style="background: rgba(249, 115, 22, 0.3);">${result.source}</span>
                            </div>
                            ${result.description ? `<small class="text-muted d-block mt-1">${result.description}</small>` : ''}
                        </div>
                    `).join('')}
                </div>
            `;
        } else {
            resultsContainer.innerHTML = `
                <p class="text-muted text-center">No results found for "${query}"</p>
                <button class="btn btn-sm btn-outline-secondary d-block mx-auto" onclick="document.getElementById('intelligence-search-results').style.display='none'">Close</button>
            `;
        }
    } catch (error) {
        console.error('Error searching intelligence:', error);
        resultsContainer.innerHTML = '<p class="text-danger text-center">Search failed</p>';
    }
}

// Load spider network status
async function loadSpiderStatus() {
    const listContainer = document.getElementById('spider-list');
    if (!listContainer) return;

    listContainer.innerHTML = '<p class="text-center"><span class="spinner-border spinner-border-sm"></span> Loading spiders...</p>';

    try {
        const response = await fetch('/api/spider-intelligence/registry/', {
            headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await response.json();

        if (data.status === 'success') {
            const spiders = data.spiders;
            const categories = {};

            // Group by category
            Object.entries(spiders).forEach(([name, info]) => {
                const cat = info.category || 'other';
                if (!categories[cat]) categories[cat] = [];
                categories[cat].push({ name, ...info });
            });

            let html = '<div class="accordion" id="spiderAccordion">';
            Object.entries(categories).sort((a, b) => b[1].length - a[1].length).forEach(([cat, spiders], idx) => {
                const catId = cat.replace(/[^a-z0-9]/gi, '');
                html += `
                    <div class="accordion-item" style="background: #1a1a1a; border: 1px solid #333;">
                        <h2 class="accordion-header">
                            <button class="accordion-button ${idx > 0 ? 'collapsed' : ''}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${catId}" style="background: rgba(249, 115, 22, 0.1); color: #f97316;">
                                ${cat.replace(/_/g, ' ').toUpperCase()} <span class="badge bg-secondary ms-2">${spiders.length}</span>
                            </button>
                        </h2>
                        <div id="collapse${catId}" class="accordion-collapse collapse ${idx === 0 ? 'show' : ''}" data-bs-parent="#spiderAccordion">
                            <div class="accordion-body p-2">
                                ${spiders.map(s => `
                                    <div class="d-flex justify-content-between align-items-center p-2 mb-1" style="background: rgba(255,255,255,0.03); border-radius: 4px;">
                                        <div>
                                            <span class="text-light">${s.name}</span>
                                            <small class="text-muted ms-2">${s.class_name || ''}</small>
                                        </div>
                                        <button class="btn btn-sm" onclick="testSpider('${s.name}')" style="background: rgba(139, 92, 246, 0.2); color: #c4b5fd; font-size: 11px; padding: 2px 8px;">
                                            Test
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';

            listContainer.innerHTML = html;
        } else {
            listContainer.innerHTML = '<p class="text-muted text-center">Could not load spider registry</p>';
        }
    } catch (error) {
        console.error('Error loading spider status:', error);
        listContainer.innerHTML = '<p class="text-danger text-center">Failed to load spiders</p>';
    }
}

// Test a specific spider
async function testSpider(spiderName) {
    const resultsContainer = document.getElementById('spider-test-results');
    const contentContainer = document.getElementById('spider-test-content');

    resultsContainer.style.display = 'block';
    contentContainer.innerHTML = `<p class="text-center"><span class="spinner-border spinner-border-sm"></span> Testing ${spiderName} spider...</p>`;

    try {
        const response = await fetch(`/api/spider-intelligence/test/?spider=${encodeURIComponent(spiderName)}`, {
            headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await response.json();

        if (data.status === 'success') {
            const result = data.result;
            contentContainer.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0 text-light">${spiderName}</h6>
                    <span class="badge" style="background: ${result.success ? '#22c55e' : '#ef4444'};">
                        ${result.success ? '✓ Working' : '✗ Failed'}
                    </span>
                </div>
                <div class="row mb-2">
                    <div class="col-4 text-center">
                        <h4 class="mb-0 text-light">${result.articles_count || 0}</h4>
                        <small class="text-muted">Articles</small>
                    </div>
                    <div class="col-4 text-center">
                        <h4 class="mb-0 text-light">${result.feeds_tested || 0}</h4>
                        <small class="text-muted">Feeds</small>
                    </div>
                    <div class="col-4 text-center">
                        <h4 class="mb-0 text-light">${result.response_time || 'N/A'}</h4>
                        <small class="text-muted">Time (ms)</small>
                    </div>
                </div>
                ${result.sample_titles && result.sample_titles.length > 0 ? `
                    <div class="mt-2">
                        <small class="text-muted">Sample Headlines:</small>
                        <ul class="list-unstyled mt-1" style="font-size: 12px;">
                            ${result.sample_titles.slice(0, 5).map(t => `<li class="text-light">• ${t.substring(0, 80)}${t.length > 80 ? '...' : ''}</li>`).join('')}
                        </ul>
                    </div>
                ` : ''}
                ${result.error ? `<p class="text-danger mt-2 mb-0"><small>Error: ${result.error}</small></p>` : ''}
                <button class="btn btn-sm btn-outline-secondary mt-2" onclick="document.getElementById('spider-test-results').style.display='none'">Close</button>
            `;
        } else {
            contentContainer.innerHTML = `<p class="text-danger">Test failed: ${data.error || 'Unknown error'}</p>`;
        }
    } catch (error) {
        console.error('Error testing spider:', error);
        contentContainer.innerHTML = '<p class="text-danger">Test request failed</p>';
    }
}

// Test a random spider from the new batch
async function testRandomSpider() {
    const newSpiders = [
        'cnn', 'reuters_rss', 'science', 'health', 'education_rss', 'library',
        'business_news', 'government', 'parenting', 'food', 'travel', 'real_estate',
        'npr', 'bbc', 'arstechnica', 'variety', 'polygon_gaming', 'smashingmagazine', 'lifehacker'
    ];
    const randomSpider = newSpiders[Math.floor(Math.random() * newSpiders.length)];
    await testSpider(randomSpider);
}

// Run all spiders (triggers backend task)
async function runAllSpiders() {
    if (!confirm('This will trigger all spiders to fetch fresh data. Continue?')) return;

    try {
        const response = await fetch('/api/spider-intelligence/run-all/', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await response.json();

        if (data.status === 'success') {
            alert(`Spider collection started! Task ID: ${data.task_id || 'N/A'}`);
        } else {
            alert('Failed to start spider collection: ' + (data.error || 'Unknown error'));
        }
    } catch (error) {
        console.error('Error running spiders:', error);
        alert('Failed to start spider collection');
    }
}

// Generate Daily Report
async function generateDailyReport() {
    const container = document.getElementById('daily-report-container');
    const content = document.getElementById('daily-report-content');

    container.style.display = 'block';
    content.innerHTML = '<p class="text-center"><span class="spinner-border spinner-border-sm"></span> Generating report...</p>';

    try {
        const response = await fetch('/api/spider-intelligence/report/', {
            headers: { 'X-CSRFToken': getCsrfToken() }
        });
        const data = await response.json();

        if (data.status === 'success') {
            const report = data.report;
            content.innerHTML = `
                <div class="mb-4">
                    <small class="text-muted">Generated: ${new Date(report.generated_at).toLocaleString()}</small>
                    <h6 class="text-warning mt-2">📊 Highlights</h6>
                    <div class="row">
                        <div class="col-4 text-center">
                            <h3 class="text-light mb-0">${report.highlights.total_data_points}</h3>
                            <small class="text-muted">Data Points</small>
                        </div>
                        <div class="col-4 text-center">
                            <h3 class="text-light mb-0">${report.highlights.active_spiders}</h3>
                            <small class="text-muted">Active Spiders</small>
                        </div>
                        <div class="col-4 text-center">
                            <h3 class="text-light mb-0">${report.highlights.top_trend ? report.highlights.top_trend.mentions : 0}</h3>
                            <small class="text-muted">Top Trend Mentions</small>
                        </div>
                    </div>
                </div>

                <div class="mb-4">
                    <h6 class="text-warning">🔥 ${report.sections.trending_topics.title}</h6>
                    ${report.sections.trending_topics.items.slice(0, 5).map(t =>
                        `<span class="badge me-1 mb-1" style="background: rgba(249, 115, 22, 0.3);">${t.topic} (${t.mentions})</span>`
                    ).join('')}
                </div>

                <div class="mb-4">
                    <h6 class="text-success">💰 ${report.sections.market_snapshot.title}</h6>
                    <p class="text-light mb-2">${report.sections.market_snapshot.summary || 'Market data available'}</p>
                    ${report.sections.market_snapshot.crypto.slice(0, 3).map(c =>
                        `<span class="badge me-1 mb-1" style="background: rgba(34, 197, 94, 0.3);">${c.symbol}: $${Number(c.price).toLocaleString()}</span>`
                    ).join('')}
                </div>

                <div class="mb-4">
                    <h6 class="text-info">💻 ${report.sections.tech_pulse.title}</h6>
                    ${report.sections.tech_pulse.hot_topics.slice(0, 8).map(t =>
                        `<span class="badge me-1 mb-1" style="background: rgba(139, 92, 246, 0.3);">${t.topic}</span>`
                    ).join('')}
                </div>

                <div class="mb-4">
                    <h6 class="text-primary">💼 ${report.sections.job_market.title}</h6>
                    <p class="text-light">${report.sections.job_market.total_jobs} remote jobs found</p>
                    ${report.sections.job_market.top_categories.slice(0, 5).map(c =>
                        `<span class="badge me-1 mb-1" style="background: rgba(6, 182, 212, 0.3);">${c.category}: ${c.count}</span>`
                    ).join('')}
                </div>

                <div class="text-center">
                    <button class="btn btn-outline-secondary" onclick="document.getElementById('daily-report-container').style.display='none'">Close Report</button>
                </div>
            `;
        } else {
            content.innerHTML = '<p class="text-danger text-center">Failed to generate report</p>';
        }
    } catch (error) {
        console.error('Error generating report:', error);
        content.innerHTML = '<p class="text-danger text-center">Failed to generate report</p>';
    }
}
</script>
