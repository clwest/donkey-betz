<script>
// SESSION 210: IMPLICIT LEARNING & STYLE RECOMMENDATIONS

        /**
         * Track user behavior for implicit learning.
         * Sends behavior signals to the backend to improve recommendations.
         */
        async function trackBehavior(signalType, contentId, style = null, model = null, metadata = {}) {
            try {
                const response = await authenticatedFetch('/api/preferences/track/', {
                    method: 'POST',
                    body: JSON.stringify({
                        signal_type: signalType,
                        content_id: contentId,
                        style: style,
                        model: model,
                        metadata: metadata
                    })
                });

                const data = await response.json();
                if (data.success) {
                    console.log(`📊 Tracked ${signalType} for content ${contentId}`);
                }
                return data;
            } catch (error) {
                console.warn('Failed to track behavior:', error);
                return { success: false };
            }
        }

        /**
         * Get personalized style recommendations.
         */
        async function getStyleRecommendations(limit = 5) {
            try {
                const response = await authenticatedFetch(`/api/preferences/recommendations/?limit=${limit}`);
                const data = await response.json();
                if (data.success) {
                    return data.recommendations;
                }
                return [];
            } catch (error) {
                console.warn('Failed to get recommendations:', error);
                return [];
            }
        }

        /**
         * Get styles similar to a given style.
         */
        async function getSimilarStyles(style, limit = 5) {
            try {
                const response = await authenticatedFetch(`/api/preferences/recommendations/similar/${style}/?limit=${limit}`);
                const data = await response.json();
                if (data.success) {
                    return data.recommendations;
                }
                return [];
            } catch (error) {
                console.warn('Failed to get similar styles:', error);
                return [];
            }
        }

        /**
         * Get discovery recommendations (styles user hasn't tried).
         */
        async function getDiscoveryStyles(limit = 5) {
            try {
                const response = await authenticatedFetch(`/api/preferences/recommendations/discover/?limit=${limit}`);
                const data = await response.json();
                if (data.success) {
                    return data.recommendations;
                }
                return [];
            } catch (error) {
                console.warn('Failed to get discovery styles:', error);
                return [];
            }
        }

        /**
         * Display style recommendations in the UI.
         */
        async function displayStyleRecommendations() {
            const container = document.getElementById('styleRecommendationsContainer');
            if (!container) return;

            try {
                const recommendations = await getStyleRecommendations(5);

                if (recommendations.length === 0) {
                    container.innerHTML = `
                        <div class="text-muted small text-center py-2">
                            <i>Generate some images to get personalized recommendations!</i>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="d-flex flex-wrap gap-2">';
                for (const rec of recommendations) {
                    const confidenceColor = rec.score > 0.7 ? 'success' : rec.score > 0.4 ? 'warning' : 'secondary';
                    html += `
                        <button class="btn btn-outline-${confidenceColor} btn-sm recommendation-chip"
                                onclick="applyRecommendedStyle('${rec.style}')"
                                title="${rec.reason}">
                            ${rec.style}
                            <span class="badge bg-${confidenceColor} ms-1">${Math.round(rec.score * 100)}%</span>
                        </button>
                    `;
                }
                html += '</div>';

                container.innerHTML = html;
            } catch (error) {
                console.error('Error displaying recommendations:', error);
            }
        }

        /**
         * Apply a recommended style to the style selector.
         */
        function applyRecommendedStyle(styleName) {
            const styleSelect = document.getElementById('style');
            if (!styleSelect) return;

            // Find and select the matching option
            for (const option of styleSelect.options) {
                if (option.value.toLowerCase() === styleName.toLowerCase() ||
                    option.text.toLowerCase().includes(styleName.toLowerCase())) {
                    styleSelect.value = option.value;

                    // Track style selection
                    trackBehavior('style_use', '', styleName, null, { context: 'recommendation_click' });

                    // Show feedback
                    showStatus(`✨ Applied style: ${option.text}`, 'success');
                    return;
                }
            }

            // If not found in dropdown, show message
            showStatus(`Style "${styleName}" suggestion - try adding to your prompt!`, 'info');
        }

        /**
         * Track style selection when user changes the dropdown.
         */
        function initStyleTracking() {
            const styleSelect = document.getElementById('style');
            if (styleSelect) {
                styleSelect.addEventListener('change', function() {
                    if (this.value) {
                        trackBehavior('style_use', '', this.value, null, { context: 'manual_selection' });
                    }
                });
            }
        }

        // Initialize style tracking on page load
        document.addEventListener('DOMContentLoaded', function() {
            initStyleTracking();
            // Load recommendations after a short delay
            setTimeout(displayStyleRecommendations, 1000);
        });

// END SESSION 210: IMPLICIT LEARNING & STYLE RECOMMENDATIONS
</script>
