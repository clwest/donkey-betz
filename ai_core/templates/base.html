<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Unified AI Intelligence System{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }

        /* Animated Background */
        .neural-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            pointer-events: none;
        }

        @keyframes neural-pulse {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        /* Navigation Bar */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.3);
            padding: 15px 30px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: #e0e0e0;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .nav-links a:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }

        /* Main Content */
        .main-content {
            margin-top: 80px;
            padding: 20px;
            min-height: calc(100vh - 80px);
        }

        /* Panel Cards */
        .panel-card {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .panel-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        /* Status indicators */
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-online {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status-warning {
            background: #ffaa00;
            box-shadow: 0 0 10px #ffaa00;
        }

        .status-error {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }

        /* Buttons */
        .btn {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid rgba(102, 126, 234, 0.3);
            color: #e0e0e0;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-success {
            background: rgba(0, 255, 136, 0.2);
            border-color: rgba(0, 255, 136, 0.3);
        }

        .btn-success:hover {
            background: rgba(0, 255, 136, 0.4);
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        /* Loading animations */
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .nav-bar {
                padding: 10px 20px;
            }

            .nav-links {
                gap: 10px;
            }

            .nav-links a {
                padding: 6px 12px;
                font-size: 0.9rem;
            }

            .main-content {
                padding: 15px;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="neural-background"></div>

    <nav class="nav-bar">
        <a href="/" class="nav-title">🤖 AI Intelligence Hub</a>
        <div class="nav-links">
            <a href="/ai-nexus/">AI Nexus</a>
            <a href="/income-builder/">💰 Income Builder</a>
            <a href="/neural-orchestra/">🎭 Neural Orchestra</a>
            <a href="/ai-production-hub/">Production Hub</a>
            <a href="/agent-testing/">Agent Testing</a>
            <a href="/consciousness/">Consciousness</a>
            <a href="/command-center/">Command Center</a>
            <a href="/unified-intelligence/">Intelligence</a>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- WebSocket Connection Script -->
    <script>
        // WebSocket connection management
        class WebSocketManager {
            constructor(url) {
                this.url = url;
                this.socket = null;
                this.reconnectInterval = 3000;
                this.maxReconnectAttempts = 5;
                this.reconnectAttempts = 0;
                this.connect();
            }

            connect() {
                try {
                    this.socket = new WebSocket(this.url);

                    this.socket.onopen = (event) => {
                        console.log('🔗 WebSocket connected:', this.url);
                        this.reconnectAttempts = 0;
                        this.onConnect(event);
                    };

                    this.socket.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        this.onMessage(data);
                    };

                    this.socket.onclose = (event) => {
                        console.log('🔌 WebSocket disconnected');
                        this.onDisconnect(event);
                        this.attemptReconnect();
                    };

                    this.socket.onerror = (error) => {
                        console.error('❌ WebSocket error:', error);
                        this.onError(error);
                    };
                } catch (error) {
                    console.error('❌ Failed to create WebSocket:', error);
                    this.attemptReconnect();
                }
            }

            attemptReconnect() {
                if (this.reconnectAttempts < this.maxReconnectAttempts) {
                    this.reconnectAttempts++;
                    console.log(`🔄 Attempting to reconnect (${this.reconnectAttempts}/${this.maxReconnectAttempts})...`);
                    setTimeout(() => this.connect(), this.reconnectInterval);
                } else {
                    console.log('❌ Max reconnect attempts reached');
                }
            }

            send(data) {
                if (this.socket && this.socket.readyState === WebSocket.OPEN) {
                    this.socket.send(JSON.stringify(data));
                } else {
                    console.warn('⚠️ WebSocket not connected, message queued');
                }
            }

            close() {
                if (this.socket) {
                    this.socket.close();
                }
            }

            // Override these methods in your specific implementation
            onConnect(event) {}
            onMessage(data) {}
            onDisconnect(event) {}
            onError(error) {}
        }

        // Global WebSocket manager instance
        let wsManager = null;

        // Initialize WebSocket if URL is provided
        const wsUrl = '{% block websocket_url %}{% endblock %}';
        if (wsUrl.trim()) {
            wsManager = new WebSocketManager(wsUrl);
        }

        // Status update helper
        function updateStatus(element, status, message) {
            if (!element) return;

            const indicator = element.querySelector('.status-indicator');
            const text = element.querySelector('.status-text');

            if (indicator) {
                indicator.className = `status-indicator status-${status}`;
            }

            if (text) {
                text.textContent = message;
            }
        }

        // Animation helper
        function animateElement(element, animation = 'pulse') {
            if (!element) return;

            element.style.animation = `${animation} 0.5s ease-in-out`;
            setTimeout(() => {
                element.style.animation = '';
            }, 500);
        }

        {% block extra_js %}{% endblock %}
    </script>
</body>
</html>
