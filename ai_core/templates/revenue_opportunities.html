<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Opportunities | AI Income Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        h1 {
            font-size: 32px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            gap: 30px;
            margin-top: 20px;
        }

        .status-item {
            display: flex;
            flex-direction: column;
        }

        .status-label {
            color: #94a3b8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-value {
            font-size: 24px;
            font-weight: bold;
            color: #60a5fa;
            margin-top: 5px;
        }

        .filters {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            backdrop-filter: blur(10px);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .filter-group select,
        .filter-group input {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .opportunities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .opportunity-card {
            background: rgba(30, 41, 59, 0.95);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .opportunity-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: #60a5fa;
        }

        .opportunity-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .opportunity-title {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 5px;
        }

        .opportunity-company {
            color: #94a3b8;
            font-size: 14px;
        }

        .opportunity-value {
            font-size: 24px;
            font-weight: bold;
            color: #10b981;
        }

        .opportunity-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .tag {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .opportunity-meta {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #94a3b8;
            font-size: 13px;
        }

        .urgency-high {
            color: #ef4444;
        }

        .urgency-medium {
            color: #f59e0b;
        }

        .urgency-low {
            color: #10b981;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(99, 102, 241, 0.3);
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #94a3b8;
        }

        .spider-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .spider-dot {
            width: 10px;
            height: 10px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .no-opportunities {
            text-align: center;
            padding: 60px 20px;
            background: rgba(30, 41, 59, 0.95);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .no-opportunities h2 {
            font-size: 24px;
            color: #f1f5f9;
            margin-bottom: 10px;
        }

        .no-opportunities p {
            color: #94a3b8;
        }

        .success-rate {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .success-high {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .success-medium {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .success-low {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Revenue Opportunities</h1>
            <p>Real-time opportunities discovered by your spider network</p>

            <div class="status-bar">
                <div class="status-item">
                    <span class="status-label">Active Opportunities</span>
                    <span class="status-value" id="activeCount">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Total Value</span>
                    <span class="status-value" id="totalValue">$0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Applied Today</span>
                    <span class="status-value" id="appliedToday">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Success Rate</span>
                    <span class="status-value" id="successRate">0%</span>
                </div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>Category</label>
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="freelance">Freelance</option>
                    <option value="fulltime">Full-Time</option>
                    <option value="contract">Contract</option>
                    <option value="consulting">Consulting</option>
                    <option value="passive">Passive Income</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Min Value</label>
                <input type="number" id="minValue" placeholder="$0" />
            </div>
            <div class="filter-group">
                <label>Skills</label>
                <select id="skillFilter">
                    <option value="all">All Skills</option>
                    <option value="python">Python</option>
                    <option value="ai">AI/ML</option>
                    <option value="web">Web Dev</option>
                    <option value="writing">Content Writing</option>
                    <option value="design">Design</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Urgency</label>
                <select id="urgencyFilter">
                    <option value="all">All Levels</option>
                    <option value="high">High Priority</option>
                    <option value="medium">Medium Priority</option>
                    <option value="low">Low Priority</option>
                </select>
            </div>
        </div>

        <div class="opportunities-grid" id="opportunitiesGrid">
            <div class="loading">Connecting to spider network...</div>
        </div>
    </div>

    <div class="spider-indicator">
        <div class="spider-dot"></div>
        <span id="spiderStatus">Spiders Active</span>
    </div>

    <script>
        let ws = null;
        let opportunities = [];
        let stats = {
            active: 0,
            totalValue: 0,
            appliedToday: 0,
            successRate: 0
        };

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/revenue-opportunities/`;

            console.log('Connecting to WebSocket:', wsUrl);
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                document.getElementById('spiderStatus').textContent = 'Spiders Active';

                // Request initial opportunities
                ws.send(JSON.stringify({
                    type: 'get_opportunities'
                }));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                console.log('WebSocket message:', data);

                if (data.type === 'opportunities_update') {
                    handleOpportunitiesUpdate(data);
                } else if (data.type === 'stats_update') {
                    updateStats(data.stats);
                } else if (data.type === 'new_opportunity') {
                    addNewOpportunity(data.opportunity);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                document.getElementById('spiderStatus').textContent = 'Connection Error';
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                document.getElementById('spiderStatus').textContent = 'Reconnecting...';
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleOpportunitiesUpdate(data) {
            opportunities = data.opportunities || [];
            stats = data.stats || stats;

            updateStats(stats);
            renderOpportunities();
        }

        function updateStats(newStats) {
            stats = { ...stats, ...newStats };

            document.getElementById('activeCount').textContent = stats.active || 0;
            document.getElementById('totalValue').textContent = `$${(stats.totalValue || 0).toLocaleString()}`;
            document.getElementById('appliedToday').textContent = stats.appliedToday || 0;
            document.getElementById('successRate').textContent = `${(stats.successRate || 0).toFixed(1)}%`;
        }

        function renderOpportunities() {
            const grid = document.getElementById('opportunitiesGrid');

            if (opportunities.length === 0) {
                grid.innerHTML = `
                    <div class="no-opportunities">
                        <h2>No opportunities found yet</h2>
                        <p>Your spider network is actively searching for opportunities...</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = opportunities.map(opp => `
                <div class="opportunity-card" onclick="viewOpportunity('${opp.id}')">
                    <div class="opportunity-header">
                        <div>
                            <div class="opportunity-title">${opp.title}</div>
                            <div class="opportunity-company">${opp.company || opp.platform}</div>
                        </div>
                        <div class="opportunity-value">$${(opp.value || 0).toLocaleString()}</div>
                    </div>

                    <div class="opportunity-tags">
                        ${(opp.skills || []).map(skill => `
                            <span class="tag">${skill}</span>
                        `).join('')}
                    </div>

                    <div class="opportunity-meta">
                        <div class="meta-item urgency-${opp.urgency || 'medium'}">
                            ${opp.urgency || 'medium'} priority
                        </div>
                        <div class="meta-item">
                            <span class="success-rate ${getSuccessClass(opp.success_probability)}">
                                ${((opp.success_probability || 0) * 100).toFixed(0)}% match
                            </span>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="applyToOpportunity(event, '${opp.id}')">
                            Quick Apply
                        </button>
                        <button class="btn btn-secondary" onclick="saveOpportunity(event, '${opp.id}')">
                            Save
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getSuccessClass(probability) {
            if (probability >= 0.7) return 'success-high';
            if (probability >= 0.4) return 'success-medium';
            return 'success-low';
        }

        function addNewOpportunity(opportunity) {
            opportunities.unshift(opportunity);
            renderOpportunities();

            // Show notification
            showNotification(`New opportunity: ${opportunity.title}`);
        }

        function viewOpportunity(id) {
            const opp = opportunities.find(o => o.id === id);
            if (opp && opp.url) {
                window.open(opp.url, '_blank');
            }
        }

        function applyToOpportunity(event, id) {
            event.stopPropagation();

            ws.send(JSON.stringify({
                type: 'apply',
                opportunity_id: id
            }));

            showNotification('Applying to opportunity...');
        }

        function saveOpportunity(event, id) {
            event.stopPropagation();

            ws.send(JSON.stringify({
                type: 'save',
                opportunity_id: id
            }));

            showNotification('Opportunity saved!');
        }

        function showNotification(message) {
            // Simple notification - could be enhanced with a proper toast
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: rgba(99, 102, 241, 0.9);
                color: white;
                padding: 15px 20px;
                border-radius: 8px;
                animation: slideIn 0.3s ease;
                z-index: 1000;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // Filter handlers
        document.getElementById('categoryFilter').addEventListener('change', filterOpportunities);
        document.getElementById('minValue').addEventListener('input', filterOpportunities);
        document.getElementById('skillFilter').addEventListener('change', filterOpportunities);
        document.getElementById('urgencyFilter').addEventListener('change', filterOpportunities);

        function filterOpportunities() {
            // Implement filtering logic here
            renderOpportunities();
        }

        // Initialize WebSocket connection
        connectWebSocket();

        // Add slide-in animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
