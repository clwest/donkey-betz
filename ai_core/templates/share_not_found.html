<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found - AI Content Studio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .message-box {
            background: white;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .error-icon {
            font-size: 5rem;
            color: #f56565;
            margin-bottom: 30px;
        }

        .message-title {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
        }

        .message-text {
            color: #718096;
            font-size: 1.1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="message-box">
        <div class="error-icon">
            <i class="fas fa-question-circle"></i>
        </div>

        <h1 class="message-title">Share Link Not Found</h1>
        <p class="message-text">
            This share link doesn't exist or may have been deleted.
            Please check the URL and try again.
        </p>

        <div style="margin-top: 40px; color: #a0aec0; font-size: 0.9rem;">
            <i class="fas fa-brain"></i> AI Content Studio
        </div>
    </div>
</body>
</html>
