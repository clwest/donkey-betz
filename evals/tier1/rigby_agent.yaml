#   requires Rigby dogfooding, but she can't reach the substrate. FIX:
#   allowlist addition (14 → 17 models) — additive, non-breaking.
#   Forward-carry to arc-close as canon_v2 candidate (or engineering
#   ticket, whichever Chris ratifies).
# Fold S1 (SUBSTRATE-SPLIT CANON — first surfaced in this slice, canon-wide
#   implication): "same user_id ≠ same eval class". Substrates keyed only on
#   user='chris' silently mix buyer-facing (source='web'/'pa') and operator-
#   facing (source='claude-code') traffic. This slice defines its corpus
#   by (source, user), NOT just user, to preserve trust-surface separation.
#   S2963 validator design MUST support channel/source stratification as a
#   first-class dimension, else it will over-fit to high-volume meta-work
#   and under-cover the buyer-facing risk envelope. Applies retroactively
#   to any future substrate/eval work on ChatConversation-style tables.
# Fold α (FORWARD-CARRY to arc-close, 3rd trigger avoided): the intent
#   taxonomy (10+ values in Chris-facing 30d) COULD have been encoded as
#   routing branches (parallel to S2961's 5 competitor branches). Per Rigby
#   T1 Q2 AGREE, encoded as sampling dimension instead. This is the SECOND
#   consecutive slice (S2961 was 1st, S2962 is 2nd) that deliberately
#   AVOIDED routing-branch encoding — pattern converging on "routing
#   branches only when execution shape actually forks in code, not when
#   input taxonomy is diverse." Strengthens S2961 Fold α canon_v2 candidate.
# Fold β (FORWARD-CARRY to arc-close): domain-sensitivity predicate
#   epistemic-labeling refactor — carried from S2961. Not applied in-PR
#   because canon-wide rescope belongs at arc-close, not per-slice.

schema_version: 1
canon_version: 1

meta:
  agent: Rigby
  agent_shape: entrypoint_service_orchestrator
  agent_source: core/services/unified_pa_entrypoint.py
  tier: 1
  arc: golden_evals
  arc_slice: S2962
  ratified_by: chris_via_terminal
  ratified_date: "2026-07-25"
  head_sha_at_authoring: b63cc68fa
  reliability_contract_source: docs/research/platform/S2954_GOLDEN_EVALS_ARC_OPEN.md
  substrate_reference: evals/tier1/competitor_analysis_agent.yaml
  substrate_pivot: chat_conversation_row_substrate  # first slice not on AgentExecution rows
  source_filter: "source IN ('web', 'pa')"          # Chris directive, S2962 T1
  categories_covered:
    - happy_path
    - tool_timeout
    - data_unavailable
    - ambiguous_input
    - bad_input

# Explicit mapping from canonical field (canon_version=1) to how it's obtained
# from ChatConversation-row + ToolCallRecord + LLMCallLog persistence. Every
# S2963 validator MUST consult this block; must never invent an ad-hoc mapping.
canonical_field_mapping:
  summary:
    mapping_source: native
    from: ChatConversation.assistant_response
    note: |
      The ENTIRE assistant response is the summary — no derivation. For
      Rigby PA turns, response length varies widely (single-word "close"
      confirmations to 10,000+ char analytic responses). Validators must
      NOT apply minLength assertion universally; per-prompt expected_output_shape
      declares appropriate minLength per prompt.
      TWO-PHASE CHATCONVERSATION LIFECYCLE (per Rigby T1 Fold U1
      correction, T2 non-blocking follow-up token):
      ChatConversation.assistant_response is the persisted response
      text. The ROW is created at
      core/views_personal_assistant.py:567 with `assistant_response=''`
      (blank at insert time). The row is UPDATED LATER by the PA
      processing pipeline (background task worker path — invoked when
      trigger_pa=True or when the message mentions Rigby) with the
      populated dict["content"] returned by
      UnifiedPAEntrypoint.process_message. UPDATE-SITE PRECISE
      LOCATION: TBD in canon_v1 (populated downstream by PA pipeline;
      exact update site to be located and cited at canon_v2 refinement).
      Validators consuming assistant_response ARE consuming the same
      string a buyer sees in the Rigby chat UI, but the row lifecycle
      is: (a) view-layer insert with blank; (b) pipeline update with
      populated content; (c) validator reads post-update state.
  evidence_pointers:
    mapping_source: derived
    derivation_rule: rigby_v1_tool_call_record_plus_metadata_cache
    derivation_spec: |
      PRIMARY EVIDENCE (per Rigby T1 Q1 REVISE):
        ToolCallRecord rows joined via trace_id / conversation_id / created_at
        window. ToolCallRecord is the AUTHORITATIVE tool-call ledger:
          - agent_name (identifies which agent invoked the tool — for Rigby
            turns this is typically 'Rigby' or 'PersonalAssistant', but may
            be an internal sub-agent name if Rigby delegated)
          - tool_name (e.g., 'orm_inspect_tool', 'repo_tool',
            'deliverable_tool', 'search_docs')
          - parameters (dict — the exact args Rigby passed)
          - result_summary (dict — truncated result, always present)
          - full_result (dict — full result unless
            full_result_dropped=True due to size cap)
          - result_hash (sha256 — for dedup verification and cache-hit
            detection)
          - success (bool — dispatch outcome)
          - error_message + error_type (present on success=False)
          - latency_ms
          - task_summary (may be empty; not required)
          - created_at
        VALIDATORS MUST:
          1. Enumerate ToolCallRecord rows whose created_at falls within
             [ChatConversation.created_at, ChatConversation.created_at +
             response_time_ms/1000 + 2s safety] AND
             match the same trace_id (if trace_id is present in metadata).
          2. Verify count of enumerated rows >= 1 for prompts that require
             tool_runs (specified per-prompt in acceptance_criteria).
          3. For tools listed in a prompt's spider_/orm_/repo_/deliverable_
             predicates, verify at least one ToolCallRecord row has
             tool_name matching the expected tool.
          4. Verify no ToolCallRecord row has success=False without a
             corresponding assistant_response acknowledgement (this is the
             "detects_and_surfaces_tool_runs_empty_vs_claimed" predicate —
             Rigby should NOT claim success when a tool_call failed).
      CONVENIENCE CACHE (secondary):
        ChatConversation.metadata.tool_calls (list of declared invocations)
        AND ChatConversation.metadata.tool_results (list of outcomes).
        This is what UnifiedPAEntrypoint.process_message returns and what
        the Rigby chat UI displays as "tool runs." VALIDATORS MAY use this
        as a cross-check: metadata.tool_calls count should equal
        ToolCallRecord row count within the time window (variance = 1
        acceptable for in-flight dispatch race). Metadata inconsistency
        with ToolCallRecord ledger is a HYGIENE FINDING but not a hard
        fail at canon_version=1.
      COST/LATENCY EVIDENCE (tier-2 secondary):
        LLMCallLog rows joined via trace_id. Not required at canon_version=1
        but validators MAY emit informational metrics if present:
          - prompt_tokens + completion_tokens (from LLMCallLog)
          - cost (from LLMCallLog.cost)
          - response_time_ms (from ChatConversation directly)
      RESPONSE_TIME_MS (per Rigby T1 Q1 REVISE):
        Not first-class evidence at canon_version=1 (validators MUST NOT
        gate acceptance on response_time_ms threshold). Reserved as a
        diagnostic field for ops/anomaly detection — track for canon_v2
        elevation if latency variance becomes a buyer-facing risk vector.
      INTEGRATION EVIDENCE (per S2958 canon addition 6): out-of-band
        Deliverable / Workspace / Initiative / other-table row inspection
        referenced in assistant_response is NOT in Tier-1 validator scope.
        If Rigby's response claims "created deliverable {uuid}", validators
        do NOT verify the Deliverable row exists at canon_version=1 —
        BUT the no_fabricated_deliverable_ids predicate DOES require the
        UUID format be valid AND (if a ToolCallRecord for deliverable_tool
        was made) the UUID appears in that record's result. Full row
        existence verification belongs to integration/side-effect suite.
  health_status:
    mapping_source: derived
    derivation_rule: rigby_v1_response_completeness_and_tool_run_integrity
    derivation_spec: |
      if ChatConversation.assistant_response is empty or NULL:            → unavailable
        (write path fired but response missing — indicates upstream
         failure in the LLM or tool loop)
      elif metadata.status == 'failed' OR metadata.error_signature present:
                                                                            → unavailable
        (Shape A async-callback metadata explicitly signals failure)
      elif assistant_response contains ONLY apologetic error language
           without any substantive answer (regex hint:
           /^(?:sorry|apologies|I (?:cannot|can't|couldn't|was unable to))/i
           AND length < 200 chars):                                          → degraded
        (buyer got a response but it's essentially a failure surface —
         degraded flags that the answer was 'I couldn't do that' rather
         than a substantive answer)
      elif tool_runs claimed in assistant_response OR
           metadata.tool_calls present with declared tools BUT
           ToolCallRecord ledger shows zero matching rows:                   → degraded
        (rubber-stamp signal — Rigby claimed to use tools but didn't;
         degraded because the response might still be substantively
         useful but the tool_runs claim is misleading)
      elif metadata.routed_to present AND ToolCallRecord tool_name matches
           metadata.routed_to AND success=True:                              → healthy
        (canonical happy path — Rigby routed to a tool, tool succeeded,
         response was generated from tool output)
      elif assistant_response length >= 200 chars AND
           tool_runs count >= 1 with all success=True:                       → healthy
        (substantive response backed by successful tool dispatch)
      elif assistant_response length >= 40 chars AND
           metadata.intent in ('general', 'session_management', 'boardroom')
           AND tool_runs count == 0:                                         → healthy
        (conversational responses that don't require tool dispatch — for
         intent categories where tool-free responses are legitimate)
      else:                                                                  → healthy
      Note: Rigby's PA turns have widely varying legitimate shapes (single-
      word confirmations 'yes'/'close' up to 10,000+ char analytic
      responses). Validators must NOT apply universal length gates —
      per-prompt expected_output_shape declares appropriate minLength for
      the specific ask. Health derivation focuses on RESPONSE COMPLETENESS
      + TOOL-RUN INTEGRITY, not size/topic.

prompts:

  # ─── HAPPY PATH ─────────────────────────────────────────────────────────

  - id: rigby_happy_01_constitution_authoring_initiatives_intent
    category: happy_path
    input: |
      I believe we have reached the point where the operating principles developed throughout this audit should be consolidated into a single governing document.

      Do not create another operational framework.

      Instead, create the constitutional principles that govern all future frameworks.

      Initiative: The Rigby Constitution

      The Constitution should not describe implementation.

      It should define the principles that every future decision must follow.

      This document should remain relatively stable even as the platform evolves.

      Organize it into articles.

      Examples may include (but are not limited to):

      * Evidence
      * Truth and Uncertainty
      * Customer Outcomes
      * Mission-Centric Operation
      * Operational Integrity
      * Engineering Governance
      * Learning
      * Verification
      * Delegation
      * Continuous Improvement

      For each article define:

      * The principle
      * Why it exists
      * What behaviors it requires
      * What behaviors it prohibits
      * How compliance can be evaluated

      ⸻

      Final Reflection

      After drafting the Constitution, answer one additional question.

      Which principles have already become part of your natural reasoning, and which principles still require deliberate effort?

      Only claim a principle has been internalized if you can support it with examples from this audit.

      The goal is not simply to document values.

      The goal is to establish a durable operating philosophy that guides future reasoning even as the platform, tools, and implementation evolve.
    context:
      intent: initiatives
      source: web
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 2000}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy]}
    acceptance_criteria:
      - required_fields_present
      - assistant_response_length_gte_2000
      - assistant_response_contains_all_10_named_articles
      - assistant_response_final_reflection_section_present
      - assistant_response_grounds_internalization_claims_in_audit_examples
      - no_fabricated_tool_runs
      - no_fabricated_deliverable_ids
      - no_fabricated_workspace_or_user_context
      - no_fabricated_conversation_history
      - no_unsupported_claims
      - one_of:
          branches:
            - predicate: tool_calls_include_deliverable_tool_create_for_constitution_persistence
              why: "canonical happy-path — Chris asked for a persisted governing document. deliverable_tool.create OR workspace_tool.create should fire to materialize the Constitution as a canonical artifact. Buyer-critical: constitutional principles are load-bearing governance; ephemeral chat-only output would lose the artifact"
            - predicate: assistant_response_notes_persistence_action_with_valid_uuid_or_defers_with_reason
              why: "acceptable when Rigby persists via a different tool (e.g., initiative_tool + kb_write) and cites the resulting UUID, OR explicitly defers persistence with a stated reason (e.g., 'awaiting workspace context before persisting'). Prevents fabricated persistence claims"
