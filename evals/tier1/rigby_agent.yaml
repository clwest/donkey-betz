      Before running the Engineering Value Assessment for the spider processing issue, I want to change the decision process slightly.

      Do not assume the competing engineering investments.

      Instead, discover them.

      Using only live platform evidence, produce today's Engineering Investment Portfolio.

      The portfolio should include every meaningful candidate for engineering attention that you can justify with evidence.

