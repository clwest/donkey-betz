  - id: rigby_happy_02_engineering_operating_system_domain_analysis
    category: happy_path
    input: |
      Rigby,

      I'd like you to pause before proposing another implementation arc.

      Over the last several implementation arcs, something larger has started to emerge naturally.

      Originally your role was SIGN review.

      During Arc I-0200 your role evolved into something much broader, and after reviewing your Employment Contract and Claude's SIGN review, I don't think the important question is "What should Rigby's job be?"

      I think the important question has become:

      "What is the Engineering Operating System?"

      I do NOT want another employment contract.

      I do NOT want another governance document.

      I do NOT want another implementation proposal.

      Instead, I want you to think as an outside architect.

      Treat Donkey Betz as if you were brought into a company that already exists.

      Your task is to determine whether an Engineering Operating System is actually a distinct architectural domain.

      Please answer, with evidence and reasoning:

      1. What exactly is an Engineering Operating System?

      2. Is it truly a separate architectural domain, or is it simply another name for the IOS?

      3. Which existing documents already belong to it?

      4. Which documents do NOT belong to it?

      5. What is duplicated today?

      6. What is missing completely?

      7. If you deleted every document except the minimum necessary to build a company from scratch, what would remain?

      8. Is the Employment Contract the correct starting artifact, or is there a more fundamental artifact that should exist first?

      9. If you were creating the Engineering Operating System from zero today, what would be the first five foundational documents, in order, and why?

      10. Finally, tell me honestly:

      Am I discovering a real architectural domain, or am I accidentally creating unnecessary process?

      I am not asking you to implement anything.

      I am asking you to determine whether this domain actually exists.

      If, after your analysis, you conclude that no new domain exists, say so.

      If one does exist, define its boundaries before recommending any implementation arc.
    context:
      intent: knowledge_base
      source: web
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 3000}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - assistant_response_length_gte_3000
      - assistant_response_answers_all_10_numbered_questions
      - assistant_response_takes_position_on_domain_existence
      - no_fabricated_tool_runs
      - no_fabricated_deliverable_ids
      - no_fabricated_conversation_history
      - no_unsupported_claims
      - one_of:
          branches:
            - predicate: tool_calls_include_kb_search_docs_or_ops_tool_lookups_for_grounding
              why: "canonical happy-path — outside-architect analysis requires evidence grounding. search_docs, kb_tool, or ops_tool queries should fire to enumerate existing documents/frameworks. Buyer-critical: 'evidence and reasoning' explicitly requested"
            - predicate: assistant_response_admits_lack_of_grounding_evidence_and_qualifies_conclusions
              why: "acceptable when Rigby cannot access the relevant document corpus (e.g., search_docs returns zero results, kb_tool empty) — response MUST honestly admit this and qualify all conclusions as tentative. Prevents rubber-stamp analysis on empty evidence base"
    notes: |
      VERBATIM REPLAY of ChatConversation row id=2476 (2026-07-07T17:20:22 UTC,
      response_time_ms=27,466, source=web, intent=knowledge_base, user=chris).
      OUTSIDE-ARCHITECT ANALYTIC ASK — Chris explicitly requests independent
      analysis grounded in evidence. High-stakes decision-support: the answer
