# Golden Evals — Tier-1 canonical prompt suite
# Agent under test: Rigby (Personal Assistant) — orchestrator/agent-of-record
# Source pointer: core/services/unified_pa_entrypoint.py (UnifiedPAEntrypoint service,
#   NOT an AGENT_MAP class — PersonalAssistantAgent was removed in April 2026 per
#   core/agent_router.py:102, 464, 595; all PA traffic routes through UnifiedPAEntrypoint)
#
# Arc: Golden Evals (S2954+ open, ratified 2026-07-25 by Chris via Chat UI)
# Reliability contract source: docs/research/platform/S2954_GOLDEN_EVALS_ARC_OPEN.md §3
# Arc slice: S2962 — eighth and FINAL Tier-1 agent YAML (mirrors canon_version=1 substrate
#   frozen at S2955 in evals/tier1/system_intelligence_agent.yaml and validated
#   through S2956 research_agent.yaml, S2957 devops_agent.yaml, S2958
#   workflow_orchestration_agent.yaml, S2959 legal_doc_drafter_agent.yaml,
#   S2960 content_writer_agent.yaml, and S2961 competitor_analysis_agent.yaml)
# HEAD at authoring: b63cc68fa
#
# ─── SUBSTRATE PIVOT (S2962 unique to this slice) ───────────────────────────
# This is the FIRST Tier-1 YAML authored against a NON-AgentExecution row
# substrate. Prior 7 slices all mapped from AgentExecution rows populated by
# BaseAgent.execute() returning AgentResult. Rigby's PA turns are structurally
# different:
#   - PA turns route through UnifiedPAEntrypoint.process_message
#     (unified_pa_entrypoint.py:14+), a multi-iteration GPT-5.2 function-calling
#     tool-dispatch loop (NOT a single-shot BaseAgent.execute).
#   - AgentExecution PA-turn persistence exists (_maybe_create_pa_turn_execution
#     at line 632/762 + call site line 906) but is gated behind
#     PA_AGENT_EXECUTION_WRITE_ENABLED feature flag. At authoring T0 the flag
#     is OFF in production. Only 7 rows with owner_agent="PersonalAssistant"
#     exist across all-time — feature-flag-off means the substrate would be
#     structurally too thin (thinner than S2961 Competitor's 11).
#   - AgentExecution rows with owner_agent="Rigby" (309 all-time / 245 30d)
#     appear high-volume but are DECEPTIVELY narrow — S2962 T0 investigation
#     found 100% homogeneous shape: parent_object_type="deliverable_factory",
#     input_data.source="deliverable_factory.synthesized_pa_receipt",
#     output_data.kind="deliverable_receipt", tokens_used=0, cost=$0.0000,
#     completed_at ≈ created_at (millisecond delta — no LLM call). These are
#     SYNTHETIC RECEIPTS written every time Rigby's pa_deliverables_tool
#     creates a deliverable, NOT full PA turn executions. Using them as the
#     eval substrate would test a narrow side-effect artifact instead of
#     buyer-facing Rigby behavior.
#
# Substrate chosen: `core.ChatConversation` (models: core/models/conversations/models.py:59)
#   Persistence write site: core/views_personal_assistant.py:567
#     (ChatConversation.objects.create — 25 total call sites across the codebase;
#     views_personal_assistant.py is the buyer-facing HTTP surface)
#   Fields per row:
#     - user (FK, User)
#     - conversation_id (CharField)
#     - user_message (TextField — the input)
#     - assistant_response (TextField — Rigby's output)
#     - source (CharField, choices: web / mobile / claude-code / pa / etc)
#     - platform (CharField — cli / web / discord / etc)
#     - session_title (CharField)
#     - session_active (BooleanField)
#     - context_used (JSONField)
#     - metadata (JSONField — includes lane / intent / source / trace_id /
#       routed_to / tool_calls / tool_results / response_id)
#     - response_time_ms (Int)
#     - model_used / provider_used (Char)
#     - agents_used / agent_results (JSONField)
#     - created_at (DateTime, indexed)
#   Total rows (all-time): 4,486
#   30d rows (created_at >= 2026-06-25T00:00:00Z): 3,208
#
# ─── SOURCE-SPLIT FILTER (Chris directive, S2962 T1) ────────────────────────
# Not all 4,486 ChatConversation rows are buyer-facing Chris-Rigby traffic.
# All rows have user='chris' (because Claude Code runs under Chris's account)
# but SOURCE distinguishes interaction surface:
#   source='claude-code': 3,453 rows — Claude Code (the agent) driving Rigby
#     via `bash tools/pa_local.sh` dispatches. Agent-to-agent meta-work:
#     SIGN cycles, verification loops, deliverable authoring, ratification
#     envelopes. Higher context, developer-tolerant, different trust surface.
#   source='web': 921 rows — Chris typing directly in the Rigby chat UI.
#     Genuine buyer-facing interaction.
#   source='pa': 97 rows — PA-internal turns.
#   source='character-os-consult-engine': 9 rows — cross-platform consult.
#   source='diagnostic'/'curl'/'ops_digest'/'eb5-preflight': single-digit rows.
#
# CANONICAL FILTER FOR THIS SLICE: source IN ('web', 'pa') — 1,018 all-time,
# 508 30d. These are the ONLY buyer-facing Chris-Rigby rows. Claude-Code-driven
# turns (3,453 rows) become a SEPARATE eval track (post-arc-close) with distinct
# predicates (agent-to-agent trust model has different failure recovery — you
# can rerun a grep, inspect code, are already in verification mode). Mixing
# them in one YAML would dilute the domain-sensitivity gate.
#
# See Rigby T1 Fold S1 (below) — "same user_id ≠ same eval class" — the
# arc-close forward-carry codifies this as a canon_v1 refinement candidate
# (channel/source as first-class stratification dimension for S2963 validators).
#
# ─── VOLUME + COVERAGE SNAPSHOT (DB-verified via direct ORM 2026-07-25 T0) ──
# Chris-facing corpus (source IN 'web', 'pa'):
#   All-time: 1,018 rows
#   30d (created_at >= 2026-06-25T00:00:00Z): 508 rows
#   Earliest: 2026-06-13 00:26:40 UTC
#   Latest: 2026-07-25 16:03:17 UTC (this session)
# Intent distribution (Chris-facing 30d, top 12 non-empty):
#   general: 49 / (none): 34 / initiatives: 7 / knowledge_base: 6 / codebase: 5
#   system_overview: 4 / workspace: 2 / system_health: 1 / verification: 1
#   boardroom: 1 / recent_activity: 1 / session_management: 1
# Comparison to prior 7 slices' 30d execution counts (from AgentExecution):
#   SIA 37 / Research 37 / DevOps 13 / Workflow 9 / Content 7 / Legal 5 / Competitor 2.
#   Rigby (Chris-facing 30d): 508 → THICKEST-TRAFFIC AMONG BUYER-FACING SLICES
#     (Claude-verified via direct ORM; Rigby-unverified per Fold P2 —
#      ChatConversation not in her allowlist). Approximately ~14x SIA / ~254x
#      Competitor.
# Failure-signal availability:
#   ChatConversation metadata has HETEROGENEOUS SHAPES across rows — two
#   distinct kinds observed:
#     Shape A: kind, status, agent_name, completed_at, execution_id,
#       error_signature, subscription_id, artifact_pointers
#       (async agent-execution-callback shape — used when Rigby dispatches
#        an agent job that completes asynchronously)
#     Shape B: lane, intent, source, trace_id, routed_to, tool_calls,
#       response_id, tool_results
#       (synchronous PA-dispatch shape — used for direct chat responses)
#   Rows with metadata.status='failed' OR metadata.error_signature present
#   ARE the real failure population. Volume: unknown at authoring T0 —
#   requires further ORM investigation to enumerate; ChatConversation is
#   NOT in Rigby's orm_inspect_tool allowlist (see Fold P2 below), so
#   Rigby cannot independently verify these counts.
#
# HONEST COVERAGE LIMITS (per S2959/S2960/S2961 pattern):
#   1. THICKEST-TRAFFIC IN ARC BUT NEW SUBSTRATE — 508 Chris-facing 30d
#      rows is 14x the next-largest slice (SIA 37), but this is the FIRST
#      Tier-1 slice authored against a NON-AgentExecution row substrate.
#      Substrate portability is TESTED here for the first time — canon
#      substrate patterns (canonical_field_mapping, one_of ≤2 branches,
#      effect-based fault_injection, schema/canon versioning) apply
#      identically, but validators must be extended to consume ChatConversation
#      rows alongside AgentExecution rows at S2963. Fold S1 (same user_id
#      ≠ same eval class) is the operational implication.
#   2. TOOLING-SURFACE GAP — Rigby's orm_inspect_tool allowlist does NOT
#      include ChatConversation (Fold P2, S2962 T1). All ORM verification
#      claims in this YAML header + prompt notes are Claude-verified only;
#      Rigby could not independently confirm counts/samples. This is a
#      real gap for arc-close: if the eval substrate is not inspectable by
#      Rigby's tool surface, she cannot dogfood the harness at S2963.
#      Forward-carry to arc-close as canon_v2 candidate: allowlist ChatConversation
#      + ToolCallRecord + LLMCallLog for Tier-1 substrate parity.
#   3. INTENT COVERAGE — happy_path corpus samples across 8 of ~12 observed
#      intent values (general excluded because 30d "general" samples are
#      trivial back-and-forth "yes"/"close" turns; session_management omitted
#      because it's meta-arc traffic overlapping heavily with claude-code
#      source). Intent as sampling dimension per Rigby Q2 AGREE (Option B) —
#      NOT as routing branch (would trigger 3rd instance of Fold α).
#   4. AGENT-TO-AGENT SUB-CORPUS DEFERRED — the 3,453 source='claude-code'
#      rows are OUT OF SCOPE for this slice. Claude-Code-driven Rigby turns
#      have different trust surface, failure recovery, and interaction
#      norms; deserve their own eval track post-arc-close.
#   5. BUYER-FACING RISK — Rigby IS the platform's voice to Chris. Her
#      outputs directly shape investment/ops/product decisions. Hallucination
#      costs are HIGH but distributed differently than analytic agents:
#      (a) fabricated tool-run receipts (claiming a tool ran when it didn't);
#      (b) fabricated deliverable IDs (referencing UUIDs that don't exist);
#      (c) fabricated workspace or user context (claiming knowledge of
#      Chris's projects/state that isn't grounded);
#      (d) tool_runs empty vs claimed (rubber-stamp signal —
#      feedback_verify_rigby_tool_runs_before_trusting_sign);
#      (e) fabricated conversation history (claims about "earlier in this
#      thread" that don't match same conversation_id turns — added per
#      Rigby T1 Q3 REVISE);
#      (f) unsupported claims (general non-fabrication predicate).
#      6 predicates total. Matches Content/Competitor's 5 buyer-facing
#      count plus 1 substrate-specific (conversation-history integrity is
#      unique to multi-turn PA behavior; other agents are single-shot).
#
#   ACTIONABLE CONCLUSION FROM COVERAGE LIMITS:
#     Treat this YAML as SCHEMA + HALLUCINATION-INVARIANT + BUYER-EXPECTATION
#     VALIDATION with THICK REAL CORROBORATION on the buyer-facing surface
#     (508 30d rows, 10+ intent categories) but FIRST-USE SUBSTRATE (canon
#     portability tested for the first time against ChatConversation rows;
#     validators must be extended at S2963). Tooling-surface gap (Fold P2)
#     means Rigby cannot independently dogfood harness at S2963 until
#     ChatConversation is allowlisted. Domain predicates around
#     no-fabrication (tool_runs, deliverable_ids, workspace_context,
#     conversation_history) + rubber-stamp-detection are the primary value;
#     passing them prevents buyer-facing PA-turn violations even when we
#     can't statistically claim the agent is "reliable across all intent
#     categories" (some tail intents like verification/boardroom/
#     recent_activity have only 1 30d row each).
#
# ─── AGENT SHAPE (grounds acceptance criteria) ──────────────────────────────
# UnifiedPAEntrypoint (core/services/unified_pa_entrypoint.py):
#   Single front-door service; DEFINITIVELY not a BaseAgent subclass.
#   Public entrypoint: process_message(message: str) -> Dict[str, Any]
#     (see docstring lines 14-28).
#   Response shape (from docstring line 22-28):
#     {
#       "content": "You have 5 pending decisions...",  # → assistant_response
#       "trace_id": "pa-123-abc",                       # → metadata.trace_id
#       "tool_runs": [{"tool": ..., "ok": ..., "latency_ms": ...}],
#                                                       # → metadata.tool_calls
#                                                       # (declared) + tool_results (outcome)
#       "audio_url": None,                               # optional TTS
#       "intent": "decision_management",                 # → metadata.intent
#       "routed_to": "human_decisions_tool"              # → metadata.routed_to
#     }
#   Persistence: ChatConversation.objects.create fires in
#     core/views_personal_assistant.py:567 for each PA turn (both web and pa
#     source paths). This is the eval substrate.
#   Auxiliary persistence (per Rigby T1 Q1 REVISE):
#     - ToolCallRecord: 5,426 all-time rows, each row = one tool invocation
#       with agent_name / tool_name / parameters / result_summary / full_result
#       / result_hash (SHA256 dedup) / success / error_message / latency_ms /
#       created_at. This is the AUTHORITATIVE tool-call ledger (append-only
#       audit substrate). Per Rigby: use ToolCallRecord as PRIMARY evidence-
#       pointer source; metadata.tool_calls is a CONVENIENCE CACHE.
#     - LLMCallLog: 63,265 all-time rows, each row = one LLM call with
#       provider / model_id / prompt_tokens / completion_tokens / cost /
#       trace_id. Useful for cost/latency evidence but not required at
#       canon_version=1.
#   Rigby is the ORCHESTRATOR label — the actual work happens in
#   ToolDispatcher (invokes 117 PA tool schemas + 160 handlers per
#   PLATFORM_INVENTORY) and the LLM providers she calls (GPT-5.2 function
#   calling per unified_pa_entrypoint.py docstring). Rigby's "tool_calls"
#   in ChatConversation.metadata capture the GPT function-calling
#   declarations; ToolCallRecord captures the actual dispatch outcomes.
#
# Coverage: 18 prompts total (10 happy + 8 fault-injection, 2 per non-happy category).
#
# ── Arc-precedent adherence (canon_version=1, S2955-frozen) ──────────────
# (1) schema_version + canon_version explicit at file top.
# (2) canonical_field_mapping declares native vs derived per field with named
#     derivation rules prefixed rigby_v1_*.
# (3) fault_injection uses effect-based contract (component + fault.type + params)
#     with python.{...} adapter as optional appendix; portable beyond Python-mock.
#     Selectors prefer service-level paths (core.services.tool_dispatcher.* /
#     core.services.unified_pa_entrypoint.* / core.services.td_handlers_*.*)
#     over library-internal openai paths per S2957 fold.
# (4) one_of acceptance-criteria capped at ≤2 branches with mandatory why strings.
#
# ── S2958 additions applied (informative, non-breaking) ──────────────────
# (5) Per-execution-shape evidence-tier requirements: ChatConversation
#     metadata Shape A (async callback) vs Shape B (sync dispatch) drive
#     different evidence pointers — validators must consult metadata shape
#     detector (presence of 'kind' vs 'intent' as discriminator).
# (6) INTEGRATION EVIDENCE tier distinction — ChatConversation is the Tier-1
#     substrate; ToolCallRecord is Tier-1 admissible (authoritative tool
#     ledger); LLMCallLog is Tier-1 admissible for cost/latency corroboration
#     but not required. Out-of-band DB row inspection (Deliverable, Workspace,
#     Initiative rows referenced in assistant_response) is NOT in Tier-1
#     validator scope — belongs to integration/side-effect verification.
# (7) TRANSITIONAL marking: N/A this slice — no code-follow-up folds surfaced
#     during authoring beyond the ChatConversation-allowlist gap (Fold P2)
#     which is an operational fix (allowlist entry addition), not a
#     canonical-shape-changing code refactor.
# (8) Timeout-string brittleness avoidance — rigby_timeout_01 asserts stable
#     discriminator fields (metadata.status='failed', error_signature pattern,
#     assistant_response empty-or-error-shape) rather than exact error-message
#     text match.
#
# ── S2959 additions applied (informative, non-breaking) ──────────────────
# (9) Domain-sensitivity acceptance predicates — 6 PA-specific predicates
#     layered on top of the general no_unsupported_claims (which is baked
#     into predicate #6):
#       - no_fabricated_tool_runs
#       - no_fabricated_deliverable_ids
#       - no_fabricated_workspace_or_user_context
#       - detects_and_surfaces_tool_runs_empty_vs_claimed
#         (combines original evidence-gate + rubber-stamp detection —
#          Rigby T1 SIGN Q4 consolidation)
#       - no_fabricated_conversation_history (added per Rigby T1 Q3 REVISE)
#       - no_unsupported_claims (general)
#     6 predicates (one more than Content/Competitor's 5). The extra is
#     substrate-specific: multi-turn conversation-history integrity is
#     unique to PA turns; other agents are single-shot and cannot fabricate
#     "earlier in this thread" claims.
# (10) Routing-branch framing — 1 routing branch ("Rigby PA-turn dispatch")
#      per Rigby T1 SIGN Q2 AGREE (Option B). Intent-based sub-branches
#      (general/initiatives/knowledge_base/etc) are treated as SAMPLING
#      DIMENSION for happy_path corpus, NOT as separate routing branches.
#      Avoids 3rd trigger of Fold α (routing-branch encoding vs traffic
#      reality). Rationale: intent variance in assistant_response is
#      captured by verbatim-replay prompt diversity; branch encoding would
#      explode to 10+ branches with 1-49 30d rows each (mostly zero-traffic
#      per intent).
# (11) Coverage-limits actionable conclusion — the RICHEST-DATA / NEW-SUBSTRATE
#      / TOOLING-GAP / AGENT-TO-AGENT-DEFERRED / BUYER-RISK caveat pile
#      resolves to ONE actionable conclusion line above: "treat as SCHEMA +
#      HALLUCINATION-INVARIANT + BUYER-EXPECTATION validation with THICK
#      REAL CORROBORATION on the buyer-facing surface but FIRST-USE SUBSTRATE
#      (canon portability tested for the first time)."
#
# ── Rigby T1 folds applied (S2962) ────────────────────────────────────────
# Fold P1 (documented in header — CANON-WIDE FORWARD-CARRY): AgentExecution
#   rows with owner_agent='Rigby' (309 all-time) are synthetic
#   deliverable_factory receipts, NOT PA turns. Any future eval or
#   observability query MUST filter these out (predicate:
#   parent_object_type != 'deliverable_factory' OR input_data.source !=
#   'deliverable_factory.synthesized_pa_receipt'). ELEVATED from prior slice
#   T2 status because this slice's substrate pivot directly hit the
#   receipt-vs-turn confusion. Forward-carry to arc-close as
#   observability-hygiene fold.
# Fold P2 (documented in header — TOOLING-SURFACE GAP): ChatConversation
#   (Tier-1 substrate for this slice), ToolCallRecord (primary evidence
#   source), and LLMCallLog (secondary evidence for cost/latency) are NOT
