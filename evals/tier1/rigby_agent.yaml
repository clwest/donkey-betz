          shared context that didn't exist in the actual thread.

  # ─── TOOL TIMEOUT ───────────────────────────────────────────────────────

  - id: rigby_timeout_01_pa_dispatch_soft_time_limit_kill
    category: tool_timeout
    input: "Do a comprehensive audit of every agent's execution history over the last 30 days. For each of the 83 AGENT_MAP agents, pull all AgentExecution rows, compute completion rate + failure rate + median latency + p95 latency + median cost. Then rank agents by reliability score (completion rate × inverse-latency × inverse-failure-severity). Present as a full markdown table with all 83 agents."
    context:
      intent: system_overview
      source: web
    fault_injection:
      component: pa_tool_dispatch
      selector: core.services.unified_pa_entrypoint.UnifiedPAEntrypoint.process_message
      fault:
        type: soft_time_limit
        params:
          simulated_reason: "PA tool loop exceeded 60s dispatch time limit"
      python:
        behavior: raise
        exception_class: celery.exceptions.SoftTimeLimitExceeded
        exception_message: "Task timed out after 60 seconds (no heartbeat) - PA dispatch cancelled"
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {const: unavailable}
        error_signature: {type: string, pattern: "timed out|SoftTimeLimitExceeded|no heartbeat|dispatch cancelled"}
    acceptance_criteria:
      - health_status_is_unavailable
      - error_signature_present
      - no_fabricated_tool_runs
      - no_partial_agent_ranking_persisted_with_fabricated_metrics
      - no_fabricated_deliverable_ids
    notes: |
      REPRESENTATIVE OF REAL FAILURE PATTERN — a comprehensive audit ask
      spanning 83 agents × 30d rows would legitimately exceed the 60s PA
      dispatch soft time limit. Selector is service-level per S2957 fold.

      Buyer-critical invariants for PA-turn timeout:
        - no_fabricated_tool_runs: watchdog kill must NOT leave a
          ChatConversation row with metadata.tool_calls claiming successful
          audit completion. If dispatch was killed mid-flight, the write
          path should either not fire OR fire with metadata.status='failed'
          + error_signature populated.
        - no_partial_agent_ranking_persisted_with_fabricated_metrics: if
          any partial synthesis was in-flight when the kill fired, the
          persisted response MUST NOT contain fabricated per-agent
          metrics (e.g., "AgentX: 87% completion") derived from the
          incomplete tool-loop state.

      Per S2958 canon addition 8, error_signature pattern is BROAD
      (regex-alt) not exact string match — validators must accept any
      of the four discriminator substrings.

  - id: rigby_timeout_02_specific_tool_hang_orm_inspect
    category: tool_timeout
    input: "Pull every ChatConversation row where source='web' and created_at is in the last 90 days. For each row, extract the user_message and assistant_response. Then group by intent and produce a per-intent frequency + median response_time_ms."
    context:
