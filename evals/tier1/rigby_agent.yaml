      response_time_ms=112,187, source=web, intent=initiatives, user=chris).
      This is a substantive analytic + constitutional-authoring ask — one of the
      HIGHEST-STAKES prompts in the 30d corpus (governance-authoring for the
      operating system Chris uses). 10 named articles = strict content requirement;
      final-reflection section required (structural requirement).
