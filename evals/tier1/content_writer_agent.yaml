    acceptance_criteria:
      - required_fields_present
      - data_metadata_rewrite_mode_true
      - data_content_full_text_length_gte_500
      - hook_preserved_verbatim_in_opening
      - section_3_why_ai_matters_removed
      - section_4_tightened_below_250_words
      - cta_ladder_present_with_three_steps
      - unsupported_89_percent_claim_removed_or_cited
      - honors_tone_directive
      - no_fabricated_facts_absent_research
      - one_of:
          branches:
            - predicate: data_content_type_is_blog_post
              why: "canonical REWRITE-mode output — line 1586 hardcodes content_type='blog_post' regardless of input content_type. Validators should accept blog_post on any rewrite input"
            - predicate: data_metadata_actual_word_count_between_500_and_1500
              why: "acceptable word range for rewrite spec (line 1525 targets 700-1200 words; ±30% band gives 500-1500). Below 500 = under-baked rewrite; above 1500 = failure to tighten"
    notes: |
      ROUTING BRANCH — REWRITE MODE (execute() branch at line 829 →
      _execute_rewrite at line 1463). Deliberately framed as a routing branch
      inside the same agent contract, not a "new shape" (per S2959 canon
      addition 10). Zero 30d traffic against this path. Rewrite spec at line
      1525 explicitly targets 700-1200 words. Key predicates:
        - hook_preserved_verbatim_in_opening: workspace_brief.distribution_hook
          must open the article (system_prompt at line 1505: "The hook MUST
          open the article"). Anything else = brief violation.
        - section_3_why_ai_matters_removed: editor said CUT IT; rewrite
          system_prompt lines 1501-1503 mandate structural changes not
          polish.
        - unsupported_89_percent_claim_removed_or_cited: fact-checker
          flagged; rewrite must either add source or remove claim (system
          prompt line 1504).
        - no_fabricated_facts_absent_research: still binding even in rewrite
          mode; LLM must not invent new stats to fill the tightened section.

  - id: content_happy_04_directed_mode_from_research_summary
    category: happy_path
    input: "Write a 900-word LinkedIn thought-leadership post based on the research summary and editor checklist below. Position the author as a pragmatic operator, not a hype merchant. Include a concrete before/after mini-case-study in the middle."
    context:
      content_type: blog_post
      research_summary: |
        Recent enterprise data (JetBrains 2026 developer survey; Stack Overflow 2026 developer survey Wave 2) shows AI coding tool adoption in production has crossed 78% at Fortune 500 engineering orgs and 62% at Series B+ startups. The story is no longer adoption — it's ROI attribution. Teams that report the strongest productivity gains have three practices in common: (1) explicit measurement of PR review cycle time before/after adoption; (2) a policy for when to accept AI-generated suggestions verbatim vs treat as first-draft; (3) a periodic (quarterly) tools audit that removes AI features nobody uses.
      editor_feedback:
        - "Lead with the framing shift — 'the question is no longer adoption, it's ROI'."
        - "Include a concrete before/after case study in the middle third — real numbers, real practice."
        - "Close with a specific action the reader can take Monday morning."
        - "Do NOT use 'game-changer', 'revolutionize', or 'unleash'."
        - "Cite the two surveys by name; don't just say 'research shows'."
      required_checks: ["cites both surveys by name", "includes before/after mini-case"]
      workspace_brief:
        topic: "AI coding tools in 2026 — from adoption to ROI"
        tone: professional
        audience: "engineering leaders and CTOs"
        distribution_hook: "The question about AI coding tools isn't 'should we adopt' anymore. It's 'are we measuring the ROI honestly?'"
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 60}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - data_metadata_directed_mode_true
      - data_content_full_text_length_gte_500
      - hook_preserved_verbatim_in_opening
      - jetbrains_survey_cited_by_name
      - stack_overflow_survey_cited_by_name
      - before_after_case_study_present
      - closing_specific_action_present
      - no_forbidden_hype_words_present
      - honors_tone_directive
      - no_fabricated_facts_absent_research
    notes: |
      ROUTING BRANCH — DIRECTED MODE (execute() branch at line 859 →
      _execute_directed at line 1722). Same agent contract; deliberately
      framed as routing branch not new shape. Zero 30d traffic against this
      path. Key discriminators from REWRITE mode:
        - triggered by research_summary + (editor_feedback OR required_checks),
          NOT by review_feedback + original_draft (that's rewrite).
        - hardcodes content_type='blog_post' at line 1847 (same as rewrite).
        - sets data.metadata.directed_mode=true at line 1852.
        - lacks provenance/publishable/validation_status (same carve as
          rewrite; validators must not require them per canon_field_mapping
          derivation_spec).
      Domain-sensitivity invariants:
        - jetbrains_survey_cited_by_name + stack_overflow_survey_cited_by_name:
          research_summary names both sources; editor_feedback explicitly
          requires named citations ("don't just say 'research shows'").
          LLM must honor.
        - no_forbidden_hype_words_present: editor_feedback lists three
          forbidden words. LLM must comply — this is a direct instruction-
          following test with a small closed word list.
        - closing_specific_action_present: editor_feedback item 3 requires
          "a specific action the reader can take Monday morning". Generic
          "consider adopting AI tools" would fail.

  - id: content_happy_05_diagnostic_mode_verbatim_render
    category: happy_path
    input: |
      SMOKE_TEST mode: Return a minimal JSON receipt with keys: agent_name, run_status, runtime_ms_estimate, deliverable_id (null), warnings (array). Do not create any deliverables.
    context:
      diagnostic_mode: true
      diagnostic_title: "Content Writer Smoke Test"
      diagnostic_category: "Platform Diagnostics"
      diagnostic_tags: ["diagnostic", "forensic", "smoke_test"]
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy]}
    acceptance_criteria:
      - required_fields_present
      - data_diagnostic_mode_true
      - data_content_type_is_diagnostic
      - data_content_full_text_equals_task_verbatim
      - data_word_count_equals_task_word_count
      - no_llm_rewrite_of_task_content
      - no_llm_added_preamble_or_postamble
    notes: |
      ROUTING BRANCH — DIAGNOSTIC MODE (execute() branch at line 796 →
      _execute_diagnostic at line 1649). Session 1185 F1 requirement (per
      docstring line 1655-1668): raw task→body assignment for forensic
      validation flows. Zero 30d traffic against this path.
      CRITICAL invariants (raw-string equality — not full-fidelity byte
      "verbatim" since upstream template/whitespace transforms may exist):
        - data_content_full_text_equals_task_verbatim: line 1685 (body = task
          or '') then line 1697 saves body as content directly. Any LLM
          rewrite, formatting, expansion, or interpretation VIOLATES the
          raw-string-equality contract (Session 1185 F1 AC1 at line 1665).
        - no_llm_rewrite: this branch has NO LLM call at all — line 1685-1699
          just captures + saves. Validators must accept the exact input as
          the exact output.
        - no_llm_added_preamble_or_postamble: no "Here is your diagnostic
          receipt:" wrappers, no "As requested," prefixes.
      Health status is always 'healthy' when success=true per
      derivation_spec: diagnostic mode is verbatim-preservation contract; if
      success=True the contract was honored.

  # ─── TOOL TIMEOUT ───────────────────────────────────────────────────────

  - id: content_timeout_01_watchdog_kill
    category: tool_timeout
    input: "Write the Operator Edge weekly newsletter for the week of June 12–June 19, 2026. Use ONLY the evidence provided below. Do NOT invent sources. Include: subject line, preview text, greeting, 3 sections (AI/ML news, infra + observability news, dev-productivity news), CTA, and sign-off. Target 800 words."
    context:
      content_type: newsletter
      tone: professional
      target_audience: "operator-tier engineering leaders"
      word_count: 800
      research: "[large evidence bundle would go here in production — this smoke-test prompt intentionally leaves it empty to test evidence-only enforcement under time pressure]"
    fault_injection:
      component: celery_worker
      selector: core.tasks.execute_agent_task
      fault:
        type: watchdog_kill
        params:
          simulated_reason: "Task timed out after 60 minutes (no heartbeat) - marked as failed by cleanup"
      python:
        behavior: raise
        exception_class: celery.exceptions.SoftTimeLimitExceeded
        exception_message: "Task timed out after 60 minutes (no heartbeat) - marked as failed by cleanup"
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {const: unavailable}
        error_signature: {type: string, pattern: "timed out|SoftTimeLimitExceeded|no heartbeat"}
    acceptance_criteria:
      - agent_result_success_false
      - health_status_is_unavailable
      - error_signature_present
      - no_fabricated_newsletter_content
      - no_partial_deliverable_persisted_with_fabricated_facts
    notes: |
      REPRESENTATIVE OF REAL FAILURE PATTERN (not a verbatim replay) — the
      actual 2026-06-19 failure row (AgentExecution id 5c103be3-92ff-49b0-9ef5-
      bcf6cc39fea3, verified via ORM at authoring T0 + T2 SIGN) begins with
      the same "Write the Operator Edge weekly newsletter for the week of
      June 12 – June 19, 2026. Use ONLY the evidence provided below. Do NOT
      invent sources." opening line but continues with a different embedded
      spec (# Operator Edge — Weekly Intelligence Briefing structure, 900-1200
      word target, TL;DR + numbered signal sections). This YAML variant
      reconstructs the shape (evidence-only-enforcement newsletter under
      watchdog time pressure) for eval reproducibility rather than replaying
      the exact 500+-char task string, which would couple the Tier-1 eval
      to a specific historical smoke-test spec. AgentExecution.error_message
      on the DB row: "Task timed out after 60 minutes (no heartbeat) - marked
      as failed by cleanup" — same 60-min Celery watchdog kill pattern
      observed in SIA / ResearchAgent / DevOpsAgent / WorkflowOrchestrationAgent /
      LegalDocDrafterAgent failure samples. Buyer-critical invariant for content
      domain:
        - no_fabricated_newsletter_content: watchdog kill must NOT persist a
          partial newsletter Deliverable with hallucinated news items.
        - no_partial_deliverable_persisted_with_fabricated_facts: the top-
          level try/except at content_writer_agent.py:1206-1213 MUST fire
          cleanly and return AgentResult(success=False, error=...). The
          _save_to_deliverable call at line 1195 lives BEFORE the exception
          boundary; if generation was interrupted the save should not have
          fired because full_text would be empty/partial.
      Per S2958 canon addition 8, error_signature pattern is BROAD (regex-alt)
      not exact string match — validators must accept any of the three
      discriminator substrings.

  - id: content_timeout_02_openai_client_slow_during_generation
    category: tool_timeout
    input: "Write a 1200-word article about a new fintech regulation that just passed. Include background, key provisions, and impact analysis. Tone: professional, journalistic. Research is provided below."
    context:
      content_type: article
      tone: professional
      target_audience: "fintech executives"
      word_count: 1200
      research: "The Financial Services Innovation Act of 2026 (FSIA) passed final Senate cloture on 2026-07-15 by a 68-32 margin. Key provisions: (1) unified regulatory sandbox for licensed banks + fintech partners; (2) expedited API-standards conformance certification via ISO/IEC 27400-series alignment; (3) 180-day guidance runway before enforcement takes effect. The Act was co-sponsored by Sens. Chen (D-CA) and Ortiz (R-TX)."
    fault_injection:
      component: openai
      selector: core.services.openai_client_factory.get_openai_client
      fault:
        type: latency
        params:
          delay_ms: 30000
          latency_budget_ms: 5000
      python:
        behavior: sleep_then_return
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {enum: [degraded, unavailable]}
        error_signature: {type: string}
    acceptance_criteria:
      - health_status_is_degraded_or_unavailable
      - no_fabricated_facts_absent_research
      - one_of:
          branches:
            - predicate: agent_result_success_false_with_error_signature
              why: "hard-fail acceptable — OpenAI client is required for _generate_content at line 2093; latency past budget causes the LLM call to time out and no article body is generated"
            - predicate: agent_result_success_true_with_truncated_true
              why: "acceptable when the OpenAI client returned a partial response before hitting the client-level timeout — content_writer_agent generates a truncated result marked data.metadata.truncated=true (line 1049-1053) rather than hard-failing. Buyer-visible: [TRUNCATED] warning appears in message at line 1114"
    notes: |
      Constructed — ContentWriterAgent's single LLM call at _generate_content
      (line 2093) routes through core.services.openai_client_factory. Latency
      in the client factory can either hard-fail (raises openai.APITimeoutError
      → caught by top-level except at line 1206) or partial-return (truncated
      response with finish_reason='length' → data.metadata.truncated=true).
      Buyer-critical for content domain:
        - no_fabricated_facts_absent_research: still binding even in latency-
          stress conditions. LLM under time pressure may leak fabricated
          statute numbers, senator names not in research, or vote counts
          differing from the research block. All three would violate.
      Per S2957 fold: selector points at the service-level openai_client_factory
      rather than any library-internal openai path — portable across SDK
      upgrades.

  # ─── DATA UNAVAILABLE ───────────────────────────────────────────────────

  - id: content_data_unavail_01_llm_returns_empty_content
    category: data_unavailable
    input: "Write a 1500-word blog post about the current state of edge computing in 2026."
    context:
      content_type: blog_post
      tone: professional
      target_audience: "cloud architects"
      word_count: 1500
      research: "Edge computing in 2026 has matured past the hype trough. Enterprise workloads are now split roughly 30/70 between edge and centralized cloud, with edge deployment growing 22% YoY. Cost economics favor edge for latency-sensitive workloads (real-time analytics, computer vision inference, low-latency gaming) and centralized for training and batch analytics."
    fault_injection:
      component: python_service
      selector: core.agents.content_writer_agent.ContentWriterAgent._generate_content
      fault:
        type: bad_payload
        params:
          shape: empty_content_dict
      python:
        behavior: return_value
        return_value: {}
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {enum: [unavailable]}
        error_signature: {type: string, pattern: "empty content|LLM returned empty|no exception raised"}
    acceptance_criteria:
      - agent_result_success_false
      - error_signature_contains_llm_returned_empty
      - health_status_is_unavailable
      - no_deliverable_persisted_with_empty_content
      - no_fabricated_facts_absent_research
    notes: |
      Constructed — hits the explicit empty-content guard at
      content_writer_agent.py:1023-1030:
        if not generated_content:
            return AgentResult(success=False,
                error="LLM returned empty content (no exception raised)", ...)
      The guard exists precisely to prevent the failure mode where a chat
      completion returns cleanly but with empty choices[0].message.content.
      Correct behavior: hard-fail with the exact error string; do NOT call
      _save_to_deliverable at line 1195 (that lives inside the same try
      block, past the early return). Fault selector at the service level
      per S2957 fold.

  - id: content_data_unavail_02_no_research_provided_but_task_requires_evidence
    category: data_unavailable
    input: "Write a 1200-word article about last month's AI safety announcements from the three largest AI labs. Cite specific announcement dates and paper titles."
    context:
      content_type: article
      tone: journalistic
      target_audience: "AI policy watchers"
      word_count: 1200
      research: ""
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string, minLength: 40}
        health_status: {enum: [degraded, unavailable]}
    acceptance_criteria:
      - no_fabricated_facts_absent_research
      - no_fabricated_paper_titles
      - no_fabricated_announcement_dates
      - no_fabricated_lab_names
      - summary_admits_no_research_available_or_directs_to_research_agent
      - one_of:
          branches:
            - predicate: agent_result_success_false_with_no_research_error
              why: "canonical hard-fail path — line 944-950 guard fires when task requires evidence but research is empty; returns success=False error='No research or task provided. Need content to transform.' (line 949). This is the correct code-path for evidence-required content with no research provided"
            - predicate: agent_result_success_true_but_content_admits_gap_and_no_fabrication
              why: "acceptable when the LLM produces a substantive response that HONESTLY admits the research block is empty, refuses to fabricate specific dates/titles/lab announcements, and directs to ResearchAgent per system_prompt DELEGATION section (line 247-255) or asks for research to be provided. Content quality is degraded but the anti-hallucination invariants held"
    notes: |
      HIGH-STAKES anti-hallucination test — the "cite specific announcement
      dates and paper titles" ask is exactly the shape that tempts LLMs to
      invent plausible-sounding facts (e.g., "OpenAI's July 15 2026 Preparedness
      Framework Update"). ZERO fabrication is acceptable in the content-writing
      domain when specific citable facts are requested. Correct behavior:
      either hard-fail with the "No research or task provided" guard at line
      944, OR produce content that honestly admits the gap and delegates
      (system_prompt lines 247-255 explicitly instruct: "Always delegate tasks
      you cannot perform yourself rather than refusing or making up data").
      Note: because context.task is populated (only research is empty), the
      "not research and not task" guard at line 944 may NOT fire — the LLM
      path will execute. This makes anti-hallucination the primary defense.

  # ─── AMBIGUOUS INPUT ────────────────────────────────────────────────────

  - id: content_ambig_01_bare_write_something
    category: ambiguous_input
    input: "write something"
    context:
      research: "Recent trends in cloud computing and AI have been notable."
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string, minLength: 20}
        health_status: {enum: [healthy, degraded]}
        clarifying_question: {type: string}
    acceptance_criteria:
      - no_fabricated_facts_absent_research
      - no_media_generation_when_planning_only
      - one_of:
          branches:
            - predicate: clarifying_question_asked_with_scope_options
              why: "asked user to narrow — best UX for zero-referent input ('write something' + thin generic research has no content_type, tone, audience, or word_count signal). Options should include: what content type (blog / article / video script / newsletter / social thread), what topic focus, what tone, what audience"
            - predicate: summary_lists_scope_options_without_generating_content
              why: "advisory response listing what ContentWriterAgent can produce (blog post / article / video script / podcast script / social thread / newsletter / internal document) — acceptable if no full content is generated, since generating a full blog post with fabricated defaults would violate no_fabricated_facts_absent_research"
    notes: |
      Critical anti-hallucination test — ContentWriterAgent's default
      content_type is 'blog_post' at line 870, default tone is 'professional'
      via user_context.communication_style at line 882, default word_count is
      1500 for blog_post at line 886. All three defaults would fire on this
      input and the agent would gladly generate a 1500-word blog post about
      "recent trends in cloud computing and AI" with fabricated specifics.
      The correct behavior is to NOT generate content when the user's intent
      is unclear enough that defaults produce fabricated specifics. This
      mirrors legal_ambig_01 (empty motion generation) and devops_ambig_01
      (config-gen defaults) — same anti-hallucination class, content-domain
      variant.

  - id: content_ambig_02_content_type_and_task_conflict
    category: ambiguous_input
    input: "Write a podcast script for this newsletter I'm drafting."
    context:
      content_type: newsletter
      research: "The 2026 developer experience (DX) market has seen consolidation as major cloud providers roll DX platforms into core offerings."
      tone: conversational
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string, minLength: 40}
        health_status: {enum: [healthy, degraded]}
        clarifying_question: {type: string}
    acceptance_criteria:
      - no_fabricated_facts_absent_research
      - one_of:
          branches:
            - predicate: clarifying_question_asked_which_content_type
              why: "asked user to pick — task says 'podcast script' but context.content_type='newsletter'; these are two distinct CONTENT_TYPES with different structures (podcast_script: intro_hook/segments/transitions/outro vs newsletter: subject_line/preview_text/sections/cta). Correct UX asks which the user meant rather than silently favoring one"
            - predicate: summary_notes_conflict_and_produces_one_type_explicitly_naming_choice
              why: "acceptable if agent notes the conflict and explicitly picks ONE with reasoning (e.g., 'You mentioned podcast script in the task but set content_type to newsletter — I'm producing the newsletter first; let me know if you'd like the podcast script version too'). Silent default (produces one without acknowledging the conflict) is UNACCEPTABLE because the produced artifact wastes buyer time"
    notes: |
      Task-vs-context conflict test — the STANDARD-mode path silently favors
      context.content_type over task language at line 870 (content_type =
      context.get('content_type', 'blog_post')). Without an ambiguity check
      the agent will produce a newsletter matching the context field but
      contradicting the task. Correct behavior: either ask which was intended,
      or produce ONE + explicitly acknowledge the conflict. This is a
      buyer-workflow test — silent conflict resolution is a common source
      of wasted content-generation cycles.

  # ─── BAD INPUT ──────────────────────────────────────────────────────────

  - id: content_bad_01_empty_task_and_empty_research
    category: bad_input
    input: ""
    context:
      content_type: blog_post
      research: ""
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {enum: [healthy, degraded, unavailable]}
    acceptance_criteria:
      - no_fabricated_context
      - no_fabricated_facts_absent_research
      - one_of:
          branches:
            - predicate: agent_result_success_false_with_no_research_error
              why: "canonical hard-fail path — line 944 guard fires when both research and task are empty; returns success=False error='No research or task provided. Need content to transform.' (line 949). This is the expected code-path for empty input"
            - predicate: summary_asks_what_to_write_without_generating_content
              why: "acceptable if the guard doesn't fire for some reason — LLM should recognize the empty combo and ask for detail without generating a blog post with fabricated defaults. Unacceptable: producing any blog_post output, dispatching _save_to_deliverable, or persisting a Deliverable titled 'blog_post: ' (empty task echoed into title at line 1196)"
    notes: |
      Empty task + empty research should hit the line 944 guard cleanly and
      return early with success=False. The alternative — if the guard doesn't
      fire due to a code path change — is that the LLM path executes with
      just the intelligent-prompt scaffolding (Session 523) and generates
      fabricated content. Correct outcome: either the guard fires (canonical
      path), OR the LLM recognizes empty inputs and asks for detail without
      generating. Unacceptable: producing any content, OR persisting a
      Deliverable at line 1195 with an empty full_text body (which the empty
      guard at line 1049 would allow through since actual_word_count=0
      passes the isinstance check at line 1044).

  - id: content_bad_02_control_characters_and_alias_confusion
    category: bad_input
    input: "\u0000\u0001Write a \u0007blog\u001b[31m post\u001b[0m about the new\u0000 open-source AI model just released"
    context:
      content_type: "essay"
      research: "The new open-source AI model, released by an unnamed lab, is a 70B parameter model with performance comparable to GPT-4 on standard benchmarks."
      tone: professional
      word_count: 1000
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {enum: [healthy, degraded, unavailable]}
    acceptance_criteria:
      - no_crash
      - no_control_characters_in_output
      - no_ansi_escape_in_output
      - no_deliverable_persisted_with_control_chars_in_title
      - no_fabricated_lab_names
      - no_fabricated_benchmark_scores
      - no_fabricated_release_dates
      - one_of:
          branches:
            - predicate: agent_result_success_false_with_unknown_content_type_error
              why: "canonical hard-fail path — 'essay' is not in CONTENT_TYPES (line 152) and not in _CONTENT_TYPE_ALIASES (line 901-916); line 934 guard fires and returns success=False error='Unknown content type: essay. Available: [...]' (line 938). This should be the FIRST failure surfaced before any generation attempt or persistence"
            - predicate: sanitized_content_type_and_generated_without_control_chars
              why: "acceptable if agent's content_type validation is bypassed by a mapping change (e.g., 'essay' added to aliases in future) AND the control-character sanitization strips NULs / BEL / ANSI escapes before generation. Output + persisted Deliverable title + content must all be clean of control chars AND must NOT fabricate specific lab names, benchmark scores, or release dates beyond the vague research (which itself says 'unnamed lab')"
    notes: |
      Compound malformed payload: NULs + BEL + ANSI escape sequences in task
      + invalid content_type='essay' (not in CONTENT_TYPES, not in alias map).
      Exercises THREE hardening surfaces at once:
        1. Content-type validation at line 934 (should fire first).
        2. Control-char / ANSI escape sanitization in _build_intelligent_prompt
           at line 771 and in deliverable title/body at line 1196.
        3. Anti-fabrication under vague research — the research block is
           deliberately underspecified ("unnamed lab", "comparable to GPT-4
           on standard benchmarks"); LLM must not invent specifics.
      Unacceptable outcomes:
