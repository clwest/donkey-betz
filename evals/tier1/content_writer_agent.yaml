# Golden Evals — Tier-1 canonical prompt suite
# Agent under test: ContentWriterAgent (core/agents/content_writer_agent.py:207)
#
# Arc: Golden Evals (S2954+ open, ratified 2026-07-25 by Chris via Chat UI)
# Reliability contract source: docs/research/platform/S2954_GOLDEN_EVALS_ARC_OPEN.md §3
# Arc slice: S2960 — sixth Tier-1 agent YAML (mirrors canon_version=1 substrate
#   frozen at S2955 in evals/tier1/system_intelligence_agent.yaml and validated
#   through S2956 research_agent.yaml, S2957 devops_agent.yaml, S2958
#   workflow_orchestration_agent.yaml, and S2959 legal_doc_drafter_agent.yaml)
# HEAD at authoring: db5f60fa4
#
# Volume snapshot (DB-verified via direct ORM 2026-07-25 T0):
#   30d executions (owner_agent="ContentWriterAgent",
#                   created_at >= 2026-06-25T00:00:00Z):        7
#     (6 completed, 0 failed, 1 cancelled — 0% real 30d failure rate;
#      the 1 cancellation was worker-restart-attributed with
#      error_message="Worker restart — execution interrupted (S2800)",
#      not an agent-side failure)
#   All-time (no created_at filter):                           23
#     (20 completed, 2 failed, 1 cancelled — earliest 2026-06-19,
#      latest 2026-07-24)
#   30d distinct task-shape distribution (exact from ORM sample):
#     - "Draft/produce brand-video script for 2026 fitness wearable" (30-45s
#       or 60-75s variants, VO + on-screen text + CTA, planning-only):  5 rows
#     - "test dispatch — receipt-shape verify, <200 words":              1 row
#     - "Run WORKFLOWS['morning_brief'] end-to-end smoke test":          1 row
#   Observed real failure modes (from AgentExecution.error_message, all-time):
#     1. "Task timed out after 60 minutes (no heartbeat) - marked as failed
#        by cleanup" — 2 occurrences (2026-06-23 SMOKE_TEST, 2026-06-19 Operator
#        Edge weekly newsletter) — same 60-min Celery watchdog pattern observed
#        in SIA / ResearchAgent / DevOpsAgent / WorkflowOrchestrationAgent /
#        LegalDocDrafterAgent failure samples.
#     2. "Worker restart — execution interrupted (S2800)" — 1 occurrence
#        (2026-07-24 brand video workflow doc cancellation) — platform-generic,
#        not agent-side.
#   Verifier note (inherited from S2956 ResearchAgent YAML): AgentExecution.error_message
#     stores empty-string ("") for successful runs, NOT NULL. Django's
#     error_message__isnull=False filter returns all rows; use error_message__gt=''
#     or .exclude(error_message='') for real failures. 3 all-time rows have
#     non-empty error_message; 20 have '' (empty string, not null); confirmed
#     directly via ORM at authoring T0. Rigby's orm_inspect_tool.count_by
#     group_by='status' argument-propagation gap (S2959 Deferred Queue entry) meant
#     status breakdown was pulled via direct `python manage.py shell` this
#     session — one more trigger for that ledger candidate.
#
#   HONEST COVERAGE LIMITS:
#   1. THIN TRAFFIC — 7 30d executions is thin but 2nd-thickest in the arc
#      (SIA 37 / Research 37 / DevOps 13 / Workflow 9 / Legal 5). All-time (23)
#      is the median across shipped Tier-1 YAMLs.
#   2. NARROW DOMAIN CONCENTRATION — 5 of 7 30d prompts are variants of the
#      same fitness-wearable brand-video-script ask (video_script content_type,
#      planning-only, professional/entertaining tone, VO + on-screen text +
#      CTA). Zero 30d traffic against blog_post, article, podcast_script,
#      social_thread, newsletter, or internal_document — 6 of 7 declared
#      content_type paths are unexercised in the observed window (5 all-time
#      newsletter runs are >30d ago per the 2026-06-19 sample). Rewrite mode,
#      Directed mode, and Diagnostic mode are all zero-traffic in the 30d
#      sample.
#   3. ZERO 30d AGENT-SIDE FAILURES — the 1 cancellation was worker-restart-
#      attributed (S2800), not agent-side. All 3 all-time non-empty error_message
#      rows have platform-generic causes (2x 60-min watchdog kill, 1x worker
#      restart). Zero LLM-generation failures, zero content-type-validation
#      failures, zero empty-content failures in the observed sample. All
#      fault-injection prompts below simulate paths that exist in the code
#      (line 934/946/1025/1206 guards + platform-wide watchdog pattern) but
#      aren't in the traffic history.
#   4. CONTENT-DOMAIN BUYER-FACING RISK — content-writing hallucinations carry
#      buyer risk (fabricated facts / stats / quotes / sources when research is
#      empty, word-count violations against declared spec, tone drift, media
#      generation when "planning only" was specified). This YAML encodes those
#      as domain-sensitivity acceptance criteria per S2959 canon addition 9:
#      no_fabricated_facts_absent_research, honors_word_count_within_tolerance,
#      honors_tone_directive, honors_content_type_structure, and
#      no_media_generation_when_planning_only. Fewer domain predicates than
#      LegalDocDrafterAgent (5 vs 7) reflects proportional harm class — content
#      quality violations degrade UX but rarely trigger irreversible external
#      consequences the way legal-drafting hallucinations can.
#
#   ACTIONABLE CONCLUSION FROM COVERAGE LIMITS (per S2959 Rigby T2 fold 4):
#     Treat this YAML as SCHEMA + HALLUCINATION-INVARIANT + BUYER-EXPECTATION
#     VALIDATION, not as a performance/reliability assurance. Volume is thin
#     (7 30d / 23 all-time), 30d traffic is heavily concentrated on one content
#     type (video_script fitness-wearable brand videos), and 4 of 5 execution
#     routing branches are zero-traffic. The domain predicates around
#     fabrication + word_count + tone + structure + planning-only are the
#     primary value; passing them prevents buyer-facing quality violations
#     even when we can't statistically claim the agent is "reliable at
#     content generation across all 7 content types". Re-baseline volume claims
#     at S2962 arc-close if production traffic grows past 50 30d executions
#     spanning ≥3 content types.
#
# Agent shape (grounds acceptance criteria):
#   FIVE routing branches inside execute() at content_writer_agent.py:707–1213
#   (all inside the same agent contract — deliberately framed as routing
#   branches, not "new shapes", per S2959 canon addition 10):
#     (A) SELF-DESCRIPTION shortcut — keyword-triggered at line 776–785 on
#         ("state your name" / "who are you" / "your capability" / "what can
#          you do" / "introduce yourself"). Returns AgentResult with
#         data.type='self_description'. No LLM call.
#     (B) DIAGNOSTIC mode — triggered when context.diagnostic_mode=true at
#         line 796–801. Dispatches to _execute_diagnostic at line 1649.
#         Renders task spec verbatim as deliverable body. NO LLM call.
#         Returns AgentResult with data.content_type='diagnostic',
#         data.diagnostic_mode=True (Session 1185 F1 — raw task→body assignment,
#         no LLM rewrite, for forensic validation flows).
#     (C) REWRITE mode — triggered when context has review_feedback AND
#         original_draft at line 824–851. Dispatches to _execute_rewrite at
#         line 1463. Single LLM call to gpt-5.2 (no tool_calls). Returns
#         AgentResult with data.metadata.rewrite_mode=True + data.content_type
#         forced to 'blog_post' + no provenance block. Session 1098 canary
#         may append output to an existing Deliverable if append_to_deliverable_id
#         is set.
#     (D) DIRECTED mode — triggered when context has research_summary AND
#         (editor_feedback OR required_checks) at line 853–868. Dispatches to
#         _execute_directed at line 1722. Single LLM call to gpt-5.2 (no
#         tool_calls). Returns AgentResult with data.metadata.directed_mode=True
#         + data.content_type forced to 'blog_post' + no provenance block.
#     (E) STANDARD mode — default path at line 870+ when none of A/B/C/D
#         triggered. Uses context.content_type (7 declared types +
#         14 aliases + fall-through to error at line 934), context.research,
#         tone/audience/word_count. Calls _generate_content (single LLM call to
#         gpt-5.2 via _call_openai; no tool_calls dispatch — the tools list is
#         empty at line 257 by design). Returns AgentResult with FULL data
#         payload (provenance + publishable + validation_status + quality_tier +
#         confidence + truncated fields set).
#   All five paths return the same AgentResult shape at the top level:
#     message: str
#     success: bool
#     error: str|None (on failure)
#     execution_time_ms: int
#     data: dict (routing-branch-specific keys; see canonical_field_mapping)
#   agent.tools = [] at line 257 — content generation is DIRECT LLM call, not
#   tool-mediated. Validators MUST NOT require tool_calls in the AgentResult
#   for this agent; the evidence tier lives in data.content + data.metadata +
#   data.provenance (STANDARD only) instead.
#   Persistence side-effect: _save_to_deliverable called on STANDARD (line
#     1195), REWRITE-with-append-target (line 1614), and DIAGNOSTIC (line 1695).
#     Directed mode does NOT auto-persist (caller/pipeline handles persistence
#     per rewrite-mode docstring line 1483). Tier-1 validators MUST NOT out-of-
#     band inspect Deliverable DB rows (INTEGRATION EVIDENCE tier per S2958
#     canon addition 6); validators consult AgentResult.data.content.full_text
#     length as a native pointer that generation succeeded.
#
# Coverage: 13 prompts total (5 happy + 8 fault-injection, 2 per non-happy category).
#
# ── Arc-precedent adherence (canon_version=1, S2955-frozen) ──────────────
# (1) schema_version + canon_version explicit at file top.
# (2) canonical_field_mapping declares native vs derived per field with named
#     derivation rules prefixed content_v1_*.
# (3) fault_injection uses effect-based contract (component + fault.type + params)
#     with python.{...} adapter as optional appendix; portable beyond Python-mock.
#     Selectors prefer service-level paths (core.agents.content_writer_agent.* /
#     core.services.*) over library-internal openai paths per S2957 fold.
# (4) one_of acceptance-criteria capped at ≤2 branches with mandatory why strings.
#
# ── S2958 additions applied (informative, non-breaking) ──────────────────
# (5) Per-execution-shape evidence-tier requirements in evidence_pointers
#     derivation_spec — STANDARD mode carries provenance/publishable/validation_status
#     while REWRITE / DIRECTED / DIAGNOSTIC modes DO NOT; validators consult
#     data.content.full_text length + data.metadata.actual_word_count instead
#     for those branches.
# (6) INTEGRATION EVIDENCE tier distinction — Deliverable row inspection is
#     out of Tier-1 validator scope; only data.content.full_text on the returned
#     AgentResult is Tier-1 admissible.
# (7) TRANSITIONAL marking: N/A this slice (no code-follow-up folds surfaced
#     during authoring).
# (8) Timeout-string brittleness avoidance — content_timeout_01 asserts stable
#     discriminator fields (error_signature pattern, agent_result_success_false)
#     rather than exact error-message text match.
#
# ── S2959 additions applied (informative, non-breaking) ──────────────────
# (9) Domain-sensitivity acceptance predicates — 5 content-domain predicates
#     layered on top of the general no_unsupported_claims:
#       - no_fabricated_facts_absent_research
#       - honors_word_count_within_tolerance
#       - honors_tone_directive
#       - honors_content_type_structure
#       - no_media_generation_when_planning_only
#     Fewer than LegalDocDrafterAgent's 7 (proportional harm class — content
#     quality violations degrade UX but rarely trigger irreversible external
#     consequences).
# (10) Routing-branch framing — the 5 execution paths (SELF-DESCRIPTION /
#      DIAGNOSTIC / REWRITE / DIRECTED / STANDARD) are framed as routing
#      branches inside the same agent contract, NOT as new shapes. Same
#      AgentResult top-level structure + hallucination invariants apply across
#      branches (though evidence-tier requirements carve per-branch differences
#      per canon addition 5).
# (11) Coverage-limits actionable conclusion — the THIN / NARROW / ZERO-30d-
#      FAILURE / BUYER-RISK caveat pile resolves to ONE actionable conclusion
#      line above: "treat as SCHEMA + HALLUCINATION-INVARIANT + BUYER-EXPECTATION
#      validation, not performance assurance."

schema_version: 1
canon_version: 1

meta:
  agent: ContentWriterAgent
  tier: 1
  arc: golden_evals
  arc_slice: S2960
  ratified_by: chris_via_chat_ui
  ratified_date: "2026-07-25"
  head_sha_at_authoring: db5f60fa4
  reliability_contract_source: docs/research/platform/S2954_GOLDEN_EVALS_ARC_OPEN.md
  substrate_reference: evals/tier1/legal_doc_drafter_agent.yaml
  categories_covered:
    - happy_path
    - tool_timeout
    - data_unavailable
    - ambiguous_input
    - bad_input

# Explicit mapping from canonical field (canon_version=1) to how it's obtained
# from the ContentWriterAgent-native AgentResult. Every S2963 validator MUST
# consult this block; must never invent an ad-hoc mapping.
canonical_field_mapping:
  summary:
    mapping_source: native
    from: AgentResult.message
    note: |
      STANDARD mode message is descriptive: "{ContentType}: '{title}' | {N}
      words | {tone} tone | for {audience} | [{QUALITY_TIER}]" (line 1104-1116).
      REWRITE mode message: "{title} | {N} words | rewrite" (line 1578).
      DIRECTED mode message: "{title} | {N} words | directed mode" (line 1842).
      DIAGNOSTIC mode message: "Diagnostic dispatch ({N} words, verbatim)" (line 1710).
      SELF-DESCRIPTION mode message: full canned self-description string (line 781).
      Validators must accept all five message shapes; content pipeline consumers
      typically parse title from data.title rather than message.
  evidence_pointers:
    mapping_source: derived
    derivation_rule: content_v1_content_payload_plus_provenance
    derivation_spec: |
      STANDARD mode (execute() line 870+, default single-LLM-call path):
        Preferred (Tier-1 admissible):
          AgentResult.data.content.full_text length >= 200 (proves generation
            produced substantive content).
          + AgentResult.data.provenance (dict) present with non-empty sources
            list (proves provenance tracking fired at line 1094-1099).
          + AgentResult.data.publishable=true (proves provenance validation
            passed at line 1140-1142).
          + AgentResult.data.metadata.actual_word_count present.
        Fallback A (content pipeline consumer path): AgentResult.data.content
          dict has content-type-specific structure keys ('title' / 'meta_description'
          / 'sections' for blog_post; 'segments' for podcast_script; 'scenes' for
          video_script; etc. per CONTENT_TYPES[content_type]['structure'] at
          line 156). Structure presence proves the LLM produced schema-conformant
          output beyond raw text.
      REWRITE mode (execute() branch at line 837 → _execute_rewrite at line 1463):
        Preferred: AgentResult.data.content.full_text length >= 500 (rewrite
          spec at line 1525 targets 700-1200 words; 500 is minimum acceptable
          bound for post-truncation safety).
        + AgentResult.data.metadata.rewrite_mode=true (proves rewrite path was
          taken).
        NOTE: rewrite mode does NOT populate data.provenance /
        data.publishable / data.validation_status; validators must not
        require them on this branch (per S2958 canon addition 5).
      DIRECTED mode (execute() branch at line 861 → _execute_directed at line 1722):
        Preferred: AgentResult.data.content.full_text length >= 500.
        + AgentResult.data.metadata.directed_mode=true.
        NOTE: directed mode also lacks provenance/publishable/validation_status
        (same carve as rewrite).
      DIAGNOSTIC mode (execute() branch at line 796 → _execute_diagnostic at line 1649):
        Preferred: AgentResult.data.content.full_text length == len(task)
          (raw task→body assignment per Session 1185 F1 AC1 at line 1665).
        + AgentResult.data.diagnostic_mode=true.
        + AgentResult.data.content_type='diagnostic'.
        Validators MUST NOT apply word-count-vs-spec or content-structure
        predicates on this branch — verbatim rendering IS the contract.
      SELF-DESCRIPTION mode (execute() line 776-785 keyword shortcut):
        Preferred: AgentResult.data.type='self_description'.
        + AgentResult.data.capabilities list present.
        + AgentResult.message contains self-description string.
        Validators MUST NOT require content generation predicates on this
        branch — the response IS the self-description.
      For tool_timeout / data_unavailable / bad_input with success=False,
      all evidence tiers MAY be empty; validators must accept empty
      data on failure paths.
      INTEGRATION EVIDENCE (per S2958 canon addition 6): out-of-band Deliverable
      row inspection is NOT in Tier-1 validator scope; data.content.full_text
      length + data.metadata.actual_word_count on the returned AgentResult
      are the Tier-1 admissible signals.
  health_status:
    mapping_source: derived
    derivation_rule: content_v1_success_and_content_completeness
    derivation_spec: |
      if not AgentResult.success:                                       → unavailable
      elif data.diagnostic_mode is true:                                → healthy
        (diagnostic mode is verbatim-preservation; if success=True the
         contract was honored, no further derivation)
      elif data.type == 'self_description':                             → healthy
        (self-description mode; if success=True the shortcut returned
         cleanly, no further derivation)
      elif data.content.full_text length >= max(200, 0.7 * data.metadata.word_count_target):
        AND data.metadata.truncated is not true:                        → healthy
      elif data.content.full_text length >= 200 AND data.metadata.truncated is true:
                                                                        → degraded
        (LLM was cut off but produced substantive partial content)
      elif data.content.full_text length < 200:                         → degraded
        (thin content; below buyer-usable threshold even if success=True)
      else:                                                             → healthy
      Note: ContentWriterAgent's data.output_category and data.confidence
      derive from _calculate_quality_tier at line 1055; they contribute to
      the health signal (quality_tier='bronze' + confidence < 0.5 may warrant
      degraded even at full word count) but are NOT the primary derivation
      inputs — success + content_length + truncation are. Validators may
      layer quality_tier / confidence as secondary signals in future canon
      versions but must not depend on them at canon_version=1.

prompts:

  # ─── HAPPY PATH ─────────────────────────────────────────────────────────

  - id: content_happy_01_video_script_brand_video
    category: happy_path
    input: "Create a 30–45s brand video script package for a fitness wearable: concept, logline, beat sheet, full VO script, on-screen text, CTA, plus 6s cutdown. Keep it modern 2026, motion-led, benefits-first. No media generation."
    context:
      content_type: video_script
      tone: professional
      target_audience: "fitness-tech buyers"
      word_count: 500
      research: "The 2026 fitness wearable market has shifted toward AI-driven recovery insights and continuous-glucose adjacent metrics. Buyers care about actionable coaching, not raw data. Competing brands emphasize community and streak mechanics; premium tier emphasizes accuracy and coach-in-your-ear features."
      no_media_generation: true
      deliverable_format: "video script package"
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 40}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - data_content_type_is_video_script
      - data_metadata_actual_word_count_present
      - data_content_full_text_length_gte_200
      - honors_word_count_within_tolerance
      - honors_tone_directive
      - honors_content_type_structure
      - no_fabricated_facts_absent_research
      - no_media_generation_when_planning_only
      - one_of:
          branches:
            - predicate: data_provenance_present_with_sources
              why: "canonical STANDARD-mode happy path — provenance tracking fired at line 1094-1099 with ResearchContext source (line 1067-1073). buyer-critical for content compliance workflows"
            - predicate: data_content_has_video_script_structure_keys
              why: "acceptable when provenance dict is present but sources array is empty — the video_script structure ('title', 'hook', 'scenes', 'narration', 'b_roll_suggestions', 'outro' per CONTENT_TYPES at line 164-169) proves schema-conformant generation even without source-tracking coverage"
    notes: |
      Represents the dominant 30d prompt shape (5 of 7 30d executions are
      fitness-wearable brand video variants — this exact task is one of them,
      execution id f9c61c43-0162-421d-a24e-78f39c9f0f0e completed 2026-07-24).
      Critical domain-sensitivity invariants:
        - no_media_generation_when_planning_only: the prompt explicitly says
          "No media generation" and context.no_media_generation=true. LLM
          must NOT produce fabricated image URLs, video-file references, or
          promise generated assets. This is buyer-critical for creative-ops
          pipelines where the writer's role is planning, not asset production.
        - honors_word_count_within_tolerance: word_count=500 target; ±30%
          tolerance (350-650) acceptable; anything beyond is a spec violation.
        - honors_tone_directive: professional tone for buyer audience; slang
          / casual voice / marketing-hype would be off-spec.
        - no_fabricated_facts_absent_research: only claim things supported by
          the research block or general common knowledge; fabricating specific
          product features, competitor names, or stats not in research is
          the primary hallucination class this predicate catches.

  - id: content_happy_02_blog_post_from_research
    category: happy_path
    input: "Write a 1500-word blog post about the state of AI-powered developer tooling in 2026, drawing from the research below. Tone should be professional but approachable — the audience is senior engineers and tech leads at scale-ups. Include a strong hook, 3-4 body sections with headers, a conclusion, and SEO metadata (meta description, tags)."
    context:
      content_type: blog_post
      tone: professional
      target_audience: "senior engineers and tech leads at scale-ups"
      word_count: 1500
      research: "The 2026 AI dev tooling landscape has consolidated around three axes: (1) IDE-native agents (Copilot, Cursor, Zed AI) that operate inside the editor with full workspace context; (2) autonomous coding platforms (Devin, SWE-agent, OpenDevin) that run tasks asynchronously; (3) code-review + security-review agents (Greptile, CodeRabbit, Semgrep AI). Enterprise adoption metrics: 78% of Fortune 500 engineering orgs run at least one AI coding tool in production per JetBrains 2026 developer survey. Cost efficiency has emerged as the primary differentiator over raw capability — teams increasingly self-host smaller models via Ollama or vLLM for read-heavy workflows and reserve frontier models for generation-heavy tasks."
      keywords: ["AI developer tools", "AI coding assistants", "IDE agents", "autonomous coding"]
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 60}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - data_content_type_is_blog_post
      - data_content_full_text_length_gte_1000
      - honors_word_count_within_tolerance
      - honors_tone_directive
      - honors_content_type_structure
      - no_fabricated_facts_absent_research
      - data_content_has_blog_post_structure_keys
      - data_provenance_present_with_sources
      - one_of:
          branches:
            - predicate: data_publishable_true
              why: "canonical STANDARD-mode happy path — provenance validation passed at line 1140-1142; content is ready for buyer-facing consumption without additional review gates"
            - predicate: data_validation_status_present_and_not_failed
              why: "acceptable when publishable is false or absent — some source-freshness thresholds (stale_threshold_hours=72.0 at line 1098) may downgrade publishable while validation_status still records the check ran cleanly"
    notes: |
      Canonical STANDARD-mode blog_post path — the most common content_type
      per CONTENT_TYPES declaration order (blog_post is first at line 152).
      Zero 30d traffic against blog_post but line 1055 quality-tier calculation
      and line 1094-1099 provenance construction are exercised on every
      STANDARD-mode run regardless of content_type. Key invariant:
      no_fabricated_facts_absent_research — the research block cites
      specific stats ("78% of Fortune 500", "JetBrains 2026 developer
      survey") and tool names ("Copilot, Cursor, Zed AI"); LLM must
      confine its factual claims to what's in the research or clearly
      generic background. Fabricating additional stats (e.g., "GitHub
      Copilot has 45M subscribers") — even if true elsewhere — is a
      grounding-discipline violation.

  - id: content_happy_03_rewrite_mode_from_editor_feedback
    category: happy_path
    input: "Rewrite the draft below to address every issue the editor flagged. Preserve the hook, tighten the middle, cut the redundant section on 'why AI matters', and add a specific 3-step CTA at the end."
    context:
      content_type: blog_post
      review_feedback: |
        Editor issues:
        1. Section 3 ("Why AI Matters") is redundant given Section 1 covers the same ground — CUT IT.
        2. Middle section (Section 4) rambles for 400 words on tooling categories without a takeaway — TIGHTEN to 200 words with a concrete example.
        3. No CTA. Add a specific 3-step next-action ladder ("try X → measure Y → decide Z").
        4. Hook is strong (opening paragraph works) — PRESERVE verbatim.
        Fact-check issues:
        1. Claim "89% of teams saw productivity gains" has no citation — either add source or remove.
      original_draft: |
        # AI Developer Tools in 2026: The New Baseline

        Every engineer I've talked to in the last six months has stopped asking whether AI coding tools are worth adopting. That question is dead. The real question is which layer of the stack to invest in first, and how to measure whether it's working.

        ## Section 1: Where We Are

        The 2026 AI dev tooling landscape has consolidated around three axes: IDE-native agents, autonomous coding platforms, and code-review agents. 78% of Fortune 500 engineering orgs run at least one AI coding tool in production. Cost efficiency has emerged as the primary differentiator.

        ## Section 3: Why AI Matters

        AI matters because software engineering is the highest-leverage economic activity of the current decade. When engineers ship faster with fewer defects, entire product surfaces get built that weren't feasible before. This applies at every scale of company from two-person startups to hyperscalers.

        ## Section 4: The Tooling Categories

        Let me walk through each category. IDE-native agents operate inside the editor with full workspace context. Copilot is the incumbent; Cursor grew fast in 2025 by leaning into agent mode; Zed AI is the newest entrant with a Rust-native architecture. Autonomous coding platforms are still maturing — Devin was the pioneer, then SWE-agent showed the pattern was reproducible, then OpenDevin proved you could build a solid open-source version in months. Code-review agents like Greptile and CodeRabbit are the sleeper hit — they don't get the same headline attention but the ROI is often the clearest because they catch specific classes of bugs in PRs. 89% of teams saw productivity gains after adopting at least two of the three layers.

        ## Conclusion

        The tooling has consolidated, cost efficiency is winning, and the adoption metrics are undeniable.
      workspace_brief:
        topic: "AI developer tools in 2026"
        tone: professional
        audience: "senior engineers"
        distribution_hook: "Every engineer I've talked to in the last six months has stopped asking whether AI coding tools are worth adopting."
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 60}
        evidence_pointers: {type: array, minItems: 1}
