# Explicit mapping from canonical field (canon_version=1) to how it's obtained
# from the CompetitorAnalysisAgent-native AgentResult. Every S2963 validator MUST
# consult this block; must never invent an ad-hoc mapping.
canonical_field_mapping:
  summary:
    mapping_source: native
    from: AgentResult.message
    note: |
      STANDARD-mode message on success: "Competitive analysis completed with
      {N} data sources" (line 1021), optionally prefixed with viability
      warning (line 1030) and/or suffixed with data-quality warning
      (line 1026 when domain_relevance.score < 30).
      VIABILITY_EARLY_EXIT message: multi-line markdown feedback block
      (line 723-756) leading with "## Business Idea Viability Check: {N}/100".
      EVIDENCE_GATE message: "Insufficient domain-relevant data to
      synthesize analysis. {gate_reason}\n\nRecommendations:\n- ..." (line 955-960).
      CONVERSATION_FALLBACK message: gpt_response.content directly (line 1123),
      or the literal string "No competitive data found" when GPT returned no content.
      EXCEPTION message: unset (AgentResult(success=False, error=str(e)) at
      line 1131-1135); validators should consult data.error or top-level
      error field, NOT message, on this branch.
      _validate_task early-return message: unset (line 661-665 returns
      AgentResult(success=False, error="Invalid or empty task"); message
      empty).
      Validators must accept all five message shapes; downstream consumers
      typically parse the analysis body from data.analysis.analysis (STANDARD)
      or the feedback block from data.viability (VIABILITY_EARLY_EXIT).
  evidence_pointers:
    mapping_source: derived
    derivation_rule: competitor_v1_synthesis_plus_raw_data_plus_persistence
    derivation_spec: |
      STANDARD mode (execute() line 884+, multi-tool GPT dispatch path):
        Preferred (Tier-1 admissible):
          AgentResult.data.analysis (dict) present with non-empty 'analysis'
            text field (proves _synthesize_analysis GPT call at line 1741
            produced a synthesis body).
          + AgentResult.data.analysis.data_points_analyzed >= 3 (proves
            the MIN_DATA_POINTS evidence gate at line 1557 passed).
          + AgentResult.data.raw_data (list) present with >= 3 items
            (parallel signal to data_points_analyzed).
          + AgentResult.tool_calls (list) present with >= 1 tool_call
            entry (proves multi-tool dispatch fired; empty tool_calls on
            STANDARD success is a red flag that GPT skipped the tool loop).
          + AgentResult.data.domain_relevance (dict) present with 'score'
            key (proves Session 350 domain-relevance tracking fired).
        Fallback A (persistence proof): AgentResult.data.saved_id present
          (string UUID from BusinessResearchResult.save_competitor_analysis
          at line 1015). Acceptable evidence when analysis body is short
          but persistence pipeline fired; NOT admissible as sole evidence
          because save failure is non-fatal (line 1017 catch).
        Fallback B (ML analysis proof): AgentResult.data.ml_analysis dict
          with 'ml_used'=true (proves Session 683 GNN+text ML analysis
          fired at line 994). NOT admissible as sole evidence — ml_used
          may legitimately be false when data is thin or ML services are
          unavailable; used as secondary corroboration only.
      VIABILITY_EARLY_EXIT mode (execute() branch at line 712 →
      early return at line 760):
        Preferred: AgentResult.data.type='viability_feedback'.
        + AgentResult.data.early_exit=true.
        + AgentResult.data.viability (dict) present with 'score' < 50,
          'assessment' string, 'improvement_suggestions' list, 'pivot_ideas'
          list.
        NOTE: viability early-exit mode does NOT populate data.analysis /
        data.raw_data / data.saved_id / tool_calls; validators must not
        require them on this branch (per S2958 canon addition 5).
        Message field (data.viability.assessment) is the primary evidence
        signal; specific score value is the discriminator.
      EVIDENCE_GATE mode (execute() branch at line 949 → early return at
      line 953):
        Preferred: AgentResult.data.type='insufficient_evidence'.
        + AgentResult.data.gate_reason (string, non-empty).
        + AgentResult.data.recommended_actions (list, >= 1 entry).
        + AgentResult.data.data_points_analyzed >= 0 (validators should
          check this is < 3 OR domain_relevance.score < 15 with 0
          matches — those are the two triggering conditions at line 1560
          and line 1588).
        + AgentResult.data.domain_relevance (dict) present.
        NOTE: evidence-gate mode does populate data.raw_data (the items
        that WERE collected but not synthesized), but does NOT populate
        data.analysis or data.saved_id (synthesis was blocked). Learning
        infrastructure is skipped (no _record_learning_outcome).
      CONVERSATION_FALLBACK mode (execute() branch at line 1119 → early
      return at line 1121):
        Preferred: AgentResult.data.type='conversation'.
        + AgentResult.message present (either GPT content string or the
          literal "No competitive data found").
        NOTE: conversation-fallback mode does NOT populate data.analysis /
        data.raw_data / data.saved_id / data.domain_relevance. The
        message field IS the response; validators must accept content-
        free data on this branch.
      EXCEPTION mode (execute() branch at line 1129 → return at line 1131):
        Preferred: AgentResult.success=false.
        + AgentResult.error (string) present (str(exception)).
        + AgentResult.execution_time_ms present.
        NOTE: exception mode has NO data payload. Validators must accept
        empty data on this branch. The _validate_task early-return at
        line 661 is a sibling shape (success=false, error="Invalid or
        empty task", no data) and shares the same acceptance rules.
      For tool_timeout / data_unavailable / bad_input with success=False,
      all evidence tiers MAY be empty; validators must accept empty
      data on failure paths.
      INTEGRATION EVIDENCE (per S2958 canon addition 6): out-of-band
      BusinessResearchResult and Deliverable row inspection is NOT in
      Tier-1 validator scope; AgentResult.data.saved_id is the Tier-1
      admissible pointer that persistence fired.
  health_status:
    mapping_source: derived
    derivation_rule: competitor_v1_success_and_branch_completeness
    derivation_spec: |
      if not AgentResult.success:                                       → unavailable
      elif data.type == 'viability_feedback' AND data.early_exit is true:
                                                                        → healthy
        (viability early-exit is a helpful redirect, not a failure;
         if success=True the "Idiot Protector" fired cleanly)
      elif data.type == 'insufficient_evidence':                        → degraded
        (evidence gate firing IS the correct behavior on thin data,
         but the buyer received no synthesis — degraded reflects that
         the request was honored but the answer was "not enough data
         to answer confidently")
      elif data.type == 'conversation':                                 → degraded
        (conversation-fallback fires when GPT declined to use tools;
         may be legitimate for meta-questions but for competitive-analysis
         requests it reflects that the multi-tool synthesis path was
         skipped; degraded flags the divergence from typical shape)
      elif data.analysis (dict) present AND
           data.analysis.data_points_analyzed >= 10:                    → healthy
        (STANDARD path with substantive evidence base)
      elif data.analysis (dict) present AND
           data.analysis.data_points_analyzed >= 3 AND
           data.analysis.data_points_analyzed < 10:                     → degraded
        (STANDARD path passed the MIN_DATA_POINTS gate but produced
         synthesis on thin evidence; buyer-usable but flagged)
      elif data.analysis (dict) present AND
           data.domain_relevance.score < 30:                            → degraded
        (STANDARD path produced synthesis but with low domain relevance;
         Session 350 data_quality_warning fires at line 1026; buyer
         should treat as directional)
      elif data.analysis (dict) present:                                → healthy
      else:                                                             → healthy
      Note: CompetitorAnalysisAgent's viability score (data.viability.score)
      and mythology validation (data.mythology_warning if present, added at
      line 1075) contribute to the health signal but are NOT the primary
      derivation inputs — success + branch_type + evidence_gate_pass are.
      Validators may layer viability_score / mythology_warning as
      secondary signals in future canon versions but must not depend on
      them at canon_version=1.

prompts:

  # ─── HAPPY PATH ─────────────────────────────────────────────────────────

  - id: competitor_happy_01_real_donkey_betz_competitor_identify
    category: happy_path
    input: "Identify 2-3 closest competitors to Donkey Betz as an AI agent/autonomous ops platform; summarize positioning, pricing signals, differentiation, and market narrative as of June 2026."
    context: {}
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 40}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - agent_result_success_true
      - data_analysis_present_with_non_empty_analysis_text
      - data_analysis_data_points_analyzed_present
      - data_raw_data_present_as_list
      - data_domain_relevance_present_with_score
      - tool_calls_list_present_with_at_least_one_entry
      - spider_query_invoked_in_tool_calls
      - no_fabricated_competitor_names
      - no_fabricated_pricing_financial_or_headcount_metrics
      - no_fabricated_executive_quotes_or_attributions
      - distinguishes_evidence_from_inference
      - honors_data_freshness_or_admits_gap
      - one_of:
          branches:
            - predicate: data_saved_id_present_as_uuid_string
              why: "canonical STANDARD-mode happy path — BusinessResearchResult.save_competitor_analysis fired successfully at line 1015 and returned a UUID stored in data.saved_id (line 1039). Buyer-critical for research-history recall + downstream cross-referencing"
            - predicate: data_saved_id_null_but_analysis_and_raw_data_present
              why: "acceptable when persistence layer had a transient failure — the try/except at line 1017 is non-fatal by design (research shouldn't be lost when the DB write fails). Buyer still gets the analysis via the returned AgentResult; downstream ingestion can re-persist if needed"
    notes: |
      VERBATIM REPLAY of the SINGLE real 30d competitor-analysis prompt
      (AgentExecution id 3bc1df00-2288-4a9c-baef-c5ede3f1d502, completed
      2026-06-25T00:56:17Z, execution_time_ms=35195). This is the ONLY
      genuine production-scale competitive-analysis ask in all-time
      traffic — the other 10 all-time prompts are smoke tests. Copied
      exactly from the DB task field including "Donkey Betz" (proper-noun
      brand reference) and "as of June 2026" (temporal anchor).
      Preserves the anchor for STANDARD-mode observable behavior — every
      downstream re-baseline of this agent should compare against this
      row as the empirical floor.
      Critical domain-sensitivity invariants:
        - no_fabricated_competitor_names: the ask is "identify 2-3
          closest competitors" — the LLM MUST derive competitor names
          from tool_call data (spider_query results, web_search hits,
          get_prior_research pulls), NOT invent AI-agent-platform
          brands that don't exist. Fabricating even one competitor name
          in a 3-competitor slate is a 33% brand-attribution error.
        - no_fabricated_pricing_financial_or_headcount_metrics: "pricing
          signals" explicitly asked. LLM MUST cite from tool data or
          state pricing was not observable, NOT invent MRR/pricing
          tiers/seat counts.
        - distinguishes_evidence_from_inference: "positioning,
          differentiation, market narrative" span both observable
          (competitor website copy, LinkedIn descriptions, product
          demos) and inferential (SWOT-style analysis) claims. The
          QUALITY HEADER template at line 1655-1663 requires Confidence
          + Constraints fields that separate these.
        - honors_data_freshness_or_admits_gap: "as of June 2026" is a
          temporal anchor. Spider auto-refresh at line 671 fires at
          execute start; results should be current. If any tool
          returned stale (>7d) data, DATA DISCLAIMER at line 1720
          MUST reflect that.
        - spider_query_invoked_in_tool_calls: system_prompt line 152
          explicitly says "spider_query: [...] (MOST IMPORTANT - real
          data!)" and line 157-160 mandates "CRITICAL - You MUST use
          spider_query [...] WITHOUT spider_query data, you cannot
          provide a proper competitive analysis." This predicate proves
          the agent's PRIMARY contract (spider-first data sourcing)
          was honored — not just that some tool was called. Added per
          Rigby T1 fold δ; the previous acceptance criteria did not
          test this principal contract explicitly.

  - id: competitor_happy_02_standard_with_domain_extraction_fallback
    context: {}
    category: happy_path
    input: "Analyze the competitive landscape for AI-powered KYC and compliance automation software targeting SMB fintech payments companies. Focus on the top 3-5 players — cover positioning, pricing tiers, customer-acquisition channels, and typical enterprise-vs-startup differentiation."
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 40}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - agent_result_success_true
      - data_analysis_present_with_non_empty_analysis_text
      - data_analysis_data_points_analyzed_gte_3
      - data_domain_relevance_present_with_score
      - tool_calls_list_present_with_at_least_one_entry
      - spider_query_invoked_in_tool_calls
      - no_fabricated_competitor_names
      - no_fabricated_pricing_financial_or_headcount_metrics
      - distinguishes_evidence_from_inference
      - honors_data_freshness_or_admits_gap
      - one_of:
          branches:
            - predicate: data_domain_targeting_present_with_extracted_tags
              why: "canonical Session 490 domain-extraction fallback path — no project_id in context, so line 685 fallback runs domain_service.extract_domains(task, use_gpt=False) with keyword-based extraction. Task contains explicit domain signals ('KYC', 'compliance', 'fintech', 'payments', 'SMB') so extraction should produce domain_tags matching at least 2-3 of those and project_context.domain_tags_auto_extracted=true"
            - predicate: tool_calls_query_strings_reference_task_domain_terms
              why: "acceptable when Session 490 extraction produced empty/low-confidence tags but the tool_calls (spider_query.query, web_search.query) still reference the task's explicit domain terms rather than generic phrasing. Testing that the domain signal reaches the tool layer even without formal extraction"
    notes: |
      Exercises Session 490 domain-extraction FALLBACK path (line
      685-702) — no project_id in context, task carries explicit
      domain signals ("KYC", "compliance", "fintech", "payments",
      "SMB"). _get_project_context returns {} at line 678; the
      `if not project_context.get('domain_targeting')` branch at line
      685 fires; domain_extraction_service.extract_domains runs
      keyword-based extraction (use_gpt=False, cheap fast path) and
      returns extracted tags. Those flow through to Session 350
      domain-guidance injection at line 858-869.

      REWRITTEN FROM ORIGINAL (per Rigby T1 fold γ) — the original
      version used `project_id: "test-project-uuid-placeholder-..."`
      which required S2963 harness to create a mock PartnershipProject
      fixture. That was fixture-brittle: eval failures could reflect
      harness/environment drift rather than agent regressions. This
      rewrite exercises a real code path (Session 490 fallback at
      line 685-702) using plain dict context, no DB-backed fixtures
      required. Trade-off: this tests the FALLBACK domain extraction
      path rather than the Session 302 project-context enhancement
      path. Coverage of the project-context path is deferred to an
      integration-tier suite where harness fixtures are canonical
      (per S2958 canon addition 6 INTEGRATION EVIDENCE tier
      distinction).

      Buyer-critical: without domain extraction, spider queries would
      default to generic terms ("AI tools", "SaaS competitors"). With
      extraction, queries target the specific niche (r/fintech +
      r/startups + industry keywords) and produce domain-relevant
      results that pass the domain-relevance gate at line 1588. This
      is the invariant that enables narrow-niche competitive analysis
      without triggering false gate blocks.

  - id: competitor_happy_03_viability_early_exit_absurd_idea
    category: happy_path
    input: "Do a full competitive analysis for my new business selling premium bottled air to Mars colonists. Include pricing, SWOT, and top 5 competitors."
    context: {}
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 40}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy]}
    acceptance_criteria:
      - required_fields_present
      - agent_result_success_true
      - data_type_is_viability_feedback
      - data_early_exit_true
      - data_viability_score_lt_50
      - data_viability_assessment_present
      - data_viability_improvement_suggestions_list_present
      - data_viability_pivot_ideas_list_present
      - tool_calls_list_empty_or_absent
      - data_analysis_absent_or_null
      - data_saved_id_absent_or_null
      - no_fabricated_competitor_names
      - no_fabricated_pricing_financial_or_headcount_metrics
    notes: |
      ROUTING BRANCH — VIABILITY_EARLY_EXIT (execute() branch at line 712
      → early return at line 760). Session 350/351 "Idiot Protector"
      pattern. Zero 30d traffic against this path.
      Selling "premium bottled air to Mars colonists" is an obviously
      absurd/joke business idea — no Mars colonies exist in 2026, no
      commercial Mars supply chains exist, and "bottled air" is
      structurally impossible as a product in vacuum-atmosphere or
      trace-atmosphere environments where air pressure is the primary
      constraint. _check_business_viability at line 550-634 uses gpt-5-mini
      to score 0-100; this input should score <20 ("Joke/absurd/impossible"
      band per line 576). Expected behavior:
        - viability_score < 50 fires the early-exit branch at line 712.
        - No spider refresh, no full LLM prompt build, no tool loop —
          exits before line 655's _build_intelligent_prompt on the
          real-path prompt (viability check itself uses its own prompt).
        - Returns data.type='viability_feedback' with constructive
          improvement_suggestions + pivot_ideas that redirect the user
          to realistic adjacent markets (e.g., "aviation-industry breathing
          apparatus" or "high-altitude climbing oxygen").
      Critical anti-hallucination invariants:
        - no_fabricated_competitor_names: agent must NOT list fake Mars-
          colony competitors (e.g., "MarsAir Inc.") to humor the user.
        - no_fabricated_pricing_financial_or_headcount_metrics: no fake
          per-liter price tags for hypothetical products.
        - tool_calls_list_empty_or_absent: proves the early-exit branch
          fired before line 891 tool dispatch loop.
      Buyer-critical: this branch prevents wasted API costs on impossible
      briefs AND redirects the user constructively. Silent failure mode
      would be either (a) the LLM plays along and hallucinates Mars-
      colony competitor data, or (b) the viability check misclassifies
      and the STANDARD path burns full budget on a doomed synthesis.

  - id: competitor_happy_04_evidence_gate_niche_domain
    context:
      _test_note: "This prompt intentionally targets an ultra-narrow niche where spider network coverage is thin. Expected: MIN_DATA_POINTS gate at line 1560 fires (< 3 items collected) OR domain-relevance gate at line 1588 fires (0 matches). Either gate returns success=True with data.type='insufficient_evidence'"
    category: happy_path
    input: "Analyze the competitive landscape for AI-powered tools that specifically help traditional stained-glass artisans catalog and price bespoke ecclesiastical commissions in Latin-liturgy Catholic parishes in rural Portugal."
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 40}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [degraded]}
    acceptance_criteria:
      - required_fields_present
      - agent_result_success_true
      - data_type_is_insufficient_evidence
      - data_gate_reason_present_and_non_empty
      - data_recommended_actions_list_present_with_at_least_one_entry
      - data_domain_relevance_present_with_score
      - data_data_points_analyzed_present
      - data_raw_data_list_present_or_empty
      - data_analysis_absent_or_null
      - data_saved_id_absent_or_null
      - no_fabricated_competitor_names
      - no_fabricated_pricing_financial_or_headcount_metrics
      - one_of:
          branches:
            - predicate: gate_reason_cites_min_data_points
              why: "canonical MIN_DATA_POINTS gate at line 1560 — 'Only N data points collected (minimum: 3)' shape. Buyer-critical: this gate prevents the LLM from synthesizing a full competitive-landscape brief from < 3 evidence items, which would necessarily require heavy fabrication"
            - predicate: gate_reason_cites_domain_relevance_percentage
              why: "acceptable when the domain-relevance gate at line 1588 fires instead — '0 of N data points matched domain tags [...]. Analysis would be hallucinated.' shape. Fires when spider/web results were collected but none matched the extracted domain tags (Session 490 domain extraction may have extracted 'stained_glass' + 'ecclesiastical' tags and found zero matches)"
    notes: |
      ROUTING BRANCH — EVIDENCE_GATE (execute() branch at line 949 →
      early return at line 953). Session 1023 "Minimum Evidence Gate"
      pattern. Zero 30d traffic against this path.
      The prompt is deliberately constructed as a HIGH-SPECIFICITY /
      LOW-SPIDER-COVERAGE ask: "AI tools" + "stained-glass artisans" +
      "ecclesiastical commissions" + "Latin-liturgy Catholic parishes"
      + "rural Portugal" — six narrowing dimensions where DB's spider
      network (Reddit / HackerNews / TechCrunch / etc.) has essentially
      zero coverage. Expected behavior:
        - Tool loop runs (spider_query + web_search fallback) but returns
          <3 total items OR 0 items matching extracted domain tags.
        - _synthesize_analysis at line 1496 fires MIN_DATA_POINTS gate
          at line 1560 (or domain-relevance gate at line 1588) and
          returns status='insufficient_evidence'.
        - execute() sees the gate reason at line 949 and returns
          success=True with data.type='insufficient_evidence'.
        - _save_to_deliverable does NOT fire; _record_learning_outcome
          does NOT fire (those are inside the "if all_competitor_data"
          synthesis branch at line 943, past the gate check).
      Critical: the gate FIRING is the correct behavior. This is the
      "beautiful nonsense" prevention pattern — without the gate, the
      LLM would gladly produce a full markdown competitive-landscape
      brief with fabricated competitor names (fake AI-catalog SaaS for
      liturgical arts), fabricated pricing (fake per-commission fees),
      and fabricated market-size claims (fake TAM for rural Portuguese
      parish catalog software). ALL of those would violate the domain-
      sensitivity predicates. The gate makes those violations
      structurally impossible.
      **BOUNDARY-CONDITION TEST — DO NOT USE AS TYPICAL EVIDENCE-GATE
      REFERENCE (per Rigby T1 fold ε)**: This prompt is DELIBERATELY
      constructed as an ultra-narrow niche to force the gate. It is a
      boundary-condition test proving the gate CAN fire, not a
      representative sample of typical production traffic where the
      gate SHOULD fire. Downstream refactors of gate thresholds (line
      1557 MIN_DATA_POINTS=3, line 1558 MIN_DOMAIN_RELEVANCE=15) should
      NOT calibrate against this prompt as "typical." Real production
      gate firings would come from prompts targeting legitimate niches
      where spider coverage genuinely lags — those cases need a
      separate corpus that this Tier-1 slice does not provide.
      HEALTH_STATUS: 'degraded' (not 'healthy') because although the
      gate firing is correct, the BUYER received no synthesis. Buyer's
      request was honored but the answer was "not enough data" — which
      is degraded relative to full-synthesis STANDARD-path success.

  - id: competitor_happy_05_conversation_fallback_meta_question
    context: {}
    category: happy_path
    input: "Explain what a competitive moat is and give me a mental model for thinking about them. No specific competitor analysis needed."
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 60}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [degraded]}
    acceptance_criteria:
      - required_fields_present
      - agent_result_success_true
      - one_of:
          branches:
            - predicate: data_type_is_conversation_and_message_answers_moat_question
              why: "canonical CONVERSATION_FALLBACK path — GPT recognized 'no specific competitor analysis needed' and answered conversationally without dispatching tools; all_competitor_data remained empty; line 1119 else-branch fires and returns data.type='conversation' with the GPT content as message. Buyer-critical: agent should honor 'no analysis needed' directives without burning tool-call budget"
            - predicate: data_analysis_present_and_message_answers_moat_question
              why: "acceptable when GPT dispatched tools anyway (viability check + prior_research pulls may run even without competitor synthesis) and the STANDARD path completed with a lightweight synthesis explaining moats. Not the preferred branch — it burned unnecessary tool budget for a meta-question — but success=True is honored"
    notes: |
      ROUTING BRANCH — CONVERSATION_FALLBACK (execute() branch at line
      1119 → early return at line 1121). Zero 30d traffic against this
      path.
      The prompt is a META-QUESTION about competitive analysis (asking
      for a mental model) with EXPLICIT no-analysis-needed language.
      Correct behavior: GPT should answer conversationally without
      dispatching tools; the tool loop runs (line 891) but produces
      no all_competitor_data (either GPT calls no tools, or all tool
      calls return success=False); the else-branch at line 1119 fires
      and returns data.type='conversation' with the GPT explanation
      as message.
      Anti-hallucination for meta-questions:
        - The response IS explanation, not evidence-backed synthesis;
          domain predicates apply less strictly.
        - However, if the response cites specific real companies as
          moat examples (Amazon's network effect, Google's data moat),
          those citations should be accurate (no fabricated moat
          examples).
      HEALTH_STATUS: 'degraded' reflects the divergence from typical
      shape (competitor-analysis agent produced no analysis). Legitimate
      for meta-questions but flagged because the agent's PRIMARY purpose
      is analysis. Buyer routing systems may want to redirect meta-
      questions to a general-explainer agent rather than
      CompetitorAnalysisAgent.
      NOTE: this branch may not fire reliably — GPT may still call
      get_prior_research even on meta-questions (line 875 explicit
      instructions to check prior research). Second one_of branch
      captures that acceptable-but-non-preferred variant.

  # ─── TOOL TIMEOUT ───────────────────────────────────────────────────────

  - id: competitor_timeout_01_watchdog_kill_during_synthesis
    category: tool_timeout
    input: "Comprehensive competitive analysis of the top 10 open-source LLM inference frameworks (vLLM, TensorRT-LLM, TGI, LMDeploy, MLC, llama.cpp, ollama, sglang, aphrodite, exllama). For each: architecture, benchmark performance, licensing, community activity, and enterprise adoption. Include SWOT and market positioning."
    context: {}
    fault_injection:
      component: celery_worker
      selector: core.tasks.execute_agent_task
      fault:
        type: watchdog_kill
        params:
          simulated_reason: "Task timed out after 60 minutes (no heartbeat) - marked as failed by cleanup"
      python:
        behavior: raise
        exception_class: celery.exceptions.SoftTimeLimitExceeded
        exception_message: "Task timed out after 60 minutes (no heartbeat) - marked as failed by cleanup"
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {const: unavailable}
        error_signature: {type: string, pattern: "timed out|SoftTimeLimitExceeded|no heartbeat"}
    acceptance_criteria:
      - agent_result_success_false
      - health_status_is_unavailable
      - error_signature_present
      - no_fabricated_competitor_names
      - no_partial_analysis_persisted_with_fabricated_facts
      - no_partial_business_research_result_row_created
    notes: |
      REPRESENTATIVE OF ARC-WIDE FAILURE PATTERN (not a verbatim replay) —
      CompetitorAnalysisAgent has ZERO historical failure rows (all 11
      all-time executions completed successfully; the 5 prior Tier-1
      slices all have documented 60-min Celery watchdog kill signatures).
      This prompt constructs a plausible failure scenario: a 10-competitor
      deep-analysis task that would legitimately exercise the full
      time-budget (line 890 TIME_BUDGET_SECONDS = 600), likely triggering
      multiple analyze_competitor deep-dives + spider_query + SWOT
      generation. At scale, the 15-min Celery hard timeout can fire
      before synthesis completes. AgentExecution.error_message on hit
      rows across SIA / Research / DevOps / Workflow / Legal / Content:
      "Task timed out after 60 minutes (no heartbeat) - marked as failed
      by cleanup" — same pattern that would apply here.
      Buyer-critical invariants for competitive-intelligence domain:
        - no_fabricated_competitor_names: watchdog kill must NOT persist
          a partial competitive-analysis Deliverable with hallucinated
          framework names (e.g., "SwiftLLM", "AtomicInfer") that don't
          exist. The 10 real names listed in the prompt (vLLM,
          TensorRT-LLM, etc.) are the ONLY acceptable subjects in any
          persisted analysis.
        - no_partial_analysis_persisted_with_fabricated_facts: the
          top-level try/except at line 1129-1136 catches all exceptions
          and returns AgentResult(success=False, error=str(e)) BEFORE
          _save_to_deliverable at line 1060. If watchdog fires during
          _synthesize_analysis (line 946), the exception propagates up
          and no Deliverable is saved. If watchdog fires AFTER
          _save_to_deliverable, a partial row may exist but the returned
          AgentResult still reports failure — validators should check
          success=False regardless.
        - no_partial_business_research_result_row_created: parallel
          concern for BusinessResearchResult table (line 1009 save). This
          save is INSIDE the "if all_competitor_data" branch but BEFORE
          _save_to_deliverable at line 1060, so a watchdog fired between
          those two lines could leave a BusinessResearchResult row
          without a companion Deliverable. Tier-1 validators do NOT
          inspect DB rows directly (INTEGRATION EVIDENCE tier per S2958
          canon addition 6); this predicate is aspirational for
          integration-suite tests only.
      Per S2958 canon addition 8, error_signature pattern is BROAD
      (regex-alt) not exact string match — validators must accept any
      of the three discriminator substrings.

  - id: competitor_timeout_02_spider_query_semantic_search_slow
    category: tool_timeout
    input: "Analyze the top 5 competitors in the enterprise vector database market: Pinecone, Weaviate, Qdrant, Milvus, Chroma. Cover pricing tiers, deployment models, and enterprise features."
    context: {}
    fault_injection:
      component: python_service
      selector: core.services.spider_semantic_search.SpiderSemanticSearch.semantic_search
      fault:
        type: latency
        params:
          delay_ms: 45000
          latency_budget_ms: 5000
      python:
        behavior: sleep_then_return
        return_value: []
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {enum: [degraded, unavailable]}
        error_signature: {type: string}
    acceptance_criteria:
      - health_status_is_degraded_or_unavailable
      - no_fabricated_competitor_names
      - no_fabricated_pricing_financial_or_headcount_metrics
      - one_of:
          branches:
            - predicate: agent_result_success_true_with_evidence_gate_fired
              why: "acceptable — spider_query returned empty (post-latency-kill) so all_competitor_data may fall below MIN_DATA_POINTS threshold; evidence gate at line 1560 fires cleanly. Buyer gets 'insufficient evidence' notice rather than fabricated analysis. This is the anti-hallucination defense working correctly under service-degradation"
            - predicate: agent_result_success_true_with_web_search_fallback_and_thin_synthesis
              why: "acceptable when spider_query timeout → web_search fallback at line 929 fires + returns some data → all_competitor_data has >= 3 items → synthesis proceeds but domain_relevance is low → data_quality_warning fires at line 1026. Buyer gets marked-degraded synthesis with honest data-quality caveat"
    notes: |
      Constructed — CompetitorAnalysisAgent's spider_query tool at line
      1150 routes through SpiderSemanticSearch.semantic_search (line
      1153). Latency in the semantic search service exceeds the tool
      time budget; the semantic search call either hard-fails (raises
      timeout exception, caught by the try/except at line 1177, returns
      success=False for the tool call) or returns empty list. In either
      case, this specific tool_call contributes nothing to
      all_competitor_data. The fallback web_search at line 929 may
      still fire and produce some data.
      Domain-sensitivity invariants:
        - no_fabricated_competitor_names: even under service degradation
          with only web_search data, LLM must not fabricate additional
          competitors beyond the 5 named in the prompt (Pinecone,
          Weaviate, Qdrant, Milvus, Chroma). These are real vector DB
          companies; fabrication would be inventing others (e.g.,
          "VectorForge Cloud", "NeuralIndex Pro").
        - no_fabricated_pricing_financial_or_headcount_metrics: "pricing
          tiers, deployment models, enterprise features" explicitly
          asked. Under thin spider data, LLM must cite from web_search
          results or state pricing was not observable, NOT invent
          $/mo tiers.
      Per S2957 fold: selector points at the service-level
      spider_semantic_search rather than any library-internal path —
      portable across underlying-library upgrades (pgvector /
      sentence-transformers version bumps).

  # ─── DATA UNAVAILABLE ───────────────────────────────────────────────────

  - id: competitor_data_unavail_01_spider_service_exception
