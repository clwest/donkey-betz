      referenced at line 1323). No length validation exists in the aggregation
      loop at lines 1339-1350 — an empty string would flow through into
      _save_legal_document as an empty motion body. Buyer-critical for legal:
      empty content must not become a persisted LegalDocument with visible
      motion body of "" (which a future court filing action might auto-file).
      Per S2957 fold: selector points at the service-level _execute_tool_call
      method rather than any library-internal openai path — portable across
      SDK upgrades.

  - id: legal_data_unavail_02_search_legal_resources_spider_data_missing
