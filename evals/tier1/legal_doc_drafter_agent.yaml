          branches:
            - predicate: tool_call_result_success_true_but_document_is_empty_string
              why: "acceptable if agent surfaces the empty result honestly — tool call was made, per-tool handler returned empty document, downstream persistence may skip the empty document; health_status=degraded reflects the incomplete output"
            - predicate: agent_result_success_false_with_no_content_error
              why: "acceptable if the agent detects the empty-content case and hard-fails rather than persisting an empty LegalDocument with '' as the motion body"
    notes: |
      Constructed — the per-tool draft_motion handler returns a shape with
