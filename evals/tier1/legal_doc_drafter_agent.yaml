# Golden Evals — Tier-1 canonical prompt suite
# Agent under test: LegalDocDrafterAgent (core/agents/legal/legal_doc_drafter_agent.py:474)
#
# Arc: Golden Evals (S2954+ open, ratified 2026-07-25 by Chris via Chat UI)
# Reliability contract source: docs/research/platform/S2954_GOLDEN_EVALS_ARC_OPEN.md §3
# Arc slice: S2959 — fifth Tier-1 agent YAML (mirrors canon_version=1 substrate
#   frozen at S2955 in evals/tier1/system_intelligence_agent.yaml and validated
#   through S2956 research_agent.yaml, S2957 devops_agent.yaml, and S2958
#   workflow_orchestration_agent.yaml)
# HEAD at authoring: c0e87d2f8
#
# Volume snapshot (DB-verified via direct ORM 2026-07-25 T0):
#   30d executions (owner_agent="LegalDocDrafterAgent",
#                   created_at >= 2026-06-25T00:00:00Z):        5
#     (5 completed, 0 failed — 0% 30d failure rate)
#   All-time (no created_at filter):                           12
#     (12 completed, 0 failed — earliest 2026-06-23, latest 2026-07-17)
#   30d distinct task strings: 3 (multiple retries of the same "Draft a motion
#     to modify visitation" ask — every 30d prompt is a variant of the same
#     Colorado parenting-time modification scenario).
#   Task-shape distribution (30d, exact from ORM sample):
#     - "Draft a motion to modify visitation from every other weekend to
#        every weekend" → 3 rows (2026-07-17)
#     - "Draft a motion to change visitation from every other weekend to
#        every weekend" → 1 row (2026-07-17)
#     - "Draft a motion to modify visitation to every weekend from every
#        other weekend" → 1 row (2026-07-17)
#     - "Draft a Colorado Motion to Modify Parenting Time in the
#        style/structure of Colorado JDF 1220. Use the following…" → 1
#        (from all-time sample, 2026-07-16)
#   Observed real failure modes (from AgentExecution.error_message, all-time): NONE.
#     Zero failures in 12 all-time rows. All fault-injection prompts below are
#     constructed from LegalDocDrafterAgent's known dependency graph (OpenAI
#     tool-selection call, per-tool draft_* handlers, Mythology Enforcer post-
#     validation, LegalDocument persistence, Deliverable persistence, denied-
#     motion pipeline mode) rather than replayed from production traces.
#   Verifier note (inherited from S2956 ResearchAgent YAML): AgentExecution.error_message
#     stores empty-string ("") for successful runs, NOT NULL. Django's
#     error_message__isnull=False filter returns all rows; use error_message__gt=''
#     or .exclude(error_message='') for real failures. All 12 all-time rows in
#     this sample have error_message='' (empty string, not null); confirmed
#     directly via ORM at authoring T0.
#
#   HONEST COVERAGE LIMITS:
#   1. THIN TRAFFIC — 5 30d executions is the thinnest arc-so-far except for
#      WorkflowOrchestrationAgent's 9. All 5 exercise a single agent tool
#      (draft_motion). Zero 30d traffic against draft_email, draft_declaration,
#      explain_procedure, get_form_info, search_legal_resources, or the denied-
#      motion pipeline mode (analyze_denied_motion + rewrite_motion).
#   2. NARROW DOMAIN — 100% of observed 30d traffic is Colorado parenting-time
#      modification variants. Zero variety across the tool surface (motion types,
#      email types, procedure explanations, form lookups). The agent's declared
#      scope covers a much broader Colorado family-law surface than production
#      traffic exercises.
#   3. ZERO FAILURE SAMPLE — every one of the 12 all-time rows completed
#      successfully. tool_timeout_01 (Celery watchdog kill) is replayed from
#      the platform-wide watchdog pattern observed in SIA / ResearchAgent /
#      DevOpsAgent / WorkflowOrchestrationAgent failure samples, not from
#      LegalDocDrafterAgent's own history.
#   4. LEGAL DOMAIN BUYER-FACING RISK — legal-drafting hallucinations carry
#      unusually high buyer cost (fabricated statute numbers, wrong JDF form
#      references, incorrect procedural sequencing, orders against non-parties
#      that cannot legally be entered). This YAML encodes those risks as
#      extra-sharp acceptance criteria (no_statutory_citations,
#      no_outcome_predictions, no_strategy_language, non_party_detected_when_present,
#      no_fabricated_jdf_form_numbers) that go beyond the general
#      no_unsupported_claims predicate. Per S2959 arc-slice scope note in
#      00-START-NEXT-SESSION.md: "hallucination invariants must be extra sharp
#      given the buyer-facing risk of drafting incorrect legal language."
#
#   ACTIONABLE CONCLUSION FROM COVERAGE LIMITS (per S2959 Rigby T2 fold 4):
#     Treat this YAML as SCHEMA + HALLUCINATION-INVARIANT VALIDATION, not as a
#     performance/reliability assurance. Volume is too thin (5 30d / 12 all-
#     time), traffic too narrow (single motion-type variant), and failure sample
#     is empty. The extra-sharp legal predicates are the primary value; passing
#     them prevents CATEGORY-LEVEL harm (fabricated statutes / non-party orders
#     / outcome predictions) even when we can't statistically claim the agent is
#     "reliable at drafting". Re-baseline volume claims at S2962 arc-close if
#     production traffic grows past 50 30d executions across ≥2 motion types.
#
# Agent shape (grounds acceptance criteria):
#   Two execution paths in execute() at legal_doc_drafter_agent.py:1229–1492:
#     (A) STANDARD MODE — GPT tool-selection at line 1297 chooses among the
#         system_prompt-declared tool surface (Core: search_legal_resources,
#         draft_motion, draft_email, draft_declaration, get_form_info,
#         explain_procedure = 6; Session 404: analyze_denied_motion, rewrite_motion,
#         generate_evidence_checklist, check_non_party_issues = 4; total 10
#         declared in system_prompt lines 576-588; agent's actual tools list also
#         registers check_order_attachment_required at line 939, giving 11
#         function-schema entries — the 10 system-prompt-declared surface is
#         what LLM tool-selection sees). Tool calls dispatched at line 1315 via
#         _execute_tool_call; documents/legal_info aggregated; LegalDocument +
#         LegalResearchResult persisted via _save_legal_document /
#         _save_legal_research; Deliverable persisted via _save_to_deliverable
#         when documents present.
#     (B) DENIED MOTION MODE — auto-detected at line 1270 via _detect_denied_motion_mode.
#         When triggered, bypasses GPT tool-selection entirely and forces direct
#         tool calls through _execute_denied_motion_pipeline (line 1274). This is
#         a ROUTING BRANCH inside the same agent contract (per S2959 Rigby T2
#         fold 2 — deliberate framing to avoid "NEW SHAPE" language that could
#         invite canon_version=2 creep before S2962 arc-close). Same AgentResult
#         shape + same acceptance-criteria discipline apply as Standard Mode;
#         validators MUST accept programmatic dispatch WITHOUT GPT-mediated
#         tool_calls for this path (evidence_pointers derivation_spec covers
#         both modes' evidence tiers).
#   Returns AgentResult with:
#     message: str (concatenation of generated_documents document text + legal_info
#              explanations / form_info / search_results, join="\n\n"; fallback
#              to gpt_response['content'] when no tool calls, or a canned
#              "I wasn't able to process your request" message)
#     success: bool
#     error: str|None (on failure at line 1487, str(e) from top-level except)
#     execution_time_ms: int
#     tool_calls: list[{tool, arguments, result_preview}]  (result_preview is str[:200])
#     data:
#       type: 'legal_assistance'                     (constant)
#       documents_generated: int
#       legal_info_provided: int
#       query: str                                   (echo of task)
#       jurisdiction: 'Colorado'                     (constant — hardcoded invariant)
#       focus_area: 'Family Law'                     (constant — hardcoded invariant)
#       disclaimer_included: true                    (constant — hardcoded invariant;
#                                                     Session 404D REMOVED disclaimer
#                                                     text from court-ready doc BODY at
#                                                     line 1411, but the meta flag on
#                                                     data.disclaimer_included stays True)
#       saved_document_ids: list[uuid_str]           (LegalDocument row UUIDs)
#       saved_research_ids: list[uuid_str]           (LegalResearchResult row UUIDs)
#       case_profile_id: uuid_str|None
#   Persistence side-effects (Tier-1 validator MUST NOT out-of-band inspect
#     LegalDocument/LegalResearchResult/Deliverable DB rows — INTEGRATION EVIDENCE
#     tier per S2958 canon addition 6; those belong in a separate side-effect
#     verification suite). Tier-1 validators consult AgentResult.data.saved_document_ids
#     length as a native pointer that persistence attempted, not out-of-band row
#     inspection.
#   Post-validation: Mythology Enforcer (Session 409, line 1481) validates output
#     to prevent unrealistic legal claims. Validators encode
#     mythology_enforcer_passed as a criterion for happy paths but do NOT re-run
#     the enforcer; they trust the wrapper contract that _validate_output was
#     called before return.
#
# Coverage: 13 prompts total (5 happy + 8 fault-injection, 2 per non-happy category).
#
# ── Arc-precedent adherence (canon_version=1, S2955-frozen) ──────────────
# (1) schema_version + canon_version explicit at file top.
# (2) canonical_field_mapping declares native vs derived per field with named
#     derivation rules prefixed legal_v1_*.
# (3) fault_injection uses effect-based contract (component + fault.type + params)
#     with python.{...} adapter as optional appendix; portable beyond Python-mock.
#     Selectors prefer service-level paths (core.agents.legal.* / core.services.*)
#     over library-internal openai paths per S2957 fold.
# (4) one_of acceptance-criteria capped at ≤2 branches with mandatory why strings.
#
# ── S2958 additions applied (informative, non-breaking) ──────────────────
# (5) Per-execution-shape evidence-tier requirements in evidence_pointers
#     derivation_spec — standard mode vs denied-motion mode carve different
#     evidence rules given different data payload shapes.
# (6) INTEGRATION EVIDENCE tier distinction — LegalDocument/LegalResearchResult
#     row inspection is out of Tier-1 validator scope; only saved_document_ids
#     length on the returned AgentResult is Tier-1 admissible.
# (8) Timeout-string brittleness avoidance — tool_timeout_01 asserts stable
#     discriminator fields (error_signature pattern, agent_result_success_false)
#     rather than exact error-message text match.

schema_version: 1
canon_version: 1

meta:
  agent: LegalDocDrafterAgent
  tier: 1
  arc: golden_evals
  arc_slice: S2959
  ratified_by: chris_via_chat_ui
  ratified_date: "2026-07-25"
  head_sha_at_authoring: c0e87d2f8
  reliability_contract_source: docs/research/platform/S2954_GOLDEN_EVALS_ARC_OPEN.md
  substrate_reference: evals/tier1/devops_agent.yaml
  categories_covered:
    - happy_path
    - tool_timeout
