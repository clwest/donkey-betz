# Explicit mapping from canonical field (canon_version=1) to how it's obtained
# from the LegalDocDrafterAgent-native AgentResult. Every S2963 validator MUST
# consult this block; must never invent an ad-hoc mapping.
canonical_field_mapping:
  summary:
    mapping_source: native
    from: AgentResult.message
    note: |
      message is the join="\n\n" concatenation of generated_documents document
      text + legal_info explanations + form_info + search_results
      (legal_doc_drafter_agent.py:1336-1370). Falls back to gpt_response['content']
      when tool_calls fired but produced no persistable payload (line 1373). Final
      fallback is the canned "I wasn't able to process your request. Please try
      rephrasing." at line 1414. Validators must accept all three shapes.
  evidence_pointers:
    mapping_source: derived
    derivation_rule: legal_v1_tool_calls_plus_saved_ids
    derivation_spec: |
      Standard mode (execute() line 1229, GPT-mediated tool selection):
        Preferred: AgentResult.tool_calls[*].tool + arguments + result_preview
          (proves tool-grounding for draft/explain/search dispatches).
        Fallback A (drafting path): AgentResult.data.saved_document_ids
          length >= 1 — proves LegalDocument persistence attempt.
        Fallback B (advisory path): AgentResult.data.saved_research_ids
          length >= 1 — proves LegalResearchResult persistence attempt.
        Fallback C (pure GPT content, no tools called): AgentResult.message
          length >= 200 with substantive content is the only evidence available.
          Legitimate for procedural-explanation asks where the LLM chose not to
          dispatch explain_procedure and answered directly. Validators must not
          upgrade this to "evidence" for explicit drafting asks.
        For happy paths with an explicit drafting or lookup ask, at least one of
        (tool_calls, saved_document_ids, saved_research_ids) MUST be non-empty.
      Denied-motion mode (execute() branch at line 1272 → _execute_denied_motion_
      pipeline at line 1274):
        Programmatic dispatch bypasses GPT tool_calls. Evidence in this path is:
          Preferred: AgentResult.data.saved_document_ids length >= 1 (proves
            rewritten motion persisted as LegalDocument).
          Fallback: AgentResult.message pattern matching JDF-form-structure
            markers ("Court:", "Case Number:", "MOTION TO", "Verified:") — proves
            structured motion content was returned even if persistence attempt
            details are opaque.
        Per S2958 canon addition 5, denied-motion mode carves its own evidence
        rules distinct from standard mode.
      For data_unavailable / tool_timeout / rejected bad_input with success=False,
      all MAY be empty.
      INTEGRATION EVIDENCE (per S2958 canon addition 6): out-of-band LegalDocument
      / LegalResearchResult / Deliverable DB row inspection is NOT in Tier-1
      validator scope; the saved_*_ids length pointers above are the Tier-1
      admissible signal.
  health_status:
    mapping_source: derived
    derivation_rule: legal_v1_success_and_tool_path
    derivation_spec: |
      if not AgentResult.success:                                       → unavailable
      elif tool_calls is empty and message is non-empty and
           message length >= 200:                                        → healthy
        (advisory path — legitimate for procedural asks where LLM
         answered directly without dispatching explain_procedure)
      elif all tool_calls have implicit-success (result_preview is
           non-empty and does not start with "Error:") and
           at least one of (saved_document_ids, saved_research_ids)
           is non-empty:                                                 → healthy
      elif all tool_calls have implicit-success but both
           saved_document_ids and saved_research_ids are empty:          → degraded
        (tool call happened but persistence didn't fire — usable output
         in memory but the buyer-facing artifact side-effect was skipped)
      elif any tool_call has result_preview starting with "Error:":     → degraded
      else:                                                             → healthy
      Note: LegalDocDrafterAgent's data.jurisdiction and data.focus_area are
      HARDCODED constants ('Colorado', 'Family Law') set at lines 1424-1425;
      they do NOT reflect runtime health and validators must not derive
      health_status from those constants. Only success + tool path + persistence
      counts feed health_status derivation.

prompts:

  # ─── HAPPY PATH ─────────────────────────────────────────────────────────

  - id: legal_happy_01_draft_motion_modify_parenting_time
    category: happy_path
    input: "Draft a Colorado Motion to Modify Parenting Time in the style/structure of Colorado JDF 1220. Case involves my two children; current parenting time is every other weekend and I want to modify to every weekend. Reason: changed circumstances (I have a stable work schedule now and can support the children full weekends)."
    context: {}
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 200}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - tool_call_draft_motion_invoked
      - tool_call_arg_motion_type_is_modify_parenting_time
      - data_jurisdiction_is_colorado
      - data_focus_area_is_family_law
      - data_disclaimer_included_true
      - no_statutory_citations
      - no_outcome_predictions
      - no_strategy_language
      - jdf_form_reference_correct_or_title_only
      - mythology_enforcer_passed
      - one_of:
          branches:
            - predicate: data_saved_document_ids_length_gte_one
              why: "buyer-critical happy path — motion drafted and LegalDocument row persisted (line 1343), giving the user a retrievable artifact"
            - predicate: tool_call_result_success_true_with_document_content
              why: "acceptable when persistence fails but the drafted motion content is still returned in the tool result; user gets the artifact even if the audit trail row didn't save"
    notes: |
      Real 30d prompt shape — all 5 30d prompts + the sampled all-time row are
      variants of this ask. Exercises draft_motion tool dispatch with
      motion_type=modify_parenting_time. Critical extra-sharp legal invariants:
        - no_statutory_citations: system_prompt lines 566-570 mandate NEVER cite
          statute numbers ("C.R.S. § 14-10-129" etc); map to CATEGORIES only.
        - no_outcome_predictions: system_prompt lines 517-518 forbid "this will
          likely succeed" language.
        - no_strategy_language: system_prompt lines 515-517 forbid "you should
          argue…" phrasing.
        - jdf_form_reference_correct_or_title_only: if a JDF form number is
          given, it must be a real number (JDF 1220 is correct for parenting-
          time modification per COLORADO_FAMILY_LAW_FORMS at line 90); if
          uncertain, agent must give official title only + direct user to
          coloradojudicial.gov per system_prompt line 524.
        - mythology_enforcer_passed: Session 409 post-validation at line 1481
          must run and return without raising.

  - id: legal_happy_02_draft_meet_and_confer_email
    category: happy_path
    input: "Draft a professional meet-and-confer email to opposing counsel in a Colorado family-law matter. Subject: proposing a modified parenting-time schedule ahead of the case-management conference next month. Tone: professional and conciliatory."
    context: {}
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 100}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - tool_call_draft_email_invoked
      - tool_call_arg_email_type_is_meet_and_confer
      - tool_call_arg_tone_matches_input
      - data_jurisdiction_is_colorado
      - data_focus_area_is_family_law
      - no_statutory_citations
      - no_outcome_predictions
      - no_strategy_language
      - mythology_enforcer_passed
    notes: |
      Zero 30d traffic against draft_email tool — this prompt exercises a tool
      path not observed in production. Standard drafting invariants apply;
      tone-argument pass-through validated (LLM must not default to "formal"
      when user explicitly says "conciliatory").

  - id: legal_happy_03_draft_declaration_in_support
    category: happy_path
    input: "Draft a sworn declaration under penalty of perjury in support of a motion to modify parenting time. Declarant is the petitioner. Key facts: (1) work schedule stabilized in January 2026; (2) new residence has adequate bedroom space for both children; (3) child expressed preference during last court-appointed evaluation; (4) current schedule causes gaps in continuity of care."
    context: {}
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 200}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - tool_call_draft_declaration_invoked
      - tool_call_arg_declarant_role_is_petitioner
      - tool_call_arg_key_facts_length_gte_4
      - data_jurisdiction_is_colorado
      - data_focus_area_is_family_law
      - declaration_contains_penalty_of_perjury_language
      - no_statutory_citations
      - no_outcome_predictions
      - no_strategy_language
      - mythology_enforcer_passed
    notes: |
      Zero 30d traffic against draft_declaration tool — exercises another tool
      not observed in production. declaration_contains_penalty_of_perjury_language
      is a domain-specific invariant: a sworn declaration under Colorado law MUST
      include a penalty-of-perjury attestation ("I declare under penalty of
      perjury under the laws of the State of Colorado…"). LLM failure mode:
      producing a "statement" instead of a sworn "declaration" without the
      required attestation clause.

  - id: legal_happy_04_explain_procedure_modify_parenting_time
    category: happy_path
    input: "Explain step by step how to file a motion to modify parenting time in Colorado, including required forms, service on the other parent, and the meet-and-confer sequence. Please include filing-fee waiver options if applicable."
    context: {}
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 400}
        evidence_pointers: {type: array}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - no_statutory_citations
      - no_outcome_predictions
      - no_strategy_language
      - jdf_form_references_are_real_or_absent
      - one_of:
          branches:
            - predicate: tool_call_explain_procedure_invoked
              why: "canonical path — agent dispatches explain_procedure with procedure=modify_parenting_time; produces structured step-by-step content persistable as LegalResearchResult"
            - predicate: no_tool_calls_and_summary_provides_step_by_step_procedure
              why: "advisory path acceptable — system_prompt permits direct answers; LLM may inline the procedure explanation without tool dispatch, as long as summary is substantive (>= 400 chars) and JDF form references are correct-or-absent (no fabricated numbers)"
    notes: |
      Zero 30d traffic against explain_procedure tool. Advisory path acceptable
      per canonical_field_mapping evidence_pointers derivation Fallback C
      (procedural asks legitimately answerable without tool dispatch). Legal-
      domain sharpness: jdf_form_references_are_real_or_absent — LLM must NOT
      fabricate form numbers (a common failure mode when models try to sound
      authoritative). Correct references live in COLORADO_FAMILY_LAW_FORMS at
      line 79.

  - id: legal_happy_05_denied_motion_pipeline_rewrite
    category: happy_path
    input: |
      I filed a motion to modify parenting time and it was denied. The court's
      order said "Motion denied — improper form, no verified factual affidavit
      attached, and no meet-and-confer certification". I attached my original
      motion below. Please analyze why it was denied and draft a corrected
      motion in proper JDF format.

      ORIGINAL DENIED MOTION:
      ---
      To the Court:

      I am asking to change my visitation from every other weekend to every
      weekend because I have a better job now and can spend more time with
      my kids. My ex-wife's new boyfriend is a bad influence and I want him
      kept away from the kids.

      Thank you,
      [Petitioner]
      ---
    context:
      denied_motion_uploaded: true
    expected_output_shape:
      type: object
      required: [summary, evidence_pointers, health_status]
      properties:
        summary: {type: string, minLength: 500}
        evidence_pointers: {type: array, minItems: 1}
        health_status: {enum: [healthy, degraded]}
    acceptance_criteria:
      - required_fields_present
      - denied_motion_mode_activated
      - correct_jdf_form_identified
      - deficiencies_mapped_to_procedural_defects
      - non_party_detected_when_present
      - draft_affidavit_in_sworn_format_present
      - draft_motion_in_jdf_structure_present
      - no_statutory_citations
      - no_outcome_predictions
      - no_strategy_language
      - mythology_enforcer_passed
      - one_of:
          branches:
            - predicate: data_saved_document_ids_length_gte_one
              why: "canonical denied-motion pipeline outcome — rewritten motion persisted as LegalDocument; buyer gets a retrievable court-ready artifact"
            - predicate: summary_contains_all_seven_denied_motion_sections
              why: "acceptable when persistence didn't fire but the full A-through-G structure per system_prompt lines 539-545 (correct form ID / denial reasons / separate filings / affidavit / motion / proposed order / evidence checklist) is present in the returned message; user gets the artifact in-line even without a persisted row"
    notes: |
      ROUTING BRANCH — DENIED MOTION MODE (execute() branch at line 1272 →
      _execute_denied_motion_pipeline at line 1274, bypasses GPT tool selection).
      Deliberately framed as a routing branch inside the same agent contract,
      not a "new shape" (per S2959 Rigby T2 fold 2 — avoids canon_version=2
      creep before S2962 arc-close). Same success + evidence + hallucination
      invariants apply as Standard Mode. Zero 30d traffic against this path. Extra-sharp legal invariants:
        - non_party_detected_when_present: system_prompt lines 549-560 mandate
          detecting non-party relief requests (here: the "new boyfriend" is a
          non-party); agent MUST explain that the court cannot order relief
          against non-parties and MUST provide the correct procedure
          (restricting the party-parent's obligation to control the home
          environment).
        - correct_jdf_form_identified: system_prompt lines 538-546 mandate the
          A-G structure begins with correct form ID (JDF 1220 for parenting-
          time modification per COLORADO_FAMILY_LAW_FORMS at line 90).
        - deficiencies_mapped_to_procedural_defects: not to legal-strategy
          critiques of the argument merits.

  # ─── TOOL TIMEOUT ───────────────────────────────────────────────────────

  - id: legal_timeout_01_watchdog_kill
    category: tool_timeout
    input: "Draft a comprehensive Colorado Motion to Modify Parenting Time with full JDF 1220 structure, verified affidavit, meet-and-confer certification, evidence exhibit list, and proposed order — all in one response."
    context:
      invocation_source: batch_smoke_test
    fault_injection:
      component: celery_worker
      selector: core.tasks.execute_agent_task
      fault:
        type: watchdog_kill
        params:
          simulated_reason: "Task timed out after 60 minutes (no heartbeat) - marked as failed by cleanup"
      python:
        behavior: raise
        exception_class: celery.exceptions.SoftTimeLimitExceeded
        exception_message: "Task timed out after 60 minutes (no heartbeat) - marked as failed by cleanup"
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {const: unavailable}
        error_signature: {type: string, pattern: "timed out|SoftTimeLimitExceeded|no heartbeat"}
    acceptance_criteria:
      - agent_result_success_false
      - health_status_is_unavailable
      - error_signature_present
      - no_fabricated_motion_content
      - no_deliverable_persisted_with_partial_content
      - no_legal_document_persisted_with_partial_content
    notes: |
      Constructed — LegalDocDrafterAgent had zero all-time failures, so this
      replays the platform-wide 60-min Celery watchdog kill pattern observed in
      SIA (sia_timeout_01), ResearchAgent (research_timeout_01), DevOpsAgent
      (devops_timeout_01), and WorkflowOrchestrationAgent (workflow_timeout_01).
      Buyer-critical invariant for legal domain: watchdog kill must NOT persist
      a partial LegalDocument or Deliverable with fabricated motion content.
      The top-level try/except at legal_doc_drafter_agent.py:1485-1492 MUST fire
      cleanly and return AgentResult(success=False, error=...). Per S2958 canon
      addition 8, error_signature pattern is BROAD (regex-alt) not exact string
      match — validators must accept any of the three discriminator substrings.

  - id: legal_timeout_02_openai_client_slow_during_draft
    category: tool_timeout
    input: "Draft a Colorado Motion to Modify Parenting Time — case involves modifying every-other-weekend to every-weekend."
    context: {}
    fault_injection:
      component: openai
      selector: core.services.openai_client_factory.get_openai_client
      fault:
        type: latency
        params:
          delay_ms: 30000
          latency_budget_ms: 5000
      python:
        behavior: sleep_then_return
    expected_output_shape:
      type: object
      required: [summary, health_status]
      properties:
        summary: {type: string}
        health_status: {enum: [degraded, unavailable]}
        error_signature: {type: string}
    acceptance_criteria:
      - health_status_is_degraded_or_unavailable
      - no_fabricated_motion_content
      - no_statutory_citations
      - one_of:
          branches:
            - predicate: agent_result_success_false_with_error_signature
              why: "hard-fail acceptable — OpenAI client is required for the outer _call_openai tool-selection call at line 1297; latency past budget causes the LLM call to time out and no draft_motion dispatch happens"
            - predicate: agent_result_success_false_with_partial_tool_call_recorded
              why: "acceptable if the top-level _call_openai completed but the per-tool draft_motion handler stalled during document generation — tool_calls list may contain the dispatch record but result_preview reflects failure"
    notes: |
      Constructed — LegalDocDrafterAgent's tool-selection LLM call at line 1297
      routes through core.services.openai_client_factory via the standard
      _call_openai path. Latency in the client factory affects both the outer
      tool-selection call and any per-tool LLM calls that draft_motion et al
      make internally. Unacceptable: fabricating a JDF-formatted motion to fill
      the void. Legal-domain sharpness: no_statutory_citations remains binding
      even in error paths — LLMs sometimes leak fabricated statute numbers when
      "trying harder" under latency stress.

  # ─── DATA UNAVAILABLE ───────────────────────────────────────────────────

  - id: legal_data_unavail_01_draft_motion_returns_empty_document
    category: data_unavailable
    input: "Draft a Colorado Motion to Modify Parenting Time — case involves modifying every-other-weekend to every-weekend."
    context: {}
    fault_injection:
      component: python_service
      selector: core.agents.legal.legal_doc_drafter_agent.LegalDocDrafterAgent._execute_tool_call
      fault:
        type: bad_payload
        params:
          shape: empty_document_string
          tool_scope: draft_motion
      python:
