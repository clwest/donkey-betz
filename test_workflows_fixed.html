<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflows Fix Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #00ff00;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
        .info { color: #ffff00; }
    </style>
</head>
<body>
    <h1>✅ Workflows Page - Fixed Endpoints Test</h1>
    
    <div>
        <button onclick="testCreateFromTemplate()">Test Create from Template</button>
        <button onclick="testCreateCampaign()">Test Create Campaign</button>
        <button onclick="testGetTemplates()">Test Get Templates</button>
        <button onclick="clearLog()">Clear</button>
    </div>
    
    <div id="result" class="result"></div>
    
    <script>
        const API_URL = 'http://localhost:8000/api';
        const AUTH_TOKEN = localStorage.getItem('authToken') || 'fc58364ffbca4e77b732d03711d44965cf40acb6';
        
        function log(message, type = 'info') {
            const result = document.getElementById('result');
            const timestamp = new Date().toISOString().split('T')[1].substring(0, 8);
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            result.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            result.scrollTop = result.scrollHeight;
        }
        
        async function testCreateFromTemplate() {
            log('Testing POST /campaigns/from-template/...');
            try {
                const response = await fetch(`${API_URL}/campaigns/from-template/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${AUTH_TOKEN}`
                    },
                    body: JSON.stringify({
                        template_name: 'Email Campaign',
                        customizations: {
                            name: 'Test Campaign from Browser',
                            target_audience: {
                                description: 'Test audience'
                            },
                            budget: 1000
                        }
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ SUCCESS! Created campaign: ${data.id}`, 'success');
                    log(`   Title: ${data.title}`, 'success');
                    log(`   Template: ${data.template_used}`, 'success');
                } else {
                    log(`❌ Failed with status ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function testCreateCampaign() {
            log('Testing POST /campaigns/...');
            try {
                const response = await fetch(`${API_URL}/campaigns/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${AUTH_TOKEN}`
                    },
                    body: JSON.stringify({
                        title: 'Custom Campaign from Browser',
                        description: 'AI-powered custom workflow',
                        campaign_type: 'multi',
                        target_audience: 'Define your audience'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ SUCCESS! Created campaign: ${data.id}`, 'success');
                    log(`   Title: ${data.title}`, 'success');
                    log(`   Type: ${data.campaign_type}`, 'success');
                } else {
                    log(`❌ Failed with status ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function testGetTemplates() {
            log('Testing GET /campaigns/templates/...');
            try {
                const response = await fetch(`${API_URL}/campaigns/templates/`, {
                    headers: {
                        'Authorization': `Token ${AUTH_TOKEN}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const templates = data.templates || [];
                    log(`✅ SUCCESS! Found ${templates.length} templates:`, 'success');
                    templates.forEach(t => {
                        log(`   - ${t.name}: ${t.description}`, 'success');
                    });
                } else {
                    log(`❌ Failed with status ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        function clearLog() {
            document.getElementById('result').innerHTML = '';
        }
        
        log('🚀 Workflows Fix Test Ready!', 'success');
        log('The missing endpoints have been added:', 'info');
        log('  ✅ POST /api/campaigns/ - Create new campaign', 'success');
        log('  ✅ POST /api/campaigns/from-template/ - Create from template', 'success');
        log('', 'info');
        log('Click the buttons above to test each endpoint.', 'info');
    </script>
</body>
</html>
