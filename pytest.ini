[pytest]
testpaths = tests core/tests
# Session 416: Use main settings to ensure all config is available
DJANGO_SETTINGS_MODULE = core.settings
python_files = test_*.py *_test.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto

# Coverage configuration
addopts = -v --tb=short --strict-markers

# Custom markers
markers =
    asyncio: mark test as asyncio
    integration: mark test as an integration test
    slow: mark test as slow running
    external_api: mark test as requiring external API access
    golden_path: mark test as a golden path smoke test
    integration_celery: mark test as exercising the full Celery task body against a real DB — see docs/testing/RUNTIME_INTEGRATION_TESTS.md

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::django.utils.deprecation.RemovedInDjango60Warning
