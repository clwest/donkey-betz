# Automatic datasource provisioning for monitoring dashboard
# =============================================================================

apiVersion: 1

datasources:
  # Prometheus - Primary Metrics Source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      queryTimeout: 60s
      timeInterval: 15s
      manageAlerts: true
      alertmanagerUid: alertmanager
    uid: prometheus

  # Elasticsearch - Logs Source
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "[unified-logs-]*"
    jsonData:
      interval: Daily
      timeField: "@timestamp"
      esVersion: 8
      includeFrozen: false
      logMessageField: message
      logLevelField: level
    uid: elasticsearch

  # Jaeger - Tracing Source
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger

  # Alertmanager - Alerts Source
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
    uid: alertmanager

  # Loki - Logs Aggregation (Alternative)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: true