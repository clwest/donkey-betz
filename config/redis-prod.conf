# =============================================================================
# UNIFIED DONKEY BETZ PLATFORM - REDIS PRODUCTION CONFIGURATION
# High-performance production Redis configuration
# =============================================================================

# Network Configuration
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60
tcp-backlog 511

# General Configuration
daemonize no
supervised no
loglevel notice
logfile ""
databases 16
always-show-logo yes

# Persistence Configuration
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Memory Management
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Append Only File
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Lua Scripting
lua-time-limit 5000

# Event Notification
notify-keyspace-events "Ex"

# Advanced Configuration
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# Client Configuration
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
client-query-buffer-limit 1gb

# Connection Limits
maxclients 10000

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 100

# Security
requirepass ${REDIS_PASSWORD}
protected-mode yes

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS "KEYS_DISABLED_USE_SCAN"
rename-command CONFIG "CONFIG_9a8b7c6d5e4f"
rename-command DEBUG ""
rename-command SHUTDOWN SHUTDOWN_9a8b7c6d5e4f

# TLS Configuration (uncomment if using TLS)
# port 0
# tls-port 6380
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
# tls-ca-cert-file /tls/ca.crt
# tls-protocols "TLSv1.2 TLSv1.3"

# Performance Tuning
hz 10
dynamic-hz yes