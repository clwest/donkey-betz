<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test - Revenue Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .connected { background: #4ade80; color: white; }
        .disconnected { background: #f87171; color: white; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .metric-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        .metric-label {
            color: #666;
            margin-bottom: 5px;
        }
        .log {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            height: 300px;
            overflow-y: auto;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
    <h1>Revenue Dashboard WebSocket Test</h1>

    <div id="status" class="status disconnected">Disconnected</div>

    <div class="controls">
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="refreshMetrics()">Refresh Metrics</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="metrics" id="metrics">
        <div class="metric-card">
            <div class="metric-label">Total Revenue</div>
            <div class="metric-value" id="revenue">$0.00</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Proposals</div>
            <div class="metric-value" id="proposals">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Conversions</div>
            <div class="metric-value" id="conversions">0</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Conversion Rate</div>
            <div class="metric-value" id="rate">0%</div>
        </div>
    </div>

    <h3>WebSocket Log</h3>
    <div class="log" id="log"></div>

    <script>
        let ws = null;
        const log = document.getElementById('log');
        const status = document.getElementById('status');

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#f87171' : type === 'success' ? '#4ade80' : '#10b981';
            log.innerHTML += `<div style="color: ${color}">[${timestamp}] ${message}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        function updateStatus(connected) {
            if (connected) {
                status.textContent = 'Connected';
                status.className = 'status connected';
            } else {
                status.textContent = 'Disconnected';
                status.className = 'status disconnected';
            }
        }

        function updateMetrics(metrics) {
            if (metrics.total_revenue !== undefined) {
                document.getElementById('revenue').textContent = `$${metrics.total_revenue.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            }
            if (metrics.proposals_submitted !== undefined) {
                document.getElementById('proposals').textContent = metrics.proposals_submitted;
            }
            if (metrics.conversions !== undefined) {
                document.getElementById('conversions').textContent = metrics.conversions;
            }
            if (metrics.conversion_rate !== undefined) {
                document.getElementById('rate').textContent = `${metrics.conversion_rate.toFixed(1)}%`;
            }
        }

        function connect() {
            if (ws) {
                ws.close();
            }

            const url = 'ws://localhost:8000/ws/revenue-dashboard/';
            addLog(`Connecting to ${url}...`);

            ws = new WebSocket(url);

            ws.onopen = () => {
                addLog('WebSocket connected successfully!', 'success');
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addLog(`Received: ${data.type}`);

                    if (data.type === 'metrics_update' && data.metrics) {
                        updateMetrics(data.metrics);
                        addLog(`Updated metrics - Revenue: $${data.metrics.total_revenue}`, 'success');
                    }
                } catch (e) {
                    addLog(`Error parsing message: ${e.message}`, 'error');
                }
            };

            ws.onerror = (error) => {
                addLog(`WebSocket error: ${error}`, 'error');
            };

            ws.onclose = () => {
                addLog('WebSocket disconnected');
                updateStatus(false);
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function refreshMetrics() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const message = { type: 'refresh_metrics' };
                ws.send(JSON.stringify(message));
                addLog('Sent refresh_metrics request');
            } else {
                addLog('WebSocket not connected', 'error');
            }
        }

        function clearLog() {
            log.innerHTML = '';
        }

        // Auto-connect on load
        window.onload = () => {
            connect();
        };
    </script>
</body>
</html>
