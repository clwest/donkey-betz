# =============================================================================
# UNIFIED DONKEY BETZ PLATFORM - PRODUCTION DOCKER COMPOSE
# Production-ready deployment with load balancing and monitoring
# =============================================================================

version: '3.8'

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  unified-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
  monitoring:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  media_files_prod:
    driver: local
  static_files_prod:
    driver: local
  nginx_cache:
    driver: local
  certbot_data:
    driver: local
  certbot_conf:
    driver: local

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE SERVICES
  # ---------------------------------------------------------------------------
  
  # PostgreSQL Database with Performance Tuning
  postgres:
    image: postgres:15-alpine
    container_name: unified-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-ai_unified_platform}
      POSTGRES_USER: ${DB_USER:-unified_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./config/postgres-prod.conf:/etc/postgresql/postgresql.conf:ro
      - ./scripts/init-postgres-prod.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      unified-prod:
        ipv4_address: 172.21.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER -d $DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    command: postgres -c 'config_file=/etc/postgresql/postgresql.conf'
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Redis with Persistence and Clustering
  redis:
    image: redis:7-alpine
    container_name: unified-redis-prod
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data_prod:/data
      - ./config/redis-prod.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      unified-prod:
        ipv4_address: 172.21.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # BACKEND SERVICES (LOAD BALANCED)
  # ---------------------------------------------------------------------------

  # Django Backend Application (Multiple Instances)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - media_files_prod:/app/media
      - static_files_prod:/app/staticfiles
      - ./logs:/app/logs
    networks:
      unified-prod:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s

  # Celery Workers (Scaled)
  celery:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery-worker
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
    volumes:
      - media_files_prod:/app/media
      - ./logs:/app/logs
    networks:
      unified-prod:
    depends_on:
      - postgres
      - redis
      - backend
    healthcheck:
      test: ["CMD", "celery", "-A", "core", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      replicas: 4
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    command: ["celery", "-A", "core", "worker", "-l", "info", "--concurrency=2", "--max-tasks-per-child=1000"]

  # Celery Beat Scheduler (Single Instance)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: celery-beat
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./logs:/app/logs
    networks:
      unified-prod:
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "pgrep", "-f", "celery.*beat"]
      interval: 60s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # FRONTEND SERVICES
  # ---------------------------------------------------------------------------

  # React Frontend (Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    environment:
      - API_URL=https://${DOMAIN}/api
      - WS_URL=wss://${DOMAIN}/ws
      - BACKEND_URL=https://${DOMAIN}
    volumes:
      - static_files_prod:/usr/share/nginx/html/static
    networks:
      unified-prod:
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # Mobile Web App
  mobile-web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      target: web-production
    environment:
      - API_URL=https://${DOMAIN}/api
      - WS_URL=wss://${DOMAIN}/ws
      - BACKEND_URL=https://${DOMAIN}
    networks:
      unified-prod:
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ---------------------------------------------------------------------------
  # LOAD BALANCER AND REVERSE PROXY
  # ---------------------------------------------------------------------------

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: unified-nginx-prod
    volumes:
      - ./config/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx-sites:/etc/nginx/conf.d:ro
      - static_files_prod:/var/www/static:ro
      - media_files_prod:/var/www/media:ro
      - nginx_cache:/var/cache/nginx
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_data:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      unified-prod:
        ipv4_address: 172.21.0.50
    depends_on:
      - backend
      - frontend
      - mobile-web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # SSL Certificate Management
  certbot:
    image: certbot/certbot
    container_name: unified-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    networks:
      unified-prod:
    restart: unless-stopped
    command: certonly --webroot --webroot-path=/var/www/certbot --email ${SSL_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}

  # ---------------------------------------------------------------------------
  # MONITORING AND LOGGING
  # ---------------------------------------------------------------------------

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: unified-prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    networks:
      - unified-prod
      - monitoring
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    restart: always

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: unified-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./config/grafana:/etc/grafana/provisioning:ro
      - ./config/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - unified-prod
      - monitoring
    depends_on:
      - prometheus
    restart: always

  # Elasticsearch for Logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: unified-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - unified-prod
      - monitoring
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  # Kibana for Log Visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.8.0
    container_name: unified-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - unified-prod
      - monitoring
    depends_on:
      - elasticsearch
    restart: always

  # Logstash for Log Processing
  logstash:
    image: docker.elastic.co/logstash/logstash:8.8.0
    container_name: unified-logstash
    volumes:
      - ./config/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logs:/var/log/app:ro
    networks:
      - unified-prod
      - monitoring
    depends_on:
      - elasticsearch
    restart: always

  # ---------------------------------------------------------------------------
  # BACKUP SERVICE
  # ---------------------------------------------------------------------------

  # Automated Database Backup
  backup:
    image: postgres:15-alpine
    container_name: unified-backup
    environment:
      - PGPASSWORD=${DB_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      unified-prod:
    depends_on:
      - postgres
    restart: unless-stopped
    command: sh -c "while true; do /backup.sh; sleep 86400; done"