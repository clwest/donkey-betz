# Donkey Betz secret-scanning configuration.
#
# Powered by gitleaks; driven by .github/workflows/secret-scan.yml.
#
# Policy: do NOT exclude documentation extensions (*.md, *.mdx, *.rst,
# *.txt). The credential leak this workflow was added to catch was
# committed inside a *.md file that the prior scanner excluded.
#
# Allowlist strategy (post history-purge):
#   - path: only genuinely-generated bundled library artifacts.
#   - regexes: two narrow-shape patterns for Discord sequential-digit
#     placeholder snowflakes and Stripe publishable keys (documented
#     public identifiers), plus documented-public example fixture
#     values (AWS docs example, jwt.io sample, GitHub docs placeholder),
#     plus per-fingerprint anchored literals for every other known FP.
#   - deliberately NO broad shape rules for 40-char hex or UUIDs;
#     each frozen historical SHA or UUID is allowlisted by exact
#     value so a real credential of the same shape would still trigger.

title = "Donkey Betz Secret Scan"

[extend]
# Inherit gitleaks' maintained default ruleset: Stripe live secret keys,
# AWS access/secret keys, GitHub PATs (classic + fine-grained), Slack
# tokens, Google API keys, private keys, generic high-entropy strings,
# and many others. See:
#   https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
useDefault = true

[allowlist]
description = "Repo-wide allowlist"
regexTarget = "secret"

# File path allowlists (very narrow).
paths = [
  '''(^|/)\.gitleaks\.toml$''',   # self-reference: this config file
  '''^frontend/dist/assets/html2canvas\.esm[^/]*\.js$''',   # bundled library
]

# Value-shape / literal allowlists. All patterns are anchored (^...$)
# to avoid unintended substring matches. Each entry has a comment naming
# the fingerprint class it suppresses.
regexes = [
  # Frozen workspace / initiative UUIDs referenced by application code and
  # docs. Anchored literals; no shape-level UUID allowlist.
  '''^b4503364\-2573\-4401\-9e28\-61a739e0ce50$''',   # workspace-uuid-4c466ac0acb7
  '''^780a8d15\-9ca0\-4d91\-970f\-6934a24fc08d$''',   # workspace-uuid-5f1de9a9d15a
  # Frozen historical git SHA-1 references (session handoffs, pa_local.sh
  # session pins, test fixtures). Each entry is the exact SHA that was
  # cited in a docs/handoff/test file; anchored literal, not a shape rule.
