<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .message {
            padding: 5px;
            margin: 5px 0;
            background: #f0f0f0;
            border-left: 3px solid #007bff;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>

    <div id="status" class="status disconnected">Disconnected</div>

    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="sendPing()">Send Ping</button>
        <button onclick="requestData()">Request Data</button>
    </div>

    <h3>Messages:</h3>
    <div id="messages"></div>

    <script>
        let ws = null;

        function updateStatus(connected) {
            const status = document.getElementById('status');
            if (connected) {
                status.className = 'status connected';
                status.textContent = 'Connected';
            } else {
                status.className = 'status disconnected';
                status.textContent = 'Disconnected';
            }
        }

        function addMessage(msg, type = 'received') {
            const messages = document.getElementById('messages');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<strong>${type}:</strong> ${JSON.stringify(msg)}`;
            messages.insertBefore(msgDiv, messages.firstChild);

            // Keep only last 20 messages
            while (messages.children.length > 20) {
                messages.removeChild(messages.lastChild);
            }
        }

        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log('Already connected');
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/consciousness/`;

            console.log('Connecting to:', wsUrl);
            ws = new WebSocket(wsUrl);

            ws.onopen = function(e) {
                console.log('Connected');
                updateStatus(true);
                addMessage('Connection established', 'system');
            };

            ws.onmessage = function(e) {
                try {
                    const message = JSON.parse(e.data);
                    addMessage(message);
                } catch (error) {
                    addMessage(e.data);
                }
            };

            ws.onerror = function(e) {
                console.error('WebSocket error:', e);
                addMessage('Connection error', 'error');
            };

            ws.onclose = function(e) {
                console.log('Disconnected');
                updateStatus(false);
                addMessage(`Connection closed (${e.code}: ${e.reason || 'No reason'})`, 'system');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendPing() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const msg = { type: 'ping', timestamp: Date.now() };
                ws.send(JSON.stringify(msg));
                addMessage(msg, 'sent');
            } else {
                alert('Not connected');
            }
        }

        function requestData() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const msg = { command: 'refresh', type: 'request_data' };
                ws.send(JSON.stringify(msg));
                addMessage(msg, 'sent');
            } else {
                alert('Not connected');
            }
        }

        // Auto-connect on load
        window.onload = function() {
            setTimeout(connect, 1000);
        };
    </script>
</body>
</html>
