<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Activity Monitor - Live Learning & Infrastructure</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 0;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(102,126,234,0.5);
        }

        .header p {
            font-size: 1.2em;
            color: #aaa;
        }

        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .nav-link {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s;
        }

        .nav-link:hover {
            background: rgba(102,126,234,0.3);
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .nav-link.active {
            background: rgba(102,126,234,0.5);
            border-color: #667eea;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .panel {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            min-height: 600px;
        }

        .panel-title {
            font-size: 1.8em;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }

        .learning-panel .panel-title {
            color: #f093fb;
        }

        .infra-panel .panel-title {
            color: #4ecdc4;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .feed-container {
            height: 450px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .feed-container::-webkit-scrollbar {
            width: 8px;
        }

        .feed-container::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }

        .feed-container::-webkit-scrollbar-thumb {
            background: rgba(102,126,234,0.5);
            border-radius: 4px;
        }

        .feed-item {
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.05);
            border-left: 3px solid transparent;
            border-radius: 10px;
            transition: all 0.3s;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .feed-item.learning {
            border-left-color: #f093fb;
        }

        .feed-item.collaboration {
            border-left-color: #667eea;
        }

        .feed-item.solution {
            border-left-color: #4ecdc4;
        }

        .feed-item.infrastructure {
            border-left-color: #ffd93d;
        }

        .feed-item.database {
            border-left-color: #336791;
        }

        .feed-item.ml-model {
            border-left-color: #00ff00;
        }

        .feed-item:hover {
            background: rgba(255,255,255,0.08);
            transform: translateX(5px);
        }

        .feed-time {
            font-size: 0.85em;
            color: #888;
            margin-bottom: 8px;
        }

        .feed-content {
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .feed-content strong {
            color: #fff;
        }

        .feed-agents {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .agent-tag {
            background: rgba(102,126,234,0.2);
            border: 1px solid rgba(102,126,234,0.4);
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85em;
        }

        .effectiveness-bar {
            margin-top: 10px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .effectiveness-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #667eea);
            transition: width 0.5s ease;
        }

        .pulse-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #4ecdc4;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.8);
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ecdc4;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: #ff4444;
            animation: none;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>AI Activity Monitor</h1>
        <p>Real-Time Learning & Infrastructure Intelligence</p>
    </div>

    <div class="nav-bar">
        <a href="/visualization/" class="nav-link">3D Ecosystem</a>
        <a href="/activity-monitor/" class="nav-link active">Activity Monitor</a>
        <a href="/master-demo/" class="nav-link">Master Demo</a>
    </div>

    <div class="container">
        <div class="panel learning-panel">
            <div class="panel-title">
                🧠 Live Learning Activity
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-label">Knowledge Transfers</div>
                    <div class="stat-value" id="knowledgeTransfers">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Solutions Deployed</div>
                    <div class="stat-value" id="solutionsDeployed">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Learning Rate</div>
                    <div class="stat-value" id="learningRate">0%</div>
                </div>
            </div>

            <div class="feed-container" id="learningFeed">
                <!-- Learning activities will be populated here -->
            </div>
        </div>

        <div class="panel infra-panel">
            <div class="panel-title">
                ⚡ Infrastructure Activity
            </div>

            <div class="stats-bar">
                <div class="stat-item">
                    <div class="stat-label">API Calls</div>
                    <div class="stat-value" id="apiCalls">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">DB Queries</div>
                    <div class="stat-value" id="dbQueries">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Cache Hits</div>
                    <div class="stat-value" id="cacheHits">0%</div>
                </div>
            </div>

            <div class="feed-container" id="infraFeed">
                <!-- Infrastructure activities will be populated here -->
            </div>
        </div>
    </div>

    <div class="connection-status">
        <div class="status-dot" id="connectionDot"></div>
        <span id="connectionText">Connected</span>
    </div>

    <script>
        let learningCount = 0;
        let solutionsCount = 0;
        let apiCount = 0;
        let dbCount = 0;

        // Generate time ago string
        function timeAgo(seconds) {
            if (seconds < 60) return `${seconds} seconds ago`;
            if (seconds < 3600) return `${Math.floor(seconds/60)} minutes ago`;
            return `${Math.floor(seconds/3600)} hours ago`;
        }

        // Fetch ecosystem stats
        async function updateStats() {
            try {
                const response = await fetch('/api/ecosystem/stats/');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('knowledgeTransfers').textContent =
                        data.stats.knowledge_transfers.toLocaleString();
                    document.getElementById('solutionsDeployed').textContent =
                        data.stats.solutions_deployed.toLocaleString();
                    document.getElementById('learningRate').textContent =
                        data.stats.learning_rate.toFixed(1) + '%';
                }
            } catch (error) {
                console.error('Failed to update stats:', error);
            }
        }

        // Fetch learning feed
        async function updateLearningFeed() {
            try {
                const response = await fetch('/api/ecosystem/live-feed/');
                const data = await response.json();

                if (data.success && data.feed) {
                    const feedContainer = document.getElementById('learningFeed');
                    feedContainer.innerHTML = '';

                    data.feed.forEach((item, index) => {
                        const feedItem = createLearningFeedItem(item);
                        feedContainer.appendChild(feedItem);
                    });
                }
            } catch (error) {
                console.error('Failed to update learning feed:', error);
            }
        }

        // Create learning feed item
        function createLearningFeedItem(item) {
            const div = document.createElement('div');
            div.className = `feed-item ${item.type}`;
            div.style.animationDelay = `${Math.random() * 0.3}s`;

            let agentTags = '';
            if (item.agents && item.agents.length > 0) {
                agentTags = `
                    <div class="feed-agents">
                        ${item.agents.map(agent =>
                            `<span class="agent-tag">${agent}</span>`
                        ).join('')}
                    </div>
                `;
            }

            let effectivenessBar = '';
            if (item.effectiveness) {
                effectivenessBar = `
                    <div class="effectiveness-bar">
                        <div class="effectiveness-fill" style="width: ${item.effectiveness}%"></div>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="feed-time">${item.time}</div>
                <div class="feed-content">${item.message}</div>
                ${agentTags}
                ${effectivenessBar}
            `;

            return div;
        }

        // Update infrastructure feed
        function updateInfraFeed() {
            const feedContainer = document.getElementById('infraFeed');
            const infraActivities = [
                { type: 'database', service: 'PostgreSQL', action: 'Query executed', latency: '12ms', queries: 5 },
                { type: 'ml-model', service: 'GPT-4', action: 'Inference completed', tokens: 1250, cost: '$0.0375' },
                { type: 'infrastructure', service: 'Redis Cache', action: 'Cache hit', hitRate: '94.3%' },
                { type: 'database', service: 'Vector DB', action: 'Embedding stored', vectors: 128 },
                { type: 'infrastructure', service: 'WebSocket', action: 'Connection established', clients: 12 },
                { type: 'ml-model', service: 'Claude-3', action: 'Analysis complete', tokens: 800 },
                { type: 'infrastructure', service: 'Load Balancer', action: 'Request routed', latency: '3ms' },
                { type: 'database', service: 'PostgreSQL', action: 'Index updated', rows: 15000 }
            ];

            // Add random new activity
            const activity = infraActivities[Math.floor(Math.random() * infraActivities.length)];
            const feedItem = document.createElement('div');
            feedItem.className = `feed-item ${activity.type}`;

            let details = '';
            if (activity.latency) details += `Latency: ${activity.latency} `;
            if (activity.queries) details += `Queries: ${activity.queries} `;
            if (activity.tokens) details += `Tokens: ${activity.tokens} `;
            if (activity.cost) details += `Cost: ${activity.cost} `;
            if (activity.hitRate) details += `Hit Rate: ${activity.hitRate} `;
            if (activity.vectors) details += `Vectors: ${activity.vectors} `;
            if (activity.clients) details += `Clients: ${activity.clients} `;
            if (activity.rows) details += `Rows: ${activity.rows} `;

            feedItem.innerHTML = `
                <div class="feed-time">${timeAgo(Math.floor(Math.random() * 60))}</div>
                <div class="feed-content">
                    <strong>${activity.service}:</strong> ${activity.action}
                    ${details ? `<div style="color: #888; font-size: 0.9em; margin-top: 5px;">${details}</div>` : ''}
                </div>
            `;

            // Keep only last 10 items
            if (feedContainer.children.length >= 10) {
                feedContainer.removeChild(feedContainer.lastChild);
            }

            feedContainer.insertBefore(feedItem, feedContainer.firstChild);

            // Update counters
            if (activity.type === 'database') dbCount++;
            if (activity.service.includes('GPT') || activity.service.includes('Claude')) apiCount++;

            document.getElementById('apiCalls').textContent = apiCount.toLocaleString();
            document.getElementById('dbQueries').textContent = dbCount.toLocaleString();
            document.getElementById('cacheHits').textContent = (90 + Math.random() * 9).toFixed(1) + '%';
        }

        // Initialize
        updateStats();
        updateLearningFeed();

        // Set up refresh intervals
        setInterval(updateStats, 5000);
        setInterval(updateLearningFeed, 3000);
        setInterval(updateInfraFeed, 2000);

        // Simulate connection status
        setInterval(() => {
            const dot = document.getElementById('connectionDot');
            const text = document.getElementById('connectionText');

            // 95% of the time stay connected
            if (Math.random() > 0.95) {
                dot.classList.add('disconnected');
                text.textContent = 'Reconnecting...';
                setTimeout(() => {
                    dot.classList.remove('disconnected');
                    text.textContent = 'Connected';
                }, 1000);
            }
        }, 10000);
    </script>
</body>
</html>
