<!-- Universal Navigation System for Unified AI Platform -->
<style>
    .universal-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        z-index: 10000;
        padding: 10px 0;
        transition: all 0.3s ease;
    }

    .universal-nav.collapsed {
        transform: translateY(-100%);
    }

    .nav-container {
        max-width: 1600px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 30px;
    }

    .nav-logo {
        font-size: 1.5em;
        font-weight: bold;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .nav-links {
        display: flex;
        gap: 5px;
        align-items: center;
    }

    .nav-link {
        padding: 8px 16px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        color: #fff;
        text-decoration: none;
        font-size: 0.9em;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
    }

    .nav-link:hover {
        background: rgba(102, 126, 234, 0.3);
        border-color: #667eea;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
    }

    .nav-link.active {
        background: rgba(102, 126, 234, 0.5);
        border-color: #667eea;
        box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
    }

    .nav-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2em;
        z-index: 10001;
        transition: all 0.3s ease;
    }

    .nav-toggle:hover {
        background: rgba(102, 126, 234, 0.5);
        border-color: #667eea;
    }

    .system-status {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.8em;
        flex-wrap: nowrap;
        white-space: nowrap;
    }

    .status-indicator {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        min-width: 0;
        flex-shrink: 0;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #00ff88;
        animation: pulse 2s infinite;
    }

    .status-dot.warning { background: #ffa726; }
    .status-dot.error { background: #ff5722; }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    /* Mobile Responsive */
    @media (max-width: 1400px) {
        .system-status {
            gap: 8px;
            font-size: 0.75em;
        }

        .status-indicator {
            padding: 3px 6px;
        }
    }

    @media (max-width: 1200px) {
        .nav-links {
            gap: 3px;
        }

        .nav-link {
            padding: 6px 12px;
            font-size: 0.8em;
        }

        .system-status {
            gap: 6px;
            font-size: 0.7em;
        }
    }

    @media (max-width: 1000px) {
        .nav-container {
            padding: 0 20px;
        }

        .system-status {
            gap: 4px;
            font-size: 0.65em;
        }

        .status-indicator {
            padding: 2px 4px;
        }
    }

    @media (max-width: 900px) {
        .nav-container {
            padding: 0 15px;
        }

        .system-status {
            display: none;
        }

        .nav-links {
            flex-wrap: wrap;
            gap: 2px;
        }
    }

    @media (max-width: 600px) {
        .nav-logo {
            font-size: 1.2em;
        }

        .nav-link {
            padding: 4px 8px;
            font-size: 0.7em;
        }
    }

    /* Ensure body has top padding when nav is visible */
    body.has-universal-nav {
        padding-top: 70px !important;
    }

    /* Dark theme compatibility */
    .universal-nav * {
        box-sizing: border-box;
    }
</style>

<div class="universal-nav" id="universalNav">
    <div class="nav-container">
        <a href="/" class="nav-logo">
            🧠 Unified AI Platform
        </a>

        <div class="nav-links">
            <a href="/ai-production-hub/" class="nav-link" data-page="ai-production-hub">
                🚀 Production Hub
            </a>
            <a href="/ai-nexus/" class="nav-link" data-page="ai-nexus">
                🧠 AI Nexus
            </a>
            <a href="/intelligence/" class="nav-link" data-page="intelligence">
                📊 Intelligence
            </a>
        </div>

        <div class="system-status">
            <div class="status-indicator">
                <div class="status-dot" id="systemStatusDot"></div>
                <span id="systemStatusText">Online</span>
            </div>
            <div class="status-indicator">
                <span>🤖 <span id="agentCount">--</span></span>
            </div>
            <div class="status-indicator">
                <span>🧠 <span id="consciousnessLevel">--</span>%</span>
            </div>
        </div>
    </div>
</div>

<div class="nav-toggle" id="navToggle" title="Toggle Navigation">
    ↕️
</div>

<script>
(function() {
    // Initialize universal navigation
    const universalNav = document.getElementById('universalNav');
    const navToggle = document.getElementById('navToggle');
    const body = document.body;

    // Add body class for proper spacing
    body.classList.add('has-universal-nav');

    // Determine current page and mark active
    const currentPath = window.location.pathname;
    const navLinks = document.querySelectorAll('.nav-link');

    navLinks.forEach(link => {
        const href = link.getAttribute('href');
        if (currentPath === href || (href !== '/' && currentPath.startsWith(href))) {
            link.classList.add('active');
        }
    });

    // Navigation toggle functionality
    let navVisible = true;

    navToggle.addEventListener('click', function() {
        navVisible = !navVisible;
        if (navVisible) {
            universalNav.classList.remove('collapsed');
            body.classList.add('has-universal-nav');
            navToggle.innerHTML = '↕️';
        } else {
            universalNav.classList.add('collapsed');
            body.classList.remove('has-universal-nav');
            navToggle.innerHTML = '↕️';
        }
    });

    // Auto-hide on scroll (optional)
    let lastScrollY = window.scrollY;
    let scrollTimeout;

    window.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(function() {
            const currentScrollY = window.scrollY;

            if (currentScrollY > lastScrollY && currentScrollY > 100) {
                // Scrolling down
                if (navVisible) {
                    universalNav.style.transform = 'translateY(-50%)';
                }
            } else {
                // Scrolling up
                if (navVisible) {
                    universalNav.style.transform = 'translateY(0)';
                }
            }

            lastScrollY = currentScrollY;
        }, 100);
    });

    // Real-time system status updates
    function updateSystemStatus() {
        // Try to get system data from intelligence API
        fetch('/api/intelligence/')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const agentCount = document.getElementById('agentCount');
                    const consciousnessLevel = document.getElementById('consciousnessLevel');
                    const statusDot = document.getElementById('systemStatusDot');
                    const statusText = document.getElementById('systemStatusText');

                    if (agentCount) agentCount.textContent = data.data.active_agents || 0;
                    if (consciousnessLevel) consciousnessLevel.textContent = Math.round(data.data.consciousness_level || 0);

                    // Update status based on system health
                    if (statusDot && statusText) {
                        if (data.data.status === 'operational') {
                            statusDot.className = 'status-dot';
                            statusText.textContent = 'Online';
                        } else {
                            statusDot.className = 'status-dot warning';
                            statusText.textContent = 'Warning';
                        }
                    }
                }
            })
            .catch(error => {
                console.log('System status update failed:', error);
                // Fallback to basic status
                const statusDot = document.getElementById('systemStatusDot');
                const statusText = document.getElementById('systemStatusText');
                if (statusDot) statusDot.className = 'status-dot warning';
                if (statusText) statusText.textContent = 'Limited';
            });
    }

    // Update system status every 30 seconds
    updateSystemStatus();
    setInterval(updateSystemStatus, 30000);

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
        // Ctrl/Cmd + Shift + N to toggle navigation
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'N') {
            e.preventDefault();
            navToggle.click();
        }

        // Quick navigation shortcuts (Ctrl/Cmd + Shift + number)
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key >= '1' && e.key <= '3') {
            e.preventDefault();
            const linkIndex = parseInt(e.key) - 1;
            if (navLinks[linkIndex]) {
                window.location.href = navLinks[linkIndex].getAttribute('href');
            }
        }
    });

    // Add smooth transitions
    universalNav.style.transition = 'all 0.3s ease';

    console.log('🧠 Universal Navigation System initialized');
    console.log('Shortcuts: Ctrl+Shift+N (toggle), Ctrl+Shift+1-3 (quick nav)');
})();
</script>
