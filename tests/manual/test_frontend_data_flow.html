<!DOCTYPE html>
<html>
<head>
    <title>Frontend Data Flow Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .test { margin: 10px 0; padding: 10px; background: #2a2a2a; border-left: 3px solid #0f0; }
        .error { border-left-color: #f00; color: #f00; }
        .success { border-left-color: #0f0; color: #0f0; }
        .warning { border-left-color: #ff0; color: #ff0; }
        h2 { color: #00ff00; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Frontend Data Flow Diagnostic</h1>
    <p>Testing data flow from backend to browser...</p>

    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function log(message, type = 'test') {
            const div = document.createElement('div');
            div.className = `test ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        async function runTests() {
            log('<h2>Step 1: Check API Connectivity</h2>');

            // Test 1: Health check (no auth required)
            try {
                const response = await fetch('http://localhost:8000/api/v1/health/');
                const data = await response.json();
                log(`✅ Health API: ${JSON.stringify(data, null, 2)}`, 'success');
            } catch (e) {
                log(`❌ Health API failed: ${e.message}`, 'error');
            }

            log('<h2>Step 2: Check WebSocket Connection</h2>');

            // Test 2: WebSocket (Income Builder example)
            try {
                const ws = new WebSocket('ws://localhost:8000/ws/income-builder/');

                ws.onopen = () => {
                    log('✅ WebSocket connected!', 'success');
                    ws.send(JSON.stringify({type: 'get_opportunities'}));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    log(`📨 WebSocket message received:<pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                };

                ws.onerror = (error) => {
                    log(`❌ WebSocket error: ${error}`, 'error');
                };

                ws.onclose = () => {
                    log('⚠️ WebSocket closed', 'warning');
                };

                // Close after 5 seconds
                setTimeout(() => ws.close(), 5000);

            } catch (e) {
                log(`❌ WebSocket test failed: ${e.message}`, 'error');
            }

            log('<h2>Step 3: Check if JavaScript is Processing Data</h2>');

            // Test 3: Check if page JavaScript is running
            const dashboardElements = [
                'todayEarnings',
                'weekEarnings',
                'monthEarnings',
                'agentCount',
                'spiderCount'
            ];

            log('Looking for common dashboard element IDs...');
            dashboardElements.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    log(`✅ Found element: ${id} = "${element.textContent}"`, 'success');
                } else {
                    log(`⚠️ Element not found: ${id}`, 'warning');
                }
            });

            log('<h2>Step 4: Check Browser Console</h2>');
            log('⚠️ Open browser DevTools Console (F12) and check for errors!', 'warning');
            log('Look for: WebSocket errors, CORS errors, 401 Unauthorized, etc.', 'warning');
        }

        // Run tests on load
        window.addEventListener('DOMContentLoaded', runTests);
    </script>
</body>
</html>
