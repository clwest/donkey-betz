<!DOCTYPE html>
<html>
<head>
    <title>UI Connectivity Test</title>
</head>
<body>
    <h1>Freelance Pipeline UI Connectivity Test</h1>
    <button onclick="testAPI()">Test API Connection</button>
    <div id="results"></div>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing API connection...</p>';

            try {
                console.log('Making API request to http://localhost:8000/api/freelance/opportunities/');

                const response = await fetch('http://localhost:8000/api/freelance/opportunities/', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);

                if (response.ok) {
                    const data = await response.json();
                    console.log('Response data:', data);

                    resultsDiv.innerHTML = `
                        <h3>✅ API Connection Successful!</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Found:</strong> ${data.opportunities?.length || 0} opportunities</p>
                        <h4>Latest Opportunities:</h4>
                        <ul>
                            ${(data.opportunities || []).slice(0, 3).map(opp =>
                                `<li>${opp.title} - $${opp.budget} (${opp.platform}) - Found: ${opp.found_at}</li>`
                            ).join('')}
                        </ul>
                        <h4>Raw Data:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <h3>❌ API Request Failed</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Status Text:</strong> ${response.statusText}</p>
                    `;
                }
            } catch (error) {
                console.error('API test error:', error);
                resultsDiv.innerHTML = `
                    <h3>💥 Connection Error</h3>
                    <p><strong>Error:</strong> ${error.message}</p>
                    <p>Check console for details</p>
                `;
            }
        }

        // Auto-run test on page load
        window.onload = function() {
            testAPI();
        };
    </script>
</body>
</html>
