<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive WebSocket Test - Unified Donkey Betz</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .ws-test {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }
        .ws-test:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }
        .ws-test h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .status.disconnected {
            background: #ffebee;
            color: #c62828;
        }
        .status.connecting {
            background: #fff8e1;
            color: #f57c00;
        }
        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }
        .controls {
            margin: 10px 0;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        button:hover {
            background: #5a67d8;
            transform: scale(1.05);
        }
        button:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: scale(1);
        }
        .messages {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 10px;
        }
        .message {
            padding: 4px 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .message.sent {
            color: #2563eb;
        }
        .message.received {
            color: #059669;
        }
        .message.error {
            color: #dc2626;
        }
        .test-summary {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .test-summary h2 {
            margin-top: 0;
            color: #333;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .summary-item {
            padding: 15px;
            background: #f7fafc;
            border-radius: 8px;
            text-align: center;
        }
        .summary-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .summary-item .label {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }
        .endpoint-info {
            background: #f0f4f8;
            padding: 8px;
            border-radius: 6px;
            margin: 10px 0;
            font-size: 12px;
            color: #4a5568;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Comprehensive WebSocket Test Suite</h1>
        
        <div class="test-summary">
            <h2>Test Summary</h2>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="value" id="total-endpoints">0</div>
                    <div class="label">Total Endpoints</div>
                </div>
                <div class="summary-item">
                    <div class="value" id="connected-count">0</div>
                    <div class="label">Connected</div>
                </div>
                <div class="summary-item">
                    <div class="value" id="failed-count">0</div>
                    <div class="label">Failed</div>
                </div>
                <div class="summary-item">
                    <div class="value" id="messages-sent">0</div>
                    <div class="label">Messages Sent</div>
                </div>
                <div class="summary-item">
                    <div class="value" id="messages-received">0</div>
                    <div class="label">Messages Received</div>
                </div>
            </div>
        </div>

        <div class="test-grid" id="test-grid">
            <!-- WebSocket test cards will be inserted here -->
        </div>
    </div>

    <script>
        const WS_BASE = 'ws://localhost:8000';
        
        // Define all WebSocket endpoints to test
        const wsEndpoints = [
            {
                name: 'Agent Progress (All)',
                path: '/ws/agent-progress/',
                testMessages: [
                    { type: 'ping' },
                    { type: 'subscribe_agent', instance_id: 'test-123' }
                ]
            },
            {
                name: 'Agent Progress (Instance)',
                path: '/ws/agent-progress/test-instance/',
                testMessages: [
                    { type: 'ping' }
                ]
            },
            {
                name: 'Dashboard',
                path: '/ws/dashboard/',
                testMessages: [
                    { type: 'refresh_dashboard' }
                ]
            },
            {
                name: 'Live Sports',
                path: '/ws/live-sports/',
                testMessages: [
                    { type: 'subscribe_sport', sport: 'ncaaf' }
                ]
            },
            {
                name: 'Arbitrage',
                path: '/ws/arbitrage/',
                testMessages: []
            },
            {
                name: 'Assistant Chat',
                path: '/ws/assistant/',
                testMessages: [
                    { type: 'chat_message', message: 'Hello from test!' }
                ]
            },
            {
                name: 'Orchestration',
                path: '/ws/orchestration/test-orch-123/',
                testMessages: []
            },
            {
                name: 'Agent Channels (All)',
                path: '/ws/channels/',
                testMessages: [
                    { type: 'ping' },
                    { type: 'get_channels' },
                    { type: 'join_channel', channel_id: 'general' }
                ]
            },
            {
                name: 'Agent Channels (Specific)',
                path: '/ws/channels/general/',
                testMessages: [
                    { type: 'ping' },
                    { type: 'get_channel_messages', channel_id: 'general' }
                ]
            },
            {
                name: 'Notifications',
                path: '/ws/notifications/',
                testMessages: []
            },
            {
                name: 'Mythology',
                path: '/ws/mythology/',
                testMessages: [
                    { type: 'ping' }
                ]
            }
        ];

        class WebSocketTester {
            constructor(endpoint, container) {
                this.endpoint = endpoint;
                this.container = container;
                this.ws = null;
                this.messageCount = { sent: 0, received: 0 };
                this.status = 'disconnected';
                this.createUI();
                this.updateSummary();
            }

            createUI() {
                const card = document.createElement('div');
                card.className = 'ws-test';
                card.innerHTML = `
                    <h3>${this.endpoint.name}</h3>
                    <div class="endpoint-info">${WS_BASE}${this.endpoint.path}</div>
                    <div class="status disconnected">Disconnected</div>
                    <div class="controls">
                        <button class="connect-btn">Connect</button>
                        <button class="test-btn" disabled>Send Tests</button>
                        <button class="disconnect-btn" disabled>Disconnect</button>
                        <button class="clear-btn">Clear</button>
                    </div>
                    <div class="messages"></div>
                `;
                
                this.statusEl = card.querySelector('.status');
                this.messagesEl = card.querySelector('.messages');
                this.connectBtn = card.querySelector('.connect-btn');
                this.testBtn = card.querySelector('.test-btn');
                this.disconnectBtn = card.querySelector('.disconnect-btn');
                this.clearBtn = card.querySelector('.clear-btn');
                
                this.connectBtn.addEventListener('click', () => this.connect());
                this.testBtn.addEventListener('click', () => this.sendTestMessages());
                this.disconnectBtn.addEventListener('click', () => this.disconnect());
                this.clearBtn.addEventListener('click', () => this.clearMessages());
                
                this.container.appendChild(card);
            }

            updateStatus(status) {
                this.status = status;
                this.statusEl.className = `status ${status}`;
                this.statusEl.textContent = status.charAt(0).toUpperCase() + status.slice(1);
                
                // Update button states
                this.connectBtn.disabled = status !== 'disconnected';
                this.testBtn.disabled = status !== 'connected';
                this.disconnectBtn.disabled = status === 'disconnected';
                
                this.updateSummary();
            }

            addMessage(content, type = 'received') {
                const msg = document.createElement('div');
                msg.className = `message ${type}`;
                const timestamp = new Date().toLocaleTimeString();
                msg.textContent = `[${timestamp}] ${content}`;
                this.messagesEl.appendChild(msg);
                this.messagesEl.scrollTop = this.messagesEl.scrollHeight;
                
                if (type === 'sent') {
                    this.messageCount.sent++;
                } else if (type === 'received') {
                    this.messageCount.received++;
                }
                this.updateSummary();
            }

            clearMessages() {
                this.messagesEl.innerHTML = '';
            }

            connect() {
                this.updateStatus('connecting');
                this.addMessage(`Connecting to ${this.endpoint.path}...`, 'sent');
                
                try {
                    this.ws = new WebSocket(`${WS_BASE}${this.endpoint.path}`);
                    
                    this.ws.onopen = () => {
                        this.updateStatus('connected');
                        this.addMessage('Connection established!', 'received');
                    };
                    
                    this.ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            this.addMessage(`Received: ${JSON.stringify(data, null, 2)}`, 'received');
                        } catch (e) {
                            this.addMessage(`Received (raw): ${event.data}`, 'received');
                        }
                    };
                    
                    this.ws.onerror = (error) => {
                        this.updateStatus('error');
                        this.addMessage(`Error: ${error.type || 'Connection failed'}`, 'error');
                    };
                    
                    this.ws.onclose = (event) => {
                        this.updateStatus('disconnected');
                        this.addMessage(`Disconnected (code: ${event.code}, reason: ${event.reason || 'No reason'})`, 'error');
                    };
                } catch (error) {
                    this.updateStatus('error');
                    this.addMessage(`Failed to create WebSocket: ${error.message}`, 'error');
                }
            }

            disconnect() {
                if (this.ws) {
                    this.ws.close();
                    this.ws = null;
                }
            }

            sendTestMessages() {
                if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
                    this.addMessage('WebSocket not connected!', 'error');
                    return;
                }
                
                if (this.endpoint.testMessages.length === 0) {
                    this.addMessage('No test messages defined for this endpoint', 'error');
                    return;
                }
                
                this.endpoint.testMessages.forEach((msg, index) => {
                    setTimeout(() => {
                        const msgStr = JSON.stringify(msg);
                        this.addMessage(`Sending: ${msgStr}`, 'sent');
                        this.ws.send(msgStr);
                    }, index * 500);
                });
            }

            updateSummary() {
                // Update global summary
                const testers = window.wsTesters || [];
                const connected = testers.filter(t => t.status === 'connected').length;
                const failed = testers.filter(t => t.status === 'error').length;
                const totalSent = testers.reduce((sum, t) => sum + t.messageCount.sent, 0);
                const totalReceived = testers.reduce((sum, t) => sum + t.messageCount.received, 0);
                
                document.getElementById('total-endpoints').textContent = testers.length;
                document.getElementById('connected-count').textContent = connected;
                document.getElementById('failed-count').textContent = failed;
                document.getElementById('messages-sent').textContent = totalSent;
                document.getElementById('messages-received').textContent = totalReceived;
            }
        }

        // Initialize all WebSocket testers
        window.wsTesters = [];
        const container = document.getElementById('test-grid');
        
        wsEndpoints.forEach(endpoint => {
            const tester = new WebSocketTester(endpoint, container);
            window.wsTesters.push(tester);
        });

        // Auto-connect all on page load (optional)
        function connectAll() {
            window.wsTesters.forEach((tester, index) => {
                setTimeout(() => tester.connect(), index * 200);
            });
        }

        // Add global control buttons
        const summaryDiv = document.querySelector('.test-summary');
        const globalControls = document.createElement('div');
        globalControls.style.marginTop = '15px';
        globalControls.innerHTML = `
            <button onclick="connectAll()" style="margin-right: 10px;">Connect All</button>
            <button onclick="window.wsTesters.forEach(t => t.disconnect())">Disconnect All</button>
            <button onclick="window.wsTesters.forEach(t => t.sendTestMessages())" style="margin-left: 10px;">Test All</button>
        `;
        summaryDiv.appendChild(globalControls);
    </script>
</body>
</html>
