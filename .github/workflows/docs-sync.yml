name: docs-index-sync

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CLAUDE.md'
      - '00-START-NEXT-SESSION.md'

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cycle 1A KFI-4 (ADR-0140 §2.1 (6)) — 4-step inline cascade.
      # Env-per-step so each step's required secrets are auditable at
      # its own block (Chris F3' cycle-2 clarification). CI bypasses
      # the MissionRunner hash-delta preflight entirely — the workflow
      # runs the same 4 management commands the Beat path invokes.

      - name: Step 1 — Build docs index
        run: python manage.py build_docs_index

      - name: Step 2 — Build RAG corpus
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: core.settings
        run: python manage.py build_rag_corpus

      - name: Step 3 — Sync docs to DB with embeddings
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: core.settings
        run: python manage.py sync_docs_index_to_documents --embed

      - name: Step 4 — Build docs provenance
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DJANGO_SETTINGS_MODULE: core.settings
        run: python manage.py build_docs_provenance

      - name: Summary
        run: echo "Docs index synced. $(wc -l < docs/_index.json) lines in index."
