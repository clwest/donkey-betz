name: Secret Scan (gitleaks)

# Scans the current working tree for accidentally committed secrets.
# Runs on every pull request and every push to main.
#
# Rationale: an earlier credential leak (ENCRYPTION_KEY and
# ENCRYPTION_KEY_BACKUP) reached the repository inside a *.md file that
# the prior scanner excluded from its allowlist. This workflow scans
# every tracked file type — documentation is explicitly in scope.
#
# Scope limitation: this configuration scans the working tree only
# (`gitleaks detect --no-git`). It does NOT scan git history. Git
# history still contains the pre-remediation leaked values; running
# gitleaks over full history today would necessarily fail. Once history
# has been purged (BFG / git-filter-repo), remove the `--no-git` flag to
# enable history-aware scanning.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.18.4"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan working tree
        run: |
          # --no-git    scan the working tree; skip git history (which
          #             still contains the pre-remediation leaked keys).
          # --config    use repo-root .gitleaks.toml (extends defaults).
          # --redact    hide secret bodies in the log output.
          # --verbose   surface per-finding context in CI logs.
          # --exit-code 1  fail the job on any finding.
          # Documentation (*.md / *.mdx / *.rst / *.txt) is intentionally
          # NOT excluded — the original leak was in a *.md file.
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-git \
            --redact \
            --verbose \
            --exit-code 1
