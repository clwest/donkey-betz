name: Secret Scan (gitleaks)

# Scans the current working tree for accidentally committed secrets.
# Runs on every pull request and every push to main.
#
# Rationale: an earlier credential leak (ENCRYPTION_KEY and
# ENCRYPTION_KEY_BACKUP) reached the repository inside a *.md file that
# the prior scanner excluded from its allowlist. This workflow scans
# every tracked file type — documentation is explicitly in scope.
#
# Scans full git history. History was purged of the known compromised
# credentials via `git filter-repo` prior to enabling history-aware
# scanning. Residual findings are documented false positives (AWS/GitHub
# docs example values, jwt.io sample tokens, coincidental patterns in
# bundled minified libraries, Discord snowflake placeholders, planning-
# doc examples). Suppressions live in .gitleaks.toml as narrow
# per-fingerprint / per-shape / per-file allowlists — documentation as
# a class remains scanned so a real leak like the original *.md incident
# would still trigger.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch full history so gitleaks can walk every commit
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.18.4"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Scan working tree and full git history
        run: |
          # --config    use repo-root .gitleaks.toml (extends defaults).
          # --redact    hide secret bodies in the log output.
          # --verbose   surface per-finding context in CI logs.
          # --exit-code 1  fail the job on any finding.
          # Documentation (*.md / *.mdx / *.rst / *.txt) is intentionally
          # NOT excluded — the original leak was in a *.md file.
          # History-aware: --no-git removed after `git filter-repo`
          # cleared all verified compromised credentials from history.
          ./gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1
