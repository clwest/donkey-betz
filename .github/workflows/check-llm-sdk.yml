name: Check direct LLM SDK calls

# Session 1098 PR #A2 — fail PRs that add direct provider-SDK calls
# outside the Session 1098 wrapper (core/services/llm_call_wrapper.py).
# See tools/check_direct_llm_calls.py and .ci/llm_whitelist.txt.

on:
  pull_request:
    paths:
      - '**/*.py'
      - '.ci/llm_whitelist.txt'
      - 'tools/check_direct_llm_calls.py'
      - '.github/workflows/check-llm-sdk.yml'
  push:
    branches: [main]

jobs:
  check-llm-sdk:
    name: Direct LLM SDK usage check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Session 1222 P5 (audit #3) — promoted from --warn-only to enforce.
      # The "~60 legacy call sites" the original comment expected had
      # already migrated down to 6 by the time of the flip. The 2 runtime
      # sites (campaign_orchestrator_agent.py, curated_action_card_generator.py)
      # were migrated to llm_call_span in the same PR; the 4 operator-only
      # sites (3 management commands + scripts/one-off/rag_docs.py) were
      # added to .ci/llm_whitelist.txt. The whitelist tail still tracks
      # the ~50 legacy direct-SDK files that pre-date the wrapper —
      # remediate per tier as they're touched, but they don't block CI.
      - name: Run direct-LLM-call checker
        run: |
          python tools/check_direct_llm_calls.py \
            --root . \
            --whitelist .ci/llm_whitelist.txt

      - name: Summarize violations in the job summary
        if: always()
        run: |
          {
            echo "## Direct LLM SDK call check"
            echo ""
            echo "Session 1098 PR #A2 + Session 1222 P5 — running in **enforce** mode."
            echo ""
            echo "Every direct provider-SDK call should migrate to"
            echo "\`core/services/llm_call_wrapper.py\` for telemetry + cancellation."
            echo ""
            echo "See \`.ci/llm_whitelist.txt\` for the tiered remediation list."
          } >> "$GITHUB_STEP_SUMMARY"
