<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
        #log { background: #000; padding: 10px; height: 400px; overflow-y: auto; border: 1px solid #00ff00; }
        .error { color: #ff0000; }
        .success { color: #00ff00; }
        .info { color: #ffff00; }
        button { background: #00ff00; color: #000; padding: 10px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>WebSocket Connection Test</h1>
    <div>
        <button onclick="connectWS()">Connect WebSocket</button>
        <button onclick="sendTestMessage()">Send Test Message</button>
        <button onclick="closeWS()">Close Connection</button>
    </div>
    <div id="log"></div>

    <script>
        let ws = null;
        const log = document.getElementById('log');

        function addLog(msg, className = '') {
            const entry = document.createElement('div');
            entry.className = className;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function connectWS() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                addLog('Already connected', 'info');
                return;
            }

            addLog('Connecting to ws://localhost:8000/ws/freelance/', 'info');

            ws = new WebSocket('ws://localhost:8000/ws/freelance/');

            ws.onopen = () => {
                addLog('WebSocket connected successfully!', 'success');
                // Send initial message
                ws.send(JSON.stringify({
                    type: 'subscribe',
                    channel: 'freelance_updates'
                }));
            };

            ws.onmessage = (event) => {
                addLog(`Received: ${event.data}`, 'success');
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'project_update') {
                        addLog(`Project Update: ${data.project_id} - ${data.status}`, 'info');
                    }
                } catch (e) {
                    // Not JSON, just display as is
                }
            };

            ws.onerror = (error) => {
                addLog(`WebSocket error: ${error}`, 'error');
            };

            ws.onclose = (event) => {
                addLog(`WebSocket closed: Code ${event.code}, Reason: ${event.reason || 'No reason'}`, 'error');
            };
        }

        function sendTestMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addLog('WebSocket not connected', 'error');
                return;
            }

            const testMsg = {
                type: 'test',
                timestamp: new Date().toISOString(),
                message: 'Test message from UI'
            };

            ws.send(JSON.stringify(testMsg));
            addLog(`Sent: ${JSON.stringify(testMsg)}`, 'info');
        }

        function closeWS() {
            if (ws) {
                ws.close();
                ws = null;
                addLog('WebSocket closed by user', 'info');
            }
        }

        // Auto-connect on load
        window.onload = () => connectWS();
    </script>
</body>
</html>
