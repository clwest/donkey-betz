# =============================================================================
# RAILWAY DEPLOYMENT CONFIGURATION
# Unified Donkey Betz Platform
# =============================================================================
# This file configures the BUILD settings shared by all services.
# Deploy settings are configured per-service in Railway dashboard.
# =============================================================================

[build]
# Use Docker for builds (multi-stage Dockerfile)
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Build target for production (matches Dockerfile STAGE 4)
# Railway will use: docker build --target production
dockerTarget = "production"

# =============================================================================
# DEPLOY SETTINGS CONFIGURED PER-SERVICE IN RAILWAY DASHBOARD
# =============================================================================
# We don't set deploy options here because we have multiple services:
# - web: Daphne ASGI server (needs healthcheck)
# - celery-worker: Celery worker (no healthcheck)
# - celery-beat: Celery scheduler (no healthcheck) [Phase 3]
#
# Configure each service's start command and healthcheck in the Railway
# dashboard under Settings → Deploy.
# =============================================================================
